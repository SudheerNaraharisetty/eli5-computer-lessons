<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ELI5 Computer Lessons</title>
<meta name="description" content="Beginner courses with big pictures, few words, and interactive quizzes.">
<meta name="theme-color" content="#F6F1EB">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#F6F1EB;--ink:#0E0C1D;--ink2:#3E3B52;--accent:#3B37E6;--accent-tint:#E6E3FF;--ok:#1F7A5C;--ok-tint:#DDEFE6;--r:22px;--shadow:0 4px 0 var(--ink);--shadow2:0 7px 0 var(--ink)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:900px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom))}
h1,h2{font-family:"Fraunces",Georgia,serif;font-weight:800;letter-spacing:-.02em;margin:0}
h1{font-size:clamp(38px,8vw,60px);line-height:1}
.lede{margin:14px 0 34px;font-size:18px;color:var(--ink2);max-width:600px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(2,1fr)}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;gap:10px;background:#fff;border:2px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s}
.card:hover{transform:translate(-1px,-3px);box-shadow:var(--shadow2)}
.card:active{transform:translate(0,1px);box-shadow:0 2px 0 var(--ink)}
.icon{width:56px;height:56px;border-radius:14px;border:2px solid var(--ink);display:grid;place-items:center;font:800 22px "Manrope",sans-serif;background:var(--accent-tint);color:var(--accent)}
.card.ok .icon{background:var(--ok-tint);color:var(--ok)}
h2{font-size:28px;line-height:1.1}
.card p{margin:0;color:var(--ink2)}
.meta{margin-top:auto;padding-top:6px;font-weight:800;font-size:14px;color:var(--accent)}
.card.ok .meta{color:var(--ok)}
</style>
<div class="wrap">
  <h1>ELI5 Computer Lessons</h1>
  <p class="lede">Beginner courses with big pictures, few words, and interactive quizzes.</p>
  <div class="grid">
    <a class="card" href="learn-principles/">
      <div class="icon">P</div>
      <h2>Learn Principles</h2>
      <p>Software engineering principles, the most used first, each with a short video.</p>
      <div class="meta">63 lessons →</div>
    </a>
    <a class="card ok" href="learn-github/">
      <div class="icon">G</div>
      <h2>Learn GitHub</h2>
      <p>Git and GitHub from zero to expert, all from the terminal.</p>
      <div class="meta">7 modules →</div>
    </a>
  </div>
</div>
</html>
