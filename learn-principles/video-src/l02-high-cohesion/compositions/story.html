  <script>
    (function () {
      // Word start times from the narration (seconds), offset by the 0.6 s lead-in.

      const t = (i) => W[i] + 0.6;
      const tl = gsap.timeline({ paused: true });

      const pop = (sel, at, o) => {
        o = o || {};
        tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.45, ease: o.ease || "back.out(1.6)" }, at);

      const out = (sel, at, d) => tl.to(sel, { opacity: 0, duration: d || 0.2, ease: "power2.in" }, at);
      const swap = (a, b, at) => {
        tl.to(a, { opacity: 0, duration: 0.12, ease: "power2.in" }, at);
        tl.fromTo(b, { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, at + 0.08);
      };
      const draw = (sel, at, d) => tl.fromTo(sel, { strokeDashoffset: 1, opacity: 1 }, { strokeDashoffset: 0, opacity: 1, duration: d || 0.45, ease: "power2.out" }, at);

      /* ---- 1. The shop is growing, and so is the code ---- */

      tl.fromTo("#s-lcard", { opacity: 0, y: -60, rotation: -14 }, { opacity: 1, y: 0, rotation: 5, duration: 0.5, ease: "back.out(1.7)" }, t(4));
      pop("#s-new2", t(4) + 0.25, { from: 0.3 });
      tl.to("#s-shop", { opacity: 0, x: -90, filter: "blur(12px)", duration: 0.4, ease: "power3.in" }, t(8) - 0.3);
      tl.fromTo("#s-code", { opacity: 0, y: 44, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power4.out" }, t(9) - 0.25);
      tl.fromTo("#s-nums", { opacity: 0 }, { opacity: 1, duration: 0.4 }, t(9));
      tl.fromTo(".s-blk", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out", stagger: 0.2 }, t(9) + 0.05);

      /* ---- 2. Three topics, all mixed together ---- */
      tl.fromTo("#s-right", { opacity: 0, x: 90 }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, t(14) - 0.15);
      pop("#s-c1", t(17) - 0.05, { from: 0.75 });
      paint([1, 4], t(17));
      pop("#s-c2", t(19) - 0.05, { from: 0.75 });
      paint([2, 5], t(19));
      pop("#s-c3", t(21) - 0.05, { from: 0.75 });
      paint([3, 6], t(21));
      [1, 2, 3, 4, 5, 6].forEach((n, k) => tl.to("#s-b" + n, { x: k % 2 ? 9 : -9, duration: 0.09, ease: "power1.inOut", yoyo: true, repeat: 3 }, t(28) - 0.05 + k * 0.03));

      /* ---- 3. The loyalty card changes ---- */
      out("#s-mixed", t(30) - 0.1, 0.25);
      tl.fromTo("#s-notice", { opacity: 0, y: -50, rotation: -4 }, { opacity: 1, y: 0, rotation: 0, duration: 0.5, ease: "back.out(1.5)" }, t(32) - 0.1);
      tl.to("#s-c3", { scale: 1.06, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, t(33));
      swap("#s-w1a", "#s-w1b", t(38));
      tl.fromTo("#s-rule2", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, t(43) - 0.05);
      swap("#s-w2a", "#s-w2b", t(47));

      /* ---- 4. Maya hunts, fixes one rule, misses the other ---- */

      tl.to("#s-b1", { backgroundColor: "#37336a", duration: 0.15, yoyo: true, repeat: 1 }, t(52) + 0.05);
      tl.to("#s-cursor", { x: 640, y: 338, duration: 0.4, ease: "power2.inOut" }, t(53) - 0.1);
      tl.to("#s-b2", { backgroundColor: "#37336a", duration: 0.15, yoyo: true, repeat: 1 }, t(53) + 0.25);
      tl.to("#s-cursor", { x: 800, y: 500, duration: 0.45, ease: "power2.inOut" }, t(55) + 0.1);
      swap("#s-kA .va", "#s-kA .vb", t(57));
      swap("#s-kB .va", "#s-kB .vb", t(57) + 0.5);
      pop("#s-y1", t(61), { from: 0.2, ease: "back.out(2.4)" });
      tl.to("#s-cursor", { x: 1010, y: 300, opacity: 0, duration: 0.7, ease: "power2.in" }, t(62) - 0.1);
      tl.fromTo("#s-r10m", { opacity: 0, scale: 1.5, svgOrigin: "660 874" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, t(68) - 0.1);
      pop("#s-missed", t(72), { from: 0.4 });
      pop("#s-n2", t(72) + 0.25, { from: 0.2, ease: "back.out(2.4)" });

      /* ---- 5. Quietly gives cookies away ---- */
      tl.to("#s-notice", { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, t(74) - 0.3);
      tl.fromTo("#s-result", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, t(74));
      tl.fromTo("#s-ck > svg", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.12 }, t(75) - 0.05);
      tl.fromTo("#s-sum", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, t(77) - 0.1);
      tl.fromTo("#s-free", { opacity: 0, scale: 1.8, rotation: 5 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.3, ease: "power4.in" }, t(79) - 0.2);
      tl.fromTo("#s-noerr", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, t(81));
      tl.fromTo("#s-should", { opacity: 0 }, { opacity: 1, duration: 0.35 }, t(86));

      pop("#s-onefile", t(133) + 0.1, { from: 0.4 });
      pop("#s-c3ok", t(134) + 0.1, { from: 0.2, ease: "back.out(2.4)" });
      tl.to("#s-cursor", { opacity: 0, duration: 0.3 }, t(134));

      /* ---- hand off to the takeaway ---- */

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
