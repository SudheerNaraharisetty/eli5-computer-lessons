        <div class="s-ok s-hide" id="s-ok2" style="left:896px;top:616px"><svg viewBox="0 0 56 56"><path d="M16 29 L25 38 L41 20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></svg></div>
        <div class="s-ok s-hide" id="s-ok3" style="left:896px;top:772px"><svg viewBox="0 0 56 56"><path d="M16 29 L25 38 L41 20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></svg></div>
        <div id="s-oneplace" class="s-abs s-hide">1 place fixed</div>

      </div>

  <script>
    (function () {
      // Word start times from the narration (seconds), offset by the 0.6 s lead-in.
      const W = [0.0, 0.337, 0.708, 1.556, 1.776, 2.101, 2.403, 2.624, 2.728, 3.181, 3.796, 4.11, 4.423, 4.667, 5.503, 5.84, 6.165, 6.281, 6.432, 6.978, 7.291, 7.976, 8.139, 8.684, 8.847, 9.242, 9.961, 10.182, 10.321, 10.786, 11.784, 12.156, 12.353, 12.492, 13.526, 13.827, 15.0, 15.43, 15.813, 16.416, 16.799, 17.415, 17.542, 18.494, 19.098, 19.423, 19.969, 20.271, 20.642, 20.909, 22.093, 22.593, 22.999, 23.173, 23.394, 23.603, 24.09, 24.973, 25.251, 25.367, 25.785, 26.807, 27.144, 27.399, 27.48, 27.829, 28.491, 29.129, 29.512, 29.698, 29.814, 30.081, 30.638, 30.94, 31.277, 31.648, 32.473, 33.03, 33.622, 34.18, 34.667, 35.294, 36.305, 36.618, 36.792, 37.071, 37.291, 37.651, 37.814, 38.801, 38.963, 39.253, 39.451, 39.799, 40.275, 40.635, 41.018, 41.343, 42.121, 42.435, 42.527, 42.818, 42.945, 43.41, 44.664, 45.0, 45.267, 45.592, 45.894, 46.382, 46.521, 46.684, 47.705, 47.973, 48.193, 48.298, 48.623, 49.25, 49.633, 50.178, 50.469, 51.386, 51.549, 51.769, 52.269, 52.582, 53.337, 53.697, 54.091, 54.498, 55.473, 55.868, 56.042, 56.239, 56.402, 56.727, 56.866, 57.284, 57.621, 57.865];
      const t = (i) => W[i] + 0.6;
      const tl = gsap.timeline({ paused: true });

      const pop = (sel, at, o) => {
        o = o || {};
        tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.45, ease: o.ease || "back.out(1.6)" }, at);
      };
      const out = (sel, at, d) => tl.to(sel, { opacity: 0, duration: d || 0.2, ease: "power2.in" }, at);
      const swap = (a, b, at) => {
        tl.to(a, { opacity: 0, duration: 0.12, ease: "power2.in" }, at);
        tl.fromTo(b, { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, at + 0.08);
      };
      // Real path lengths, so a stroke can be drawn on and pulled back.
      const LEN = {};
      document.querySelectorAll("#s-wires path, #s-marks path").forEach((p) => {
        const L = Math.ceil(p.getTotalLength()) || 1200;
        LEN["#" + p.id] = L;
        p.style.strokeDasharray = L + " " + (L + 40);
      });
      const draw = (sel, at, d) => {
        tl.set(sel, { opacity: 1 }, at);
        tl.fromTo(sel, { strokeDashoffset: LEN[sel] }, { strokeDashoffset: 0, duration: d || 0.45, ease: "power2.out" }, at);
      };
      const type = (sel, at, d, steps) => tl.fromTo(sel, { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: d, ease: "steps(" + steps + ")" }, at);

      /* ---- 1. Maya and her printer ---- */
      tl.to("#s-arm", { rotation: -16, svgOrigin: "296 340", duration: 0.2, ease: "power1.inOut", yoyo: true, repeat: 3 }, 0.5);
      pop("#s-name", t(1) - 0.05, { from: 0.4 });
      tl.fromTo("#s-sign", { opacity: 0, y: -150, rotation: -9 }, { opacity: 1, y: 0, rotation: -3, duration: 0.6, ease: "back.out(1.3)" }, t(4) - 0.1);
      tl.fromTo("#s-mini", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, t(8) - 0.05);
      pop("#s-minitag", t(11) - 0.05, { from: 0.3, ease: "back.out(2.2)" });

      /* ---- 2. Three parts use it ---- */
      tl.fromTo("#s-three", { opacity: 0, x: 50 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, t(14) - 0.05);
      [["#s-sl1", t(22)], ["#s-sl2", t(24)], ["#s-sl3", t(28)]].forEach(([s, at], i) => {
        tl.fromTo(s, { opacity: 0, y: 70, rotation: [-5, 4, -3][i] }, { opacity: 1, y: 0, rotation: [-2, 1.5, -1][i], duration: 0.5, ease: "back.out(1.5)" }, at - 0.05);
      });

      /* ---- 3. The code: every part reaches inside ---- */
      tl.to("#s-shop", { opacity: 0, x: -90, duration: 0.35, ease: "power3.in" }, t(30) - 0.3);
      tl.fromTo("#s-code", { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, t(30) + 0.02);
      tl.fromTo(["#s-dA", "#s-o1", "#s-o2", "#s-dB", "#s-o3", "#s-o4", "#s-dC", "#s-o5", "#s-o6"], { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out", stagger: 0.06 }, t(30) + 0.25);
      tl.fromTo("#s-pA", { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, t(33) + 0.1);
      // "Every part": the three def lines pulse
      tl.to(".s-def", { scale: 1.06, transformOrigin: "0% 50%", duration: 0.18, ease: "power2.out", stagger: 0.12, yoyo: true, repeat: 1 }, t(36));
      // "reaches right inside": wires run from the six lines into the printer
      ["#s-w1", "#s-w2", "#s-w3", "#s-w4", "#s-w5", "#s-w6"].forEach((w, i) => {
        const at = t(38) + i * 0.13;
        draw(w, at, 0.75);
        tl.fromTo("#s-e" + (i + 1), { opacity: 0, scale: 0.2, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2.5)" }, at + 0.65);
      });
      out("#s-cvA", t(40) - 0.2, 0.3);
      pop("#s-iA1", t(40) - 0.05, { from: 0.7 });
      pop("#s-iA2", t(40) + 0.1, { from: 0.7 });
      // "Into its memory"
      tl.to(".s-wo", { opacity: 0.22, duration: 0.3 }, t(43));
      tl.to("#s-wires path.s-wm", { stroke: "#3b37e6", duration: 0.3 }, t(43));
      tl.to("#s-wires circle.s-wm", { fill: "#3b37e6", duration: 0.3 }, t(43));
      draw("#s-rm", t(45) - 0.1, 0.5);
      tl.to(".tm", { color: "#ffc24b", duration: 0.2, ease: "power2.out", stagger: 0.08 }, t(45));
      // "and into its motor"
      tl.to(".s-wm", { opacity: 0.22, duration: 0.3 }, t(47));
      tl.to(".s-wo", { opacity: 1, duration: 0.3 }, t(47));
      tl.to("#s-wires path.s-wo", { stroke: "#3b37e6", duration: 0.3 }, t(47));
      tl.to("#s-wires circle.s-wo", { fill: "#3b37e6", duration: 0.3 }, t(47));
      out("#s-rm", t(47), 0.25);
      draw("#s-ro", t(49) - 0.1, 0.5);
      tl.to(".to", { color: "#ffc24b", duration: 0.2, ease: "power2.out", stagger: 0.08 }, t(49));
      // "Six lines that know this printer's insides"
      tl.to(".s-wm", { opacity: 1, duration: 0.3 }, t(50) - 0.1);
      out("#s-ro", t(50) - 0.1, 0.25);
      tl.to(["#s-st1", "#s-st2", "#s-st3", "#s-st4", "#s-st5", "#s-st6"], { opacity: 1, duration: 0.2, stagger: 0.09 }, t(50));
      tl.fromTo("#s-six", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, t(50) + 0.1);

      /* ---- 4. The printer breaks; a different brand arrives ---- */
      tl.to("#s-pA", { x: 10, duration: 0.06, ease: "power1.inOut", yoyo: true, repeat: 7 }, t(59));
      tl.fromTo("#s-stamp", { opacity: 0, scale: 2.4, rotation: 4 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.3, ease: "power4.in" }, t(60) - 0.25);
      tl.to("#s-wires .s-wire", { stroke: "#0e0c1d", duration: 0.3 }, t(60));
      tl.to("#s-wires circle", { fill: "#0e0c1d", duration: 0.3 }, t(60));
      tl.to("#s-pA", { x: 620, opacity: 0, duration: 0.5, ease: "power3.in" }, t(61));
      tl.fromTo("#s-pB", { opacity: 0, x: 620 }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, t(64) - 0.1);
      // "Inside, nothing has the same name"
      out("#s-cvB", t(66) - 0.15, 0.3);
      pop("#s-iB1", t(66), { from: 0.7 });
      pop("#s-iB2", t(66) + 0.15, { from: 0.7 });
      tl.to(".tk", { color: "#ff6b8b", duration: 0.3, stagger: 0.05 }, t(70));
      // "every line snaps": one, two, three, four, five, six
      tl.to("#s-wires .s-wire", { x: 3, duration: 0.05, yoyo: true, repeat: 9, ease: "power1.inOut" }, t(73));
      [76, 77, 78, 79, 80, 81].forEach((w, i) => {
        const n = i + 1, at = t(w) - 0.05;
        tl.to("#s-e" + n, { opacity: 0, scale: 2, duration: 0.15, ease: "power2.out" }, at);
        tl.to("#s-w" + n, { stroke: "#b8235a", duration: 0.15 }, at);
        tl.fromTo("#s-w" + n, { strokeDashoffset: 0 }, { strokeDashoffset: LEN["#s-w" + n] * 0.38, duration: 0.3, ease: "back.out(2.5)", immediateRender: false }, at);
        tl.to("#s-st" + n, { backgroundColor: "#4a1e3a", duration: 0.15 }, at);
        pop("#s-b" + n, at + 0.05, { from: 0.3, d: 0.3 });
      });
      // "All she did was swap a printer"
      out("#s-six", t(82) - 0.1, 0.2);
      tl.fromTo("#s-brokenpill", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, t(82) + 0.1);
      draw("#s-rname", t(86) - 0.05, 0.6);

      /* ---- 5. The fix: one small job ---- */
      out(["#s-w1", "#s-w2", "#s-w3", "#s-w4", "#s-w5", "#s-w6", "#s-rname", "#s-b1", "#s-b2", "#s-b3", "#s-b4", "#s-b5", "#s-b6", "#s-brokenpill", "#s-st1", "#s-st2", "#s-st3", "#s-st4", "#s-st5", "#s-st6"], t(89) - 0.15, 0.3);
      tl.to(".s-old", { opacity: 0, x: 30, duration: 0.3, ease: "power2.in", stagger: 0.03 }, t(89));
      tl.to("#s-dA", { y: 208, duration: 0.6, ease: "power3.inOut" }, t(91) - 0.1);
      tl.to("#s-dB", { y: 156, duration: 0.6, ease: "power3.inOut" }, t(91) - 0.05);
      tl.to("#s-dC", { y: 104, duration: 0.6, ease: "power3.inOut" }, t(91));
      tl.to("#s-stN", { opacity: 1, duration: 0.3 }, t(93));
      type("#s-n1", t(95), 0.7, 14);
      draw("#s-under", t(97) + 0.15, 0.4);
      // "Only it knows the printer's insides"
      type("#s-n2", t(98), 0.5, 12);
      type("#s-n3", t(98) + 0.45, 0.5, 12);
      pop("#s-skB", t(98) + 0.2, { from: 0.4, d: 0.3 });
      tl.set("#s-plug", { opacity: 1 }, t(98) + 0.2);
      tl.fromTo("#s-plug", { x: -420 }, { x: -76, duration: 0.45, ease: "power3.out" }, t(98) + 0.2);
      tl.to("#s-plug", { x: 0, duration: 0.22, ease: "power3.in" }, t(101) + 0.05);
      tl.to("#s-pB", { x: 7, duration: 0.07, yoyo: true, repeat: 1, ease: "power1.out" }, t(101) + 0.27);
      draw("#s-in1", t(102), 0.4);
      draw("#s-in2", t(102) + 0.2, 0.45);
      // "Every other part just asks it to print"
      out("#s-under", t(104) - 0.1, 0.25);
      type("#s-c1", t(104), 0.35, 10);
      type("#s-c2", t(104) + 0.3, 0.35, 10);
      type("#s-c3", t(104) + 0.6, 0.35, 10);
      draw("#s-rail", t(108) - 0.1, 0.7);
      draw("#s-br1", t(108) + 0.2, 0.25);
      draw("#s-br2", t(108) + 0.1, 0.25);
      tl.fromTo("#s-ah", { opacity: 0 }, { opacity: 1, duration: 0.15 }, t(108) + 0.55);

      /* ---- 6. The printer changes again: one place ---- */
      out(["#s-in1", "#s-in2"], t(115) - 0.25, 0.2);
      tl.to("#s-plug", { x: -76, duration: 0.3, ease: "power2.out" }, t(115) - 0.3);
      tl.to("#s-pB", { x: 620, opacity: 0, duration: 0.45, ease: "power3.in" }, t(115));
      tl.fromTo("#s-pC", { opacity: 0, x: 620 }, { opacity: 1, x: 0, duration: 0.55, ease: "expo.out" }, t(116) + 0.1);
      tl.fromTo("#s-cursor", { opacity: 0, x: 620, y: 1000 }, { opacity: 1, x: 560, y: 346, duration: 0.6, ease: "power3.out" }, t(117) - 0.3);
      swap("#s-k1 .vz", "#s-k1 .vd", t(118));
      tl.to("#s-cursor", { x: 540, y: 398, duration: 0.3, ease: "power2.inOut" }, t(118) + 0.2);
      swap("#s-k2 .vz", "#s-k2 .vd", t(118) + 0.5);
      tl.to("#s-cursor", { x: 700, y: 250, opacity: 0, duration: 0.5, ease: "power2.in" }, t(119) + 0.45);
      tl.to("#s-plug", { x: 0, duration: 0.22, ease: "power3.in" }, t(119) + 0.1);
      draw("#s-in1", t(119) + 0.35, 0.3);
      draw("#s-in2", t(119) + 0.45, 0.35);
      pop("#s-oneplace", t(119) + 0.05, { from: 0.4 });
      pop("#s-okP", t(120) + 0.2, { from: 0.2, ease: "back.out(2.4)" });
      // "The other parts never notice"
      pop("#s-ok1", t(122), { from: 0.2, ease: "back.out(2.4)" });
      pop("#s-ok2", t(123) + 0.2, { from: 0.2, ease: "back.out(2.4)" });
      pop("#s-ok3", t(124) + 0.1, { from: 0.2, ease: "back.out(2.4)" });

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.3, ease: "power2.in" }, 53.4);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
  </script>
