            <g fill="#5a3418">

          </svg>

        <!-- rings and pointer -->
        <svg id="s-marks" class="s-abs" viewBox="0 0 1920 1080">

          <path id="s-r2" class="s-ring" d="M454 332 C452 302 564 300 564 330 C564 360 448 362 450 324" />

        </svg>
        <svg id="s-cursor" class="s-abs s-hide" viewBox="0 0 48 48"><path d="M4 3 L4 37 L13 29 L20 45 L27 42 L20 26 L33 26 Z" fill="#fff" stroke="#0e0c1d" stroke-width="4" stroke-linejoin="round" /></svg>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // Word start times from the narration (seconds), offset by the 0.6 s lead-in.
      const W = [0.0, 0.441, 0.731, 1.022, 1.231, 1.335, 1.672, 1.765, 1.881, 2.74, 2.949, 3.425, 3.924, 4.098, 4.226, 4.621, 5.352, 5.608, 5.735, 5.875, 6.827, 7.221, 7.465, 7.906, 8.057, 8.742, 9.125, 9.474, 9.95, 10.344, 10.6, 11.041, 11.993, 12.249, 12.388, 13.119, 13.967, 14.257, 14.396, 15.0, 15.801, 16.126, 16.277, 17.159, 17.543, 17.717, 18.1, 18.599, 19.853, 20.12, 20.979, 21.351, 21.606, 22.001, 23.197, 23.522, 23.916, 24.044, 24.242, 24.543, 25.495, 25.751, 25.937, 26.355, 26.807, 27.016, 27.864, 28.119, 28.665, 28.955, 29.884, 30.36, 30.604, 31.393, 31.637, 32.229, 32.728, 33.1, 34.017, 34.516, 35.05, 35.178, 35.445, 35.631, 35.863, 35.99, 36.861, 37.047, 37.163, 37.465, 37.755, 38.603, 38.835, 39.125, 39.45, 39.566, 40.135, 40.379, 40.774, 42.086, 42.562, 43.177, 43.769, 44.489, 45.046, 45.882, 46.3, 46.509, 46.765, 46.881, 47.09, 48.146, 48.413, 48.552, 48.924, 49.307, 49.621, 50.039, 50.282, 51.141, 51.478, 51.687, 51.861, 52.686, 53.057, 53.51, 54.299, 54.578, 54.706, 55.6, 55.983, 56.343, 56.621, 56.946, 57.097, 57.806, 58.224, 58.607, 58.943, 59.338, 59.501];
      const t = (i) => W[i] + 0.6;
      const tl = gsap.timeline({ paused: true });

      const pop = (sel, at, o) => {
        o = o || {};
        tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.45, ease: o.ease || "back.out(1.6)" }, at);
      };
      const out = (sel, at, d) => tl.to(sel, { opacity: 0, duration: d || 0.2, ease: "power2.in" }, at);
      const swap = (a, b, at) => {
        tl.to(a, { opacity: 0, duration: 0.12, ease: "power2.in" }, at);
        tl.fromTo(b, { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, at + 0.08);
      };
      const LEN = {};
      document.querySelectorAll("#s-marks path, #s-wire path").forEach((p) => {
        const L = Math.ceil(p.getTotalLength()) || 600;
        LEN["#" + p.id] = L;
        p.style.strokeDasharray = L + " " + (L + 40);
      });
      const draw = (sel, at, d) => {
        tl.set(sel, { opacity: 1 }, at);
        tl.fromTo(sel, { strokeDashoffset: LEN[sel] }, { strokeDashoffset: 0, duration: d || 0.45, ease: "power2.out" }, at);
      };
      const type = (sel, at, d, steps) => tl.fromTo(sel, { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: d, ease: "steps(" + steps + ")" }, at);
      const flip = (card, a, b, at) => {
        tl.to(card, { scaleY: 0.04, duration: 0.14, ease: "power2.in" }, at);
        tl.set(a, { opacity: 0 }, at + 0.14);
        tl.set(b, { opacity: 1 }, at + 0.14);
        tl.to(card, { scaleY: 1, duration: 0.32, ease: "back.out(2.6)" }, at + 0.14);
      };
      // a timetable bar and its shadow move together
      const bar = (i, x, w, at, d) => tl.to(["#s-br" + i, "#s-sh" + i], { attr: { x: x, width: w }, duration: d || 0.5, ease: "power3.inOut" }, at);
      const fade = (a, b, at) => {
        tl.to(a, { opacity: 0, duration: 0.15 }, at);
        tl.to(b, { opacity: 1, duration: 0.25 }, at + 0.12);
      };
      const check = (i, at) => tl.fromTo("#s-ck" + i, { opacity: 0, scale: 0.2, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.4)" }, at);

      /* ---- 1. The shop and its sign ---- */
      tl.to("#s-arm", { rotation: -16, svgOrigin: "296 340", duration: 0.2, ease: "power1.inOut", yoyo: true, repeat: 3 }, 0.3);
      tl.fromTo("#s-shopname", { opacity: 0, y: -150, rotation: -9 }, { opacity: 1, y: 0, rotation: -3, duration: 0.6, ease: "back.out(1.3)" }, t(0) - 0.25);
      tl.fromTo(["#s-window", "#s-strings"], { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, t(3) - 0.15);
      tl.fromTo("#s-bigsign", { opacity: 0, y: -80, rotation: 8 }, { opacity: 1, y: 0, rotation: 0, duration: 0.55, ease: "back.out(1.8)" }, t(5) - 0.1);
      tl.fromTo("#s-laptop", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, t(10) - 0.05);
      tl.fromTo(".s-lbar", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.3, ease: "power3.out", stagger: 0.12 }, t(10) + 0.2);
      draw("#s-wp", t(11), 0.7);
      flip("#s-bigsign", "#s-bfc", "#s-bfo", t(15) - 0.1);

      /* ---- 2. The clever code ---- */
      tl.to("#s-shop", { opacity: 0, x: -90, duration: 0.3, ease: "power3.in" }, t(16) - 0.15);
      tl.fromTo("#s-code", { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, t(16) + 0.15);
      tl.fromTo(".s-cl", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out", stagger: 0.1 }, t(16) + 0.4);
      tl.fromTo("#s-right", { opacity: 0, x: 90 }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, t(19) - 0.1);
      tl.fromTo("#s-sticker", { opacity: 0, scale: 2, rotation: 6 }, { opacity: 1, scale: 1, rotation: -7, duration: 0.3, ease: "power4.in" }, t(22) - 0.25);
      tl.fromTo("#s-p3", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, t(25));
      tl.to(["#s-g1", "#s-g2", "#s-g3"], { color: "#ffffff", scale: 1.5, transformOrigin: "20% 50%", duration: 0.16, ease: "power2.out", stagger: 0.14, yoyo: true, repeat: 1 }, t(25) + 0.05);
      draw("#s-r1", t(30) - 0.1, 0.45);
      pop("#s-cap1", t(30) + 0.2, { from: 0.5, d: 0.35 });
      draw("#s-r2", t(31) - 0.05, 0.35);
      draw("#s-r3", t(31) + 0.15, 0.35);
      pop("#s-cap2", t(31) + 0.3, { from: 0.5, d: 0.35 });

      /* ---- 3. It works ---- */
      out(["#s-r1", "#s-r2", "#s-r3", "#s-cap1", "#s-cap2"], t(43) - 0.2, 0.3);
      tl.to("#s-sign", { scale: 1.1, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, t(34));
      [0, 1, 2, 3, 4].forEach((i) => {
        const at = t(35) + i * 0.07;
        tl.set(["#s-br" + i, "#s-sh" + i], { opacity: 1 }, at);
        tl.fromTo(["#s-br" + i, "#s-sh" + i], { attr: { width: 0 } }, { attr: { width: 380 }, duration: 0.5, ease: "power3.out" }, at);
        tl.to("#s-l" + i, { opacity: 1, duration: 0.25 }, t(36) + i * 0.06);
      });
      [5, 6].forEach((i, k) => {
        const at = t(39) + k * 0.1;
        tl.set(["#s-br" + i, "#s-sh" + i], { opacity: 1 }, at);
        tl.fromTo(["#s-br" + i, "#s-sh" + i], { attr: { width: 0 } }, { attr: { width: 228 }, duration: 0.5, ease: "power3.out" }, at);
        tl.to("#s-l" + i + "a", { opacity: 1, duration: 0.25 }, t(40) + k * 0.08);
      });

      /* ---- 4. A simple request ---- */
      tl.set("#s-notetext", { opacity: 0 }, 0);
      tl.fromTo("#s-note", { opacity: 0, y: 120, rotation: 3 }, { opacity: 1, y: 0, rotation: 0, duration: 0.55, ease: "back.out(1.5)" }, t(45) - 0.1);
      tl.fromTo("#s-notetext", { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 1.5, ease: "power1.inOut" }, t(48));
      tl.to("#s-band", { opacity: 1, duration: 0.3 }, t(49));
      tl.fromTo("#s-cut", { opacity: 0, scale: 1.5, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, t(51));

      /* ---- 5. Where does Sunday go? ---- */
      tl.to("#s-sticker", { opacity: 0, y: 160, rotation: 14, duration: 0.5, ease: "power2.in" }, t(54));
      tl.to("#s-band", { opacity: 0, duration: 0.3 }, t(54));
      tl.fromTo("#s-cursor", { opacity: 0, x: 620, y: 1010 }, { opacity: 1, x: 420, y: 300, duration: 0.8, ease: "power3.out" }, t(55));
      tl.to("#s-cursor", { x: 640, y: 352, duration: 0.7, ease: "power1.inOut" }, t(58));
      pop("#s-q1", t(60), { from: 0.3, ease: "back.out(2.2)" });
      tl.to("#s-cursor", { x: 300, y: 300, duration: 0.6, ease: "power1.inOut" }, t(60) + 0.1);
      pop("#s-q2", t(62), { from: 0.3, ease: "back.out(2.2)" });
      pop("#s-q3", t(63), { from: 0.3, ease: "back.out(2.2)" });
      tl.to("#s-cursor", { x: 500, y: 352, duration: 0.5, ease: "power1.inOut" }, t(63));
      tl.to("#s-cursor", { x: 790, y: 340, duration: 0.8, ease: "power2.inOut" }, t(65));
      out(["#s-q1", "#s-q2", "#s-q3"], t(67), 0.3);
      swap("#s-k .v2", "#s-k .v4", t(68));
      draw("#s-r4", t(69) - 0.1, 0.4);
      bar(6, 206, 152, t(68) + 0.3);
      fade("#s-l6a", "#s-l6b", t(68) + 0.45);
      tl.to("#s-cursor", { x: 900, y: 520, opacity: 0, duration: 0.6, ease: "power2.in" }, t(69) + 0.3);

      /* ---- 6. Sunday is right, Saturday is not ---- */
      check(6, t(72) - 0.05);
      out("#s-cut", t(72), 0.3);
      tl.set("#s-ghost", { opacity: 1 }, t(74) + 0.1);
      bar(5, 206, 152, t(74) + 0.1);
      fade("#s-l5a", "#s-l5b", t(75));
      tl.to("#s-bad", { opacity: 1, duration: 0.3 }, t(75));
      tl.fromTo("#s-x5", { opacity: 0, scale: 0.2, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.4)" }, t(76));
      pop("#s-chip", t(78), { from: 0.4 });
      tl.fromTo("#s-now", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, t(79));
      pop("#s-cookies", t(85) - 0.05, { from: 0.5 });
      tl.to("#s-sign", { rotation: 4, duration: 0.09, ease: "power1.inOut", yoyo: true, repeat: 3 }, t(88));
      flip("#s-sign", "#s-sfo", "#s-sfc", t(90) - 0.1);
      tl.fromTo("#s-wrong", { opacity: 0, scale: 2.4, rotation: 4 }, { opacity: 1, scale: 1, rotation: -7, duration: 0.3, ease: "power4.in" }, t(90) + 0.25);

      /* ---- 7. Write it again, in plain steps ---- */
      out(["#s-wrong", "#s-r4", "#s-bad", "#s-p3"], t(91), 0.3);
      tl.to(["#s-c3", "#s-c2", "#s-c1"], { opacity: 0, x: 40, duration: 0.3, ease: "power2.in", stagger: 0.1 }, t(92));
      out(["#s-g2", "#s-g3"], t(92), 0.3);
      out(["#s-br0", "#s-br1", "#s-br2", "#s-br3", "#s-br4", "#s-br5", "#s-br6", "#s-sh0", "#s-sh1", "#s-sh2", "#s-sh3", "#s-sh4", "#s-sh5", "#s-sh6", ".lab", "#s-ck6", "#s-x5", "#s-ghost", "#s-now"], t(92), 0.4);
      type("#s-p1", t(93) + 0.15, 0.7, 14);
      tl.fromTo("#s-pplain", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, t(97));
      // "Opening time."
      type("#s-p2", t(99), 0.4, 8);
      tl.to("#s-g2", { opacity: 1, duration: 0.2 }, t(99));
      // "Closing time."
      type("#s-p3l", t(101), 0.4, 8);
      tl.to("#s-g3", { opacity: 1, duration: 0.2 }, t(101));
      type("#s-pr", t(101) + 0.45, 0.4, 10);
      tl.to("#s-g4", { opacity: 1, duration: 0.2 }, t(101) + 0.45);
      // every day is 8 to 18 for a moment
      tl.set(["#s-br0", "#s-br1", "#s-br2", "#s-br3", "#s-br4", "#s-br5", "#s-br6", "#s-sh0", "#s-sh1", "#s-sh2", "#s-sh3", "#s-sh4", "#s-sh5", "#s-sh6"], { attr: { x: 130, width: 0 }, opacity: 1 }, t(101) + 0.7);
      [0, 1, 2, 3, 4, 5, 6].forEach((i) => {
        tl.to(["#s-br" + i, "#s-sh" + i], { attr: { width: 380 }, duration: 0.4, ease: "power3.out" }, t(101) + 0.72 + i * 0.03);
      });
      tl.to([".l86", "#s-l5w", "#s-l6w"], { opacity: 1, duration: 0.2 }, t(101) + 0.95);
      tl.to("#s-now", { opacity: 1, duration: 0.25 }, t(101) + 1.0);
      // "Weekend hours."
      tl.to("#s-pr", { y: 156, duration: 0.3, ease: "power3.inOut" }, t(103) - 0.1);
      type("#s-p4", t(103) + 0.15, 0.45, 12);
      type("#s-p5", t(103) + 0.5, 0.25, 6);
      type("#s-p6", t(103) + 0.7, 0.25, 6);
      tl.to(["#s-g5", "#s-g6", "#s-g7"], { opacity: 1, duration: 0.2, stagger: 0.12 }, t(103) + 0.2);
      bar(5, 206, 228, t(104) + 0.3, 0.45);
      bar(6, 206, 228, t(104) + 0.36, 0.45);
      fade("#s-l5w", "#s-l5a", t(104) + 0.4);
      fade("#s-l6w", "#s-l6a", t(104) + 0.46);
      flip("#s-sign", "#s-sfc", "#s-sfo", t(104) + 0.75);
      // "Anyone can read it out loud."
      tl.set("#s-read", { opacity: 1, y: 0 }, t(105));
      [1, 2, 3, 4, 5].forEach((k) => tl.to("#s-read", { y: 52 * k, duration: 0.14, ease: "power2.inOut" }, t(105) + k * 0.33));
      out("#s-pplain", t(107) - 0.15, 0.15);
      tl.fromTo("#s-pread", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, t(107));

      /* ---- 8. The Sunday rule: two new lines ---- */
      out(["#s-read", "#s-chip", "#s-cookies", "#s-now"], t(111) - 0.1, 0.3);
      tl.to("#s-note", { scale: 1.05, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, t(113));
      tl.to("#s-band", { opacity: 1, duration: 0.3 }, t(113));
      tl.set("#s-cursor", { x: 700, y: 1010 }, t(112));
      tl.to("#s-cursor", { opacity: 1, x: 250, y: 540, duration: 0.8, ease: "power3.out" }, t(113) + 0.1);
      tl.to("#s-pr", { y: 260, duration: 0.3, ease: "power3.inOut" }, t(115));
      tl.to("#s-new", { opacity: 1, duration: 0.3 }, t(116) - 0.05);
      type("#s-p7", t(116), 0.4, 10);
      type("#s-p8", t(116) + 0.4, 0.3, 8);
      tl.to(["#s-g8", "#s-g9"], { opacity: 1, duration: 0.2, stagger: 0.3 }, t(116) + 0.1);
      pop("#s-two", t(117), { from: 0.4 });
      tl.to("#s-cursor", { opacity: 0, x: 330, y: 640, duration: 0.5, ease: "power2.in" }, t(117) + 0.2);
      bar(6, 206, 152, t(118) + 0.15, 0.45);
      fade("#s-l6a", "#s-l6b", t(118) + 0.3);
      check(6, t(118) + 0.55);
      // "Nothing else is touched."
      tl.to("#s-band", { opacity: 0, duration: 0.3 }, t(119));
      [0, 1, 2, 3, 4, 5].forEach((i) => check(i, t(119) + 0.05 + i * 0.13));

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.3, ease: "power2.in" }, 52.68);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
  </script>
</template>
