      const R = (n) => n * 52;
      const place = (rows, at, d) => Object.keys(rows).forEach((k) => (d ? tl.to(k, { y: R(rows[k]), duration: d, ease: "power3.out" }, at) : tl.set(k, { y: R(rows[k]) }, at)));

      /* ---- 0. Maya has a dream: a second shop, in Paris ---- */
      pop("#s-name", t(0) - 0.05, { from: 0.4 });
      pop("#s-dot1", t(3) - 0.15, { from: 0.2, d: 0.3 });
