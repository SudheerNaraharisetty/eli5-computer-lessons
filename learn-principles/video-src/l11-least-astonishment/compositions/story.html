      out(["#s-twice", "#s-prom", "#s-broke", "#s-rn2", "#s-row1", "#s-row2"], t(109), 0.3);
      tl.to(["#s-L2", "#s-L4", ".s-co", "#s-L10", "#s-L11", "#s-L12"], { opacity: 1, duration: 0.4, ease: "power2.inOut" }, t(109));

      tl.to("#s-chgtxt", { color: "#7cf0b5", duration: 0.3 }, t(123));

      draw("#s-wB", t(124) - 0.1, 0.6);

      pop("#s-plain", t(125) + 0.15, { from: 0.4 });

      /* ---- 7. Show it as often as you like. One order, one charge ---- */

      [[t(131), "#s-n1", null], [t(134), "#s-n2", "#s-n1"], [t(136) + 0.05, "#s-n3", "#s-n2"]].forEach(([at, tag, prev], i) => {
        row("#s-run", 2, at - 0.32);

        else tl.fromTo("#s-a1 .ma", { scale: 1.35 }, { scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, at);

        tl.fromTo(tag, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, at);
      });

      pop("#s-stok", t(142) + 0.1, { from: 0.2, ease: "back.out(2.4)", d: 0.3 });
