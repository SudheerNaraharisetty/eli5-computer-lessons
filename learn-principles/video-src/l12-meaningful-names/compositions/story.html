      const draw = (sel, at, d) => {
        tl.set(sel, { opacity: 1 }, at);
        tl.fromTo(sel, { strokeDashoffset: LEN[sel] }, { strokeDashoffset: 0, duration: d || 0.45, ease: "power2.out" }, at);
      };

      /* ---- the code as movable pieces: a rename swaps a token and slides the rest of its line ---- */
      const CH = 16.8, X0 = 168, LY = (i) => 278 + i * 104;
      const lines = gsap.utils.toArray("#s-lines .s-tx").map((tx) => gsap.utils.toArray(tx.children));
      const isTok = (sg) => sg.classList.contains("tk");
      lines.forEach((segs) => segs.forEach((sg) => { sg._s = 0; }));
      const segLen = (sg) => (isTok(sg) ? sg.children[sg._s].textContent.length : sg.textContent.length);
      const place = (at) => lines.forEach((segs) => {
        let c = 0;
        segs.forEach((sg) => {
          const x = c * CH;
          if (sg._x === undefined) gsap.set(sg, { x });
          else if (sg._x !== x) tl.fromTo(sg, { x: sg._x }, { x, duration: 0.42, ease: "power3.inOut", immediateRender: false }, at - 0.08);
          sg._x = x;
          c += segLen(sg);
        });
      });
      place();
      const advance = (sg, at) => {
        const a = sg.children[sg._s], b = sg.children[sg._s + 1];
        sg._s += 1;
        tl.to(a, { opacity: 0, duration: 0.14, ease: "power2.in" }, at - 0.04);
        tl.fromTo(b, { opacity: 0, scale: 1.3, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, at + 0.14);
      };
      const toks = (k) => gsap.utils.toArray('#s-lines .tk[data-k="' + k + '"]');
      const rename = (k, at) => { toks(k).forEach((sg) => advance(sg, at)); place(at); };
      const decode = (k, at) => tl.to(toks(k).map((sg) => sg.children[0]), { color: "#ffc24b", duration: 0.25, ease: "power2.out" }, at);
      const cur = (col, line, at, d) => tl.to("#s-cursor", { x: X0 + col * CH + 6, y: LY(line) + 10, duration: d || 0.45, ease: "power2.inOut" }, at);
      const strike = (n, at) => {
        tl.fromTo("#s-row" + n + " i", { opacity: 1, scaleX: 0, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power3.out" }, at);
        tl.to(["#s-row" + n + " code", "#s-row" + n + " span"], { opacity: 0.55, duration: 0.3 }, at);
      };

      /* ---- 1. Maya opens a file she wrote six months ago ---- */
      pop("#s-name", t(0) - 0.05, { from: 0.4 });
      tl.fromTo("#s-file", { opacity: 0, y: 70, rotation: -7 }, { opacity: 1, y: 0, rotation: -2, duration: 0.55, ease: "back.out(1.4)" }, t(3) - 0.1);
      tl.fromTo("#s-age", { opacity: 0, scale: 0.4, rotation: 10 }, { opacity: 1, scale: 1, rotation: 4, duration: 0.45, ease: "back.out(2)" }, t(6) - 0.05);
      tl.to("#s-smile", { opacity: 0, duration: 0.15 }, t(10));
      tl.to("#s-frown", { opacity: 1, duration: 0.15 }, t(10));
      pop("#s-q1", t(10), { from: 0.2, ease: "back.out(2.4)", d: 0.35 });
      pop("#s-q2", t(11), { from: 0.2, ease: "back.out(2.4)", d: 0.35 });
      pop("#s-q3", t(12), { from: 0.2, ease: "back.out(2.4)", d: 0.35 });

      /* ---- 2. The names say nothing ---- */
      tl.to("#s-open", { opacity: 0, x: -90, duration: 0.35, ease: "power3.in" }, t(13) - 0.4);
      tl.fromTo("#s-code", { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, t(13) - 0.1);
      tl.fromTo("#s-lines .s-ln", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out", stagger: 0.07 }, t(13) + 0.1);
      draw("#s-rcalc", t(16) - 0.05, 0.5);
      draw("#s-rx", t(19) - 0.05, 0.3);
      draw("#s-ry", t(20) - 0.05, 0.3);
      draw("#s-rf", t(22) - 0.05, 0.3);
      pop("#s-what", t(24) - 0.05, { from: 0.4 });

      /* ---- 3. She traces every line and writes a decoder note ---- */
      out(["#s-rcalc", "#s-rx", "#s-ry", "#s-rf"], t(27) - 0.1, 0.25);
      out("#s-what", t(28) + 0.05, 0.25);
      tl.fromTo("#s-scan", { opacity: 0, y: 0 }, { opacity: 1, y: 0, duration: 0.2 }, t(29) - 0.1);
      [1, 2, 3, 4, 5].forEach((i) => tl.to("#s-scan", { y: i * 104, duration: 0.2, ease: "power2.inOut" }, t(29) + 0.1 + i * 0.28));
      out("#s-scan", t(33) + 0.25, 0.3);
      tl.fromTo("#s-note", { opacity: 0, x: 80, rotation: 5 }, { opacity: 1, x: 0, rotation: 1.2, duration: 0.55, ease: "back.out(1.4)" }, t(35) - 0.1);
      [["x", 1, t(37)], ["y", 2, t(43)], ["f", 3, t(47)], ["t", 4, t(53) - 0.1], ["t2", 5, t(54)]].forEach(([k, n, at]) => {
        tl.fromTo("#s-row" + n, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, at - 0.05);
        decode(k, at + 0.05);
      });

      /* ---- 4. And there is a bug ---- */
      tl.fromTo("#s-bugpill", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, t(59) - 0.1);
      tl.fromTo("#s-rcp", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, t(60) - 0.05);
      tl.fromTo("#s-low", { opacity: 0, scale: 2.4, rotation: 4 }, { opacity: 1, scale: 1, rotation: -5, duration: 0.3, ease: "power4.in" }, t(64) - 0.25);
      tl.fromTo("#s-reads", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 25.4);
      [25.5, 26.0, 26.5].forEach((at, i) => {
        tl.fromTo("#s-scan", { opacity: 1, y: 0 }, { opacity: 1, y: 520, duration: 0.42, ease: "power1.inOut", immediateRender: false }, at);
        if (i === 0) tl.set("#s-rd1", { opacity: 1 }, at);
        else swap("#s-rd" + i, "#s-rd" + (i + 1), at);
      });
      out("#s-scan", t(70), 0.25);
      swap("#s-rd3", "#s-rd4", t(72));
      tl.to("#s-reads", { backgroundColor: "#b8235a", duration: 0.2 }, t(72));

      /* ---- 5. She renames things, one at a time ---- */
      out("#s-reads", t(75) - 0.3, 0.25);
      tl.fromTo("#s-cursor", { opacity: 0, x: 700, y: 1010 }, { opacity: 1, x: X0 + 9 * CH + 6, y: LY(0) + 10, duration: 0.7, ease: "power3.out" }, t(75) - 0.1);
      rename("x", t(77)); strike(1, t(77) + 0.3);
      cur(23, 0, t(79) - 0.5);
      rename("y", t(79)); strike(2, t(79) + 0.3);
      cur(37, 0, t(81) - 0.5);
      rename("f", t(81)); strike(3, t(81) + 0.3);
      cur(4, 1, t(84) - 0.5);
      rename("t", t(84)); strike(4, t(84) + 0.3);
      cur(4, 4, t(85) - 0.5);
      rename("t2", t(85)); strike(5, t(85) + 0.3);
      cur(4, 0, t(90) - 0.6, 0.55);
      rename("calc", t(91));
      tl.to("#s-cursor", { opacity: 0, x: 420, y: 180, duration: 0.45, ease: "power2.in" }, t(92) + 0.5);

      /* ---- 6. The note goes in the bin ---- */
      tl.to("#s-note > div", { opacity: 0, duration: 0.14 }, t(94) - 0.12);
      tl.to("#s-note", { scale: 0.2, rotation: 160, y: -30, borderRadius: 120, duration: 0.5, ease: "power3.inOut" }, t(94) - 0.1);
      pop("#s-bin", t(98) - 0.1, { from: 0.4, d: 0.35 });
      tl.to("#s-note", { y: 150, rotation: 300, duration: 0.35, ease: "power2.in" }, t(98) + 0.2);
      out("#s-note", t(98) + 0.45, 0.1);
      tl.to("#s-bin", { rotation: -7, transformOrigin: "50% 100%", duration: 0.08, yoyo: true, repeat: 3, ease: "power1.inOut" }, t(98) + 0.55);
      tl.to("#s-bin", { opacity: 0, y: 40, duration: 0.3, ease: "power2.in" }, t(100) - 0.35);
      pop("#s-nodec", t(100) - 0.05, { from: 0.75 });
      tl.to("#s-lines .tk b.n", { color: "#ffffff", duration: 0.22, yoyo: true, repeat: 1, stagger: 0.02 }, t(101));

      /* ---- 7. Look at the last line ---- */
      tl.to("#s-lines .s-ln:not(:last-child)", { opacity: 0.45, duration: 0.4, ease: "power2.inOut" }, t(104));
      tl.fromTo("#s-scan", { opacity: 0, y: 520 }, { opacity: 1, y: 520, duration: 0.3, immediateRender: false }, t(107) - 0.05);
      draw("#s-rsub", t(113) - 0.05, 0.5);
      tl.to("#s-lines .s-ln:nth-child(5)", { opacity: 1, duration: 0.3 }, t(114));
      draw("#s-rtwt", t(116) - 0.05, 0.55);
      pop("#s-unused", t(117) + 0.1, { from: 0.4 });
      tl.fromTo("#s-taxrow", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, t(118));
      tl.to("#s-lines .s-ln", { opacity: 1, duration: 0.4, ease: "power2.inOut" }, t(119));
      out("#s-bugpill", t(123) - 0.2, 0.2);
      tl.fromTo("#s-bug", { opacity: 0, scale: 2.4, rotation: 4 }, { opacity: 1, scale: 1, rotation: -5, duration: 0.3, ease: "power4.in" }, t(123) - 0.2);

      /* ---- 8. One small fix ---- */
      tl.set("#s-cursor", { x: 760, y: 1010 }, t(127));
      tl.to("#s-cursor", { opacity: 1, x: X0 + 11 * CH + 6, y: LY(5) + 10, duration: 0.6, ease: "power3.out" }, t(128) - 0.15);
      out(["#s-rsub", "#s-rtwt", "#s-bug", "#s-unused"], t(129) - 0.15, 0.2);
      advance(document.querySelector("#s-ret"), t(129) + 0.05);
      swap("#s-miss", "#s-taxamt", t(129) + 0.4);
      swap("#s-tamt .a", "#s-tamt .b", t(129) + 0.6);
      out("#s-low", t(129) + 0.55, 0.15);
      pop("#s-right", t(130) + 0.15, { from: 0.3, ease: "back.out(2.4)", d: 0.35 });
      tl.to("#s-cursor", { opacity: 0, x: 700, y: 900, duration: 0.4, ease: "power2.in" }, t(130) + 0.1);

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.3, ease: "power2.in" }, 53.08);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
  </script>
</template>
