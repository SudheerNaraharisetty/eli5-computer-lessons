            <g id="s-A2"><g transform="translate(196 196) rotate(40)"><path d="M-14 4 L-8 -11 L3 -6 L12 -13 L15 3 L5 12 L-7 11 Z" fill="#ffc24b" stroke="#0e0c1d" stroke-width="4" stroke-linejoin="round" /></g></g>
            <g id="s-A3"><g transform="translate(330 194) rotate(-80)"><path d="M-6 -16 H6 V-8 L10 0 V16 H-10 V0 L-6 -8 Z" fill="#ff6b8b" stroke="#0e0c1d" stroke-width="4" stroke-linejoin="round" /></g></g>
            <g id="s-A4"><g transform="translate(474 192) rotate(-30)"><rect x="-10" y="-15" width="20" height="30" rx="4" fill="#fff" stroke="#0e0c1d" stroke-width="4" /><path d="M-10 -5 H10" stroke="#0e0c1d" stroke-width="3" /></g></g>
            <g id="s-A5"><g transform="translate(262 186) rotate(160)"><path d="M-14 4 L-8 -11 L3 -6 L12 -13 L15 3 L5 12 L-7 11 Z" fill="#c9c6ff" stroke="#0e0c1d" stroke-width="4" stroke-linejoin="round" /></g></g>

      </div>
    </div>
  </div>

  <script>
    (function () {
      // Word start times from the narration (seconds), offset by the 0.6 s lead-in.
      const W = [0.0, 0.488, 0.662, 0.743, 1.022, 1.173, 1.997, 2.31, 2.426, 2.972, 3.39, 3.553, 3.715, 4.04, 4.946, 5.375, 5.666, 5.968, 6.211, 6.304, 6.676, 7.094, 7.848, 8.011, 8.22, 8.615, 9.056, 9.207, 9.567, 9.927, 10.879, 11.064, 11.146, 11.645, 11.97, 12.365, 12.69, 13.108, 14.153, 14.327, 14.617, 14.826, 15.418, 15.928, 17.02, 17.194, 17.531, 17.891, 18.332, 19.028, 19.214, 19.69, 20.282, 20.491, 20.712, 21.269, 21.687, 21.896, 22.128, 22.43, 23.394, 23.695, 24.137, 24.369, 25.425, 25.611, 25.948, 26.308, 26.958, 27.12, 27.457, 27.631, 27.782, 28.386, 28.595, 28.676, 29.013, 29.431, 29.779, 30.023, 31.137, 31.497, 31.753, 31.892, 32.507, 32.774, 33.042, 33.297, 34.458, 34.783, 35.491, 35.828, 36.107, 36.292, 36.85, 37.117, 37.662, 37.988, 38.405, 39.207, 39.369, 39.741, 40.275, 40.495, 40.786, 41.122, 42.19, 42.364, 42.759, 43.073, 43.421, 43.665, 44.222, 44.536, 44.93, 46.08, 46.509, 46.869, 47.345, 47.554, 47.902, 48.251, 48.46, 49.4, 49.598, 49.714, 49.992, 50.329, 50.735, 51.13, 51.548, 52.361, 52.732, 52.976, 53.162, 53.463, 53.858, 54.648, 54.961, 55.077, 55.484, 55.6, 55.913, 56.343, 56.517, 56.703, 57.051];
      const t = (i) => W[i] + 0.6;
      const R = 44; // one code row
      const PINK = "#4a1e3a", GREEN = "#173f36", CLEAR = "rgba(74, 30, 58, 0)";
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => "#s-" + id;

      const pop = (sel, at, o) => {
        o = o || {};
        tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.45, ease: o.ease || "back.out(1.6)" }, at);
      };
      const out = (sel, at, d) => tl.to(sel, { opacity: 0, duration: d || 0.2, ease: "power2.in" }, at);

      /* ---- code rows: every state of the file is an ordered list of row ids ("" is a blank line) ---- */
      const cur = {}, vis = {};
      const gut = gsap.utils.toArray("#s-gut i");
      const state = (list, at, d) => {
        list.forEach((id, i) => {
          if (!id) return;
          const y = i * R;
          if (at === null) { gsap.set($(id), { y }); cur[id] = y; vis[id] = true; return; }
          if (!vis[id]) tl.set($(id), { y }, at);
          else if (cur[id] !== y) tl.fromTo($(id), { y: cur[id] }, { y, duration: d || 0.4, ease: "power3.inOut", immediateRender: false }, at);
          cur[id] = y;
        });
        if (at !== null) gut.forEach((g, i) => tl.to(g, { opacity: i < list.length ? 1 : 0, duration: 0.2 }, at + 0.15));
      };
      const show = (ids, at) => ids.forEach((id, i) => {
        vis[id] = true;
        tl.fromTo($(id), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, at + i * 0.06);
      });
      const hide = (ids, at, d) => ids.forEach((id) => {
        vis[id] = false;
        tl.to($(id), { opacity: 0, duration: d || 0.2, ease: "power2.in" }, at);
      });
      const vswap = (id, a, b, at) => {
        tl.to($(id) + " > ." + a, { opacity: 0, duration: 0.12, ease: "power2.in" }, at);
        tl.to($(id) + " > ." + b, { opacity: 1, duration: 0.3, ease: "power2.out" }, at + 0.08);
      };
      const tint = (id, col, at) => tl.to($(id), { backgroundColor: col, duration: 0.25 }, at);
      const tag = (id, at) => tl.fromTo($(id), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, at);

      const S = ["r1", "r2", "r3", "r4", "", "c1", "c2", "c3"];
      state(S, null);

      /* ---- meter, pips, litter ---- */
      gsap.set("#s-needle", { rotation: -90, svgOrigin: "267 190" });
      let count = 0;
      const meter = (c, at) => {
        tl.to("#s-needle", { rotation: -90 + c * 22.5, svgOrigin: "267 190", duration: 0.6, ease: "back.out(2.2)" }, at);
        tl.to("#s-n" + count, { opacity: 0, duration: 0.1 }, at + 0.1);
        tl.to("#s-n" + c, { opacity: 1, duration: 0.2 }, at + 0.18);
        count = c;
      };
      const pipBad = (n, at) => {
        tl.to($("p-" + n), { backgroundColor: "#ff9db3", duration: 0.2 }, at);
        tl.to($("p-" + n), { scale: 1.22, duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1 }, at);
      };
      const pipGood = (n, at) => {
        tl.to($("p-" + n), { backgroundColor: "#1f7a5c", duration: 0.2 }, at);
        tl.to($("p-" + n) + " > b", { opacity: 0, duration: 0.15 }, at);
        tl.to($("p-" + n) + " > svg", { opacity: 1, duration: 0.2 }, at + 0.05);
        tl.to($("p-" + n), { scale: 1.22, duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1 }, at);
      };
      const drop = (id, at) => tl.fromTo($(id), { opacity: 0, y: -130 }, { opacity: 1, y: 0, duration: 0.55, ease: "bounce.out" }, at);
      const pick = (id, at) => tl.to($(id), { opacity: 0, y: -46, duration: 0.4, ease: "power2.in" }, at);
      const bloom = (id, x, at) => tl.fromTo($(id), { opacity: 0, scale: 0, svgOrigin: x + " 150" }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, at);
      gsap.set(["#s-A1", "#s-A2", "#s-A3", "#s-A4", "#s-A5", "#s-F1", "#s-F2", "#s-F3", "#s-pick"], { opacity: 0 });

      const ring = document.querySelector("#s-rx");
      const RL = Math.ceil(ring.getTotalLength()) || 200;
      ring.style.strokeDasharray = RL + " " + (RL + 40);

      /* ---- 1. The scouts' rule ---- */
      const CAMP = { scale: 2.5, x: -1154, y: -352, transformOrigin: "0 0" };
      tl.to("#s-arm", { rotation: -16, svgOrigin: "296 340", duration: 0.2, ease: "power1.inOut", yoyo: true, repeat: 5 }, 0.3);
      const hw = gsap.utils.toArray("#s-h2 span");
      [6, 7, 8, 9, 10, 11, 12, 13].forEach((w, i) => tl.fromTo(hw[i], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, t(w) - 0.05));
      tl.to("#s-L0", { y: -34, opacity: 0, duration: 0.45, ease: "power2.in" }, t(9) + 0.05);
      tl.fromTo("#s-pick", { opacity: 0, scale: 0.2, svgOrigin: "262 180" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.4)" }, t(9) + 0.45);

      /* ---- 2. Maya's shop file gets a visit every week ---- */
      const T2 = t(14) - 0.45;
      tl.to(["#s-kick", "#s-h2", "#s-maya"], { opacity: 0, duration: 0.3, ease: "power2.in" }, T2);
      tl.to("#s-pick", { opacity: 0, duration: 0.3 }, T2);
      tl.fromTo("#s-camp", CAMP, { scale: 1, x: 0, y: 0, transformOrigin: "0 0", duration: 0.8, ease: "power3.inOut" }, T2 + 0.05);
      tl.fromTo("#s-code", { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, T2 + 0.4);
      tl.fromTo("#s-lines .s-ln:not(.s-hide)", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out", stagger: 0.05 }, T2 + 0.6);
      gut.slice(0, 8).forEach((g, i) => tl.to(g, { opacity: 1, duration: 0.2 }, T2 + 0.6 + i * 0.05));
      tl.fromTo("#s-right", { opacity: 0, x: 90 }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, T2 + 0.35);
      [1, 2, 3, 4, 5].forEach((n, i) => pop($("p-" + n), t(19) - 0.1 + i * 0.13, { from: 0.4, d: 0.35 }));
      // "a new feature here, a small fix there": the meter shows how she finds the file
      tl.fromTo("#s-meter", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, t(23) - 0.1);
      tl.to("#s-n0", { opacity: 1, duration: 0.2 }, t(23) + 0.1);
      meter(2, t(25));
      tl.set("#s-rx", { opacity: 1 }, t(27));
      tl.fromTo("#s-rx", { strokeDashoffset: RL }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, t(27));
      tag("t-x", t(27) + 0.25);
      tl.to("#s-L1", { y: -14, duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1 }, t(27) + 0.1);
      tint("r3", PINK, t(28) + 0.15);
      tag("t-dead0", t(28) + 0.35);
      tl.to("#s-L2", { y: -14, duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1 }, t(28) + 0.25);

      /* ---- 3. In a hurry: each visit leaves something behind ---- */
      out(["#s-rx", "#s-t-x", "#s-t-dead0"], t(30) - 0.1, 0.25);
      tint("r3", CLEAR, t(30) - 0.1);
      tl.fromTo("#s-modeA", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, t(31));
      tl.to(".s-pip", { y: -10, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, stagger: 0.07 }, t(33));
      // visit 1: a note that says fix later
      const A1 = ["r1", "r2", "r3", "r4", "", "c1", "c2", "a1", "a2", "c3"];
      pipBad(1, t(38));
      state(A1, t(38), 0.35);
      show(["a1", "a2"], t(38) + 0.25);
      tint("a1", PINK, t(39) + 0.1);
      drop("A1", t(39) + 0.1);
      meter(3, t(39) + 0.3);
      tag("t-todo", t(42));
      // visit 2: a name like tmp2
      const A2 = ["r1", "r2", "r3", "a3", "r4", "", "c1", "c2", "a1", "a2", "c3"];
      pipBad(2, t(44));
      state(A2, t(44), 0.35);
      show(["a3"], t(44) + 0.25);
      vswap("r4", "va", "vt", t(45) + 0.2);
      tint("a3", PINK, t(47) - 0.1);
      drop("A2", t(47) - 0.1);
      meter(4, t(47) + 0.1);
      tag("t-tmp", t(47) + 0.3);
      // visit 3: a copied line
      const A3 = A2.concat(["", "p1", "p2", "p3"]);
      pipBad(3, t(49));
      state(A3, t(49), 0.3);
      show(["p1", "p2", "p3"], t(49) + 0.1);
      tint("p3", PINK, t(50));
      drop("A3", t(50));
      meter(5, t(50) + 0.2);
      tag("t-copy", t(50) + 0.35);
      // visit 4: an old line, switched off but never deleted
      pipBad(4, t(52));
      vswap("a2", "va", "vd", t(55) - 0.1);
      tint("a2", PINK, t(55));
      tag("t-dead", t(55) + 0.2);
      drop("A4", t(55) + 0.1);
      meter(6, t(55) + 0.3);
      // visit 5: no single one hurts
      const A5 = A2.concat(["", "p1", "p2", "a5", "p3"]);
      pipBad(5, t(60));
      state(A5, t(60), 0.35);
      show(["a5"], t(60) + 0.25);
      vswap("p3", "va", "vt", t(61));
      tint("a5", PINK, t(61));
      tag("t-tmp3", t(61) + 0.25);
      drop("A5", t(62));
      meter(7, t(62) + 0.2);
      // after five visits, the file is a mess
      tl.to(".s-pip", { y: -10, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, stagger: 0.07 }, t(66));
      tl.fromTo("#s-mess", { opacity: 0, scale: 2.4, rotation: 4 }, { opacity: 1, scale: 1, rotation: -7, duration: 0.3, ease: "power4.in" }, t(72) - 0.25);
      tl.fromTo("#s-res", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, t(75) - 0.15);
      tl.fromTo("#s-resA span", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, t(77));
      pop("#s-resA b", t(78), { from: 1.5, d: 0.4, ease: "back.out(2)" });

      /* ---- 4. Now play it again, with one new habit ---- */
      const TR = t(80) - 0.05;
      out(["#s-t-todo", "#s-t-tmp", "#s-t-copy", "#s-t-dead", "#s-t-tmp3", "#s-mess"], TR, 0.2);
      hide(["a5", "p3", "p2", "p1", "a3", "a2", "a1"], TR + 0.05, 0.3);
      ["a1", "a2", "a3", "a5", "p3"].forEach((id) => tint(id, CLEAR, TR + 0.3));
      tl.set("#s-r4 > .vt, #s-a2 > .vd, #s-p3 > .vt", { opacity: 0 }, TR + 0.4);
      tl.set("#s-a2 > .va, #s-p3 > .va", { opacity: 1 }, TR + 0.4);
      tl.to("#s-r4 > .va", { opacity: 1, duration: 0.25 }, TR + 0.4);
      state(S, TR + 0.35, 0.5);
      ["A5", "A4", "A3", "A2", "A1"].forEach((id, i) => tl.to($(id), { opacity: 0, y: -90, duration: 0.3, ease: "power2.in" }, TR + 0.1 + i * 0.07));
      tl.to(".s-pip", { backgroundColor: "#ffffff", duration: 0.3, stagger: -0.06 }, TR + 0.2);
      tl.to("#s-needle", { rotation: -45, svgOrigin: "267 190", duration: 0.8, ease: "power3.inOut" }, TR + 0.15);
      tl.to("#s-n7", { opacity: 0, duration: 0.15 }, TR + 0.4);
      tl.to("#s-n2", { opacity: 1, duration: 0.2 }, TR + 0.6);
      count = 2;
      out("#s-modeA", TR + 0.1, 0.25);
      tl.fromTo("#s-modeB", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, t(85) - 0.1);
      tl.to(".s-pip", { y: -10, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, stagger: 0.07 }, t(88));
      // visit 1: the task, then a clearer name
      const B1 = ["r1", "r2", "r3", "r4", "", "c1", "c2", "a2", "c3"];
      state(B1, t(93) - 0.1, 0.35);
      show(["a2"], t(93) + 0.15);
      tl.fromTo("#s-cursor", { opacity: 0, x: 700, y: 1010 }, { opacity: 1, x: 472, y: 218, duration: 0.8, ease: "power3.out" }, t(95));
      vswap("r1", "va", "vb", t(100) - 0.05);
      vswap("r2", "va", "vb", t(100) + 0.15);
      tag("t-name", t(100) + 0.3);
      pick("L1", t(100) + 0.1);
      meter(1, t(100) + 0.3);
      pipGood(1, t(101));
      // visit 2: the task, then a dead line deleted
      const B2a = ["r1", "r2", "r3", "b2", "r4", "", "c1", "c2", "a2", "c3"];
      const B2b = ["r1", "r2", "b2", "r4", "", "c1", "c2", "a2", "c3"];
      out("#s-t-name", t(102) - 0.1, 0.2);
      state(B2a, t(102) - 0.1, 0.3);
      show(["b2"], t(102) + 0.1);
      tl.to("#s-cursor", { x: 590, y: 302, duration: 0.45, ease: "power2.inOut" }, t(102));
      tint("r3", PINK, t(103));
      tl.fromTo("#s-r3 > s", { opacity: 1, scaleX: 0, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power2.out" }, t(103) + 0.15);
      hide(["r3"], t(105), 0.2);
      state(B2b, t(105) + 0.15, 0.35);
      pick("L2", t(105) + 0.05);
      meter(0, t(105) + 0.25);
      pipGood(2, t(105) + 0.3);
      // visit 3: the task would copy the tax line a third time; it gets one home
      const B3a = B2b.concat(["", "p1", "p2", "p3"]);
      const B3b = ["w1", "w2", ""].concat(B3a);
      state(B3a, t(106) - 0.1, 0.3);
      show(["p1", "p2", "p3"], t(106));
      tl.to("#s-cursor", { x: 820, y: 720, opacity: 0, duration: 0.5, ease: "power2.in" }, t(106));
      ["r4", "c3", "p3"].forEach((id, i) => tint(id, "#2e2a58", t(107) + i * 0.12));
      state(B3b, t(109) - 0.15, 0.4);
      show(["w1", "w2"], t(109) + 0.15);
      tint("w1", GREEN, t(109) + 0.2);
      tint("w2", GREEN, t(109) + 0.2);
      ["r4", "c3", "p3"].forEach((id, i) => {
        vswap(id, "va", "vw", t(110) + i * 0.14);
        tint(id, "rgba(46, 42, 88, 0)", t(110) + 0.1 + i * 0.14);
      });
      tag("t-home", t(111));
      pipGood(3, t(111) + 0.1);
      bloom("F1", 246, t(111) + 0.2);
      // visits 4 and 5: two minutes each
      const B4 = B3b.filter((id) => id !== "a2");
      hide(["a2"], t(112) - 0.1, 0.2);
      state(B4, t(112) + 0.05, 0.3);
      pipGood(4, t(112) + 0.2);
      bloom("F2", 352, t(112) + 0.3);
      const B5 = B4.slice(0, 14).concat(["b5", "p3"]);
      state(B5, t(113) + 0.2, 0.3);
      show(["b5"], t(113) + 0.4);
      pipGood(5, t(114));
      bloom("F3", 404, t(114) + 0.1);
      [1, 2, 3, 4, 5].forEach((n, i) => pop($("m-" + n), t(112) + i * 0.16, { from: 0.4, d: 0.3 }));

      /* ---- 5. After five visits, the same file is clean ---- */
      out("#s-t-home", t(115) - 0.1, 0.2);
      tint("w1", CLEAR, t(115));
      tint("w2", CLEAR, t(115));
      tl.to(".s-pip", { y: -10, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, stagger: 0.07 }, t(116));
      tl.fromTo("#s-clean", { opacity: 0, scale: 2.4, rotation: 4 }, { opacity: 1, scale: 1, rotation: -7, duration: 0.3, ease: "power4.in" }, t(122) - 0.25);
      tl.fromTo("#s-resB span", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, t(125));
      pop("#s-resB b", t(129), { from: 1.5, d: 0.4, ease: "back.out(2)" });

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.3, ease: "power2.in" }, 52.2);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
  </script>
</template>
