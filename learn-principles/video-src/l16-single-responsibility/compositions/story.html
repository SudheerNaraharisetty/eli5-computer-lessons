          <p><span id="s-tk1a" class="s-hide">Count each&nbsp;</span><span id="s-tk1b" class="s-hide">gift box</span><br /><span id="s-tk1c" class="s-hide">as <em>6 cookies</em></span></p>
        </div>
        <div class="s-abs s-tk s-ol s-hide" id="s-tk2" data-layout-allow-occlusion data-layout-allow-overlap>
          <small>THE BAKER ASKS AGAIN</small>
          <p><span>Bake <em>10 spare</em></span><br /><span>cookies every day</span></p>
        </div>

        <svg id="s-cursor" class="s-abs s-hide" viewBox="0 0 48 48"><path d="M4 3 L4 37 L13 29 L20 45 L27 42 L20 26 L33 26 Z" fill="#fff" stroke="#0e0c1d" stroke-width="4" stroke-linejoin="round" /></svg>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // Word start times from the narration (seconds), offset by the 0.6 s lead-in.
      const W = [0.0, 0.36, 0.708, 0.929, 1.265, 1.858, 2.159, 3.065, 3.216, 3.553, 4.04, 4.214, 4.458, 4.853, 4.992, 5.84, 6.13, 6.606, 6.78, 6.908, 7.407, 7.814, 8.719, 8.882, 9.416, 9.915, 10.124, 10.612, 10.844, 10.995, 11.157, 12.19, 12.446, 12.632, 12.771, 13.421, 13.758, 14.106, 14.454, 14.779, 15.453, 15.836, 16.15, 17.287, 17.705, 17.891, 18.332, 19.366, 19.772, 20.085, 20.457, 20.886, 21.177, 21.571, 22.315, 22.651, 23.058, 23.174, 23.708, 23.859, 24.23, 24.544, 24.799, 25.472, 25.925, 26.842, 27.005, 27.109, 27.446, 27.852, 28.224, 28.584, 28.99, 29.942, 30.395, 30.674, 30.871, 31.045, 31.405, 31.533, 31.916, 32.508, 32.74, 33.053, 33.413, 33.599, 34.702, 34.888, 35.213, 35.375, 35.7, 36.409, 36.629, 37.279, 37.732, 37.86, 38.603, 38.893, 39.253, 39.439, 39.729, 40.89, 41.308, 41.482, 41.9, 42.318, 43.386, 43.734, 43.874, 44.385, 44.733, 45.685, 45.882, 46.289, 46.718, 47.461, 47.81, 48.007, 48.436, 49.981, 50.271, 50.549, 50.677, 51.374, 51.676, 52.106, 52.28, 53.313, 54.091, 54.311, 54.509, 54.741, 54.869, 55.008, 55.368, 55.995, 56.204, 56.413, 56.645, 57.609, 58.061];
      const t = (i) => W[i] + 0.6;
      const tl = gsap.timeline({ paused: true });

      const pop = (sel, at, o) => {
        o = o || {};
        tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.45, ease: o.ease || "back.out(1.6)" }, at);
      };
      const out = (sel, at, d) => tl.to(sel, { opacity: 0, duration: d || 0.2, ease: "power2.in" }, at);
      const swap = (a, b, at) => {
        tl.to(a, { opacity: 0, duration: 0.12, ease: "power2.in" }, at);
        tl.fromTo(b, { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, at + 0.08);
      };
      const pulse = (sel, at, s) => tl.fromTo(sel, { scale: 1 }, { scale: s || 1.1, duration: 0.17, ease: "power2.out", yoyo: true, repeat: 1 }, at);
      const wobble = (sel, at, deg) => tl.fromTo(sel, { rotation: 0 }, { rotation: deg || 2.5, duration: 0.07, ease: "sine.inOut", yoyo: true, repeat: 5 }, at);

      // Hand-drawn rings: build the path from "cx,cy,rx,ry".
      document.querySelectorAll("#s-marks path[data-ring]").forEach((p) => {
        const [cx, cy, rx, ry] = p.getAttribute("data-ring").split(",").map(Number);
        p.setAttribute("d", `M${cx - rx} ${cy + 2} C${cx - rx - 2} ${cy - ry - 4} ${cx + rx} ${cy - ry - 6} ${cx + rx} ${cy} C${cx + rx} ${cy + ry + 4} ${cx - rx - 6} ${cy + ry + 6} ${cx - rx - 4} ${cy - 8}`);
      });
      // Stroke drawing: measure each path, then tween the dash offset to 0.
      const LEN = {};
      document.querySelectorAll("#s-marks path").forEach((p) => {
        const L = Math.ceil(p.getTotalLength()) || 1200;
        LEN["#" + p.id] = L;
        p.style.strokeDasharray = L + " " + (L + 40);
        p.style.strokeDashoffset = L;
      });
      const draw = (sel, at, d) => {
        tl.set(sel, { opacity: 1 }, at);
        tl.fromTo(sel, { strokeDashoffset: LEN[sel] }, { strokeDashoffset: 0, duration: d || 0.45, ease: "power2.out", immediateRender: false }, at);
      };

      /* ---- 1. Three people, one program ---- */
      const MOVE = t(31) - 0.35;
      // Opening places (big, in a row). They slide to the side columns at MOVE.
      [["#s-p1", 284, 140], ["#s-p2", 764, -150], ["#s-p3", 1244, -440]].forEach(([p, x, y]) =>
        tl.fromTo(p, { x, y, scale: 1.4 }, { x: 0, y: 0, scale: 1, duration: 0.85, ease: "power3.inOut" }, MOVE));
      [["#s-c1", -1124, 510], ["#s-c2", -644, 220], ["#s-c3", -164, -70]].forEach(([c, x, y]) =>
        tl.fromTo(c, { x, y }, { x: 0, y: 0, duration: 0.85, ease: "power3.inOut" }, MOVE + 0.05));

      pop("#s-p1i", t(0) - 0.1, { from: 0.4 });
      pop("#s-p3i", t(1) - 0.1, { from: 0.4 });
      tl.fromTo("#s-prog", { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.5)" }, t(4) - 0.1);
      draw("#s-o1", t(5), 0.45);
      draw("#s-o2", t(5) + 0.15, 0.3);
      draw("#s-o3", t(5) + 0.3, 0.45);
      pulse("#s-prog", t(6) + 0.1, 1.08);

      /* ---- 2. Who decides what ---- */
      pulse("#s-p1i", t(8), 1.12);
      pop("#s-c1i", t(10), { from: 0.7 });
      pulse("#s-p2i", t(15), 1.12);
      pop("#s-c2i", t(17), { from: 0.7 });
      pulse("#s-p3i", t(23), 1.12);
      pop("#s-c3i", t(25), { from: 0.7 });

      /* ---- 3. In the code, all three share one function and one count ---- */
      out(["#s-o1", "#s-o2", "#s-o3"], MOVE - 0.1, 0.2);
      tl.to("#s-prog", { opacity: 0, scale: 0.7, duration: 0.25, ease: "power2.in" }, MOVE);
      tl.fromTo("#s-code", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, t(34) - 0.25);
      tl.fromTo("#s-lines > .s-ln, #s-low > .s-ln", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out", stagger: 0.045 }, t(34));
      draw("#s-w1", t(34) + 0.45, 0.25);
      draw("#s-w2", t(34) + 0.5, 0.25);
      draw("#s-w3", t(34) + 0.55, 0.25);
      draw("#s-s1", t(35), 0.4);
      draw("#s-s2", t(35) + 0.2, 0.4);
      draw("#s-s3", t(36) + 0.05, 0.4);
      pop("#s-knot", t(37), { from: 0.2, ease: "back.out(2.6)" });
      draw("#s-ufn", t(39) - 0.05, 0.45);
      tl.to("#s-lines .dm", { opacity: 0.45, duration: 0.4, ease: "power2.inOut" }, t(41) - 0.2);
      draw("#s-r5", t(41), 0.5);
      draw("#s-u1", t(42) + 0.05, 0.3);
      draw("#s-u2", t(42) + 0.3, 0.3);
      draw("#s-u3", t(42) + 0.55, 0.3);

      /* ---- 4. The baker asks: a gift box is 6 cookies ---- */
      out(["#s-ufn", "#s-r5", "#s-u1", "#s-u2", "#s-u3"], t(43) - 0.1, 0.25);
      tl.to("#s-lines .dm", { opacity: 1, duration: 0.4, ease: "power2.inOut" }, t(43));
      pulse("#s-p1i", t(45), 1.14);
      tl.fromTo("#s-p1", { x: 0 }, { x: -14, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 3, immediateRender: false }, t(46));
      tl.fromTo("#s-tk1", { opacity: 0, scale: 0.3, x: -150, y: 30 }, { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.45, ease: "back.out(1.5)" }, t(47) - 0.5);
      tl.fromTo("#s-tk1a", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, t(47) - 0.05);
      tl.fromTo("#s-tk1b", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, t(49) - 0.05);
      tl.fromTo("#s-tk1c", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, t(51) - 0.05);
      pulse("#s-tk1c", t(52) + 0.2, 1.12);

      // The request travels into the code. Maya makes room and types two lines.
      tl.to("#s-tk1", { x: 60, y: 250, scale: 0.12, opacity: 0, duration: 0.42, ease: "power3.in" }, t(54) - 0.2);
      tl.fromTo("#s-cursor", { opacity: 0, x: 780, y: 1010 }, { opacity: 1, x: 706, y: 492, duration: 0.5, ease: "power3.out" }, t(54) - 0.1);
      tl.fromTo("#s-low", { y: 0 }, { y: 104, duration: 0.3, ease: "power3.inOut" }, t(55) - 0.15);
      tl.to("#s-low b.o", { opacity: 0, duration: 0.1 }, t(55));
      tl.to("#s-low b.n", { opacity: 1, duration: 0.1 }, t(55) + 0.05);
      tl.set(["#s-nl1", "#s-nl2"], { opacity: 1 }, t(55) + 0.12);
      tl.fromTo("#s-nl1", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.4, ease: "steps(12)", immediateRender: false }, t(55) + 0.12);
      tl.set("#s-nl2", { clipPath: "inset(0% 100% 0% 0%)" }, t(55) + 0.12);
      tl.to("#s-cursor", { x: 760, y: 544, duration: 0.2, ease: "power2.inOut" }, t(55) + 0.45);
      tl.to("#s-nl2", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.4, ease: "steps(12)" }, t(57) - 0.12);
      tl.to("#s-cursor", { x: 1090, y: 880, opacity: 0, duration: 0.5, ease: "power2.in" }, t(57) + 0.35);
      // The tug: one rope moves, everything tied to the function shakes.
      wobble("#s-code", t(57) + 0.3, 0.5);
      wobble("#s-c1i", t(57) + 0.32, 2.5);
      wobble("#s-c2i", t(57) + 0.38, 2.5);
      wobble("#s-c3i", t(57) + 0.44, 2.5);

      /* ---- 5. The baking plan is right: 42 ---- */
      swap("#s-n1 .v0", "#s-n1 .v1", t(59));
      pop("#s-ok1", t(62), { from: 0.2, ease: "back.out(2.4)" });
      pop("#s-t1", t(63), { from: 0.3, ease: "back.out(2.2)", d: 0.4 });
      pulse("#s-n1", t(64), 1.12);

      /* ---- 6. But the tax report used that same count ---- */
      pulse("#s-p3i", t(67), 1.12);
      wobble("#s-c3i", t(68), 2);
      tl.to("#s-lines .dm", { opacity: 0.45, duration: 0.4, ease: "power2.inOut" }, t(69));
      draw("#s-rp", t(70), 0.5);
      draw("#s-rm", t(72) - 0.1, 0.45);
      pulse("#s-n3", t(76), 1.1);
      swap("#s-n3 .v0", "#s-n3 .v1", t(82));
      wobble("#s-c3i", t(82) + 0.05, 3);
      pop("#s-t3", t(83) + 0.25, { from: 0.3, ease: "back.out(2.2)", d: 0.4 });
      tl.fromTo("#s-wr3", { opacity: 0, scale: 2.4, rotation: 4 }, { opacity: 1, scale: 1, rotation: -7, duration: 0.3, ease: "power4.in" }, t(85) + 0.4);
      // The slip is wrong too.
      draw("#s-rs", t(87) - 0.1, 0.4);
      pulse("#s-p2i", t(87), 1.1);
      swap("#s-q2 .v0", "#s-q2 .v1", t(87) + 0.2);
      tl.fromTo("#s-wr2", { opacity: 0, scale: 2.4, rotation: 4 }, { opacity: 1, scale: 1, rotation: -7, duration: 0.3, ease: "power4.in" }, t(89) - 0.2);

      /* ---- 7. The fix: split the function, one piece per person ---- */
      out(["#s-rp", "#s-rm", "#s-rs"], t(91), 0.25);
      tl.to("#s-lines .dm", { opacity: 1, duration: 0.3, ease: "power2.inOut" }, t(91));
      const SPLIT = t(93);
      pop("#s-cut1", SPLIT - 0.1, { from: 1, d: 0.01 });
      pop("#s-cut2", SPLIT - 0.1, { from: 1, d: 0.01 });
      tl.fromTo("#s-cut1", { clipPath: "inset(-10px 100% -10px 0%)" }, { clipPath: "inset(-10px 0% -10px 0%)", duration: 0.35, ease: "power2.out", immediateRender: false }, SPLIT - 0.1);
      tl.fromTo("#s-cut2", { clipPath: "inset(-10px 0% -10px 100%)" }, { clipPath: "inset(-10px 0% -10px 0%)", duration: 0.35, ease: "power2.out", immediateRender: false }, SPLIT);
      out(["#s-s1", "#s-s2", "#s-s3", "#s-knot", "#s-w1", "#s-w2", "#s-w3", "#s-t1", "#s-t3", "#s-wr2", "#s-wr3"], SPLIT + 0.3, 0.25);
      tl.to("#s-code", { opacity: 0, scale: 0.97, duration: 0.25, ease: "power2.in" }, SPLIT + 0.4);
      out(["#s-cut1", "#s-cut2"], SPLIT + 0.45, 0.2);
      tl.fromTo("#s-bA", { opacity: 0, y: 70, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.4)" }, SPLIT + 0.5);
      tl.fromTo("#s-bB", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.4)" }, SPLIT + 0.56);
      tl.fromTo("#s-bC", { opacity: 0, y: -70, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.4)" }, SPLIT + 0.62);
      // The numbers go back to what each person expects.
      swap("#s-q2 .v1", "#s-q2 .v2", SPLIT + 0.9);
      swap("#s-n3 .v1", "#s-n3 .v2", SPLIT + 1.0);
      [["1", "A", t(96)], ["2", "B", t(98) - 0.05], ["3", "C", t(99) + 0.15]].forEach(([n, b, at]) => {
        draw("#s-a" + n, at, 0.35);
        draw("#s-x" + n, at + 0.1, 0.3);
        pop("#s-b" + b + " .s-boss", at + 0.15, { from: 0.4 });
        if (n === "1") pulse("#s-ok1", at + 0.3, 1.25);
        else pop("#s-ok" + n, at + 0.3, { from: 0.2, ease: "back.out(2.4)" });
      });

      /* ---- 8. The baker asks again: only the baker's piece changes ---- */
      pulse("#s-p1i", t(103), 1.14);
      tl.fromTo("#s-tk2", { opacity: 0, scale: 0.3, x: -150, y: 30 }, { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.45, ease: "back.out(1.5)" }, t(102));
      tl.to("#s-tk2", { x: 150, y: 220, scale: 0.12, opacity: 0, duration: 0.42, ease: "power3.in" }, t(106) - 0.05);
      tl.to(["#s-bB", "#s-bC"], { opacity: 0.78, duration: 0.35, ease: "power2.inOut" }, t(106));
      tl.fromTo("#s-hl", { opacity: 0, scaleX: 0, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: 0.35, ease: "power3.out" }, t(108));
      tl.set("#s-cursor", { x: 1000, y: 1010 }, t(106));
      tl.to("#s-cursor", { opacity: 1, x: 880, y: 458, duration: 0.6, ease: "power3.out" }, t(108) - 0.1);
      swap("#s-k1 .v0", "#s-k1 .v1", t(110));
      swap("#s-n1 .v1", "#s-n1 .v2", t(110) + 0.3);
      pop("#s-t1b", t(110) + 0.5, { from: 0.3, ease: "back.out(2.2)", d: 0.4 });
      tl.to("#s-cursor", { opacity: 0, x: 960, y: 520, duration: 0.4, ease: "power2.in" }, t(110) + 0.5);
      tl.to(["#s-bB", "#s-bC"], { opacity: 1, duration: 0.3, ease: "power2.out" }, t(112) - 0.15);
      pop("#s-lkB", t(112), { from: 0.4 });
      pop("#s-lkC", t(112) + 0.25, { from: 0.4 });
      pulse("#s-ok2", t(113) + 0.1, 1.3);
      pulse("#s-ok3", t(114), 1.3);

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.3, ease: "power2.in" }, 47.6);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
  </script>
</template>
