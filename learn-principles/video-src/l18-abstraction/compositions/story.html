        <div class="s-ok" id="s-k0" style="top:164px"><svg viewBox="0 0 56 56"><path d="M16 29 L25 38 L41 20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></svg></div>
        <div class="s-ok" id="s-k1" style="top:292px"><svg viewBox="0 0 56 56"><path d="M16 29 L25 38 L41 20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></svg></div>
        <div class="s-ok" id="s-k2" style="top:420px"><svg viewBox="0 0 56 56"><path d="M16 29 L25 38 L41 20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></svg></div>
        <div class="s-ok" id="s-k3" style="top:548px"><svg viewBox="0 0 56 56"><path d="M16 29 L25 38 L41 20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></svg></div>
        <div class="s-ok" id="s-k4" style="top:676px"><svg viewBox="0 0 56 56"><path d="M16 29 L25 38 L41 20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></svg></div>
        <div class="s-ok" id="s-k5" style="top:804px"><svg viewBox="0 0 56 56"><path d="M16 29 L25 38 L41 20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></svg></div>

  <script>
    (function () {
      // Word start times from the narration (seconds), offset by the 0.6 s lead-in.
      const W = [0.0, 0.348, 0.604, 0.743, 1.08, 1.219, 1.776, 1.974, 2.218, 2.554, 2.717, 3.657, 3.924, 4.052, 4.18, 5.132, 5.468, 5.561, 5.863, 5.979, 6.095, 6.42, 7.338, 7.605, 7.744, 8.173, 8.94, 9.23, 9.346, 9.764, 9.938, 10.136, 10.449, 10.588, 11.006, 11.97, 12.365, 12.829, 13.177, 13.317, 14.106, 14.466, 14.896, 15.093, 15.244, 16.486, 16.881, 17.241, 17.38, 17.531, 17.833, 18.1, 18.216, 19.238, 19.586, 19.749, 19.853, 20.085, 20.573, 20.759, 21.049, 21.49, 22.744, 23.29, 23.522, 23.963, 24.219, 24.486, 24.637, 24.869, 25.055, 25.24, 26.088, 26.366, 26.692, 26.842, 27.725, 27.969, 28.456, 28.607, 28.816, 28.944, 29.246, 29.501, 29.815, 30.384, 31.312, 31.544, 31.858, 32.264, 32.554, 33.286, 33.878, 35.109, 35.306, 35.492, 35.608, 35.724, 36.328, 36.537, 36.629, 37.639, 37.918, 38.046, 38.417, 38.835, 39.126, 39.567, 39.869, 40.298, 40.6, 41.61, 42.016, 42.318, 42.643, 42.876, 43.131, 43.363, 43.514, 44.745, 45.14, 45.407, 45.581, 45.987, 46.161, 46.428, 47.38, 47.949, 48.332, 48.843, 49.11, 49.714, 49.911, 50.851, 51.072, 51.467, 51.699, 51.85, 52.326, 52.488, 53.359, 53.557, 53.905, 54.195, 54.334, 54.636, 54.868, 55.124, 55.565, 55.867, 56.482, 56.726, 56.865, 57.875, 58.224, 58.375, 58.909, 59.211, 59.373];
      const t = (i) => W[i] + 0.6;
      const tl = gsap.timeline({ paused: true });

      const pop = (sel, at, o) => {
        o = o || {};
        tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.45, ease: o.ease || "back.out(1.6)" }, at);
      };
      const out = (sel, at, d) => tl.to(sel, { opacity: 0, duration: d || 0.2, ease: "power2.in" }, at);

      /* hand-drawn strokes: draw by real length */
      const LEN = {};
      document.querySelectorAll("#s-marks path[data-ring]").forEach((p) => {
        const [cx, cy, rx, ry] = p.dataset.ring.split(" ").map(Number);
        const k = ry * 1.34;
        p.setAttribute("d", `M${cx - rx} ${cy + 1} C${cx - rx - 2} ${cy - k} ${cx + rx} ${cy - k - 2} ${cx + rx} ${cy - 1} C${cx + rx} ${cy + k} ${cx - rx - 6} ${cy + k + 2} ${cx - rx - 4} ${cy - 7}`);
      });
      document.querySelectorAll("#s-marks path, #s-wires path").forEach((p) => {
        const L = Math.ceil(p.getTotalLength()) || 600;
        LEN["#" + p.id] = L;
        p.style.strokeDasharray = L + " " + (L + 40);
      });
      const draw = (sel, at, d) => {
        tl.set(sel, { opacity: 1 }, at);
        tl.fromTo(sel, { strokeDashoffset: LEN[sel] }, { strokeDashoffset: 0, duration: d || 0.45, ease: "power2.out" }, at);
      };

      /* ---- 1. Maya wants to text her customers ---- */
      tl.to("#s-arm", { rotation: -16, svgOrigin: "296 340", duration: 0.2, ease: "power1.inOut", yoyo: true, repeat: 3 }, 0.3);
      pop("#s-name", t(0), { from: 0.4 });
      tl.fromTo("#s-phone", { x: 160, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 0.25);
      draw("#s-send", t(3) - 0.15, 0.5);
      tl.fromTo("#s-bub", { opacity: 0, scale: 0.4, transformOrigin: "0% 100%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, t(3) + 0.25);
      pop("#s-cust", t(5), { from: 0.4 });
      tl.fromTo("#s-now", { opacity: 0 }, { opacity: 1, duration: 0.3 }, t(8));
      pop("#s-tick", t(10), { from: 0.2, ease: "back.out(2.4)" });

      /* ---- 2. the code, step by fiddly step ---- */
      tl.to("#s-intro", { opacity: 0, x: -90, duration: 0.35, ease: "power3.in" }, t(11) - 0.5);
      out("#s-send", t(11) - 0.5, 0.25);
      tl.fromTo("#s-code", { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, t(11) - 0.15);
      tl.fromTo("#s-lines .s-ln", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out", stagger: 0.07 }, t(11) + 0.1);
      tl.fromTo("#s-how", { opacity: 0, x: 90 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, t(15) - 0.45);
      [t(15), t(22), t(26), t(35), t(37), t(40)].forEach((at, i) => {
        const n = i + 1;
        tl.fromTo("#s-st" + n, { opacity: 0, scaleX: 0.2, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power3.out" }, at - 0.05);
        pop("#s-n" + n, at + 0.1, { from: 0.3 });
        tl.fromTo("#s-r" + n, { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, at + 0.2);
      });
      draw("#s-r160", t(30) - 0.05, 0.5);
      pop("#s-hfoot", t(42), { from: 0.4 });

      /* ---- 3. five jobs, five copies ---- */
      out("#s-r160", t(45) - 0.5, 0.2);
      tl.to("#s-code", { x: -327, y: -318, scale: 0.3, opacity: 0, duration: 0.5, ease: "power3.in" }, t(45) - 0.45);
      tl.to("#s-how", { x: -817, y: -318, scale: 0.3, opacity: 0, duration: 0.5, ease: "power3.in" }, t(45) - 0.45);
      const jobAt = [t(45), t(46), t(47) + 0.1, t(50), t(52)];
      jobAt.forEach((at, i) => {
        pop("#s-j" + i, at, { from: 0.5 });
        tl.fromTo("#s-l" + i, { opacity: 0 }, { opacity: 1, duration: 0.15 }, at + 0.2);
        pop("#s-b" + i, at + 0.2, { from: 0.5 });
      });
      tl.to(".s-blob:not(#s-b5)", { scale: 1.12, duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1, stagger: 0.13 }, t(53));
      tl.fromTo("#s-count", { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, t(57) - 0.3);
      pop("#s-c1", t(57), { from: 0.7 });
      pop("#s-c2", t(60), { from: 0.5, ease: "back.out(2)" });

      /* ---- Sam only wants one more message ---- */
      tl.to("#s-count", { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, t(62) - 0.4);
      tl.fromTo("#s-sam", { opacity: 0, y: -50, rotation: -4 }, { opacity: 1, y: 0, rotation: 0, duration: 0.5, ease: "back.out(1.5)" }, t(62) - 0.1);
      pop("#s-j5d", t(68), { from: 0.6 });
      tl.fromTo("#s-say", { opacity: 0, scale: 0.4, transformOrigin: "0% 100%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, t(72) - 0.05);
      tl.fromTo("#s-net", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, t(76));
      pop("#s-b5", t(78), { from: 0.5 });
      tl.fromTo("#s-net .s-chip", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)", stagger: 0.22 }, t(81));
      pop("#s-q", t(85), { from: 0.2, ease: "back.out(2.4)" });

      /* ---- 4. one handle, called notify ---- */
      tl.to(["#s-sam", "#s-say", "#s-net"], { opacity: 0, x: 60, duration: 0.3, ease: "power2.in" }, t(86) - 0.35);
      tl.fromTo("#s-mach", { opacity: 0, x: 110 }, { opacity: 1, x: 0, duration: 0.55, ease: "expo.out" }, t(88) - 0.15);
      pop("#s-btn", t(89), { from: 0.4 });
      pop("#s-htag", t(90), { from: 0.5 });
      pop("#s-btxt", t(92), { from: 0.3, ease: "back.out(2.2)" });
      tl.fromTo("#s-sig", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, t(93));
      [["#s-sg1", t(97)], ["#s-sg2", t(100)]].forEach(([s, at]) => {
        tl.to(s, { color: "#3b37e6", duration: 0.15 }, at);
        tl.fromTo(s, { scale: 1 }, { scale: 1.22, duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1 }, at);
      });
      // every copy of the steps leaves its job and goes behind the handle
      tl.set("#s-door", { yPercent: -102 }, 0);
      tl.to(".s-blob:not(#s-b5)", { scale: 1.1, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, stagger: 0.06 }, t(101));
      out(".s-link", t(104) - 0.15, 0.2);
      out("#s-b5", t(104), 0.3);
      [0, 1, 2, 3, 4].forEach((i) => {
        tl.to("#s-b" + i, { x: 932, y: 430 - (192 + i * 128), scale: 0.45, duration: 0.6, ease: "power3.in" }, t(104) + i * 0.12);
        tl.to("#s-b" + i, { opacity: 0, duration: 0.12 }, t(104) + i * 0.12 + 0.52);
      });
      out("#s-behind", t(105) + 0.1, 0.3);
      tl.fromTo("#s-mtext", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, t(106) + 0.05);
      tl.to("#s-mtext", { scale: 1.06, duration: 0.12, yoyo: true, repeat: 5, ease: "power1.inOut" }, t(106) + 0.6);
      tl.to("#s-door", { yPercent: 0, duration: 0.5, ease: "power3.out" }, t(109) - 0.1);
      tl.set("#s-mtext", { opacity: 0 }, t(109) + 0.45);

      /* ---- each job just says what it wants ---- */
      [0, 1, 2, 3, 4].forEach((i) => draw("#s-w" + i, t(111) - 0.35 + i * 0.09, 0.4));
      const bez = (i, u) => {
        const y0 = 192 + i * 128, y1 = 330 + i * 40, v = 1 - u;
        return { x: v * v * v * 506 + 3 * v * v * u * 720 + 3 * v * u * u * 720 + u * u * u * 935, y: v * v * v * y0 + 3 * v * v * u * y0 + 3 * v * u * u * y1 + u * u * u * y1 };
      };
      const pulse = (i, at) => {
        const N = 10, kf = [];
        for (let k = 1; k <= N; k++) kf.push(Object.assign(bez(i, k / N), { duration: 0.55 / N, ease: "none" }));
        tl.set("#s-d" + i, Object.assign(bez(i, 0), { opacity: 1 }), at);
        tl.to("#s-d" + i, { keyframes: kf }, at);
        tl.set("#s-d" + i, { opacity: 0 }, at + 0.56);
        tl.to("#s-j" + i, { scale: 1.06, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, at - 0.05);
        tl.to("#s-btn", { scale: 0.93, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1 }, at + 0.52);
      };
      [0, 1, 2, 3, 4].forEach((i) => pulse(i, t(112) + i * 0.22));
      pop("#s-what", t(116) - 0.05, { from: 0.4 });

      /* ---- Sam adds his message in one line ---- */
      out("#s-j5d", t(119) + 0.1, 0.15);
      pop("#s-j5", t(119), { from: 0.7 });
      draw("#s-w5", t(120), 0.4);
      tl.fromTo("#s-one", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, t(120) - 0.1);
      tl.fromTo("#s-o2", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.8, ease: "steps(20)" }, t(122) - 0.15);
      tl.fromTo("#s-ostrip", { opacity: 0 }, { opacity: 1, duration: 0.25 }, t(124) - 0.05);
      pop("#s-oneline", t(124), { from: 0.3, ease: "back.out(2.2)" });
      pulse(5, t(125) + 0.25);

      /* ---- 5. texts become email; the front never moves ---- */
      tl.to(["#s-one", "#s-oneline"], { opacity: 0, y: 30, duration: 0.25, ease: "power2.in" }, t(126) - 0.4);
      tl.fromTo("#s-switch", { opacity: 0, y: 40, rotation: -3 }, { opacity: 1, y: 0, rotation: 0, duration: 0.45, ease: "back.out(1.5)" }, t(126) - 0.1);
      tl.set(["#s-sw1", "#s-sw2"], { opacity: 0 }, 0);
      pop("#s-sw1", t(130), { from: 0.5 });
      pop("#s-sw2", t(132) - 0.1, { from: 0.5, ease: "back.out(2)" });
      tl.set("#s-mtext", { opacity: 1 }, t(133) - 0.12);
      tl.to("#s-door", { yPercent: -102, duration: 0.4, ease: "power3.inOut" }, t(133) - 0.1);
      tl.to("#s-mtext", { y: 560, rotation: 14, opacity: 0, duration: 0.55, ease: "power3.in" }, t(134));
      tl.fromTo("#s-mmail", { opacity: 1, y: -640, rotation: -8 }, { opacity: 1, y: 0, rotation: 0, duration: 0.6, ease: "back.out(1.2)", immediateRender: false }, t(135));
      tl.to("#s-door", { yPercent: 0, duration: 0.45, ease: "power3.out" }, t(139) - 0.1);
      tl.set("#s-mmail", { opacity: 0 }, t(139) + 0.4);
      [0, 1, 2, 3, 4, 5].forEach((i) => {
        const at = t(141) + i * 0.2;
        tl.to("#s-j" + i, { scale: 1.06, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, at);
        pop("#s-k" + i, t(145) + i * 0.13, { from: 0.2, ease: "back.out(2.4)", d: 0.35 });
      });
      tl.fromTo("#s-zero", { opacity: 0, scale: 2.2, rotation: 3 }, { opacity: 1, scale: 1, rotation: -5, duration: 0.3, ease: "power4.in" }, t(148) - 0.1);

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.3, ease: "power2.in" }, 56.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
  </script>
