  <script>
    (function () {
      // Word start times from the narration (seconds). t(i) adds the 0.6 s lead-in.
      const W = [0.0, 0.232, 0.65, 0.987, 1.544, 2.009, 2.368, 2.543, 2.647, 2.937, 3.947, 4.238, 4.54, 5.027, 5.201, 5.329, 5.712, 6.444, 6.699, 6.861, 7.872, 8.034, 8.777, 9.253, 9.334, 10.101, 10.716, 10.855, 11.958, 12.144, 12.318, 12.62, 12.794, 13.073, 13.421, 13.595, 13.978, 14.35, 14.489, 14.64, 15.476, 15.685, 15.813, 16.196, 16.382, 16.672, 16.892, 17.241, 17.961, 18.17, 18.68, 19.83, 20.19, 20.364, 20.619, 21.119, 21.467, 21.745, 22.152, 22.338, 23.742, 24.079, 24.555, 24.764, 24.961, 25.17, 26.169, 26.413, 26.691, 26.831, 27.04, 27.33, 27.852, 28.235, 28.375, 28.502, 28.828, 30.058, 30.267, 30.964, 31.161, 31.649, 31.869, 32.705, 32.937, 33.054, 33.332, 33.936, 34.226, 34.423, 35.375, 35.608, 36.467, 36.873, 37.245, 37.767, 37.964, 38.243, 38.359, 38.487, 38.615, 39.242, 39.485, 40.205, 40.484, 40.635, 40.855, 41.494, 41.714, 41.993, 42.632, 43.433, 44.315, 44.907, 45.302, 45.766, 46.962, 47.357, 47.554, 47.891, 48.204, 48.669, 48.831, 49.052, 49.435, 49.783, 50.167, 50.666, 50.84, 51.072, 51.92, 52.094, 52.198, 52.5, 52.709, 53.057, 53.278, 53.603, 53.835, 54.056, 54.358, 54.451, 54.567, 55.472, 55.821, 56.18, 56.715, 56.831, 57.179, 57.62, 58.7];
      const t = (i) => W[i] + 0.6;
      const tl = gsap.timeline({ paused: true });
      const NR = { immediateRender: false };

      const pop = (sel, at, o) => {
        o = o || {};
        tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.45, ease: o.ease || "back.out(1.6)" }, at);
      };
      const out = (sel, at, d) => tl.to(sel, { opacity: 0, duration: d || 0.2, ease: "power2.in" }, at);
      const swap = (a, b, at) => {
        tl.to(a, { opacity: 0, duration: 0.12, ease: "power2.in" }, at);
        tl.fromTo(b, { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, at + 0.08);
      };
      // Stroke drawing: dash length from the real path length.
      const len = {};
      document.querySelectorAll("#s-marks path").forEach((p) => {
        const L = Math.ceil(p.getTotalLength()) || 600;
        len[p.id] = L;
        p.style.strokeDasharray = L + " " + (L + 40);
        p.style.strokeDashoffset = L;
      });
      const draw = (id, at, d, from, to) => {
        const L = len[id];
        tl.set("#" + id, { opacity: 1 }, at);
        tl.fromTo("#" + id, { strokeDashoffset: L * (1 - (from || 0)) }, Object.assign({ strokeDashoffset: L * (1 - (to == null ? 1 : to)), duration: d || 0.45, ease: "power2.out" }, NR), at);
      };

      /* ---- code lines: every line is placed by (row, indent) and can fly to a new place ---- */
      const X = (n) => 72 * n, Y = (r) => 52 * (r - 1);
      const pos = { def: [1, 0], ifA: [2, 1], ifB: [3, 2], ifC: [4, 3], yes: [5, 4], elC: [6, 3], mSold: [7, 4], elB: [8, 2], mPts: [9, 3], elA: [10, 1], mCard: [11, 2],
        ifS: [4, 3], elN: [7, 4], mSat: [8, 5], ifT: [10, 1], mT: [11, 2] };
      Object.keys(pos).forEach((k) => gsap.set("#l-" + k, { x: X(pos[k][1]), y: Y(pos[k][0]) }));
      const lay = (map, at, d) => Object.keys(map).forEach((k) => {
        const a = pos[k], b = map[k];
        if (a[0] === b[0] && a[1] === b[1]) return;
        tl.fromTo("#l-" + k, { x: X(a[1]), y: Y(a[0]) }, Object.assign({ x: X(b[1]), y: Y(b[0]), duration: d || 0.6, ease: "power3.inOut" }, NR), at);
        pos[k] = b;
      });
      let count = 11;
      const numbers = (n, at) => {
        for (let i = Math.min(n, count) + 1; i <= Math.max(n, count); i++) tl.to("#s-n" + i, { opacity: n > count ? 1 : 0, duration: 0.25 }, at);
        count = n;
      };
      const typeIn = (sel, at, d, steps) => tl.fromTo(sel, { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: d || 0.6, ease: "steps(" + (steps || 14) + ")" }, at);
      const flip = (k, at) => swap("#l-" + k + " .fa", "#l-" + k + " .fb", at);
      const dim = (keys, at, v) => tl.to(keys.map((k) => "#l-" + k), { opacity: v == null ? 0.35 : v, duration: 0.35, ease: "power2.inOut" }, at);

      /* ---- 1. The shop: 30 points win a free cookie ---- */
      tl.to("#s-arm", { rotation: -16, svgOrigin: "296 340", duration: 0.2, ease: "power1.inOut", yoyo: true, repeat: 3 }, 0.4);
      tl.fromTo("#s-lcard", { opacity: 0, y: 60, rotation: -12 }, { opacity: 1, y: 0, rotation: -4, duration: 0.5, ease: "back.out(1.5)" }, t(4) - 0.1);
      pop("#s-win", t(6) - 0.05, { from: 0.3 });
      pop("#s-bigcookie", t(8) - 0.05, { from: 0.4 });
      pop("#s-free", t(8) + 0.25, { from: 0.3, ease: "back.out(2.2)" });
      tl.fromTo("#s-itillgrp", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, t(10) - 0.2);
      tl.set("#s-itxt", { opacity: 0 }, 0);
      pop("#s-jobpill", t(11) - 0.05, { from: 0.5 });
      tl.fromTo("#s-jobwire", { opacity: 1, scaleY: 0, transformOrigin: "50% 0%" }, { opacity: 1, scaleY: 1, duration: 0.3, ease: "power2.out" }, t(12));
      tl.fromTo("#s-itxt", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, t(13) + 0.1);

      /* ---- 2. Here it is: three questions, one inside the other ---- */
      tl.to("#s-shop", { opacity: 0, x: -90, duration: 0.35, ease: "power3.in" }, t(17) - 0.35);
      tl.fromTo("#s-code", { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, t(17) - 0.15);
      tl.fromTo(["def", "ifA", "ifB", "ifC", "yes", "elC", "mSold", "elB", "mPts", "elA", "mCard"].map((k) => "#l-" + k), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out", stagger: 0.06 }, t(17) + 0.05);
      tl.fromTo("#s-right", { opacity: 0, x: 90 }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, t(17) + 0.1);
      tl.fromTo("#s-rt1", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, t(17) + 0.25);
      pop("#s-till", t(17) + 0.45, { from: 0.8 });
      pop("#s-f1", t(17) + 0.6, { from: 0.8 });
      pop("#s-f2", t(17) + 0.75, { from: 0.8 });

      pop("#s-q1", t(21) - 0.05, { from: 0.3 });
      pop("#s-f0", t(21), { from: 0.8 });
      tl.fromTo("#s-deep .p1", { opacity: 0 }, { opacity: 1, duration: 0.2 }, t(21) + 0.1);
      swap("#s-deep .p1", "#s-deep .p2", t(24));
      swap("#s-deep .p2", "#s-deep .p3", t(27));
      draw("s-st1", t(21), 0.3, 0, 0.11);
      pop("#s-q2", t(24) - 0.05, { from: 0.3 });
      draw("s-st1", t(24) - 0.25, 0.4, 0.11, 0.41);
      pop("#s-q3", t(27) - 0.05, { from: 0.3 });
      draw("s-st1", t(27) - 0.25, 0.4, 0.41, 0.71);

      draw("s-ryes", t(33) - 0.15, 0.6);
      draw("s-st1", t(35) - 0.1, 0.35, 0.71, 1);
      draw("s-push", t(35), 0.6);
      tl.fromTo("#s-pushh", { opacity: 0 }, { opacity: 1, duration: 0.15 }, t(35) + 0.5);
      tl.fromTo("#l-yes", { x: X(4) - 24 }, Object.assign({ x: X(4), duration: 0.5, ease: "back.out(3)" }, NR), t(35) + 0.45);

      out(["#s-push", "#s-pushh", "#s-ryes"], t(40) - 0.1, 0.25);
      dim(["def", "ifA", "ifB", "ifC", "yes"], t(42) - 0.1);
      tl.to(["#s-q1", "#s-q2", "#s-q3"], { opacity: 0.35, duration: 0.3 }, t(42) - 0.1);
      draw("s-st2", t(46), 1.1);
      tl.to(["#s-q1", "#s-q2", "#s-q3"], { opacity: 1, duration: 0.3 }, t(49) - 0.1);
      dim(["ifA", "ifB", "ifC"], t(49) - 0.1, 1);
      pop("#s-a3", t(49), { from: 0.3 });
      pop("#s-a2", t(49) + 0.3, { from: 0.3 });
      pop("#s-a1", t(49) + 0.6, { from: 0.3 });

      /* ---- 3. A new rule; Maya squeezes in one more question ---- */
      out(["#s-q1", "#s-q2", "#s-q3", "#s-a1", "#s-a2", "#s-a3", "#s-st1", "#s-st2"], t(51) - 0.15, 0.25);
      dim(["def", "yes"], t(51) - 0.1, 1);
      tl.fromTo("#s-notice", { opacity: 0, y: 50, rotation: 4 }, { opacity: 1, y: 0, rotation: 0, duration: 0.5, ease: "back.out(1.5)" }, t(53) - 0.1);
      tl.set("#s-ntxt", { opacity: 0 }, 0);
      tl.fromTo("#s-ntxt", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, t(55));
      tl.fromTo("#s-cursor", { opacity: 0, x: 620, y: 1010 }, { opacity: 1, x: 420, y: 390, duration: 0.7, ease: "power3.out" }, t(60) - 0.1);
      lay({ ifC: [5, 4], yes: [6, 5], elC: [7, 3], mSold: [8, 4], elB: [9, 2], mPts: [10, 3], elA: [11, 1], mCard: [12, 2] }, t(61), 0.6);
      numbers(12, t(61) + 0.2);
      swap("#s-deft .d1", "#s-deft .d2", t(61) + 0.3);
      typeIn("#l-ifS", t(63), 0.8, 21);
      swap("#s-deep .p3", "#s-deep .p4", t(65));
      tl.to("#s-cursor", { x: 492, y: 546, duration: 0.5, ease: "power2.inOut" }, t(66) - 0.3);
      lay({ elC: [9, 3], mSold: [10, 4], elB: [11, 2], mPts: [12, 3], elA: [13, 1], mCard: [14, 2] }, t(66), 0.55);
      numbers(14, t(66) + 0.2);
      typeIn("#l-elN", t(67) + 0.1, 0.25, 5);
      typeIn("#l-mSat", t(67) + 0.4, 0.8, 26);
      tl.to("#s-cursor", { opacity: 0, x: 560, y: 470, duration: 0.4, ease: "power2.in" }, t(72) - 0.5);
      dim(["def", "ifA", "ifB", "yes", "elB", "mPts", "elA", "mCard"], t(72) - 0.1);
      draw("s-br1", t(72), 0.5);
      draw("s-br2", t(72) + 0.35, 0.6);
      pop("#s-x1", t(75), { from: 0.3, ease: "back.out(2.4)" });
      pop("#s-x2", t(75) + 0.25, { from: 0.3, ease: "back.out(2.4)" });

      /* ---- 4. Tuesday, sold out: the till says "Not on Saturdays." ---- */
      out(["#s-br2", "#s-x2", "#s-x1"], t(77) - 0.1, 0.25);
      dim(["ifS", "elC", "mSold"], t(77) - 0.1);
      out("#s-f0", t(77) - 0.2, 0.2);
      pop("#s-f3", t(78) - 0.05, { from: 0.7 });
      swap("#s-left .c12", "#s-left .c0", t(81));
      draw("s-rsat", t(87) - 0.1, 0.6);
      swap("#s-reply .r1", "#s-reply .r2", t(87));
      tl.fromTo("#s-wrong", { opacity: 0, scale: 2.4, rotation: 4 }, { opacity: 1, scale: 1, rotation: -7, duration: 0.3, ease: "power4.in" }, t(89) + 0.35);

      /* ---- 5. The fix: flip each question, bring its answer up, leave early ---- */
      out(["#s-br1", "#s-rsat", "#s-wrong"], t(90) - 0.1, 0.25);
      dim(["def", "ifA", "ifB", "yes", "elB", "mPts", "elA", "mCard", "ifS", "elC", "mSold"], t(90), 1);
      tl.to("#s-tillgrp", { opacity: 0, y: 30, duration: 0.35, ease: "power2.in" }, t(91));
      dim(["def", "yes", "elN", "mSat", "elC", "mSold", "elB", "mPts", "elA", "mCard"], t(92) - 0.05);
      out("#s-rt1", t(94), 0.2);
      tl.fromTo("#s-rt2", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, t(94) + 0.15);
      pop("#s-in", t(96), { from: 0.4 });
      tl.fromTo("#s-lane", { opacity: 1, scaleY: 0, transformOrigin: "50% 0%" }, { opacity: 1, scaleY: 1, duration: 0.7, ease: "power2.inOut" }, t(96) + 0.15);
      dim(["def", "yes", "elN", "mSat", "elC", "mSold", "elB", "mPts", "elA", "mCard"], t(101) - 0.25, 1);

      // One guard: flip the question, send a customer down the lane, then bring the answer up and turn them away.
      const gateY = [278, 382, 486, 590, 694];
      const guard = (n, key, askAt, leaveAt, layout, dead, rows) => {
        const dy = gateY[n - 1] - 236;
        if (key) flip(key, askAt);
        tl.fromTo("#s-t" + (n === 5 ? 6 : n), { opacity: 0, x: 0, y: -20 }, { opacity: 1, x: 0, y: 0, duration: 0.2, ease: "power2.out" }, askAt);
        tl.fromTo("#s-t" + (n === 5 ? 6 : n), { y: 0 }, Object.assign({ y: dy, duration: 0.3 + n * 0.08, ease: "power2.inOut" }, NR), askAt + 0.2);
        tl.fromTo("#s-w" + n, { opacity: 1, scaleX: 0, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power2.out" }, askAt + 0.1);
        pop("#s-g" + n, askAt + 0.3, { from: 0.3 });
        if (dead) out("#l-" + dead, leaveAt - 0.05, 0.2);
        lay(layout, leaveAt, 0.6);
        if (rows) numbers(rows, leaveAt + 0.3);
        tl.fromTo("#s-e" + n, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.25, ease: "power2.out" }, leaveAt);
        tl.fromTo("#s-t" + (n === 5 ? 6 : n), { x: 0 }, Object.assign({ x: 102, duration: 0.4, ease: "back.out(1.4)" }, NR), leaveAt + 0.1);
        pop("#s-y" + n, leaveAt + 0.3, { from: 0.7 });
      };
      guard(1, "ifA", t(101), t(103), { mCard: [3, 2], ifB: [4, 1], ifS: [5, 2], ifC: [6, 3], yes: [7, 4], elN: [8, 3], mSat: [9, 4], elC: [10, 2], mSold: [11, 3], elB: [12, 1], mPts: [13, 2] }, "elA", 13);
      guard(2, "ifB", t(107), t(110), { mPts: [5, 2], ifS: [6, 1], ifC: [7, 2], yes: [8, 3], elN: [9, 2], mSat: [10, 3], elC: [11, 1], mSold: [12, 2] }, "elB", 12);
      guard(3, "ifS", t(111), t(112), { mSat: [7, 2], ifC: [8, 1], yes: [9, 2], elN: [10, 1], mSold: [11, 2] }, "elC", 11);
      guard(4, "ifC", t(113), t(115), { mSold: [9, 2], yes: [10, 1] }, "elN", 10);

      /* ---- 6. The yes line stands at the left edge ---- */
      draw("s-ryes2", t(118) - 0.15, 0.6);
