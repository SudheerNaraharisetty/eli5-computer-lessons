  <script>
    (function () {
      // Word start times from the narration (seconds), offset by the 0.6 s lead-in.
      const W = [0.0, 0.522, 0.65, 0.987, 1.277, 1.509, 1.904, 2.241, 2.833, 3.158, 3.622, 4.447, 4.795, 5.108, 5.236, 5.503, 5.7, 6.049, 6.235, 6.362, 7.198, 7.581, 7.651, 8.092, 8.336, 8.638, 9.056, 9.195, 9.323, 10.008, 10.182, 10.553, 10.855, 11.366, 11.587, 11.981, 12.318, 13.328, 13.584, 14.466, 14.849, 15.244, 15.662, 16.01, 16.358, 16.73, 17.066, 17.658, 18.703, 18.935, 19.295, 19.876, 20.038, 20.387, 20.503, 20.886, 21.048, 21.571, 22.279, 22.581, 22.929, 23.37, 23.719, 24.067, 24.775, 25.135, 25.762, 26.203, 27.318, 27.643, 28.061, 28.177, 29.164, 29.338, 29.675, 30.093, 30.429, 30.603, 30.778, 30.882, 31.556, 32.345, 32.531, 32.832, 33.355, 33.819, 34.075, 34.353, 34.504, 34.702, 35.7, 35.874, 36.408, 36.722, 36.942, 37.349, 37.662, 37.79, 37.906, 38.846, 39.113, 39.264, 39.543, 39.88, 40.007, 40.53, 40.774, 40.924, 41.981, 42.399, 42.852, 43.003, 43.722, 43.931, 44.21, 44.477, 45.069, 45.394, 45.789, 46.799, 47.113, 47.31, 47.531, 47.879, 48.39, 48.877, 49.179, 49.446, 49.597, 49.794, 50.688, 51.431, 51.606, 51.977, 52.244];
      const t = (i) => W[i] + 0.6;
      const tl = gsap.timeline({ paused: true });

      const pop = (sel, at, o) => {
        o = o || {};
        tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.45, ease: o.ease || "back.out(1.6)" }, at);

      /* hand-drawn strokes: draw by real length */
      const LEN = {};
      document.querySelectorAll("#s-marks path[data-ring]").forEach((p) => {
        const [cx, cy, rx, ry] = p.dataset.ring.split(" ").map(Number);
        const k = ry * 1.34;
        p.setAttribute("d", `M${cx - rx} ${cy + 1} C${cx - rx - 2} ${cy - k} ${cx + rx} ${cy - k - 2} ${cx + rx} ${cy - 1} C${cx + rx} ${cy + k} ${cx - rx - 6} ${cy + k + 2} ${cx - rx - 4} ${cy - 7}`);

      document.querySelectorAll("#s-marks path").forEach((p) => {
        const L = Math.ceil(p.getTotalLength()) || 600;

        tl.set(sel, { opacity: 1 }, at);

      /* something goes in at the front, the gears turn */
      const feed = (sel, at, d) => {
        pop(sel, at - 0.35, { from: 0.5, d: 0.3 });
        tl.fromTo(sel, { x: 0 }, { x: 510, duration: d || 0.7, ease: "power2.in" }, at);
        tl.set(sel, { opacity: 0 }, at + (d || 0.7));

      let turn = 0;
      const gears = (at) => {
        turn += 150;
        tl.to("#s-g1", { rotation: turn, transformOrigin: "50% 50%", duration: 0.7, ease: "power2.inOut" }, at);

      };
      /* a tag drops out of the bottom and lands in its place */
      const drop = (sel, at, fromLeft, left, top) => {
        const dx = fromLeft - left, dy = -150 - top;
        tl.set(sel, { opacity: 1, x: dx, y: dy }, at);
        tl.to(sel, { y: dy + 170, duration: 0.3, ease: "power2.out" }, at);
        tl.to(sel, { x: 0, y: 0, duration: 0.45, ease: "back.out(1.3)" }, at + 0.3);
      };

      /* ---- 1. Tuesday is sale day ---- */
      tl.set("#s-sign", { rotation: -3 }, 0);
      tl.fromTo("#s-flyer", { rotation: -9, y: -60 }, { rotation: -3, y: 0, duration: 0.6, ease: "back.out(1.4)" }, 0.05);
      tl.to("#s-arm", { rotation: -16, svgOrigin: "296 340", duration: 0.2, ease: "power1.inOut", yoyo: true, repeat: 3 }, 0.4);
      tl.fromTo("#s-fl1", { scale: 1 }, { scale: 1.12, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, t(0));
      tl.fromTo("#s-saleday", { opacity: 0, scale: 2.2, rotation: 14 }, { opacity: 1, scale: 1, rotation: 8, duration: 0.3, ease: "power4.in" }, t(2) - 0.1);
      tl.fromTo("#s-fl2", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, t(8) - 0.05);

      tl.fromTo("#s-sam", { opacity: 0, y: -50, rotation: -4 }, { opacity: 1, y: 0, rotation: 0, duration: 0.5, ease: "back.out(1.5)" }, t(11) - 0.15);
      tl.fromTo("#s-mach", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, t(14) - 0.15);
      gears(t(16));
      tl.fromTo("#s-wall", { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.55, ease: "expo.out" }, t(22) - 0.1);
      tl.fromTo("#s-mini", { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.55, ease: "expo.out" }, t(22) + 0.05);
      tl.fromTo("#s-p1", { opacity: 1, scaleX: 0, transformOrigin: "100% 50%" }, { opacity: 1, scaleX: 1, duration: 0.45, ease: "power3.out" }, t(24) - 0.05);
      pop("#s-m1", t(25) + 0.05, { from: 0.3, d: 0.35 });
      pop("#s-l1", t(28) - 0.05, { from: 0.4 });
      feed("#s-cg", t(30), 0.7);
      gears(t(32));
      drop("#s-tg", t(34), 800, 800, 30);
      out(["#s-tg"], t(37) - 0.15, 0.25);

      /* ---- 3. On Tuesday, Sam tries it ---- */

      tl.fromTo("#s-today", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, t(38) - 0.15);
      swap("#s-sb1", "#s-sb2", t(39));
      tl.fromTo("#s-call", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, t(40) - 0.1);
      feed("#s-ca", t(42) + 0.25, 0.6);
      gears(t(44) - 0.1);
      tl.fromTo("#s-r1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, t(45) - 0.2);
      drop("#s-t1", t(45) + 0.1, 800, 990, 196);
      pop("#s-k1", t(47) + 0.15, { from: 0.2, ease: "back.out(2.4)" });

      /* ---- 4. Monday night: the same call ---- */
      tl.to("#s-tv1", { opacity: 0, duration: 0.12 }, t(49) - 0.1);
      tl.fromTo("#s-tv2", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, t(49));
      tl.to("#s-today", { backgroundColor: "#211e40", color: "#ffffff", duration: 0.3, ease: "power2.inOut" }, t(49) - 0.05);
      swap("#s-sb2", "#s-sb3", t(52));
      tl.to("#s-call", { scale: 1.04, duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1 }, t(56));
      feed("#s-cb", t(58) + 0.25, 0.6);
      gears(t(60) - 0.1);
      tl.fromTo("#s-r2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, t(61) - 0.2);
      drop("#s-t2", t(61) + 0.1, 800, 1474, 196);
      pop("#s-k2", t(63) + 0.25, { from: 0.2, ease: "back.out(2.4)" });
      draw("#s-rcall", t(64), 0.5);
      pop("#s-same", t(65), { from: 0.4 });
      pop("#s-neq", t(66), { from: 0.2, ease: "back.out(2.4)" });
      tl.to(["#s-t1", "#s-t2"], { rotation: 4, duration: 0.1, ease: "power1.inOut", yoyo: true, repeat: 3 }, t(67));

      tl.to("#s-wall", { opacity: 0.1, duration: 0.6, ease: "power2.inOut" }, t(69) - 0.1);

      pop("#s-mon", t(87), { from: 0.5, d: 0.25 });
      tl.fromTo("#s-mon", { x: 0 }, { x: -300, duration: 0.6, ease: "power2.in" }, t(88) + 0.05);
      tl.set("#s-mon", { opacity: 0 }, t(88) + 0.66);
      tl.fromTo("#s-flash", { opacity: 0 }, { opacity: 1, duration: 0.15, yoyo: true, repeat: 1 }, t(89) + 0.15);
      tl.to("#s-t2", { rotation: -4, duration: 0.1, ease: "power1.inOut", yoyo: true, repeat: 3 }, t(89) + 0.25);

      /* ---- 6. The fix: bring the pipe round to the front ---- */

      out(["#s-rtoday", "#s-wire", "#s-hid"], t(92) - 0.15, 0.2);
      tl.set("#s-bpipe", { opacity: 0 }, t(92) + 0.3);

      tl.to("#s-fpipe", { y: 0, duration: 0.6, ease: "power2.in" }, t(92) + 0.8);

      pop("#s-m2", t(98) + 0.05, { from: 0.3, d: 0.35 });

      pop("#s-l2", t(107) - 0.1, { from: 0.4 });

      swap("#s-2a", "#s-2b", t(107) + 0.35);

      drop("#s-t3", t(114), 800, 960, 196);
      pop("#s-k3", t(115) + 0.45, { from: 0.2, ease: "back.out(2.4)" });
      pop("#s-d1", t(116) - 0.05, { from: 0.4, d: 0.3 });
      tl.to("#s-tv2", { opacity: 0, duration: 0.1 }, t(117) - 0.15);
      tl.fromTo("#s-tv3", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(2)" }, t(117) - 0.1);
      tl.to("#s-today", { backgroundColor: "#ffffff", color: "#0e0c1d", duration: 0.2 }, t(117) - 0.15);
      pop("#s-d2", t(117), { from: 0.4, d: 0.3 });
      tl.to("#s-tv3", { opacity: 0, duration: 0.1 }, t(118) - 0.2);
      tl.fromTo("#s-tv4", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(2)" }, t(118) - 0.15);
      pop("#s-d3", t(118) - 0.05, { from: 0.4, d: 0.3 });

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.26, ease: "power2.in" }, 46.92);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
  </script>
