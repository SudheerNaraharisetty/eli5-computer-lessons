  <script>

      tl.to("#s-btn1", { scale: 0.92, duration: 0.1, ease: "power2.in", yoyo: true, repeat: 1 }, t(81) - 0.1);

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.3, ease: "power2.in" }, 59.35);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
