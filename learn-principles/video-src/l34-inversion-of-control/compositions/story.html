        <div class="s-tag s-hide" id="s-tg5" style="top:580px">ring_bell</div>

        <!-- orders and call signals -->
        <div class="s-ord s-hide" id="s-o1" style="left:900px;top:104px">ORDER<i></i><i></i></div>
        <div class="s-ord s-hide" id="s-o2" style="left:648px;top:268px">ORDER<i></i><i></i></div>
        <div class="s-ord s-hide" id="s-o3" style="left:648px;top:268px">ORDER<i></i><i></i></div>
        <div class="s-dot s-hide" id="s-d1"></div>
        <div class="s-dot s-hide" id="s-d2"></div>
        <div class="s-dot s-hide" id="s-d3"></div>
        <div class="s-dot s-hide" id="s-d4"></div>
        <div class="s-dot s-hide" id="s-d5"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // Word start times from the narration (seconds), offset by the 0.6 s lead-in.
      const W = [0.0, 0.418, 0.708, 1.045, 1.44, 2.38, 2.659, 2.937, 3.216, 3.355, 3.901, 4.11, 4.481, 4.83, 4.981, 5.155, 6.118, 6.316, 6.641, 7.372, 7.546, 7.814, 8.185, 8.301, 9.067, 9.288, 9.404, 10.089, 10.321, 10.437, 10.96, 11.192, 11.32, 12.504, 13.108, 13.317, 13.572, 14.35, 14.675, 14.988, 15.29, 15.453, 15.883, 16.568, 16.73, 17.334, 17.624, 17.752, 18.193, 19.006, 19.343, 19.586, 19.981, 20.353, 20.84, 20.991, 21.27, 21.618, 21.839, 22.222, 22.605, 22.953, 23.789, 24.01, 24.289, 24.695, 25.333, 25.484, 25.775, 26.111, 26.343, 26.46, 26.703, 27.354, 27.748, 28.108, 28.445, 28.654, 29.06, 29.316, 30.012, 30.268, 30.384, 30.546, 30.686, 31.011, 31.719, 31.916, 32.195, 32.613, 33.251, 33.402, 33.704, 34.076, 34.366, 34.656, 34.784, 35.004, 35.701, 35.864, 36.247, 36.966, 37.21, 37.419, 37.791, 38.023, 38.244, 38.464, 39.138, 39.312, 39.625, 39.927, 40.24, 40.391, 41.1, 41.309, 41.46, 41.796, 42.226, 43.329, 43.642, 43.898, 44.617, 44.757, 46.034, 46.289, 46.649, 47.067, 47.729, 47.961, 48.332, 49.4, 49.737, 50.097, 50.422, 50.689, 51.037, 51.676, 52.442, 52.686, 53.174, 53.406, 53.638, 53.986];
      const t = (i) => W[i] + 0.6;
      const tl = gsap.timeline({ paused: true });
      const ON = "#ffc24b", OFF = "#3e3b52";
      // where each wire starts and ends
      const LY = [330, 382, 434, 486, 538, 590];     // code lines 3 to 8
      const JY = [190, 294, 398, 502, 606, 710];     // job cards
      const BY = [288, 368, 448, 528, 608];          // board rows

      const pop = (sel, at, o) => {
        o = o || {};
        tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.45, ease: o.ease || "back.out(1.6)" }, at);
      };
      const out = (sel, at, d) => tl.to(sel, { opacity: 0, duration: d || 0.2, ease: "power2.in" }, at);
      const swap = (a, b, at) => {
        tl.to(a, { opacity: 0, duration: 0.12, ease: "power2.in" }, at);
        tl.fromTo(b, { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, at + 0.08);
      };
      const LEN = {};
      document.querySelectorAll("#s-wires path.s-wire, #s-wires path.s-line2").forEach((p) => {
        const L = Math.ceil(p.getTotalLength()) || 560;
        LEN["#" + p.id] = L;
        p.style.strokeDasharray = L + " " + (L + 40);
      });
      const draw = (sel, at, d) => {
        tl.set(sel, { opacity: 1 }, at);
        tl.fromTo(sel, { strokeDashoffset: LEN[sel] }, { strokeDashoffset: 0, duration: d || 0.4, ease: "power2.out", immediateRender: false }, at);
      };
      const type = (sel, at, d, steps) => tl.fromTo(sel, { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: d, ease: "steps(" + steps + ")" }, at);
      const light = (id, col, at) => {
        tl.to(id + " > u", { backgroundColor: col, duration: 0.16, ease: "power2.out" }, at);
        if (col === ON) tl.fromTo(id + " > u", { scale: 1 }, { scale: 1.45, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);
      };
      // a call: a signal runs from (x1,y1) to (x2,y2)
      const call = (dot, x1, y1, x2, y2, at, d) => {
        tl.fromTo(dot, { opacity: 1, x: x1, y: y1, scale: 1 }, { x: x2, y: y2, duration: d, ease: "power2.in", immediateRender: false }, at);
        tl.to(dot, { opacity: 0, scale: 1.8, duration: 0.14, ease: "power2.out" }, at + d);
      };

      /* ---- 1. Maya's shop takes orders online ---- */
      tl.to("#s-arm", { rotation: -16, svgOrigin: "296 340", duration: 0.2, ease: "power1.inOut", yoyo: true, repeat: 3 }, 0.3);
      pop("#s-name", t(0), { from: 0.4 });
      tl.fromTo("#s-sign", { opacity: 0, y: -150, rotation: -9 }, { opacity: 1, y: 0, rotation: -3, duration: 0.6, ease: "back.out(1.3)" }, t(0) + 0.2);
      tl.fromTo("#s-web", { opacity: 0, x: 160, rotation: 5 }, { opacity: 1, x: 0, rotation: 2, duration: 0.55, ease: "back.out(1.4)" }, t(3) - 0.1);

      /* ---- 2. One loop runs it all, and Maya's code is in charge ---- */
      tl.to("#s-shop", { opacity: 0, x: -90, duration: 0.35, ease: "power3.in" }, t(5) - 0.4);
      tl.fromTo("#s-code", { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, t(5) - 0.1);
      tl.fromTo(".s-old", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out", stagger: 0.06 }, t(5) + 0.1);
      ["#s-j1", "#s-j2", "#s-j3", "#s-j4"].forEach((j, i) => tl.fromTo(j, { opacity: 0, x: 70 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, t(7) + i * 0.12));
      tl.fromTo("#s-badge", { opacity: 0, scale: 2.2, rotation: 6 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.3, ease: "power4.in" }, t(14) - 0.2);
      tl.to(".s-tab", { color: "#ffc24b", duration: 0.2, yoyo: true, repeat: 1, repeatDelay: 0.5 }, t(11));

      /* ---- 3. An order arrives. The loop calls each job, in order ---- */
      tl.fromTo("#s-o1", { opacity: 0, y: -220, rotation: -14 }, { opacity: 1, y: 0, rotation: -5, duration: 0.5, ease: "back.out(1.3)" }, t(17) - 0.15);
      tl.set("#s-play", { y: 0 }, 0);
      tl.to("#s-play", { opacity: 1, duration: 0.2 }, t(18) - 0.1);
      [23, 26, 29, 32].forEach((w, i) => {
        const at = t(w) - 0.1, id = "#s-j" + (i + 1);
        tl.to("#s-play", { y: (i + 1) * 52, duration: 0.22, ease: "power3.inOut" }, at - 0.15);
        draw("#s-w" + (i + 1), at, 0.3);
        call("#s-d" + (i + 1), 861, LY[i], 1395, JY[i], at, 0.32);
        light(id, ON, at + 0.32);
        tl.fromTo(id, { scale: 1 }, { scale: 1.06, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at + 0.32);
      });
      tl.fromTo("#s-ca", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, t(20) - 0.1);
      tl.fromTo("#s-cb", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, t(33) - 0.1);
      out(["#s-ca", "#s-cb"], t(37) - 0.25, 0.25);
      [33, 34, 35, 36].forEach((w, i) => pop("#s-n" + (i + 1), t(w) - 0.05, { from: 0.3, d: 0.3 }));
      tl.to("#s-play", { opacity: 0, duration: 0.25 }, t(36));

      /* ---- 4. Sam wants a bell. The accountant wants a tax log ---- */
      out("#s-o1", t(37) - 0.2, 0.25);
      tl.fromTo("#s-m1", { opacity: 0, x: -80, rotation: -4 }, { opacity: 1, x: 0, rotation: -1.5, duration: 0.5, ease: "back.out(1.5)" }, t(38) - 0.1);
      tl.to("#s-g7", { opacity: 1, duration: 0.2 }, t(41) - 0.1);
      type("#s-l7", t(41), 0.4, 10);
      tl.fromTo("#s-j5", { opacity: 0, x: 70 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, t(42) - 0.1);
      draw("#s-w5", t(42) + 0.05, 0.35);
      pop("#s-count", t(42) + 0.35, { from: 0.5 });
      tl.fromTo("#s-m2", { opacity: 0, x: -80, rotation: 4 }, { opacity: 1, x: 0, rotation: 1.5, duration: 0.5, ease: "back.out(1.5)" }, t(44) - 0.1);
      tl.to("#s-g8", { opacity: 1, duration: 0.2 }, t(47) - 0.1);
      type("#s-l8", t(47), 0.4, 10);
      tl.fromTo("#s-j6", { opacity: 0, x: 70 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, t(48) - 0.1);
      draw("#s-w6", t(48) + 0.05, 0.35);
      swap("#s-c1", "#s-c2", t(48) + 0.4);
      // each new idea means opening the one loop
      tl.to(["#s-m1", "#s-m2"], { y: -10, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, stagger: 0.18 }, t(50));
      tl.fromTo("#s-dash", { opacity: 0, scale: 1.05, svgOrigin: "512 414" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, t(53) - 0.1);
      tl.to("#s-count", { y: -10, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, t(53) + 0.2);
      pop("#s-every", t(58) - 0.1, { from: 0.4 });
      tl.fromTo("#s-play", { opacity: 0, y: 0 }, { opacity: 1, y: 312, duration: 0.9, ease: "none", immediateRender: false }, t(59));
      tl.to("#s-play", { opacity: 0, duration: 0.2 }, t(59) + 0.9);

      /* ---- 5. Maya flips it: a small board owns the loop ---- */
      out(["#s-m1", "#s-m2", "#s-count", "#s-dash", "#s-every", "#s-j5", "#s-j6", "#s-w1", "#s-w2", "#s-w3", "#s-w4", "#s-w5", "#s-w6", ".s-num"], t(62), 0.3);
      ["#s-j1", "#s-j2", "#s-j3", "#s-j4"].forEach((j) => light(j, OFF, t(62)));
      tl.to("#s-badge", { opacity: 0, y: -40, duration: 0.2, ease: "power2.in" }, t(64) - 0.3);
      tl.to("#s-code", { scaleX: 0, duration: 0.26, ease: "power2.in" }, t(64) - 0.2);
      tl.set("#s-code", { opacity: 0 }, t(64) + 0.06);
      tl.fromTo("#s-board", { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.42, ease: "back.out(1.5)" }, t(64) + 0.06);
      tl.fromTo("#s-btitle", { scale: 1 }, { scale: 1.08, transformOrigin: "0% 50%", duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, t(68));
      tl.fromTo("#s-badge", { opacity: 0, y: -160, rotation: 6 }, { opacity: 1, y: 0, rotation: -4, duration: 0.4, ease: "bounce.out", immediateRender: false }, t(69) - 0.1);
      pop("#s-loop", t(71) - 0.1, { from: 0.3, d: 0.35 });
      tl.fromTo("#s-loop", { rotation: 0 }, { rotation: 360, duration: 0.9, ease: "power2.inOut", immediateRender: false }, t(71) + 0.1);

      tl.fromTo("#s-cc", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, t(69) - 0.1);
      out("#s-cc", t(90) - 0.2, 0.2);
      tl.fromTo("#s-cd", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, t(91) - 0.1);

      /* ---- each job leaves its name ---- */
      tl.fromTo("#s-strip", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, t(73) - 0.4);
      [0, 1, 2, 3].forEach((i) => {
        const at = t(73) + 0.05 + i * 0.42, tg = "#s-tg" + (i + 1);
        const dy = (148 + i * 104 + 14) - (260 + i * 80);
        tl.fromTo("#s-j" + (i + 1), { scale: 1 }, { scale: 1.06, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);
        tl.fromTo(tg, { opacity: 0, x: 1238, y: dy, scale: 0.7 }, { opacity: 1, x: 1180, y: dy, scale: 1, duration: 0.16, ease: "power2.out" }, at);
        tl.to(tg, { x: 0, y: 0, duration: 0.5, ease: "power3.inOut" }, at + 0.16);
        type("#s-k" + (i + 1), at + 0.3, 0.32, 12);
      });
      // "call me when an order arrives": the line runs from the job to the board
      pop("#s-say", t(80) - 0.15, { from: 0.5 });
      ["#s-v1", "#s-v2", "#s-v3", "#s-v4"].forEach((v, i) => draw(v, t(80) + i * 0.1, 0.45));

      /* ---- 6. An order drops in. The board calls every job on its list ---- */
      out("#s-say", t(86) - 0.25, 0.2);
      tl.fromTo("#s-o2", { opacity: 1, y: -420, rotation: 12 }, { opacity: 1, y: 0, rotation: -4, duration: 0.5, ease: "power3.in" }, t(87) - 0.1);
      tl.to("#s-board", { y: 7, duration: 0.07, ease: "power1.out", yoyo: true, repeat: 1 }, t(87) + 0.4);
      tl.to("#s-loop", { rotation: 720, duration: 0.8, ease: "power2.inOut" }, t(87) + 0.4);
      tl.to("#s-tray", { backgroundColor: "#ffc24b", duration: 0.15, yoyo: true, repeat: 1, repeatDelay: 0.3 }, t(87) + 0.4);
      [0, 1, 2, 3].forEach((i) => {
        const at = t(92) - 0.15 + i * 0.32, id = "#s-j" + (i + 1), tg = "#s-tg" + (i + 1);
        tl.to(tg, { backgroundColor: ON, duration: 0.12, yoyo: true, repeat: 1, repeatDelay: 0.2 }, at);
        tl.fromTo(tg, { scale: 1 }, { scale: 1.07, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);
        call("#s-d" + (i + 1), 861, BY[i], 1395, JY[i], at + 0.05, 0.3);
        light(id, ON, at + 0.35);
        pop(id + " .s-ok", at + 0.4, { from: 0.2, ease: "back.out(2.4)", d: 0.3 });
      });

      /* ---- 7. The kitchen bell: one new job, one new line ---- */
      out(["#s-o2", ".s-ok"], t(98) - 0.2, 0.25);
      ["#s-j1", "#s-j2", "#s-j3", "#s-j4"].forEach((j) => light(j, OFF, t(98) - 0.2));
      tl.set("#s-j5 > u", { backgroundColor: OFF }, t(98));
      tl.fromTo("#s-j5", { opacity: 0, x: 70, scale: 1 }, { opacity: 1, x: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)", immediateRender: false }, t(99) - 0.1);
      pop("#s-newjob", t(102) - 0.1, { from: 0.4 });
      tl.to("#s-kgreen", { opacity: 1, duration: 0.25 }, t(105) - 0.1);
      type("#s-k5", t(105), 0.4, 12);
      tl.fromTo("#s-tg5", { opacity: 0, x: 1238, y: -2, scale: 0.7 }, { opacity: 1, x: 1180, y: -2, scale: 1, duration: 0.16, ease: "power2.out" }, t(105));
      tl.to("#s-tg5", { x: 0, y: 0, duration: 0.5, ease: "power3.inOut" }, t(105) + 0.16);
      pop("#s-newline", t(107) - 0.1, { from: 0.4 });
      draw("#s-v5", t(107) + 0.2, 0.4);
      // the next order rings it too
      tl.fromTo("#s-o3", { opacity: 1, y: -420, rotation: -12 }, { opacity: 1, y: 0, rotation: 4, duration: 0.42, ease: "power3.in" }, t(109) - 0.05);
      tl.to("#s-board", { y: 7, duration: 0.07, ease: "power1.out", yoyo: true, repeat: 1 }, t(109) + 0.37);
      tl.to("#s-loop", { rotation: 1080, duration: 0.8, ease: "power2.inOut" }, t(109) + 0.37);
      [0, 1, 2, 3, 4].forEach((i) => {
        const at = t(110) - 0.1 + i * 0.06, id = "#s-j" + (i + 1);
        tl.to("#s-tg" + (i + 1), { backgroundColor: ON, duration: 0.1, yoyo: true, repeat: 1, repeatDelay: 0.15 }, at);
        call("#s-d" + (i + 1), 861, BY[i], 1395, JY[i], at, 0.22);
        light(id, ON, at + 0.22);
      });
      tl.to("#s-j5", { rotation: 5, duration: 0.07, ease: "power1.inOut", yoyo: true, repeat: 7 }, t(111) + 0.05);
      tl.fromTo("#s-ding", { opacity: 0, scale: 0.4, rotation: -20 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.3, ease: "back.out(2.4)" }, t(111) + 0.05);
      // and the loop stays shut
      out("#s-newjob", t(114), 0.2);
      tl.fromTo("#s-lock", { opacity: 0, scale: 2, y: -40 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "power4.in" }, t(116) - 0.1);
      tl.fromTo("#s-shut", { opacity: 0, scale: 2.2, rotation: 4 }, { opacity: 1, scale: 1, rotation: -5, duration: 0.28, ease: "power4.in" }, t(117) - 0.05);

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.3, ease: "power2.in" }, 43.48);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
  </script>
</template>
