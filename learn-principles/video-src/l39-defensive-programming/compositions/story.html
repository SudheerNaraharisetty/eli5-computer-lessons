  <script>
    (function () {
      // Word start times from the narration (seconds); t(i) adds the 0.6 s lead-in.
      const W = [0.0, 0.441, 0.94, 1.277, 1.602, 2.31, 2.519, 2.763, 3.762, 4.238, 4.331, 4.725, 5.097, 5.561, 5.851, 6.676, 6.861, 6.989, 7.303, 7.767, 8.336, 8.649, 8.847, 9.23, 9.741, 10.519, 11.134, 11.401, 11.796, 12.353, 13.142, 13.305, 13.595, 14.176, 14.907, 15.36, 16.149, 16.358, 16.834, 17.531, 17.844, 18.703, 18.889, 19.319, 19.783, 20.805, 21.025, 21.397, 21.768, 22.244, 22.941, 23.312, 23.428, 23.928, 24.148, 24.392, 25.158, 25.391, 25.716, 26.087, 26.18, 26.668, 26.946, 27.271, 28.281, 28.723, 28.943, 29.524, 29.709, 30.162, 30.638, 31.683, 31.927, 32.055, 32.74, 32.972, 33.088, 33.204, 33.97, 34.203, 34.318, 34.736, 35.027, 35.282, 35.537, 36.339, 36.768, 38.045, 38.208, 38.603, 39.055, 39.253, 39.589, 40.1, 40.402, 40.797, 41.47, 41.644, 41.911, 42.051, 42.387, 42.736, 42.945, 43.061, 43.653, 44.698, 45.127, 45.476, 45.569, 45.87, 46.184, 46.451, 46.706, 46.997, 47.229, 48.308, 48.982, 49.11, 49.597, 49.783, 50.433, 50.607, 50.99, 51.165, 51.293, 51.734, 52.233, 52.709, 53.173, 53.382, 53.545, 53.673, 54.485, 54.787, 55.124, 55.286, 55.681, 56.413, 56.691, 56.865, 57.481, 58.386, 58.688, 58.99, 59.199, 59.466, 59.663, 60.65, 60.952, 61.103, 61.533, 61.742, 61.869];
      const t = (i) => W[i] + 0.6;
      const tl = gsap.timeline({ paused: true });

      const pop = (sel, at, o) => {
        o = o || {};
        tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.45, ease: o.ease || "back.out(1.6)" }, at);
      };
      const out = (sel, at, d) => tl.to(sel, { opacity: 0, duration: d || 0.2, ease: "power2.in" }, at);
      const swap = (a, b, at) => {
        tl.to(a, { opacity: 0, duration: 0.12, ease: "power2.in" }, at);
        tl.fromTo(b, { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, at + 0.08);
      };
      const stamp = (sel, at) => tl.fromTo(sel, { opacity: 0, scale: 2.2, rotation: 3 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.26, ease: "power4.in" }, at - 0.22);

      /* hand-drawn strokes: draw by real length */
      const LEN = {};
      document.querySelectorAll("#s-marks path").forEach((p) => {
        const L = Math.ceil(p.getTotalLength()) || 600;
        LEN["#" + p.id] = L;
        p.style.strokeDasharray = L + " " + (L + 40);
      });
      const draw = (sel, at, d) => {
        tl.set(sel, { opacity: 1 }, at);
        tl.fromTo(sel, { strokeDashoffset: LEN[sel] }, { strokeDashoffset: 0, duration: d || 0.4, ease: "power2.out" }, at);
      };

      /* what the box on the form shows: one value at a time, or the caret when empty */
      const box = (cls, at) => {
        tl.to(["#s-in > b", "#s-caret"], { opacity: 0, duration: 0.08 }, at - 0.1);
        if (cls) tl.fromTo("#s-in > b." + cls, { opacity: 0, scale: 1.3, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, at);
        else tl.to("#s-caret", { opacity: 1, duration: 0.08 }, at);
      };
      /* room screens */
      const val = (room, from, to, at) => swap(room + " .s-scr > b." + from, room + " .s-scr > b." + to, at);

      /* envelopes: slot in the queue, the landing spot beside line 2, and the spot in front of the gate */
      const SLOT = { 1: [96, 500], 2: [306, 500], 3: [96, 620], 4: [306, 620], 5: [96, 740], 6: [306, 740] };
      const LAND = [1500, 202], GATE = [556, 202], BOX = [244, 276];
      const e = (i) => "#s-e" + i;
      const dx = (i, p) => p[0] - SLOT[i][0], dy = (i, p) => p[1] - SLOT[i][1];
      // out of the box on the form, across to line 2 of the code
      const send = (i, at, d) => {
        tl.fromTo(e(i), { opacity: 0 }, { opacity: 1, duration: 0.15 }, at);
        tl.fromTo(e(i), { x: BOX[0] - 95 - SLOT[i][0], y: BOX[1] - 48 - SLOT[i][1], scale: 0.3 }, { x: dx(i, LAND), y: dy(i, LAND), scale: 1, duration: d || 0.65, ease: "power2.inOut" }, at);
      };
      const used = (i, at) => tl.to(e(i), { opacity: 0, scale: 0.6, duration: 0.2, ease: "power2.in" }, at);

      gsap.set("#s-form", { x: 60, y: 150, scale: 1.5, transformOrigin: "0px 0px" });
      gsap.set("#s-gatebar", { svgOrigin: "790 152" });

      /* ---- 1. One box on Maya's website ---- */
      pop("#s-name", t(0) - 0.05, { from: 0.4 });
      pop("#s-in", t(3), { from: 0.7 });
      pop("#s-btn", t(4), { from: 0.7 });
      tl.fromTo("#s-flabel", { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.75, ease: "steps(17)" }, t(5));
      tl.to("#s-caret", { opacity: 0, duration: 0.01, repeat: 3, repeatDelay: 0.4, yoyo: true }, t(8) - 0.3);
      box("f1", t(11));
      // the first envelope comes out of the box and hangs in the air
      tl.fromTo(e(1), { opacity: 0 }, { opacity: 1, duration: 0.15 }, t(12) - 0.05);
      tl.fromTo(e(1), { x: 187, y: -32, scale: 0.3 }, { x: 819, y: -148, scale: 1.3, duration: 0.6, ease: "back.out(1.3)" }, t(12) - 0.05);
      pop("#s-ttext", t(14) - 0.05, { from: 0.3, ease: "back.out(2.4)" });
      // the code arrives and takes it as it is
      out(["#s-maya", "#s-name"], t(15) - 0.15, 0.3);
      tl.to("#s-form", { x: 0, y: 0, scale: 1, duration: 0.7, ease: "power3.inOut" }, t(15) - 0.15);
      tl.fromTo("#s-code", { opacity: 0, x: 90 }, { opacity: 1, x: 0, duration: 0.55, ease: "expo.out" }, t(16));
      tl.to(e(1), { x: dx(1, LAND), y: dy(1, LAND), scale: 1, duration: 0.6, ease: "power2.inOut" }, t(17));
      draw("#s-feed", t(18) - 0.05, 0.3);
      tl.fromTo("#s-feedh", { opacity: 0 }, { opacity: 1, duration: 0.1 }, t(18) + 0.2);
      draw("#s-tring", t(18) + 0.2, 0.4);
      pop("#s-nocheck", t(18) + 0.35, { from: 0.4 });

      /* ---- 2. Watch who turns up ---- */
      tl.fromTo("#s-rooms", { opacity: 0 }, { opacity: 1, duration: 0.2 }, t(20) - 0.05);
      tl.fromTo(".s-room", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.4)", stagger: 0.13 }, t(20) - 0.05);
      tl.fromTo(".s-wire", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.3, ease: "power2.out", stagger: 0.13 }, t(20) + 0.1);
      // "3": fine
      tl.to(e(1), { scale: 1.18, duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1 }, t(24));
      val("#s-till", "v0", "v1", t(25) - 0.1);
      val("#s-sales", "v0", "v1", t(25) + 0.05);
      val("#s-kit", "v0", "v1", t(25) + 0.2);
      tl.fromTo(".s-ok", { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)", stagger: 0.1 }, t(25) + 0.2);
      // an empty box: crash
      used(1, t(26) + 0.1);
      box(null, t(26));
      send(2, t(27) - 0.1, 0.7);
      tl.to("#s-hot", { opacity: 1, duration: 0.12 }, t(29) - 0.05);
      stamp("#s-crash", t(29) + 0.1);
      tl.to(e(2), { x: "+=10", duration: 0.05, yoyo: true, repeat: 5 }, t(29) + 0.1);
      // the word "three": crash
      out(["#s-crash", "#s-hot"], t(30) - 0.1, 0.15);
      used(2, t(30) - 0.1);
      box("f3", t(30) + 0.05);
      send(3, t(31), 0.65);
