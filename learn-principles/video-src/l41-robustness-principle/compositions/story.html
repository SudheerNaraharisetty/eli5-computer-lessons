          <div class="s-drow" style="top:130px"><small>out</small><span class="s-mono" id="s-dout">ready,cookie,count,cents</span></div>
        </div>

        <!-- mode tags, drawn over both windows so one can travel across -->
        <div class="s-tag s-hide" id="s-tsloppy">SLOPPY</div>
        <div class="s-tag s-hide" id="s-tforg">FORGIVING</div>
        <div class="s-tag s-hide" id="s-tstrict">STRICT</div>

        <svg id="s-marks" class="s-abs" viewBox="0 0 1920 1080">
          <path id="s-rneat" d="M140 572 C140 506 470 506 470 572 C470 638 140 638 136 562" />
        </svg>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // Word start times from the narration (seconds), offset by the 0.6 s lead-in.
      const W = [0.0, 0.464, 0.778, 0.975, 1.312, 1.66, 1.892, 2.171, 3.332, 3.646, 4.075, 4.389, 4.679, 4.946, 5.074, 6.13, 6.502, 6.954, 7.523, 8.464, 8.696, 9.102, 9.369, 9.741, 10.681, 10.832, 11.32, 11.819, 12.806, 12.968, 13.386, 13.978, 15.07, 15.267, 15.592, 15.859, 15.964, 16.091, 16.509, 18.054, 18.344, 18.878, 19.598, 20.178, 20.561, 21.037, 21.943, 22.129, 22.303, 22.5, 22.791, 23.058, 24.114, 24.369, 24.613, 25.089, 25.298, 25.449, 26.355, 26.494, 26.842, 27.179, 27.446, 28.212, 28.375, 28.572, 29.083, 29.455, 29.71, 30.372, 30.558, 30.755, 30.906, 31.73, 32.531, 32.891, 33.112, 33.541, 34.261, 34.459, 34.609, 34.993, 35.225, 35.329, 35.794, 36.328, 36.618, 36.746, 37.106, 37.837, 38.162, 38.267, 39.149, 39.59, 39.753, 40.182, 41.158, 41.529, 41.959, 42.586, 42.853, 43.131, 43.932, 44.223, 44.443, 44.757, 46.069, 46.231, 46.452, 47.055, 47.52, 48.611, 48.913, 49.041, 49.18, 49.726, 49.97, 50.132, 50.898, 51.072, 51.235, 51.583, 51.908, 52.222, 53.151, 53.569, 54.079, 54.509, 54.683, 55.531, 55.891, 56.819, 57.214, 57.435, 57.562, 58.329, 59.408, 59.652, 60.128, 60.244, 60.43, 60.581, 61.208, 61.44, 62.125, 62.334, 62.543, 62.682];
      const t = (i) => W[i] + 0.6;
      const tl = gsap.timeline({ paused: true });

      const pop = (sel, at, o) => {
        o = o || {};
        tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.4, ease: o.ease || "back.out(1.6)" }, at);
      };
      const out = (sel, at, d) => tl.to(sel, { opacity: 0, duration: d || 0.25, ease: "power2.in" }, at);
      const swap = (a, b, at) => {
        if (a) tl.to(a, { opacity: 0, duration: 0.1, ease: "power2.in" }, at);
        tl.fromTo(b, { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, at + 0.07);
      };
      const stamp = (sel, at, rot) => tl.fromTo(sel, { opacity: 0, scale: 2.4, rotation: 5 }, { opacity: 1, scale: 1, rotation: rot, duration: 0.26, ease: "power4.in" }, at - 0.2);
      const draw = (sel, at, d) => {
        document.querySelectorAll(sel).forEach((p, i) => {
          const L = p.getTotalLength() + 2;
          gsap.set(p, { strokeDasharray: L, strokeDashoffset: L });
          tl.set(p, { strokeDashoffset: L, opacity: 1 }, at + i * 0.18);
          tl.to(p, { strokeDashoffset: 0, duration: d || 0.4, ease: "power2.out" }, at + i * 0.18 + 0.01);
        });
      };
      const pulse = (sel, at, s) => tl.fromTo(sel, { scale: 1 }, { scale: s || 1.15, transformOrigin: "0% 50%", duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);
      // a letter flies in from the left and lands crooked on the desk
      const arrive = (sel, at, rot) => tl.fromTo(sel, { opacity: 0, x: -820, y: -24, rotation: -14 }, { opacity: 1, x: 0, y: 0, rotation: rot, duration: 0.4, ease: "power3.out" }, at);
      const shake = (sel, at) => tl.fromTo(sel, { x: 0 }, { x: 10, duration: 0.05, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, at);

      /* ---- 1. Orders arrive from other programs, one line of text each ---- */
      tl.to("#s-arm", { rotation: -16, svgOrigin: "296 340", duration: 0.2, ease: "power1.inOut", yoyo: true, repeat: 5 }, 0.5);
      tl.fromTo("#s-sign", { opacity: 0, y: -120, rotation: -6 }, { opacity: 1, y: 0, rotation: 0, duration: 0.55, ease: "back.out(1.3)" }, t(0) - 0.1);
      tl.fromTo("#s-from > span", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.35, ease: "back.out(1.6)", stagger: 0.18 }, t(6) - 0.05);
      arrive("#s-l0", t(8) + 0.05, 0);
      pop("#s-l0f", t(11), { from: 0.5 });
      [["#s-l0a", 15], ["#s-l0b", 17], ["#s-l0c", 18]].forEach(([s, i]) => {
        tl.fromTo(s, { scale: 1, color: "#0e0c1d" }, { scale: 1.3, color: "#3b37e6", duration: 0.16, ease: "power2.out", immediateRender: false }, t(i));
        tl.to(s, { scale: 1, duration: 0.22, ease: "power2.inOut" }, t(i) + 0.18);
      });
      tl.fromTo("#s-deal", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, t(11) + 0.3);
      tl.fromTo("#s-din", { backgroundColor: "rgba(230,227,255,0)" }, { backgroundColor: "#e6e3ff", duration: 0.25 }, t(15));

      /* ---- 2. A very strict reader ---- */
      out("#s-l0f", t(19) - 0.1, 0.2);
      pop("#s-l0k", t(19), { from: 0.2, ease: "back.out(2.4)" });
      tl.fromTo("#s-code", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, t(20) - 0.1);
      tl.to("#s-l0", { y: 180, scale: 0.5, opacity: 0, transformOrigin: "0% 0%", duration: 0.4, ease: "power2.in" }, t(21));
      stamp("#s-tstrict", t(23) + 0.1, -6);

      const reject = (sel, cnt, prev, o) => {
        arrive(sel, o.in, o.rot);
        if (o.hot) tl.to(sel + " " + o.hot, o.hotTo, o.ring);
        draw(sel + " > svg > path", o.ring, 0.35);
        stamp(sel + " .s-rej", o.rej, -8);
        if (!prev) {
          tl.set("#s-c1", { opacity: 1 }, o.rej - 0.05);
          out("#s-hlab", o.rej - 0.3, 0.15);
          tl.fromTo("#s-shut", { opacity: 1, scaleY: 0, transformOrigin: "50% 0%" }, { opacity: 1, scaleY: 1, duration: 0.3, ease: "bounce.out" }, o.rej - 0.05);
        } else {
          shake("#s-shut", o.rej);
          swap(prev, cnt, o.rej);
        }
        tl.to(sel, { x: -860, y: 30, rotation: -18, opacity: 0, duration: 0.4, ease: "power2.in" }, o.rej + 0.5);
      };
      reject("#s-la", "#s-c1", null, { in: t(24) - 0.4, rot: -4, ring: t(25), rej: t(27), hot: ".cap", hotTo: { color: "#b8235a", duration: 0.2 } });
      reject("#s-lb", "#s-c2", "#s-c1", { in: t(28) - 0.3, rot: 3, ring: t(29) + 0.05, rej: t(31), hot: ".sp", hotTo: { backgroundColor: "#fbe0ea", boxShadow: "inset 0 -5px 0 0 #b8235a", duration: 0.2 } });
      reject("#s-lc", "#s-c3", "#s-c2", { in: t(32) - 0.35, rot: -3, ring: t(33), rej: t(38), hot: ".xt", hotTo: { color: "#b8235a", duration: 0.2 } });
      tl.fromTo("#s-fri", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, t(40));
      swap("#s-c3", "#s-c40", t(42));
      shake("#s-shut", t(42) + 0.1);
      pulse("#s-cntlab", t(45), 1.12);

      /* ---- 3. And what Maya sends back is a mess ---- */
      pulse("#s-outt", t(50), 1.2);
      tl.fromTo("#s-m1", { opacity: 0, x: -160, scale: 0.6, rotation: 0 }, { opacity: 1, x: 0, scale: 1, rotation: -5, duration: 0.45, ease: "back.out(1.6)" }, t(54) - 0.05);
      stamp("#s-tsloppy", t(57) + 0.1, 5);
      tl.fromTo("#s-m2", { opacity: 0, x: -200, scale: 0.6, rotation: 0 }, { opacity: 1, x: 0, scale: 1, rotation: 4, duration: 0.45, ease: "back.out(1.6)" }, t(59) - 0.05);
      tl.to("#s-m1", { rotation: -8, duration: 0.14, ease: "sine.inOut", yoyo: true, repeat: 3 }, t(61));
      tl.to("#s-m2", { rotation: 7, duration: 0.14, ease: "sine.inOut", yoyo: true, repeat: 3 }, t(61) + 0.07);
      tl.fromTo("#s-to > span", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.35, ease: "back.out(1.6)", stagger: 0.15 }, t(64) - 0.05);
      tl.fromTo("#s-recv", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, t(64) + 0.1);
      swap(null, "#s-rq", t(66));
      pop("#s-rpbad", t(66) + 0.25, { from: 0.4 });
      tl.to("#s-dout", { backgroundColor: "#fbe0ea", duration: 0.25 }, t(67));

      /* ---- 4. Backwards. So she flips it ---- */
      pulse("#s-tstrict", t(70), 1.12);
      pulse("#s-tsloppy", t(72), 1.12);
      pop("#s-back", t(73), { from: 0.4 });
      tl.to("#s-tsloppy", { y: 90, rotation: 28, opacity: 0, duration: 0.35, ease: "power2.in" }, t(76) - 0.05);
      tl.to("#s-tstrict", { x: 1018, rotation: 5, backgroundColor: "#1f7a5c", duration: 0.7, ease: "power3.inOut" }, t(76));
      tl.to("#s-tstrict", { y: -18, duration: 0.35, ease: "power2.out", yoyo: true, repeat: 1 }, t(76));
      pop("#s-tforg", t(76) + 0.55, { from: 0.4 });
      tl.set("#s-tforg", { rotation: -6 }, 0);
      out("#s-back", t(76) + 0.2, 0.3);
      tl.to("#s-m1", { x: 700, rotation: 20, opacity: 0, duration: 0.45, ease: "power2.in" }, t(76) + 0.1);
      tl.to("#s-m2", { x: 600, rotation: -20, opacity: 0, duration: 0.45, ease: "power2.in" }, t(76) + 0.2);
      out(["#s-rq", "#s-rpbad"], t(76) + 0.2, 0.3);
      tl.fromTo("#s-rwait", { opacity: 0 }, { opacity: 1, duration: 0.3 }, t(76) + 0.5);
      tl.to("#s-dout", { backgroundColor: "rgba(251,224,234,0)", duration: 0.3 }, t(76) + 0.2);
      tl.to("#s-shut", { scaleY: 0, duration: 0.5, ease: "power3.inOut" }, t(77) + 0.1);
      tl.to("#s-hlab", { opacity: 1, duration: 0.3 }, t(77) + 0.5);

      /* ---- 5. A patient reader: forgive the form ---- */
      pulse("#s-int", t(79), 1.2);
      tl.fromTo(".s-slot > u", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.12 }, t(83));
      const forgive = (sel, slot, pile, prev, o) => {
        arrive(sel, o.in, o.rot);
        if (slot) {
          out(slot + " > u", o.code - 0.05, 0.12);
          tl.fromTo(slot + " > b", { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, o.code);
        }
        if (o.dim) tl.to(sel + " " + o.dim, { opacity: 0.25, duration: 0.25 }, o.code);
        tl.to(sel + " .s-raw", { opacity: 0, duration: 0.12, ease: "power2.in" }, o.fix);
        tl.fromTo(sel + " .s-neat", { opacity: 0, scale: 1.25, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, o.fix + 0.08);
        tl.to(sel, { rotation: 0, backgroundColor: "#ddefe6", duration: 0.3, ease: "back.out(2)" }, o.fix);
        tl.to(sel, { x: 24, y: 182, scale: 0.46, transformOrigin: "0% 0%", duration: 0.32, ease: "power2.in" }, o.drop);
        tl.to(sel, { opacity: 0, duration: 0.1 }, o.drop + 0.3);
        if (!prev) tl.fromTo("#s-neat", { opacity: 0 }, { opacity: 1, duration: 0.1 }, o.drop + 0.28);
        else pulse("#s-neat", o.drop + 0.3, 1.06);
        swap(prev, pile, o.drop + 0.3);
      };
      forgive("#s-la2", "#s-sl", "#s-p1", null, { in: t(85) - 0.45, rot: -4, code: t(86), fix: t(87), drop: t(89) - 0.25 });
      forgive("#s-lb2", "#s-ss", "#s-p2", "#s-p1", { in: t(89) - 0.3, rot: 3, code: t(89) + 0.1, fix: t(90) + 0.05, drop: t(92) - 0.3 });
      forgive("#s-lc2", null, "#s-p3", "#s-p2", { in: t(92) - 0.25, rot: -3, code: t(92) + 0.2, dim: ".xt", fix: t(94) + 0.1, drop: t(95) + 0.5 });
      pulse("#s-pile", t(96), 1.15);
      draw("#s-rneat", t(99), 0.55);

      /* ---- 6. But it never guesses ---- */
      out("#s-rneat", t(102) - 0.1, 0.25);
      tl.fromTo("#s-tray", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, t(102));
      pop("#s-noguess", t(104), { from: 0.4 });
      out("#s-hlab", t(105), 0.25);
      const sendBack = (sel, cnt, prev, o) => {
        tl.fromTo(sel, { opacity: 0, x: -820, y: o.y - 24, rotation: -14 }, { opacity: 1, x: 0, y: o.y, rotation: o.rot, duration: 0.4, ease: "power3.out" }, o.in);
        draw(sel + " > svg > path", o.ring, 0.35);
        pop(sel + " .s-ask", o.ask, { from: 0.4 });
        tl.to(sel, { x: 346, y: 180, scale: 0.4, rotation: 8, transformOrigin: "0% 0%", duration: 0.4, ease: "power2.in" }, o.back);
        tl.to(sel, { opacity: 0, duration: 0.12 }, o.back + 0.36);
        swap(prev, cnt, o.back + 0.38);
      };
      sendBack("#s-ld", "#s-t1", null, { in: t(106) - 0.4, y: -18, rot: -3, ring: t(107), ask: t(108) + 0.2, back: t(111) });
      sendBack("#s-le", "#s-t2", "#s-t1", { in: t(109) - 0.3, y: 76, rot: -3, ring: t(110) - 0.1, ask: t(110) + 0.25, back: t(111) + 0.7 });
      pop("#s-note", t(115), { from: 0.4 });
      out("#s-noguess", t(118) - 0.2, 0.3);

      /* ---- 7. One stamp on the way out ---- */
      pulse("#s-outt", t(119), 1.2);
      tl.fromTo("#s-press", { opacity: 0, y: -70 }, { opacity: 1, y: 0, duration: 0.4, ease: "bounce.out" }, t(122) - 0.1);
      const print = (row, ok, at, dy) => {
        tl.to("#s-press", { y: 12, duration: 0.07, ease: "power2.in" }, at);
        tl.to("#s-press", { y: 0, duration: 0.22, ease: "back.out(3)" }, at + 0.07);
        tl.fromTo(row, { opacity: 0, y: -dy, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.32, ease: "back.out(1.4)" }, at + 0.08);
        pop(ok, at + 0.38, { from: 0.2, ease: "back.out(2.4)", d: 0.3 });
      };
      print("#s-o1", "#s-k1", t(123) + 0.25, 60);
      print("#s-o2", "#s-k2", t(125), 126);
      print("#s-o3", "#s-k3", t(126) + 0.25, 192);
      tl.fromTo("#s-tstrict", { scale: 1 }, { scale: 1.2, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, t(128));
      swap("#s-rwait", "#s-rgood", t(127));
      pop("#s-rpok", t(129), { from: 0.4 });
      tl.to("#s-dout", { backgroundColor: "#ddefe6", duration: 0.25 }, t(129) + 0.1);
      tl.to("#s-to > span", { backgroundColor: "#ddefe6", duration: 0.25 }, t(130));

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.25, ease: "power2.in" }, 57.02);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
  </script>
</template>
