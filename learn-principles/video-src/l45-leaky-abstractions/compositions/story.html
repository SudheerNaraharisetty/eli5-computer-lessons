      </div>

  </div>

  <script>
    (function () {
      // Word start times from the narration (seconds), offset by the 0.6 s lead-in.
      const W = [0.0, 0.221, 0.65, 1.509, 1.881, 2.218, 3.495, 3.831, 4.319, 5.259, 5.759, 6.165, 6.444, 6.583, 6.989, 7.396, 7.546, 7.941, 8.046, 9.242, 9.439, 9.532, 9.892, 10.356, 10.728, 11.157, 11.413, 11.668, 11.796, 12.771, 13.177, 13.491, 13.804, 13.932, 14.211, 14.942, 15.139, 15.244, 15.685, 16.057, 16.277, 16.44, 17.485, 17.996, 18.553, 18.785, 19.691, 19.865, 19.981, 20.538, 20.956, 21.432, 21.722, 22.64, 22.86, 23.29, 23.603, 24.613, 25.322, 25.751, 26.169, 26.308, 26.61, 26.75, 27.005, 27.353, 27.504, 28.003, 29.083, 29.373, 29.664, 30.116, 30.372, 30.709, 31.428, 31.893, 32.067, 32.171, 32.647, 33.762, 34.122, 34.505, 34.784, 35.051, 35.643, 36.061, 36.862, 37.268, 37.617, 37.953, 38.278, 39.323, 39.509, 39.683, 39.834, 40.345, 41.111, 41.285, 41.668, 42.678, 42.887, 43.015, 43.34, 43.468, 43.805, 44.49, 44.85, 46.161, 46.533, 46.719, 46.881, 47.404, 48.727, 48.913, 49.029, 49.412, 49.923, 50.097, 50.376, 50.933, 51.281, 52.338, 52.582, 53.139, 53.673, 54.184, 54.811, 55.252, 55.426, 56.053, 56.39, 56.517, 56.901, 57.017, 57.144, 57.783, 58.224, 58.468, 58.839, 59.014, 59.548, 60.476, 60.929, 61.986, 62.334, 62.717, 63.263, 63.692, 64.052, 64.563, 65.875, 66.026, 66.235, 66.723, 66.955, 67.454, 67.628, 67.744, 68.035, 68.487, 68.847, 69.347, 69.521, 69.648, 70.031];
      const t = (i) => W[i] + 0.6;
      const tl = gsap.timeline({ paused: true });

      const pop = (sel, at, o) => {
        o = o || {};
        tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.45, ease: o.ease || "back.out(1.6)" }, at);
      };

      const swap = (a, b, at) => {
        tl.to(a, { opacity: 0, duration: 0.12, ease: "power2.in" }, at);
        tl.fromTo(b, { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, at + 0.08);
      };
      // Stroke drawing from the real path length.
      const draw = (sel, at, d) => {
        const p = document.querySelector(sel);
        const len = p.getTotalLength();
        p.style.strokeDasharray = len;
        tl.fromTo(sel, { strokeDashoffset: len, opacity: 1 }, { strokeDashoffset: 0, opacity: 1, duration: d || 0.45, ease: "power2.out", immediateRender: false }, at);
      };
      const press = (btn, at) => {
        tl.to(btn, { y: 7, scale: 0.96, duration: 0.1, ease: "power2.in" }, at);
        tl.to(btn, { y: 0, scale: 1, duration: 0.25, ease: "back.out(3)" }, at + 0.12);
      };
      const spinGears = (at, d) => {
        tl.to("#s-g1", { rotation: "+=200", svgOrigin: "40 40", duration: d, ease: "power1.inOut" }, at);
        tl.to("#s-g2", { rotation: "-=290", svgOrigin: "96 56", duration: d, ease: "power1.inOut" }, at);
      };
      // A leak: starts at its source behind the wall, comes through, drops into place.
      const drip = (sel, dx, dy, at, land) => {
        tl.fromTo(sel, { opacity: 0, scale: 0.5, x: dx, y: dy }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, at);
        tl.to(sel, { x: 40, duration: land - at - 0.25, ease: "power2.inOut" }, at + 0.25);
        tl.to(sel, { x: 0, duration: 0.5, ease: "power1.out" }, land);
        tl.to(sel, { y: 0, duration: 0.5, ease: "bounce.out" }, land);
      };


      /* ---- 1. Lesson 18: notify, one simple handle ---- */
      tl.fromTo("#s-l18", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, t(1) - 0.1);
      pop("#s-btn1", t(5) - 0.05, { from: 0.4 });
      draw("#s-rbtn1", t(7) - 0.05, 0.55);
      // Behind it: the hatch slides away and shows the six steps.
      tl.to("#s-rin", { opacity: 1, duration: 0.05 }, t(9) - 0.15);
      tl.to("#s-cover", { x: 900, duration: 0.6, ease: "power3.inOut" }, t(9) - 0.15);
      tl.to("#s-pipes", { opacity: 1, duration: 0.4 }, t(11) - 0.1);
      ["#s-st-1", "#s-st-2", "#s-st-3", "#s-st-4", "#s-st-5", "#s-st-6"].forEach((s, i) => pop(s, t(11) + i * 0.34, { from: 0.7, d: 0.35 }));
      spinGears(t(11), 2.2);

      /* ---- 2. A normal day: press, works ---- */
      out("#s-rbtn1", t(19) - 0.2, 0.25);
      out("#s-l18", t(19) - 0.2, 0.25);
      tl.to("#s-cover", { x: 0, duration: 0.6, ease: "power3.inOut" }, t(19));
      tl.to("#s-rin", { opacity: 0, duration: 0.05 }, t(19) + 0.6);
      tl.fromTo("#s-strip", { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.4)" }, t(23) - 0.25);
      tl.fromTo("#s-cursor", { opacity: 0, x: 560, y: 1000 }, { opacity: 1, x: 820, y: 392, duration: 0.6, ease: "power3.out" }, t(24) - 0.45);
      press("#s-btn1", t(24) + 0.2);
      tl.to("#s-cursor", { opacity: 0, x: 900, y: 560, duration: 0.4, ease: "power2.in" }, t(26));
      pop("#s-bubA", t(28) - 0.2, { from: 0.5 });
      pop("#s-tick", t(28) + 0.2, { from: 0.2, ease: "back.out(2.4)" });

      /* ---- 3. A long message, with the pickup code at the end ---- */
      out(["#s-bubA", "#s-tick"], t(31) - 0.4, 0.25);
      tl.fromTo("#s-tape", { opacity: 1, clipPath: "inset(-12% 100% -30% -2%)" }, { opacity: 1, clipPath: "inset(-12% -2% -30% -2%)", duration: 0.9, ease: "power2.out", immediateRender: false }, t(31) - 0.1);
      tl.fromTo("#s-count", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, t(33) + 0.35);
      tl.to("#s-tail", { backgroundColor: "#e6e3ff", duration: 0.3 }, t(37));
      tl.fromTo("#s-tail", { scale: 1 }, { scale: 1.18, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, t(38));
      // Notify reports no problem.
      tl.set("#s-cursor", { x: 560, y: 1000 }, t(41));
      tl.to("#s-cursor", { opacity: 1, x: 820, y: 392, duration: 0.55, ease: "power3.out" }, t(42) - 0.5);
      press("#s-btn1", t(42) + 0.1);
      tl.to("#s-cursor", { opacity: 0, x: 900, y: 560, duration: 0.4, ease: "power2.in" }, t(43) + 0.2);
      tl.fromTo("#s-noerr", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, t(44) - 0.1);
      // But the customer's text stops mid sentence.
      tl.fromTo("#s-bubB", { opacity: 1, clipPath: "inset(-4% -4% 104% -4%)" }, { opacity: 1, clipPath: "inset(-4% -4% -4% -4%)", duration: 0.9, ease: "power1.out", immediateRender: false }, t(48) - 0.1);
      draw("#s-rcut", t(50) - 0.05, 0.45);
      pop("#s-stops", t(51), { from: 0.4 });
      tl.fromTo("#s-nocode", { opacity: 0, scale: 2, rotation: 3 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.3, ease: "power4.in" }, t(56) - 0.3);
      tl.to("#s-tail", { backgroundColor: "#fbe0ea", color: "#b8235a", duration: 0.3 }, t(54));
      // Inside: the hatch opens on the step that cuts.
      tl.to("#s-rin", { opacity: 1, duration: 0.05 }, t(57) - 0.1);
      tl.to("#s-cover", { x: 900, duration: 0.6, ease: "power3.inOut" }, t(57) - 0.1);
      tl.to(["#s-st-1", "#s-st-2", "#s-st-4", "#s-st-5", "#s-st-6"], { opacity: 0.45, duration: 0.4 }, t(58));
      tl.to("#s-st-3", { backgroundColor: "#b8235a", scale: 1.06, duration: 0.3, ease: "back.out(2)" }, t(61) - 0.05);
      draw("#s-rstep", t(61) + 0.1, 0.5);
      // That hidden detail just leaked out.
      out("#s-rstep", t(68), 0.25);
      pop("#s-stn1", t(71) + 0.1, { from: 0.2 });
      drip("#s-dr1", 450, -338, t(69), t(72));

      /* ---- 4. Save is a handle too ---- */
      out(["#s-tape", "#s-noerr", "#s-rcut"], t(74) - 0.35, 0.25);
      tl.to("#s-phone", { opacity: 0, x: -120, duration: 0.35, ease: "power2.in" }, t(74) - 0.35);
      tl.to("#s-st-3", { backgroundColor: "#6b1f43", scale: 1, opacity: 0.8, duration: 0.3 }, t(74) - 0.3);
      swap("#s-call1", "#s-call2", t(74) - 0.05);
      pop("#s-btn2", t(74), { from: 0.4 });
      draw("#s-rbtn2", t(77) - 0.1, 0.5);
      tl.to("#s-savehow", { opacity: 1, duration: 0.3 }, t(77));
      pop("#s-plugdb", t(77) + 0.1, { from: 0.7 });
      // Maya plugs in an online sales book.
      out("#s-rbtn2", t(79) - 0.2, 0.25);
      tl.to("#s-plugdb", { opacity: 0, x: 380, y: 150, rotation: 14, duration: 0.4, ease: "power2.in" }, t(79));
      tl.fromTo("#s-plugon", { opacity: 0, x: 420 }, { opacity: 1, x: 0, duration: 0.5, ease: "back.out(1.5)" }, t(80));
      tl.set("#s-wire", { opacity: 1 }, t(83) - 0.1);
      draw("#s-wirep", t(83) - 0.05, 0.8);
      pop("#s-cloud", t(83) + 0.55, { from: 0.5 });
      pop("#s-cloudtxt", t(83) + 0.7, { from: 0.5 });
      // Now save takes three seconds.
      tl.fromTo("#s-till", { opacity: 0, x: -120 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, t(86) - 0.3);
      tl.set("#s-cursor", { x: 560, y: 1000 }, t(85));
      tl.to("#s-cursor", { opacity: 1, x: 820, y: 572, duration: 0.5, ease: "power3.out" }, t(87) - 0.5);
      press("#s-btn2", t(87));
      tl.to("#s-cursor", { opacity: 0, x: 900, y: 700, duration: 0.4, ease: "power2.in" }, t(88));
      tl.to(["#s-saving", "#s-spin"], { opacity: 1, duration: 0.2 }, t(87) + 0.15);
      tl.to("#s-arc", { rotation: 1080, svgOrigin: "35 35", duration: 2.4, ease: "none" }, t(87) + 0.15);
      spinGears(t(87) + 0.15, 2.2);
      tl.set("#s-dot", { opacity: 1, x: 454, y: 469 }, t(87) + 0.2);
      tl.to("#s-dot", { x: 600, duration: 0.22, ease: "none" }, t(87) + 0.2);
      tl.to("#s-dot", { y: 640, duration: 0.26, ease: "none" }, t(87) + 0.42);
      tl.to("#s-dot", { x: 250, duration: 0.52, ease: "none" }, t(87) + 0.68);

      tl.to("#s-dot", { x: 506, duration: 0.38, ease: "none" }, t(87) + 1.43);

      const tick = (a, b, at) => {
        if (a) tl.to(a, { opacity: 0, duration: 0.06 }, at);

      pop("#s-x", t(95), { from: 0.2, ease: "back.out(2.4)" });

      tl.fromTo("#s-frozen", { opacity: 0, scale: 2.4, rotation: 4 }, { opacity: 1, scale: 1, rotation: -7, duration: 0.3, ease: "power4.in" }, t(98) - 0.25);
      tl.fromTo(".s-q", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.8)", stagger: 0.18 }, t(98) + 0.25);

      pop("#s-err", t(101) - 0.05, { from: 0.5 });
      draw("#s-rbtn2", t(104) - 0.1, 0.5);
      pop("#s-stn3", t(105) + 0.35, { from: 0.2 });
      drip("#s-dr3", 760, -70, t(105) - 0.1, t(106) + 0.1);

      /* ---- 5. That is a leaky abstraction ---- */
      out("#s-rbtn2", t(107) - 0.3, 0.25);
      tl.to("#s-strip", { opacity: 0, y: -40, duration: 0.3, ease: "power2.in" }, t(107) - 0.3);
      const words = gsap.utils.toArray("#s-title span");
      tl.fromTo(words[0], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, t(109) - 0.05);
      tl.fromTo(words[1], { opacity: 0, y: 40, scale: 1.3 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2)" }, t(110) - 0.05);
      tl.fromTo(words[2], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, t(111) - 0.05);
      draw("#s-under", t(111) + 0.5, 0.45);
      // On a bad day, the hidden machinery shows through.
      tl.to("#s-st-3", { opacity: 1, backgroundColor: "#b8235a", scale: 1.06, duration: 0.25, ease: "back.out(2)" }, t(117));
      tl.fromTo("#s-plugon", { scale: 1 }, { scale: 1.08, duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out" }, t(118));
      tl.fromTo("#s-x", { scale: 1 }, { scale: 1.4, duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out" }, t(118) + 0.2);
      spinGears(t(117), 1.6);
      tl.fromTo([".s-stain"], { scale: 1 }, { scale: 1.5, duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out", stagger: 0.12 }, t(119));
      tl.fromTo(["#s-dr1", "#s-dr2", "#s-dr3"], { scale: 1 }, { scale: 1.12, duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out", stagger: 0.15 }, t(120) - 0.1);

      /* ---- 6. You cannot seal every leak. So be honest. ---- */
      tl.fromTo("#s-plaster", { opacity: 0, scale: 2, rotation: -20 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.3, ease: "power4.in" }, t(123) - 0.25);
      tl.to("#s-plaster", { y: 420, rotation: 120, opacity: 0, duration: 0.7, ease: "power2.in" }, t(125) - 0.1);
      tl.fromTo("#s-drop", { opacity: 0, y: -20, scale: 0.4 }, { opacity: 1, y: 0, scale: 1, duration: 0.25, ease: "back.out(2)" }, t(125));
      tl.to("#s-drop", { y: 240, opacity: 0, duration: 0.6, ease: "power2.in" }, t(125) + 0.3);
      // Write the limits on the front.
      tl.fromTo("#s-panel", { scale: 1 }, { scale: 1.05, transformOrigin: "100% 50%", duration: 0.22, yoyo: true, repeat: 1, ease: "power2.out" }, t(134) - 0.1);
      tl.to("#s-dr1", { y: -330, x: 0, scale: 0.9, opacity: 0, duration: 0.45, ease: "power3.in" }, t(135) - 0.3);
      pop("#s-pl1", t(135) + 0.1, { from: 0.5, ease: "back.out(2)" });
      pop("#s-pl2", t(141), { from: 0.5, ease: "back.out(2)" });
      tl.to("#s-dr2", { y: -172, x: 0, scale: 0.9, opacity: 0, duration: 0.45, ease: "power3.in" }, t(142) + 0.45);
      pop("#s-pl3", t(142) + 0.85, { from: 0.5, ease: "back.out(2)" });
      // Turn strange errors into plain words.
      draw("#s-rerr", t(145) - 0.05, 0.5);
      out("#s-rerr", t(146), 0.2);
      tl.to("#s-dr3", { x: -420, y: -390, scale: 0.8, opacity: 0, duration: 0.45, ease: "power3.in" }, t(146) - 0.2);
      swap("#s-err", "#s-plain", t(146) + 0.2);
      tl.to("#s-frozen", { opacity: 0, scale: 0.6, duration: 0.25, ease: "power2.in" }, t(146) + 0.3);
      out(["#s-sec", "#s-spin", "#s-saving"], t(146) + 0.3, 0.25);

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.3, ease: "power2.in" }, 65.75);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
  </script>
