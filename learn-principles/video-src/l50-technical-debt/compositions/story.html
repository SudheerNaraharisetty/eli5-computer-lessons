  <script>
    (function () {
      // Word start times from the narration (seconds); the voice starts 0.6 s in.
      const W = [0.0, 0.29, 0.592, 0.894, 1.753, 2.055, 2.322, 2.45, 2.728, 3.251, 3.448, 3.599, 4.528, 4.772, 5.689, 5.828, 6.13, 6.385, 6.815, 7.221, 8.092, 8.29, 8.44, 8.731, 8.824, 9.81, 10.008, 10.379, 10.53, 10.82, 11.447, 11.854, 11.97, 12.446, 12.91, 13.166, 13.723, 13.862, 14.954, 15.256, 15.964, 16.208, 16.358, 16.625, 16.741, 17.333, 17.74, 18.03, 19.063, 19.388, 19.771, 20.224, 20.816, 20.99, 21.199, 22.024, 22.233, 22.616, 22.894, 23.498, 23.73, 24.334, 24.497, 25.286, 25.518, 25.623, 26.018, 26.598, 27.318, 28.363, 28.514, 28.816, 28.955, 29.315, 29.535, 29.675, 29.953, 30.708, 30.917, 31.3, 31.823, 31.985, 32.229, 32.787, 33.657, 33.808, 34.11, 34.586, 34.946, 35.248, 35.921, 36.177, 37.164, 38.313, 38.684, 39.056, 39.149, 39.602, 40.054, 40.252, 40.588, 40.89, 41.958, 42.225, 42.597, 42.794, 43.224, 43.398, 43.735, 43.874, 44.443, 44.71, 44.814, 45.14, 45.975, 46.196, 46.475, 46.765, 46.904, 47.589, 48.007, 48.576, 48.89, 49.911, 50.283, 50.654, 51.014, 51.165, 51.467, 52.408, 52.57, 52.756, 53.545, 53.708, 53.789, 54.207, 54.648, 55.763, 56.065, 56.831, 57.168, 57.632, 57.98, 58.294, 59.014, 59.908, 60.07, 60.651, 60.848, 60.999, 61.939, 62.218, 62.323, 62.462, 63.008, 63.379, 63.507, 63.913, 64.145, 64.366, 64.505, 64.819, 65.051, 65.225, 65.597];
      const t = (i) => W[i] + 0.6;
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);

      // hand-drawn rings around code tokens
      const ring = (cx, cy, rx, ry) => `M${cx - rx + 8} ${cy + 6} C${cx - rx - 2} ${cy - ry} ${cx + rx} ${cy - ry - 2} ${cx + rx} ${cy} C${cx + rx} ${cy + ry} ${cx - rx - 6} ${cy + ry} ${cx - rx + 2} ${cy - 10}`;
      $("#s-rprice").setAttribute("d", ring(444, 713, 72, 40));
      $("#s-rtax").setAttribute("d", ring(696, 763, 52, 40));
      $("#s-rmiss").setAttribute("d", ring(402, 863, 168, 38));
      $("#s-rfin").setAttribute("d", ring(545, 313, 168, 40));
      $("#s-rcalc").setAttribute("d", ring(562, 763, 186, 40));
      const lens = {};
      document.querySelectorAll("#s-marks path, #s-chart .seg").forEach((p) => {
        const L = Math.ceil(p.getTotalLength()) || 300;
        lens[p.id] = L;
        if (p.id === "s-rmiss" || p.id === "s-c6") return; // dashed ones pop instead of drawing
        p.style.strokeDasharray = L + " " + (L + 40);
        p.style.strokeDashoffset = L;
      });

      const pop = (sel, at, o) => {
        o = o || {};
        tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.45, ease: o.ease || "back.out(1.6)" }, at);
      };
      const out = (sel, at, d) => tl.to(sel, { opacity: 0, duration: d || 0.25, ease: "power2.in" }, at);
      const draw = (sel, at, d) => {
        const L = lens[sel.slice(1)];
        tl.set(sel, { opacity: 1 }, at);
        tl.fromTo(sel, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: d || 0.45, ease: "power2.out" }, at);
      };
      const swap = (a, b, at) => {
        tl.to(a, { opacity: 0, duration: 0.12, ease: "power2.in" }, at);
        tl.fromTo(b, { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, at + 0.08);
      };
      const typeIn = (sel, at, d, steps) => tl.fromTo(sel, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: d, ease: "steps(" + steps + ")" }, at);

      /* ---- 1. Christmas, hampers, by Friday ---- */
      tl.fromTo("#s-cal", { opacity: 0, y: -60, rotation: -6 }, { opacity: 1, y: 0, rotation: -3, duration: 0.55, ease: "back.out(1.4)" }, 0.15);
      tl.fromTo("#s-xmas", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, t(3) - 0.1);
      tl.fromTo("#s-web", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, t(9) - 0.5);
      pop("#s-htile", t(8), { from: 0.4, ease: "back.out(2)" });
      tl.fromTo("#s-friday", { opacity: 0, scale: 2.2, rotation: 8 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.35, ease: "power4.in" }, t(13) - 0.15);

      /* ---- 2. Two ways: proper (5 days) or shortcut (1 day) ---- */
      tl.fromTo("#s-right", { opacity: 0, x: 90 }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, t(15) - 0.2);
      tl.fromTo("#s-plbl", { opacity: 0 }, { opacity: 1, duration: 0.3 }, t(15));
      tl.fromTo("#s-plan .s-blk.p, #s-plan .s-blk.late", { opacity: 0, scaleX: 0, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: 0.25, ease: "power3.out", stagger: 0.16 }, t(18) - 0.05);
      tl.fromTo("#s-deadline", { scaleY: 1 }, { scaleY: 1.04, duration: 0.15, yoyo: true, repeat: 1, ease: "power1.inOut" }, t(19) + 0.3);
      tl.fromTo("#s-slbl", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, t(24) - 0.05);

      // the shop slides away, the code arrives

      tl.fromTo("#s-code", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, t(25) - 0.1);

      draw("#s-rprice", t(32) - 0.15, 0.45);
      draw("#s-rtax", t(32) + 0.3, 0.4);
      tl.fromTo("#s-notests", { opacity: 0, scale: 2, rotation: 6 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.3, ease: "power4.in" }, t(35));
      tl.fromTo("#s-sblk", { opacity: 0, scaleX: 0, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: 0.35, ease: "back.out(1.6)" }, t(38) - 0.05);
      // the note
      out(["#s-rprice", "#s-rtax"], t(40), 0.25);
      tl.set("#s-gB", { opacity: 1 }, t(44) - 0.1);
      typeIn("#s-gB .s-ln:nth-child(1)", t(44) - 0.1, 0.6, 12);
      typeIn("#s-gB .s-ln:nth-child(2)", t(45), 0.7, 14);

      /* ---- 3. 300 sold, good decision, 4 days borrowed ---- */

      const sold = { v: 0 };
      tl.fromTo(sold, { v: 0 }, { v: 300, duration: 1.1, ease: "power2.out", onUpdate: () => { $("#s-soldn").textContent = Math.round(sold.v); } }, t(48));
      tl.fromTo("#s-good", { opacity: 0, scale: 2.2, rotation: 6 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.3, ease: "power4.in" }, t(53) - 0.1);
      tl.fromTo("#s-brk", { opacity: 0, scaleX: 0, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: 0.4, ease: "power3.out" }, t(56) - 0.1);
      pop("#s-borrow", t(57), { from: 0.4 });

      /* ---- 4. January is busy. A loan charges interest. ---- */
      tl.to("#s-plan", { opacity: 0, duration: 0.3, ease: "power2.in" }, t(60) + 0.3);
      tl.fromTo("#s-ledger", { opacity: 0 }, { opacity: 1, duration: 0.3 }, t(60) + 0.45);
      tl.fromTo("#s-r0", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, t(60) + 0.5);
      tl.fromTo("#s-balance", { opacity: 0 }, { opacity: 1, duration: 0.3 }, t(60) + 0.6);
      tl.fromTo("#s-b4", { opacity: 0 }, { opacity: 1, duration: 0.3 }, t(60) + 0.6);

      /* ---- 5. February: made twice, one missed ---- */

      typeIn("#s-kit", t(70) - 0.05, 0.6, 10);

      tl.to("#s-cursor", { x: 300, y: 880, duration: 0.5, ease: "power2.inOut" }, t(76) - 0.2);

      swap("#s-b4", "#s-b3", t(81) + 0.1);

      /* ---- 6. March: discount, 3 days not 1 ---- */

      draw("#s-rfin", t(86) - 0.1, 0.45);
      pop("#s-edit1", t(86) + 0.3, { from: 0.4 });
      draw("#s-rcalc", t(87) - 0.1, 0.45);

      draw("#s-c3", t(88) + 0.2, 0.4);
      tl.fromTo("#s-d3", { opacity: 0 }, { opacity: 1, duration: 0.2 }, t(88) + 0.55);
      swap("#s-b3", "#s-b1", t(88) + 0.3);

      /* ---- 7. April: Sam, two order systems ---- */
      out(["#s-rfin", "#s-edit1", "#s-rcalc", "#s-byhand"], t(92) - 0.1);
      pop("#s-sam", t(93), { from: 0.4 });
      tl.fromTo("#s-r4", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, t(94));
      draw("#s-c4", t(94) + 0.1, 0.35);
      tl.fromTo("#s-d4", { opacity: 0 }, { opacity: 1, duration: 0.2 }, t(94) + 0.4);
      swap("#s-b1", "#s-b0", t(94) + 0.2);
      draw("#s-bk1", t(99) - 0.05, 0.4);
      pop("#s-k1", t(99) + 0.2, { from: 0.3 });

      pop("#s-k2", t(100) + 0.2, { from: 0.3 });

      out(["#s-sam", "#s-bk1", "#s-bk2", "#s-k1", "#s-k2", "#s-notests"], t(114) - 0.2);
      tl.to("#s-gC", { opacity: 0, scaleY: 0.3, transformOrigin: "50% 0%", duration: 0.45, ease: "power3.in" }, t(116));
      tl.to("#s-gB", { opacity: 0, duration: 0.3, ease: "power2.in" }, t(116) + 0.15);

      tl.to("#s-c6", { opacity: 0, duration: 0.3 }, t(117) + 0.1);
      tl.fromTo("#s-gD", { opacity: 0 }, { opacity: 1, duration: 0.2 }, t(121) - 0.1);
      typeIn("#s-gD .s-ln", t(121) - 0.1, 0.7, 14);
      pop("#s-onepath", t(122), { from: 0.5 });
      draw("#s-rail", t(124) - 0.1, 0.6);
      draw("#s-c7", t(124), 0.4);
      pop("#s-once", t(126), { from: 0.4 });
      pop("#s-int0", t(128) - 0.1, { from: 0.4 });

      tl.to("#s-code", { opacity: 0.18, duration: 0.4, ease: "power2.inOut" }, t(129) - 0.2);
      out(["#s-onepath", "#s-once", "#s-rail"], t(129) - 0.2, 0.3);

      tl.fromTo("#s-web2", { opacity: 0 }, { opacity: 1, duration: 0.6 }, t(135));
      pop("#s-dzero", t(137), { from: 0.4 });
      tl.fromTo("#s-leave", { opacity: 0, scale: 2.4, rotation: 8 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.3, ease: "power4.in" }, t(139) - 0.15);

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.3, ease: "power2.in" }, 57.95);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
