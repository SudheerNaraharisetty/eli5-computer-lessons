<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f6f1eb;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: #f6f1eb;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="76.1"
      data-width="1920"
      data-height="1080"
    >
      <div id="ground"></div>
      <div
        id="story"
        data-composition-id="story"
        data-composition-src="compositions/story.html"
        data-start="0"
        data-duration="65.7"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="takeaway"
        data-composition-id="takeaway"
        data-composition-src="compositions/takeaway.html"
        data-start="65.7"
        data-duration="10.4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <audio
        id="voice"
        class="clip"
        src="assets/voice/narration.mp3"
        data-start="0.6"
        data-duration="73.1"
        data-track-index="2"
        data-volume="1"
      ></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
