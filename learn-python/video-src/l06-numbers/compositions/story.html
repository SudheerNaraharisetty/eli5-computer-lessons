    (function () {
      // Word start times from the narration (seconds). The voice starts 0.6 s into the film.

      const t = (i) => W[i] + 0.6;

      // Hand-drawn ring around a point, in page pixels.
      // Code panel: 40px mono = 24px per char, code starts at x=136, output at x=1100; line tops 760, 824, 888.
      // Scale display: 60px mono = 36px per char, text starts at x=1074, centre y=371.
      const ring = (id, cx, cy, rx, ry) => {
        const d = `M${cx - rx + 6} ${cy + 4} C${cx - rx + 2} ${cy - ry} ${cx + rx} ${cy - ry - 3} ${cx + rx} ${cy} C${cx + rx} ${cy + ry} ${cx - rx - 3} ${cy + ry + 3} ${cx - rx} ${cy - 8}`;
        const p = document.getElementById(id); p.setAttribute("d", d);
        if (!p.style.strokeDasharray) { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; p.dataset.len = L; }
      };
      ring("r-int", 1254, 792, 170, 40);      // <class 'int'> output, line 1 (cols 0-13)
      ring("r-float", 1290, 856, 206, 40);    // <class 'float'> output, line 2 (cols 0-15)

      ring("r-round", 352, 856, 92, 38);      // round( on line 2, cols 6-11
      ring("r-places", 676, 856, 50, 36);     // , 2 on line 2, cols 21-23

      const pop = (sel, at, o) => { o = o || {}; tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.45, ease: o.ease || "back.out(1.6)", immediateRender: false }, at); };

        const p = document.getElementById(id);
        tl.set(p, { opacity: 1 }, at);
        tl.fromTo(p, { strokeDashoffset: +p.dataset.len }, { strokeDashoffset: 0, duration: d || 0.5, ease: "power2.out", immediateRender: false }, at);
      };
      const bump = (sel, at) => tl.fromTo(sel, { scale: 1 }, { scale: 1.03, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);
      // Swap a display value: the old one fades, the new one pops.
      const swap = (from, to, at) => { out(from, at - 0.1, 0.12); pop(to, at, { from: 0.7, d: 0.35 }); };

      const drop = (sel, at) => tl.fromTo(sel, { opacity: 0, y: -260 }, { opacity: 1, y: 0, duration: 0.6, ease: "bounce.out", immediateRender: false }, at);
      const type = (sel, at, n) => tl.fromTo(sel, { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.04 * n, ease: `steps(${n})`, immediateRender: false }, at);

      const weigh = (at) => tl.fromTo("#s-plate", { y: 0 }, { y: 8, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.inOut", immediateRender: false }, at);

      /* ---- 2. The counter: 3 guests, 12 cookies, 3 desserts for Chloe ---- */

      drop("#k1", t(16) - 0.2); click(t(16) + 0.1); swap("#c0", "#c1", t(16) + 0.15);
      drop("#k2", t(18) - 0.2); click(t(18) + 0.1); swap("#c1", "#c2", t(18) + 0.15);
      drop("#k3", t(20) - 0.2); click(t(20) + 0.1); swap("#c2", "#c3", t(20) + 0.15);

      /* ---- 3. The scale: 2.5 kg of pasta for Ana, 0.75 litres of milk ---- */

      drop("#m1", t(29) - 0.2); weigh(t(29) + 0.1); swap("#v0", "#v1", t(29) + 0.15);

      pop("#s-kfloat", t(62) - 0.05, { from: 0.3, ease: "back.out(2.2)" });
      tl.fromTo("#s-cursor", { opacity: 0, x: 760, y: 1000 }, { opacity: 1, x: 300, y: 800, duration: 0.5, ease: "power3.out" }, t(63) - 0.3);
      type("#L1", t(63), 14);
      type("#L2", t(64) + 0.2, 16);
      tl.to("#s-cursor", { opacity: 0, x: 380, y: 980, duration: 0.4, ease: "power2.in" }, t(65));
      pop("#o1", t(67), { from: 0.7, d: 0.3 }); draw("r-int", t(67) + 0.15, 0.45);
      pop("#o2", t(69) - 0.1, { from: 0.7, d: 0.3 }); draw("r-float", t(69) + 0.1, 0.45);

      /* ---- 5. Count with int: 2.0 guests makes no sense ---- */
      out(["#r-int", "#r-float"], t(74) - 0.3, 0.25);
      bump("#s-cnt", t(71));
      tl.fromTo("#s-kint", { scale: 1 }, { scale: 1.2, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, t(73));
      out("#s-cchips", t(74) - 0.3, 0.2);
      drop("#s-bad", t(74) - 0.2); swap("#c3", "#c4", t(74) + 0.15);
      type("#L3", t(74), 16);
      (function () { const p = document.getElementById("r-two"); p.style.strokeDashoffset = 0; tl.fromTo(p, { opacity: 0, scale: 1.4, svgOrigin: "516 371" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)", immediateRender: false }, t(77)); })();
      pop("#o3", t(77) + 0.1, { from: 0.7, d: 0.3 });
      pop("#s-nosense", t(79) - 0.05, { from: 0.3, ease: "back.out(2.4)" });
      tl.fromTo("#s-bad", { x: 0 }, { x: 10, duration: 0.06, ease: "none", yoyo: true, repeat: 5, immediateRender: false }, t(79));
