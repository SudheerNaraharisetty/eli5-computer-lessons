      const W = [0.0, 0.441, 0.778, 0.987, 1.382, 1.544, 1.858, 1.974, 2.635, 2.856, 3.135, 3.402, 3.483, 3.762, 4.83, 5.329, 5.538, 5.631, 5.805, 6.177, 6.351, 6.815, 7.883, 8.243, 8.359, 9.381, 9.625, 9.915, 10.054, 10.588, 11.088, 12.051, 12.469, 12.852, 14.002, 14.35, 14.675, 14.791, 15.755, 16.115, 16.289, 16.753, 17.311, 17.613, 17.729, 18.263, 18.599, 19.284, 19.621, 19.819, 20.202, 21.154, 21.699, 22.036, 22.698, 23.232, 23.557, 24.625, 25.124, 25.426, 25.902, 26.32, 27.133, 27.365, 27.504, 28.062, 28.572, 29.072, 29.397, 29.559, 30.5, 30.848, 31.138, 31.278, 31.603, 31.881, 32.833, 33.077, 33.611, 33.89, 34.006, 34.563, 35.109, 35.376, 36.328, 36.699, 37.071, 37.477, 37.965, 38.534, 39.184, 39.451, 39.555, 39.857, 41.076, 41.366, 41.75, 42.156, 42.376, 42.469, 43.085, 43.398, 43.561, 43.665, 44.199, 45.186, 45.604, 46.37, 46.846, 47.496, 47.856, 48.472, 48.762, 49.261, 49.621, 49.935, 50.422, 51.212, 51.653, 52.245, 52.396, 52.802, 53.162, 53.429, 53.545, 54.567, 54.869, 55.484, 55.786, 55.879, 55.983, 56.587, 57.167, 57.957, 58.247, 58.654, 58.828, 59.513, 59.791, 60.233, 60.395, 61.208, 61.928, 62.113, 62.311];
      const t = (i) => W[i] + 0.6;
      const tl = gsap.timeline({ paused: true });

      // Hand-drawn ring around a point, in page pixels.
      // Code panel: 40px mono = 24px per char, code starts at x=136, output at x=1100; line centres y 792, 856, 920.
      const ring = (id, cx, cy, rx, ry) => {
        const d = `M${cx - rx + 6} ${cy + 4} C${cx - rx + 2} ${cy - ry} ${cx + rx} ${cy - ry - 3} ${cx + rx} ${cy} C${cx + rx} ${cy + ry} ${cx - rx - 3} ${cy + ry + 3} ${cx - rx} ${cy - 8}`;

        if (!p.style.strokeDasharray) { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; p.dataset.len = L; }
      };
      ring("r-500", 748, 331, 140, 62);      // 500 g on the recipe tile
      ring("r-wrong", 1644, 538, 160, 66);   // $65.0 on the bill
      ring("r-first", 472, 856, 88, 36);     // 15 / 3 on line 2 (cols 11-16)
      ring("r-dinner", 1748, 268, 64, 38);   // $60 on the bill
      ring("r-br", 388, 856, 128, 38);       // (60 + 15) on line 2b (cols 6-14)
      ring("r-right", 1644, 538, 160, 66);   // $25.0 on the bill
      ring("r-dot", 1172, 856, 30, 34);      // .0 of 25.0
      ring("r-slash", 532, 856, 28, 34);     // / on line 2b (col 16)
      ring("r-dot2", 1148, 920, 30, 34);     // .0 of 4.0
      ring("r-dsl", 376, 792, 42, 34);       // // on the cookie line (cols 9-10)

      ring("r-left", 476, 488, 140, 66);     // the 2 cookies left on the tray

      const out = (sel, at, d) => tl.to(sel, { opacity: 0, duration: d || 0.25, ease: "power2.in" }, at);
      const draw = (id, at, d) => {
        const p = document.getElementById(id);
        tl.set(p, { opacity: 1 }, at);
        tl.fromTo(p, { strokeDashoffset: +p.dataset.len }, { strokeDashoffset: 0, duration: d || 0.5, ease: "power2.out", immediateRender: false }, at);
      };
      const bump = (sel, at) => tl.fromTo(sel, { scale: 1 }, { scale: 1.03, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);
      const swap = (from, to, at) => { out(from, at - 0.1, 0.12); pop(to, at, { from: 0.7, d: 0.35 }); };
      const type = (sel, at, n) => tl.fromTo(sel, { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.04 * n, ease: `steps(${n})`, immediateRender: false }, at);
      const row = (sel, at) => tl.fromTo(sel, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out", immediateRender: false }, at);

      /* ---- 1. Ana, Ben and Chloe; Python's signs ---- */
      pop("#f1", t(0) - 0.05); pop("#f2", t(1) - 0.05); pop("#f3", t(3) - 0.05);
      bump("#s-recipe", t(7));
      tl.fromTo("#s-tile", { scale: 1 }, { scale: 1.05, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, t(13));
      tl.fromTo("#s-code", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out" }, t(14));
      pop(".s-key", t(18) - 0.05, { st: 0.12, from: 0.4, ease: "back.out(2)" });
      show(".s-klbl", t(18) + 0.2, 0.4);

      /* ---- 2. Double the pasta: 250 * 2 = 500 g ---- */
      bump("#s-recipe", t(22));
      tl.fromTo("#s-cursor", { opacity: 0, x: 700, y: 1010 }, { opacity: 1, x: 250, y: 800, duration: 0.5, ease: "power3.out", immediateRender: false }, t(25) - 0.45);
      type("#L1", t(25), 14);
      tl.to("#s-cursor", { opacity: 0, x: 420, y: 1000, duration: 0.4, ease: "power2.in" }, t(30) + 0.2);

      /* ---- 3. Split the bill ---- */

      tl.to("#s-recipe", { opacity: 0.35, duration: 0.4, ease: "power2.inOut" }, t(35));
      out("#s-signs", t(35) - 0.1, 0.25);
      show("#s-receipt", t(35) + 0.15, 0.3);
      bump("#s-bill", t(35) + 0.15);
      row("#rw1", t(40) - 0.05);
      row("#rw2", t(44) - 0.05);
      row("#rw3", t(49) - 0.05);
      show(["#s-line", "#s-each", "#s-ebox"], t(50) + 0.2, 0.35);
      type("#L2", t(51), 18);
      tl.fromTo("#rw3", { scale: 1 }, { scale: 1.06, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, t(56));
      tl.fromTo("#s-ebox", { scale: 1 }, { scale: 1.06, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, t(57));

      /* ---- 4. Python says 65.0: wrong ---- */
      pop("#o2", t(59), { from: 0.7, d: 0.3 });
      pop("#ev1", t(59) + 0.1, { from: 0.6 });
      draw("r-wrong", t(64) - 0.05, 0.45);
      tl.fromTo("#s-wrong", { opacity: 0, scale: 2, rotation: -8 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.35, ease: "back.out(2.2)", immediateRender: false }, t(64));

      /* ---- 5. Divides before it adds: only the tip got split ---- */
      draw("r-first", t(66), 0.45);
      pop("#s-b1", t(66) + 0.15, { from: 0.4 });
      pop("#s-b2", t(69), { from: 0.4 });

      draw("r-dot", t(93) - 0.05, 0.4);

      out(["#s-recipe", "#s-bill"], t(105), 0.3);
      tl.fromTo("#s-dessert", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out", immediateRender: false }, t(106));
      pop(".s-ck", t(107) - 0.05, { st: 0.035, from: 0.3, d: 0.3, ease: "back.out(2)" });
      pop(".s-plate", t(109) - 0.05, { st: 0.1, from: 0.5 });
      show(".s-pn", t(109) + 0.1, 0.35);
      type("#D1", t(111), 14);
      draw("r-dsl", t(112), 0.4);

      // Deal whole cookies, round the table: cookie i goes to plate i % 3, spot floor(i / 3).
      const plateX = [900, 1180, 1460], plateY = 250;
      for (let i = 0; i < 12; i++) {
        const el = document.getElementById("ck" + i);
        const p = i % 3, s = Math.floor(i / 3);
        const tx = plateX[p] + (s % 2 ? 44 : -44) - 40, ty = plateY + (s < 2 ? -44 : 44) - 40;
        tl.fromTo(el, { x: 0, y: 0 }, { x: tx - parseFloat(el.style.left), y: ty - parseFloat(el.style.top), duration: 0.42, ease: "power2.inOut", immediateRender: false }, t(113) - 0.15 + i * 0.13);

      pop("#d1o", t(117), { from: 0.7, d: 0.3 });
