      const draw = (id, at, d) => {

        tl.set(p, { opacity: 1 }, at);

      const clear = (sel, at) => tl.to(sel, { clipPath: "inset(0% 100% 0% 0%)", duration: 0.2, ease: "power2.in" }, at);
      const pulse = (sel, at) => tl.fromTo(sel, { scale: 1 }, { scale: 1.25, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, at);
      // Switch both clips between double " and single ' quotes.
      const quotes = (kind, at) => {
        const on = kind === "single" ? ["#qL1", "#qR1"] : ["#qL2", "#qR2"];
        const off = kind === "single" ? ["#qL2", "#qR2"] : ["#qL1", "#qR1"];
        tl.to(off, { opacity: 0, duration: 0.1 }, at - 0.08);
        tl.fromTo(on, { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(2)", immediateRender: false }, at);
        tl.fromTo(["#s-clipL", "#s-clipR"], { scaleY: 1 }, { scaleY: 0.92, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, at);
      };

      /* ---- 1. Words on the card, numbers on the scale. Python keeps them apart ---- */
      bump("#s-card", t(2));
      pop("#s-cl1", t(6) - 0.1, { from: 0.8, d: 0.35 });
      pop("#s-cl2", t(6) + 0.2, { from: 0.8, d: 0.35 });
      pop("#s-cl3", t(6) + 0.5, { from: 0.8, d: 0.35 });
      bump("#s-right", t(9));
      tl.fromTo("#s-plate", { y: 0 }, { y: 8, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.inOut", immediateRender: false }, t(11));
      swap("#v0", "#v1", t(12));
      pop("#s-kstr", t(15), { from: 0.3, ease: "back.out(2.2)" });
      pop("#s-kint", t(16) + 0.1, { from: 0.3, ease: "back.out(2.2)" });

      /* ---- 2. Strings: text inside quotes, held like two clips ---- */
      pulse("#s-kstr", t(23));
      pop("#s-sub1", t(23) + 0.1, { from: 0.8 });
      out(["#s-cl1", "#s-cl2", "#s-cl3"], t(25), 0.3);
      pop("#s-strip", t(27), { from: 0.85, d: 0.4 });
      tl.fromTo("#s-clipL", { opacity: 0, x: -120 }, { opacity: 1, x: 0, duration: 0.45, ease: "back.out(1.6)", immediateRender: false }, t(29) - 0.05);
      tl.fromTo("#s-clipR", { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.45, ease: "back.out(1.6)", immediateRender: false }, t(29) - 0.05);
      tl.fromTo(["#s-clipL", "#s-clipR"], { scaleY: 1 }, { scaleY: 0.9, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, t(32));
      tl.fromTo(["#s-clipL", "#s-clipR"], { scaleY: 1 }, { scaleY: 0.9, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, t(37));

      /* ---- 3. Single or double. Chloe's apostrophe needs double quotes ---- */
      quotes("single", t(38));
      quotes("double", t(40));
      quotes("single", t(44));
      draw("r-apos", t(49), 0.45);
      tl.to("#s-rest", { color: "#b8235a", duration: 0.2 }, t(49) + 0.2);
      tl.fromTo("#s-strip", { x: 0 }, { x: 8, duration: 0.06, yoyo: true, repeat: 5, ease: "none", immediateRender: false }, t(50));
      tl.fromTo("#s-code", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out" }, t(51) - 0.2);
      quotes("double", t(53));
      out("#r-apos", t(53) + 0.2, 0.25);
      tl.to("#s-rest", { color: "#0e0c1d", duration: 0.2 }, t(53) + 0.2);
      type("#L1", t(53), 21);
      pop("#o1", t(56), { from: 0.7, d: 0.3 });
      pop("#s-ok1", t(57), { from: 0.3, ease: "back.out(2.4)" });

      /* ---- 4. + joins, * repeats: the label maker ---- */
      dim("#s-card", t(58) - 0.3, 0.35);
      out(["#s-scale", "#s-nm1", "#s-kint"], t(58) - 0.3, 0.3);
      show(["#s-maker", "#s-nm2"], t(58) - 0.1, 0.35);
      bump("#s-right", t(58));
      type("#L2", t(59) - 0.1, 23);
      draw("r-plus", t(59) + 0.2, 0.4);
      pop("#o2", t(61), { from: 0.7, d: 0.3 });
      print("#tv1", t(61) + 0.1, 10);
      out("#r-plus", t(64) - 0.2, 0.2);
      type("#L3", t(64) - 0.1, 15);
      draw("r-star", t(65), 0.4);
      clear("#tv1", t(66));
      draw("r-eq", t(69) + 0.1, 0.4);
      draw("r-20", t(72), 0.4);
      pop("#o3", t(73), { from: 0.7, d: 0.3 });
      print("#tv2", t(73) + 0.2, 20);
      bump("#s-right", t(75));

      /* ---- 5. len counts the characters: lasagne has 7 ---- */
      out(["#r-star", "#r-eq", "#r-20", "#L1", "#o1", "#L2", "#o2", "#L3", "#o3", "#s-ok1"], t(77) - 0.1, 0.3);
      dim("#s-card", t(77), 1);
      dim("#s-right", t(77), 0.35);
      swap("#sv1", "#sv2", t(78));
      type("#L4", t(78), 21);
      ["#b1", "#b2", "#b3", "#b4", "#b5", "#b6", "#b7"].forEach((b, i) => pop(b, t(79) + i * 0.2, { from: 0.3, d: 0.3, ease: "back.out(2.4)" }));
      pop("#o4", t(84), { from: 0.5, d: 0.35 });
      draw("r-seven", t(84) + 0.1, 0.4);
      pulse("#b7", t(84));

      /* ---- 6. The trouble: "200" + "50" glues into 20050 ---- */
      out(["#L4", "#o4", "#r-seven", "#b1", "#b2", "#b3", "#b4", "#b5", "#b6", "#b7"], t(87) - 0.1, 0.3);
      dim("#s-card", t(87), 0.35);
      dim("#s-right", t(87), 1);
      clear("#tv2", t(87));
      bump("#s-right", t(89));
      type("#P1", t(92) - 0.1, 19);
      draw("r-q200", t(97), 0.4);
      draw("r-q50", t(100) - 0.1, 0.4);
      pop("#q1", t(107), { from: 0.6, d: 0.35 });
      tl.fromTo("#tv3", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 50% 0% 0%)", duration: 0.35, ease: "steps(7)", immediateRender: false }, t(91));
      tl.fromTo("#s-mk-dev", { y: 0 }, { y: 5, duration: 0.06, yoyo: true, repeat: 3, ease: "none", immediateRender: false }, t(91));
      tl.to("#tv3", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.35, ease: "steps(7)" }, t(107));
      draw("r-glue", t(107) + 0.6, 0.45);
      ["#d1", "#d2", "#d3", "#d4", "#d5"].forEach((d, i) => {
        tl.to(d, { color: "#b8235a", duration: 0.1 }, t(108 + i));
        tl.fromTo(d, { y: 0 }, { y: -12, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, t(108 + i));
      });
      ["#e1", "#e2", "#e3", "#e4", "#e5"].forEach((d, i) => tl.to(d, { color: "#ff6b8b", duration: 0.1 }, t(108 + i)));

      /* ---- 7. Text plus a real number: TypeError ---- */
      out(["#r-q200", "#r-q50", "#r-glue"], t(113) - 0.2, 0.25);
      clear("#tv3", t(113));
      type("#P2", t(113), 20);
      draw("r-three", t(117) - 0.05, 0.35);
      print("#tv4", t(118), 8);
      pop("#q2", t(123) - 0.05, { from: 0.8, d: 0.3 });
      pop("#s-stamp", t(123), { from: 1.8, d: 0.35, ease: "back.out(1.4)" });
      tl.fromTo("#s-code", { x: 0 }, { x: 8, duration: 0.06, yoyo: true, repeat: 5, ease: "none", immediateRender: false }, t(123) + 0.1);

      /* ---- 8. The fix: str turns 3 into text ---- */
      tl.fromTo("#s-cursor", { opacity: 0, x: 900, y: 1040 }, { opacity: 1, x: 578, y: 866, duration: 0.5, ease: "power3.out", immediateRender: false }, t(124));
      out("#r-three", t(127) - 0.15, 0.15);
      swap("#P2", "#P3", t(127));
      ["#s-s", "#s-t", "#s-r"].forEach((s, i) => tl.fromTo(s, { y: 0 }, { y: -14, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, t(127 + i)));
      draw("r-str", t(132), 0.45);
      tl.to("#s-cursor", { opacity: 0, x: 760, y: 1040, duration: 0.4, ease: "power2.in" }, t(132) + 0.3);
      out("#s-stamp", t(134) - 0.2, 0.25);
      pop("#s-n3", t(137), { from: 0.4 });
      show("#s-arr", t(138), 0.25);
      pop("#s-t3", t(139), { from: 0.4 });
      out("#q2", t(140) - 0.25, 0.2);
      pop("#q3", t(140), { from: 0.7, d: 0.3 });
      clear("#tv4", t(140) - 0.25);
      print("#tv5", t(140), 8);
      pop("#s-ok2", t(142), { from: 0.3, ease: "back.out(2.4)" });

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.3, ease: "power2.in" }, 60.55);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
  </script>
