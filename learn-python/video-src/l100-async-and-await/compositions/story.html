      bump("#pR", t(40), 1.05);

      pop("#pAsy", t(47), { d: 0.35 });

      /* ---- 4. async def: a recipe that can pause. await: I'm waiting, go do something else ---- */
      out("#stR", t(50) - 0.1, 0.2);
      out("#pAsy", t(50) + 0.3, 0.2);
      tl.set(["#bE", "#bV", "#done"], { x: 0 }, t(50));
      tl.set(["#bR", "#bE", "#bV"], { clipPath: "inset(0% 100% 0% 0%)", opacity: 1 }, t(50));
      type("#c0", t(50) - 0.1, 14, 0.2);
      type("#c1", t(50), 11, 0.2);
      type("#c2", t(50) + 0.1, 12, 0.2);
      type("#c4", t(50) + 0.2, 30, 0.5);
      draw("r-ad", t(51), 0.4);
      type("#c5", t(55), 41, 0.6);
      type("#c6", t(56), 15, 0.25);
      out("#r-ad", t(58) - 0.2, 0.2);
      draw("r-aw1", t(60), 0.4);
      cookTo(0, t(58), 0.4);
      pop("#bubble", t(64), { from: 0.7, d: 0.4 });
      out(["#bubble", "#r-aw1"], t(70) - 0.45, 0.25);

      /* ---- 5. asyncio.gather puts all three on the stove; the cook jumps at each await ---- */
      type("#c8", t(70), 17, 0.3);
      type("#c9", t(71), 25, 0.4);
      type("#c10", t(72), 25, 0.35);
      type("#c11", t(73), 25, 0.35);
      type("#c12", t(73) + 0.35, 23, 0.35);
      type("#c13", t(74) - 0.1, 19, 0.3);
      draw("r-ga", t(74), 0.4);
      bump("#pR", t(75), 1.05);
      bump("#pE", t(77), 1.05);
      bump("#pV", t(80), 1.05);
      out("#r-ga", t(81) - 0.2, 0.2);
      draw("r-rice", t(82), 0.35);
      show("#stR", t(83), 0.3);
      draw("r-aw2", t(85), 0.35);
      out(["#r-rice", "#r-aw2"], t(88), 0.2);
      cookTo(1, t(88), 0.45);
      draw("r-eggs", t(91), 0.35);
      show("#stE", t(91), 0.3);
      draw("r-aw3", t(92), 0.35);
      out(["#r-eggs", "#r-aw3"], t(94), 0.2);
      cookTo(2, t(94) + 0.2, 0.45);
      draw("r-veg", t(97), 0.35);
      show("#stV", t(97), 0.3);

      /* ---- 6. All three cook at once: veg, then eggs, then rice. 15 minutes ---- */
      const T2 = t(98), r = 0.207;
      out("#r-veg", T2, 0.2);
      grow("#bR", T2, 15 * r);
      grow("#bE", T2, 10 * r);
      grow("#bV", T2, 5 * r);
      out("#stV", T2 + 5 * r, 0.15);
      pop("#kV", T2 + 5 * r, { d: 0.3 });
      out("#stE", T2 + 10 * r, 0.15);
      pop("#kE", T2 + 10 * r, { d: 0.3 });
      out("#stR", T2 + 15 * r, 0.15);
      pop("#kR", T2 + 15 * r, { d: 0.3 });
      tl.set("#done", { x: 360 }, T2 + 15 * r);
      show("#done", T2 + 15 * r, 0.2);
      pop("#pTog", t(111), { d: 0.35 });
      show("#ghost", t(113), 0.3);
      show("#strike", t(114), 0.2);

      /* ---- 7. The trap: time.sleep puts the cook to sleep at the stove ---- */
      out(["#pTog", "#ghost", "#strike", "#kV", "#kE", "#kR"], t(115), 0.25);
      tl.to("#s-cursor", { opacity: 1, duration: 0.2 }, t(115));
      cursorTo(168 + 9 * 16.8, 204 + 5 * 54 + 6, t(115) + 0.1, 0.5);
      out("#c5", t(117), 0.15);
      type("#c5b", t(117), 32, 0.45);
      show("#hlB", t(117), 0.2);
      draw("r-ts", t(119), 0.4);
      tl.to("#s-cursor", { opacity: 0, duration: 0.2 }, t(120));
      cookTo(0, t(124), 0.5);
      tl.set("#cook .eye", { opacity: 0 }, t(127));
      tl.set("#cook .shut", { opacity: 1 }, t(127));
      pop("#zzz", t(127), { from: 0.5, d: 0.4 });
      show("#stR", t(127), 0.2);
      draw("r-sleep", t(130), 0.45);
      tl.to(["#pE", "#pV"], { opacity: 0.35, duration: 0.3 }, t(131));
      tl.to("#bE", { x: 360, duration: 0.8, ease: "power3.inOut" }, t(131));
      tl.to("#bV", { x: 600, duration: 0.8, ease: "power3.inOut" }, t(131) + 0.1);
      doneTo(30, t(131) + 0.2, 0.8);
      pop("#pBad", t(134), { d: 0.35 });
      pop("#wrong", t(134) + 0.15, { from: 1.5, ease: "power3.out", d: 0.3 });

      /* ---- 8. The fix: await asyncio.sleep. The pot waits, not the cook ---- */
      out(["#pBad", "#wrong", "#r-ts", "#r-sleep"], t(137) - 0.1, 0.25);
      tl.to("#s-cursor", { opacity: 1, duration: 0.2 }, t(137));
      cursorTo(168 + 6 * 16.8, 204 + 5 * 54 + 6, t(137), 0.35);
      out(["#c5b", "#hlB"], t(138), 0.15);
      type("#c5c", t(138), 41, 0.55);
      show("#hlO", t(138), 0.2);
      draw("r-aw4", t(143), 0.45);
      tl.to("#s-cursor", { opacity: 0, duration: 0.2 }, t(144));
      out("#zzz", t(145), 0.2);
      tl.set("#cook .shut", { opacity: 0 }, t(145) + 0.1);
      tl.set("#cook .eye", { opacity: 1 }, t(145) + 0.1);
      tl.to(["#pE", "#pV"], { opacity: 1, duration: 0.3 }, t(146));
      show(["#stE", "#stV"], t(147), 0.3);
      tl.to(["#bE", "#bV"], { x: 0, duration: 0.8, ease: "power3.inOut" }, t(146));
      doneTo(15, t(146) + 0.1, 0.8);
      bump("#cook", t(150), 1.1);
      pop("#pFix", t(145), { d: 0.35 });

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.15, ease: "power2.in" }, 60.0);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
  </script>
