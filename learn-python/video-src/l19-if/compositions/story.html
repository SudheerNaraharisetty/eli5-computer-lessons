      bump("#k-serve", t(18));

      /* ---- 2. Until now, Python ran every line, top to bottom. if lets it decide ---- */

      tl.fromTo("#s-code", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out", immediateRender: false }, t(19) + 0.2);

      draw("rail", t(23), 1.2);

      bump("#L1", t(23));
      bump("#L2", t(24));
      pop("#oA", t(24) + 0.1, { from: 0.8, d: 0.3 });
      bump("#L3", t(26));
      pop("#oB", t(26) + 0.1, { from: 0.8, d: 0.3 });
      out(["#rail", "#rail-h", "#oA", "#oB"], t(28), 0.3);
      tl.to("#L2", { x: 96, y: 64, duration: 0.5, ease: "power2.inOut" }, t(29));
      tl.to("#L3", { y: 64, duration: 0.5, ease: "power2.inOut" }, t(29));
      type("#Lif", t(30), 20, 0.6);
      pop("#n4", t(30), { from: 0.6, d: 0.3 });
      pop("#ben", t(34), { from: 0.7 });
      pop("#dia", t(36), { from: 0.5, ease: "back.out(2)" });

      /* ---- 3. Write if, then a question, then a colon. Pushed in by four spaces. Runs only when True ---- */
      draw("r-if", t(38), 0.4);
      draw("r-q", t(41), 0.5);
      draw("r-colon", t(44), 0.4);
      out(["#r-if", "#r-q", "#r-colon"], t(46) - 0.1, 0.25);
      bump("#L2", t(46));
      pop("#dots", t(53), { from: 0.4, ease: "back.out(2.2)" });
      show("#blk-off", t(56), 0.3);
      pop("#tag", t(58), { from: 0.5, ease: "back.out(2.2)" });
      bump("#tag", t(63));

      /* ---- 4. Ben's meal has 22 g. Is 22 under 30? True. The block lights up. Add a shake ---- */
      out("#dots", t(64), 0.25);
      bump("#ben", t(64));
      pop("#c22", t(67), { from: 0.5, ease: "back.out(2.2)" });
      draw("r-22", t(67) + 0.1, 0.4);
      out("#r-22", t(72) - 0.15, 0.2);
      swap("#dq0", "#dq1", t(72));
      show("#dia-t", t(77), 0.25);
      pop("#ansT", t(77), { from: 0.5, ease: "back.out(2.2)" });
      show("#blk-on", t(80), 0.3);
      bump("#blk-on", t(80) + 0.3);
      pop("#oA2", t(82), { from: 0.8, d: 0.3 });
      pop("#shake", t(84), { from: 0.4, ease: "back.out(2.2)" });
      pop("#oB2", t(85) + 0.2, { from: 0.8, d: 0.3 });

      /* ---- 5. Make it 35. Is 35 under 30? False. The block stays dark. Python jumps past it ---- */
      cursorTo(566, 212, t(86), [700, 600]);
      out(["#oA2", "#oB2"], t(89) - 0.2, 0.2);
      swap("#v22", "#v35", t(89));
      swap("#c22", "#c35", t(89) + 0.1);
      tl.to("#s-cursor", { opacity: 0, duration: 0.3 }, t(90));
      out(["#dia-t", "#ansT"], t(91) - 0.1, 0.2);
      swap("#dq1", "#dq2", t(91));

      pop("#ansF", t(96), { from: 0.5, ease: "back.out(2.2)" });
      shake("#ansF", t(96) + 0.4);
      out(["#blk-on", "#shake"], t(97) + 0.2, 0.4);
      out("#tag", t(100), 0.25);
      dim("#L2", t(100), 0.45);
      draw("jump", t(103), 0.55);
      show("#jump-h", t(103) + 0.5, 0.15);
      pop("#oB3", t(104) + 0.2, { from: 0.8, d: 0.3 });

      /* ---- 6. The last line is not pushed in, so it always runs ---- */
      out(["#jump", "#jump-h"], t(107) - 0.15, 0.2);
      draw("r-last", t(107), 0.5);
      pop("#always", t(115), { from: 0.5, ease: "back.out(2.2)" });
      bump("#oB3", t(115) + 0.2);

      type("#E1a", t(127) - 0.3, 25, 0.4);

      show("#colon", t(129) - 0.1, 0.2);
      tl.to("#L2", { x: 0, duration: 0.5, ease: "power2.inOut" }, t(131) - 0.2);
      tl.fromTo("#r-miss2", { opacity: 0, scale: 0.7, transformOrigin: "266px 340px" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, t(131) + 0.4);
      pop("#miss2", t(131) + 0.5, { from: 0.5, ease: "back.out(2.2)" });
      type("#E2a", t(135) - 0.3, 25, 0.4);
      type("#E2b", t(135), 74, 1.2);

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.2, ease: "power2.in" }, 58.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
