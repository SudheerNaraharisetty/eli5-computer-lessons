      const bump = (sel, at) => tl.fromTo(sel, { scale: 1 }, { scale: 1.06, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);

      const type = (sel, at, n, d) => tl.fromTo(sel, { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: d || 0.04 * n, ease: `steps(${n})`, immediateRender: false }, at);
      const hlTo = (line, at) => tl.to("#s-hl", { y: (line - 1) * 64, duration: 0.25, ease: "power2.inOut" }, at);
      const dip = (at) => tl.fromTo("#s-spoon", { y: 0, rotation: 0 }, { y: 64, rotation: -8, duration: 0.3, ease: "power2.in", yoyo: true, repeat: 1, immediateRender: false }, at);
      const light = (i, at) => {
        tl.to(`#bw${i} .b-lit`, { opacity: 1, duration: 0.3, ease: "power2.out" }, at);
        pop(`#ck${i}`, at + 0.05, { from: 0.4, ease: "back.out(2.2)" });
        bump(`#bw${i}`, at);
        const others = [0, 1, 2].filter((k) => k !== i).flatMap((k) => [`#bw${k}`, `#bl${k}`]);
        dim(others, at, 0.3);
      };
      const unlight = (i, at) => {
        tl.to(`#bw${i} .b-lit`, { opacity: 0, duration: 0.2, ease: "power2.in" }, at);
        out(`#ck${i}`, at, 0.2);
        dim(["#bw0", "#bw1", "#bw2", "#bl0", "#bl1", "#bl2"], at, 1);
      };
      const soupLines = ["#A1", "#A3", "#A4", "#A5", "#A6", "#A7", "#A8"];

      /* ---- 1. Taste the soup. Too salty: add water. Too bland: add salt. Neither: serve it ---- */
      dip(t(1));
      pop("#e1", t(4), { from: 0.8 }); bump("#bw0", t(5));
      pop("#e2", t(8), { from: 0.8 }); bump("#bw1", t(9));
      pop("#e3", t(12), { from: 0.8 }); bump("#bw2", t(16));

      /* ---- 2. In Python: if asks the first question, elif the next, else catches the rest ---- */
      out("#s-taste", t(21) - 0.2, 0.25);
      tl.fromTo("#s-code", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out", immediateRender: false }, t(21));
      pop("#s-salt", t(21) + 0.2, { from: 0.8 });
      type("#A1", t(21) + 0.3, 11, 0.4);
      type("#A3", t(23), 15, 0.4);
      type("#A4", t(24) + 0.1, 33, 0.6);
      bump("#bw0", t(24) + 0.4);
      type("#A5", t(28), 16, 0.4);
      draw("r-elif", t(28) + 0.15, 0.4);
      pop("#n-elif", t(31), { from: 0.6 });
      type("#A6", t(33), 32, 0.6);
      bump("#bw1", t(33) + 0.4);
      out("#r-elif", t(37) - 0.1, 0.2);
      type("#A7", t(38), 5, 0.25);
      draw("r-else", t(38) + 0.1, 0.4);
      type("#A8", t(39), 33, 0.6);
      bump("#bw2", t(40));
      pop("#n-else", t(45), { from: 0.6 });

      /* ---- 3. Checks from the top. The first True wins, its block runs, the rest are skipped ---- */
      out(["#r-else", "#n-else", "#n-elif"], t(48) - 0.2, 0.2);
      tl.set("#s-hl", { y: 128 }, 0);
      show("#s-hl", t(48), 0.25);
      tl.fromTo("#s-hl", { y: 0 }, { y: 128, duration: 0.5, ease: "power2.inOut", immediateRender: false }, t(48));
      pop("#t3", t(55), { from: 0.5, ease: "back.out(2.2)" });
      hlTo(4, t(58));
      show("#o1", t(59), 0.25);
      dim(["#A5", "#A6", "#A7", "#A8"], t(62), 0.5);
      pop("#n-skip", t(64), { from: 0.6 });
      // fourteen grams: too salty
      draw("r-14", t(65), 0.4);
      bump("#s-salt", t(65));
      dip(t(66));
      light(0, t(69));

      // three: too bland
      out(["#r-14", "#n-skip", "#t3", "#o1"], t(71) - 0.2, 0.15);
      dim(["#A5", "#A6", "#A7", "#A8"], t(71) - 0.2, 1);
      unlight(0, t(71) - 0.2);
      swap("#cv14", "#cv3", t(71));
      swap("#sv14", "#sv3", t(71));
      hlTo(3, t(71));
      dip(t(71));
      pop("#f3", t(71) + 0.15, { from: 0.6, d: 0.25 });
      hlTo(5, t(71) + 0.3);
      pop("#t5", t(71) + 0.45, { from: 0.6, d: 0.25 });
      hlTo(6, t(71) + 0.6);
      show("#o2", t(71) + 0.7, 0.2);
      light(1, t(71) + 0.7);

      // nine: neither, so else serves it
      out(["#t5", "#o2"], t(74) - 0.2, 0.15);
      unlight(1, t(74) - 0.2);
      swap("#cv3", "#cv9", t(74));
      swap("#sv3", "#sv9", t(74));
      hlTo(3, t(74));
      dip(t(74));
      hlTo(5, t(75));
      pop("#f5", t(75) + 0.2, { from: 0.6, d: 0.3 });
      hlTo(7, t(77));
      hlTo(8, t(78));
      show("#o3", t(78) + 0.1, 0.2);
      light(2, t(78));
      pop("#s-one", t(80), { from: 0.6 });
      bump("#bw2", t(83));

      /* ---- 4. Ben's protein: 20 or more is good, 40 or more is great. Ben eats 50 ---- */
      const soupWorld = ["#s-salt", "#s-pot", "#s-spoon", "#s-counter", "#bw0", "#bw1", "#bw2", "#bl0", "#bl1", "#bl2", "#ck2", "#s-one"];
      out(soupWorld, t(85) - 0.3, 0.3);
      out([...soupLines, "#f3", "#f5", "#o3", "#s-hl"], t(85) - 0.3, 0.25);
      swap("#fn1", "#fn2", t(85));
      pop("#s-ben", t(86), { from: 0.8 });
      show(".s-sc", t(86) + 0.2, 0.3);
      show("#s-scale", t(86) + 0.2, 0.3);
      type("#B1", t(86) + 0.2, 14, 0.4);
      type("#B3", t(88), 19, 0.45);
      type("#B4", t(88) + 0.5, 17, 0.4);
      pop("#netA", t(92), { from: 0.7 });
      type("#B5", t(94), 21, 0.45);
      type("#B6", t(94) + 0.5, 18, 0.4);
      pop("#netB", t(98), { from: 0.7 });
      type("#B7", t(98) + 0.3, 5, 0.2);
      type("#B8", t(98) + 0.5, 22, 0.45);
      pop("#benv", t(101), { from: 0.6 });
      pop("#s-dot", t(101), { from: 0.4, ease: "back.out(2.2)" });
      // the first check is already True
      tl.set("#s-hl", { y: 128 }, t(102));
      show("#s-hl", t(104), 0.2);
      draw("r-c20", t(106), 0.45);
      pop("#t3", t(111), { from: 0.5, ease: "back.out(2.2)" });
      // the wide net catches him first
      tl.to("#s-dot", { y: 72, duration: 0.45, ease: "bounce.out" }, t(113));
      bump("#netA", t(115));
      show("#o4", t(115), 0.25);
      out("#r-c20", t(117), 0.2);
      // great never gets a chance
      dim(["#B5", "#B6", "#B7", "#B8"], t(118), 0.5);
      show("#s-miss", t(119), 0.25);
      dim("#netB", t(119), 0.45);
      show("#s-netmiss", t(119), 0.25);
      pop("#s-never", t(120), { from: 0.6 });

      /* ---- 5. The fix is the order: the narrow check first. 40, then 20, then else ---- */
      out(["#s-miss", "#s-netmiss", "#s-never", "#t3", "#o4", "#s-hl"], t(124) - 0.1, 0.2);
      dim(["#B5", "#B6", "#B7", "#B8", "#netB"], t(124), 1);
      tl.to("#s-dot", { y: 0, duration: 0.4, ease: "power2.inOut" }, t(124));
      tl.fromTo("#s-cursor", { opacity: 0, x: 760, y: 1000 }, { opacity: 1, x: 532, y: 350, duration: 0.5, ease: "power3.out", immediateRender: false }, t(125));
      // swap the two checks
      swap("#B3", "#F3", t(131));
      swap("#B4", "#F4", t(131) + 0.05);
      swap("#B5", "#F5", t(131) + 0.1);
      swap("#B6", "#F6", t(131) + 0.15);
      tl.to("#netB", { y: -180, duration: 0.5, ease: "power2.inOut" }, t(131));
      tl.to("#netA", { y: 180, duration: 0.5, ease: "power2.inOut" }, t(131));
      tl.to("#s-cursor", { opacity: 0, duration: 0.3 }, t(133));
      // forty, then twenty, then else
      tl.set("#s-hl", { y: 128 }, t(134) - 0.1);
      show("#s-hl", t(134), 0.2);
      draw("r-40", t(134), 0.35);
      tl.to("#s-dot", { y: 72, duration: 0.45, ease: "bounce.out" }, t(134) + 0.2);
      bump("#netB", t(134) + 0.5);
      show("#o5", t(134) + 0.5, 0.2);
      hlTo(5, t(136));
      hlTo(7, t(138));

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.25, ease: "power2.in" }, 57.85);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
  </script>
</template>
