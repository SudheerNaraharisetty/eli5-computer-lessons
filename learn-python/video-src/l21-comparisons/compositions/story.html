      const arc = (d0, d1, r) => { const p0 = pt(d0, r), p1 = pt(d1, r); return `M${p0[0].toFixed(1)} ${p0[1].toFixed(1)} A${r} ${r} 0 ${d1 - d0 > 180 ? 1 : 0} 1 ${p1[0].toFixed(1)} ${p1[1].toFixed(1)}`; };

        const p = pt(deg, r), el = document.createElementNS(NS, "text");

      band.setAttribute("d", arc(hrDeg(114), hrDeg(133), R + 22));

      for (let v = 60; v <= 200; v += 20) tick(g2, hrDeg(v), 26, 5);

      label(document.getElementById("g2-l114"), hrDeg(114) - 7, R + 72, "114", "#1f7a5c", 32);
      label(document.getElementById("g2-l133"), hrDeg(133) + 7, R + 72, "133", "#1f7a5c", 32);
      const bl = band.getTotalLength(); band.style.strokeDasharray = bl; band.style.strokeDashoffset = bl;

      /* ---- rings (page pixels) ---- */
      // Code: 40px mono, 24px per char, text from x=136; line i centre y = 212 + 64*i.

        const L = p.getTotalLength(); p.dataset.len = L;
