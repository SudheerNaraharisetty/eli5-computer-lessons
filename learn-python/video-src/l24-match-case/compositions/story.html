      // Word start times from the narration (seconds). The voice starts 0.6 s into the film.
      const W = [0.0, 0.499, 0.848, 1.115, 1.219, 1.637, 2.357, 2.647, 2.868, 2.995, 3.796, 4.087, 4.261, 4.923, 5.248, 5.422, 6.107, 6.316, 6.502, 6.803, 7.79, 7.941, 8.22, 8.591, 8.835, 9.195, 9.555, 9.694, 10.751, 10.983, 11.622, 11.877, 12.156, 12.55, 12.841, 13.874, 14.234, 14.396, 14.872, 15.221, 15.488, 15.917, 16.289, 17.206, 17.74, 18.088, 18.274, 18.401, 19.121, 19.307, 19.435, 19.76, 20.027, 20.224, 20.677, 21.884, 22.256, 22.628, 23.034, 23.719, 23.893, 24.218, 24.764, 25.24, 25.948, 26.238, 26.61, 26.795, 27.132, 27.446, 28.165, 28.549, 28.827, 29.28, 29.64, 29.849, 29.953, 30.557, 30.987, 31.242, 31.381, 32.438, 32.6, 32.926, 33.146, 33.227, 34.04, 34.435, 34.992, 35.317, 35.747, 35.932, 36.106, 36.315, 37.267, 37.511, 37.825, 38.219, 38.359, 38.904, 39.752, 40.205, 40.518, 40.832, 41.099, 41.726, 41.946, 42.155, 42.318, 42.434, 42.678, 43.583, 43.943, 44.477, 44.814, 45.267, 46.219, 46.764, 47.171, 47.368, 47.484, 47.6, 48.343, 48.68, 48.866, 49.516, 49.678, 49.783, 50.154, 50.549, 51.513, 52.964, 53.278, 54.334, 54.497, 54.88, 55.518, 55.855, 56.227, 56.842, 57.295, 57.945, 58.293, 58.572, 58.653, 59.942, 60.151, 60.638, 61.091, 61.823, 62.159, 62.705, 63.181, 64.121, 64.423, 65.143, 65.549, 66.095, 67.21, 67.593, 67.941, 68.115, 68.487, 68.812, 69.032];
      const t = (i) => W[i] + 0.6;
      const tl = gsap.timeline({ paused: true });

      // Rings in page pixels. Code text starts at x 136, 22.8 px per char. Row r centre y = 214 + (r - 1) * 60.
      const ring = (id, cx, cy, rx, ry) => {
        const d = `M${cx - rx + 6} ${cy + 4} C${cx - rx + 2} ${cy - ry} ${cx + rx} ${cy - ry - 3} ${cx + rx} ${cy} C${cx + rx} ${cy + ry} ${cx - rx - 3} ${cy + ry + 3} ${cx - rx} ${cy - 8}`;
        const p = document.getElementById(id); p.setAttribute("d", d);
        const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; p.dataset.len = L;
      };
      ring("r-code", 1492, 230, 70, 60);      // the letter on the ticket
      ring("r-match", 193, 214, 76, 36);      // match, row 1, cols 0-4
      ring("r-case", 273, 274, 62, 34);       // case, row 2, cols 4-7
      ring("r-c", 330, 394, 124, 36);         // case "C":, row 4
      ring("r-bar", 444, 514, 30, 34);        // the bar, row 6, col 13
      ring("r-guard", 581, 274, 172, 36);     // if guests > 6, row 2, cols 13-25
      ring("r-wild", 353, 754, 30, 34);       // _, row 10, col 9
      ring("r-pasta", 398, 394, 82, 36);      // pasta, row 4, cols 9-13
      ring("r-trap", 1310, 492, 186, 124);    // the trap door

      const pop = (sel, at, o) => { o = o || {}; tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.45, ease: o.ease || "back.out(1.6)", immediateRender: false }, at); };
      const show = (sel, at, d) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d || 0.3, ease: "power2.out", immediateRender: false }, at);
      const out = (sel, at, d) => tl.to(sel, { opacity: 0, duration: d || 0.25, ease: "power2.in" }, at);
      const dim = (sel, at, v) => tl.to(sel, { opacity: v, duration: 0.3, ease: "power2.out" }, at);
      const draw = (id, at, d) => {
        const p = document.getElementById(id);
        tl.set(p, { opacity: 1 }, at);
        tl.fromTo(p, { strokeDashoffset: +p.dataset.len }, { strokeDashoffset: 0, duration: d || 0.5, ease: "power2.out", immediateRender: false }, at);
      };
      const bump = (sel, at) => tl.fromTo(sel, { scale: 1 }, { scale: 1.06, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);

      const hlTo = (row, at) => tl.to("#s-hl", { y: (row - 1) * 60, duration: 0.25, ease: "power2.inOut" }, at);
      // A ticket slides in along the rail from the right.
      const slide = (sel, at) => tl.fromTo(sel, { opacity: 1, x: 520 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, at);
      // Door centres, and the ticket's left edge, to fly a ticket into its station.
      const DOOR = { P: [1310, 490], C: [1674, 490], R: [1310, 730], W: [1674, 730] };
      const fly = (sel, left, door, at) => {
        const [dx, dy] = DOOR[door];
        tl.to(sel, { x: dx - (left + 100), y: dy - 215, scale: 0.35, duration: 0.5, ease: "power2.in" }, at);
        tl.to(sel, { opacity: 0, duration: 0.15 }, at + 0.4);
      };
      const light = (door, at) => {
        tl.fromTo(`#d${door} .lit`, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, at);
        bump(`#d${door}`, at);
      };
      const unlight = (door, at) => tl.to(`#d${door} .lit`, { opacity: 0, duration: 0.3 }, at);

      /* ---- 1. Tickets slide through the pass. P pasta, C chili, R rice pudding. Pick the station ---- */
      slide("#tkA", t(0));
      show("#s-order", t(6), 0.3);
      draw("r-code", t(9), 0.4);
      light("P", t(10));
      out("#r-code", t(12) - 0.1, 0.15);
      fly("#tkA", 1392, "P", t(12));
      unlight("P", t(13));
      slide("#tkB", t(13) - 0.1);
      light("C", t(15));
      fly("#tkB", 1392, "C", t(15) + 0.2);
      unlight("C", t(16));
      slide("#tkC", t(16) - 0.1);
      light("R", t(18));
      fly("#tkC", 1392, "R", t(19));
      unlight("R", t(20));
      bump("#dP", t(25)); bump("#dC", t(25) + 0.1); bump("#dR", t(25) + 0.2); bump("#dW", t(25) + 0.3);

      /* ---- 2. match and case. Match the order, one case per code. From the top, first fit wins ---- */
