      const W = [0.0, 0.209, 0.569, 0.94, 1.068, 1.242, 2.194, 2.577, 2.926, 3.471, 3.657, 4.377, 4.621, 4.772, 5.062, 5.677, 6.629, 7.082, 7.988, 8.22, 8.8, 9.033, 9.16, 9.265, 9.636, 10.356, 10.646, 11.041, 11.157, 11.366, 11.575, 12.179, 12.399, 12.527, 12.934, 13.27, 13.479, 13.851, 14.454, 14.605, 15.047, 15.197, 15.627, 15.778, 15.906, 16.219, 16.439, 16.892, 17.775, 18.111, 18.46, 18.727, 18.889, 19.713, 20.155, 20.549, 20.677, 21.199, 21.664, 21.792, 22.535, 22.686, 23.162, 23.603, 24.172, 24.415, 24.81, 25.135, 25.634, 25.936, 26.273, 26.401, 26.784, 26.958, 27.991, 28.328, 28.711, 29.152, 29.559, 30.58, 30.987, 31.184, 31.416, 31.672, 31.915, 32.647, 32.867, 33.018, 33.402, 34.713, 35.119, 35.514, 35.944, 36.327, 36.42, 36.942, 37.209, 38.115, 39.02, 39.845, 41.4, 41.83, 42.236, 42.654, 42.817, 43.258, 43.467, 43.815, 43.978, 44.616, 44.825, 44.965, 45.371, 46.648, 46.938, 47.333, 47.472, 47.879, 48.529, 48.958, 49.365, 49.597, 50.282, 50.479, 50.595, 51.072, 51.467, 52.14, 52.349, 52.477, 53.011, 53.835, 54.903, 55.24, 56.25, 56.494, 56.923, 57.341, 57.69, 58.305, 58.955, 59.176, 59.303, 59.559, 59.919, 60.116, 60.244, 60.673, 60.94, 61.858, 62.217, 62.589, 62.96, 63.367, 63.796, 64.69, 64.853, 65.201, 65.503, 66.026, 66.327, 66.49, 67.082, 67.86];
      const t = (i) => W[i] + 0.6;
      const tl = gsap.timeline({ paused: true });

      /* ---- rings (page pixels) ---- */
      // Code: 40px mono, 24px per char, text from x=136; line i centre y = 212 + 64*i.
      const ring = (id, cx, cy, rx, ry, dashed) => {
        const d = `M${cx - rx + 6} ${cy + 4} C${cx - rx + 2} ${cy - ry} ${cx + rx} ${cy - ry - 3} ${cx + rx} ${cy} C${cx + rx} ${cy + ry} ${cx - rx - 3} ${cy + ry + 3} ${cx - rx} ${cy - 8}`;
        const p = document.getElementById(id); p.setAttribute("d", d);
        if (dashed) { p.style.strokeDasharray = "16 12"; return; }
        const L = p.getTotalLength(); p.dataset.len = L;
        p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
      };
      ring("r-cond", 388, 276, 124, 38);      // stirs < 5 on line 2, cols 6-14
      ring("r-zero", 340, 212, 30, 34);       // 0 on line 1, col 8
      ring("r-inc", 352, 340, 138, 38);       // stirs += 1 on line 3, cols 4-13
      ring("r-miss", 352, 340, 138, 38, true); // the gap where stirs += 1 was
      ring("r-twelve", 496, 468, 40, 36);     // 12 on line 5 of boil.py, cols 14-15
      ring("r-twenty", 376, 212, 40, 36);     // 20 on line 1 of boil.py, cols 9-10
      ring("r-pot0", 1519, 658, 86, 86);      // the stirs counter in the pot
      ring("r-stop", 236, 926, 124, 46);      // the Stop button

      const pop = (sel, at, o) => { o = o || {}; tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.45, ease: o.ease || "back.out(1.6)", immediateRender: false }, at); };
      const show = (sel, at, d) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d || 0.3, ease: "power2.out", immediateRender: false }, at);
      const out = (sel, at, d) => tl.to(sel, { opacity: 0, duration: d || 0.25, ease: "power2.in" }, at);
      const draw = (id, at, d) => {
        const p = document.getElementById(id);
        tl.set(p, { opacity: 1 }, at);
        tl.fromTo(p, { strokeDashoffset: +p.dataset.len }, { strokeDashoffset: 0, duration: d || 0.5, ease: "power2.out", immediateRender: false }, at);
      };
      const bump = (sel, at) => tl.fromTo(sel, { scale: 1 }, { scale: 1.06, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);
      const swap = (from, to, at) => { out(from, at - 0.1, 0.1); pop(to, at, { from: 0.7, d: 0.3 }); };
      const type = (sel, at, n) => tl.fromTo(sel, { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.035 * n, ease: `steps(${n})`, immediateRender: false }, at);
      // The spoon turns about the pot's centre. Keep the angle in a variable so every tween is absolute.
      let rot = 0;
      const stir = (at, turns, d) => {
        tl.fromTo("#spoon", { rotation: rot, svgOrigin: "200 200" }, { rotation: rot + 360 * turns, svgOrigin: "200 200", duration: d, ease: turns > 1 ? "none" : "power1.inOut", immediateRender: false }, at);
        rot += 360 * turns;
      };
      const gateClose = (bar, red, at) => {
        tl.fromTo(bar, { scaleX: 0.1, svgOrigin: "148 24" }, { scaleX: 1, svgOrigin: "148 24", duration: 0.35, ease: "bounce.out", immediateRender: false }, at);
        tl.set(red, { opacity: 1 }, at + 0.3);
        tl.set(bar, { opacity: 0 }, at + 0.3);
      };
      const cursorTo = (x, y, at) => tl.fromTo("#s-cursor", { opacity: 0, x: x + 420, y: y + 260 }, { opacity: 1, x, y, duration: 0.55, ease: "power3.out", immediateRender: false }, at);
      const cursorAway = (at) => tl.to("#s-cursor", { opacity: 0, x: "+=380", y: "+=240", duration: 0.4, ease: "power2.in" }, at);

      // initial state of the bars (open, green)
      gsap.set(["#bar1", "#bar2"], { scaleX: 0.1, svgOrigin: "148 24" });
      gsap.set("#n0", { opacity: 1 });

      /* ---- 1. A sauce on the stove. Before every stir, check: thick yet? ---- */
      bump("#s-pot", t(1));
      pop("#g1", t(6) - 0.05, { from: 0.6 });
      bump("#g1", t(10));
      bump("#cq1", t(13));
      pop("#ch-no", t(15), { from: 0.6 });
      stir(t(16), 1, 0.45);
      stir(t(17), 1, 0.45);

      /* ---- 2. while stirs < 5: the question is asked at the top of every round ---- */
      tl.fromTo("#s-code", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.55, ease: "expo.out", immediateRender: false }, t(18) - 0.1);
      type("#L1", t(23), 16);
      swap("#cq1", "#cq2", t(26));
      out("#ch-no", t(26) - 0.1, 0.15);
      draw("r-cond", t(26) + 0.1, 0.45);
      show("#L2", t(31), 0.3);
      show("#L3", t(31) + 0.25, 0.3);
      bump(["#L2", "#L3"], t(34));
      out("#r-cond", t(38), 0.2);
      draw("lp", t(41), 0.6);
      tl.set("#lph", { opacity: 1 }, t(41) + 0.55);
      bump("#L1", t(44));
      bump("#g1", t(44));

      /* ---- 3. Three parts: set, check, change. Then 5 rounds and the loop stops ---- */
      out(["#lp", "#lph"], t(48) - 0.1, 0.2);
      type("#L0", t(53), 9);
      pop("#bd1", t(53) + 0.2, { from: 0.6 });
      draw("r-zero", t(56), 0.4);
      bump("#s-count", t(56));
      out("#r-zero", t(60) - 0.2, 0.15);
      pop("#bd2", t(61), { from: 0.6 });
      bump("#L1", t(61));
      cursorTo(330, 330, t(64) - 0.3);
      draw("r-inc", t(65), 0.45);
      pop("#bd3", t(66), { from: 0.6 });
      cursorAway(t(69));
      out("#r-inc", t(72) - 0.3, 0.2);
      show("#o1area", t(72) - 0.2, 0.3);
      pop("#ch-t", t(74) - 0.25, { from: 0.6 });
      for (let k = 1; k <= 5; k++) {
        const at = t(73 + k);
        stir(at, 1, 0.32);
        swap(`#n${k - 1}`, `#n${k}`, at + 0.05);
        pop(`#o${k}`, at + 0.05, { from: 0.8, d: 0.25 });
        bump("#g1", at);
      }
      bump("#s-count", t(79));
      swap("#ch-t", "#ch-f", t(81));
      gateClose("#bar1", "#bar1r", t(85));
      pop("#p-thick", t(87), { from: 0.6 });

      /* ---- 4. Boiling water: 12 degrees a minute from 20, until it passes 100 ---- */
      out(["#sc1", "#c1", "#f1"], t(89) - 0.35, 0.3);
      show(["#sc2", "#c2", "#f2"], t(89) - 0.05);
      tl.set("#fill", { scaleY: 20 / 120, svgOrigin: "70 460" }, 0);
      draw("r-twelve", t(91), 0.4);
      out("#r-twelve", t(95) - 0.1, 0.15);
      draw("r-twenty", t(96), 0.4);
      out("#r-twenty", t(97) + 0.3, 0.15);
      pop("#ch2-t", t(97) - 0.1, { from: 0.6 });
      const heat = [t(97), t(98), t(99), t(99) + 0.5, t(99) + 0.95, t(100) - 0.25, t(101)];
      heat.forEach((at, i) => {
        const k = i + 1, temp = 20 + 12 * k;
        swap(`#mn${k - 1}`, `#mn${k}`, at);
        bump("#g2", at);
        if (k < 7) swap(`#tp${k - 1}`, `#tp${k}`, at);
        if (k < 7) tl.fromTo("#fill", { scaleY: (temp - 12) / 120, svgOrigin: "70 460" }, { scaleY: temp / 120, svgOrigin: "70 460", duration: 0.3, ease: "power2.out", immediateRender: false }, at);
      });
      swap("#tp6", "#tp7", t(105));
      tl.fromTo("#fill", { scaleY: 92 / 120, svgOrigin: "70 460" }, { scaleY: 104 / 120, svgOrigin: "70 460", duration: 0.5, ease: "power2.out", immediateRender: false }, t(105));
      bump("#s-mark", t(105) + 0.3);
      swap("#ch2-t", "#ch2-f", t(111));
      gateClose("#bar2", "#bar2r", t(111));
      pop("#o2out", t(112), { from: 0.7, d: 0.3 });

      /* ---- 5. Forget the change line: the spoon spins forever. Press Stop. Ctrl+C ---- */
      out(["#sc2", "#c2", "#f2"], t(113) - 0.35, 0.3);
      // reset the sauce scene: counter back to 0, gate open, outputs cleared
      tl.set(["#n5", "#p-thick", "#ch-f", "#bar1r", "#bd1", "#bd2", "#bd3", "#o1", "#o2", "#o3", "#o4", "#o5"], { opacity: 0 }, t(113) - 0.1);
      tl.set("#n0", { opacity: 1 }, t(113) - 0.1);
      tl.set("#bar1", { opacity: 1, scaleX: 0.1, svgOrigin: "148 24" }, t(113) - 0.1);
      show(["#sc1", "#c1", "#f1"], t(113) - 0.05);
      out("#L2", t(114), 0.35);
      show("#r-miss", t(116), 0.25);
      pop("#s-miss", t(116) + 0.1, { from: 0.6 });
      draw("r-pot0", t(118), 0.45);
      bump("#s-count", t(121));
      out("#r-pot0", t(123), 0.2);
      pop("#ch-t", t(124), { from: 0.6 });
      bump("#g1", t(126));
      // the program runs: Stop shows, output streams, the spoon spins until Stop
      const runFrom = t(127), stopAt = t(133) + 0.15;
      pop("#s-stop", runFrom - 0.2, { from: 0.7, d: 0.3 });
      show("#s-streamin", runFrom, 0.15);
      tl.fromTo("#s-streamin", { y: 0 }, { y: -2440, duration: stopAt - runFrom, ease: "none", immediateRender: false }, runFrom);
      stir(runFrom, Math.round((stopAt - runFrom) / 0.42), stopAt - runFrom);
      cursorTo(220, 900, t(132) - 0.35);
      draw("r-stop", t(133) - 0.05, 0.4);
      bump("#s-stop", t(133) - 0.05);
      swap("#s-stop", "#s-run", stopAt + 0.1);
      pop("#s-stopped", stopAt + 0.15, { from: 0.8, d: 0.3 });
      cursorAway(t(134));
      out("#r-stop", t(135), 0.2);
      show("#s-keys", t(135), 0.25);
      pop("#k-ctrl", t(138) - 0.05, { from: 0.5 });
      show("#k-plus", t(138) + 0.2, 0.2);
      pop("#k-c", t(139) - 0.05, { from: 0.5 });
      bump(["#k-ctrl", "#k-c"], t(139) + 0.35);

      swap("#ch-t", "#ch-f", 61.5);
      gateClose("#bar1", "#bar1r", 61.5);
