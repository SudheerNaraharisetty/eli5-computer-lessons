        tl.to("#spoon", { x: 0, y: 0, duration: 0.4, ease: "power2.inOut" }, at + 0.9);

      // A meal card drops into the jar; the jar fills and its label shows the new total.

      tl.fromTo("#s-cursor", { opacity: 0, x: 760, y: 700 }, { opacity: 1, x: 140, y: 290, duration: 0.45, ease: "power3.out", immediateRender: false }, t(31) - 0.3);
