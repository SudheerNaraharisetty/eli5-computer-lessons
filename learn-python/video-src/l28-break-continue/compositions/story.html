      const pop = (sel, at, o) => { o = o || {}; tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.45, ease: o.ease || "back.out(1.6)", immediateRender: false }, at); };
      const show = (sel, at, d) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d || 0.3, ease: "power2.out", immediateRender: false }, at);
      const out = (sel, at, d) => tl.to(sel, { opacity: 0, duration: d || 0.25, ease: "power2.in" }, at);
      const draw = (id, at, d) => {
        const p = document.getElementById(id);
        tl.set(p, { opacity: 1 }, at);
        tl.fromTo(p, { strokeDashoffset: +p.dataset.len }, { strokeDashoffset: 0, duration: d || 0.5, ease: "power2.out", immediateRender: false }, at);
      };
      const bump = (sel, at) => tl.fromTo(sel, { scale: 1 }, { scale: 1.1, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);
      const type = (sel, at, n, d) => tl.fromTo(sel, { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: d || 0.03 * n, ease: `steps(${n})`, immediateRender: false }, at);
      const tick = (prev, next, at) => {
        if (prev) tl.set(prev, { opacity: 0 }, at);
        tl.set(next, { opacity: 1 }, at);
        tl.fromTo(next, { scale: 1.25 }, { scale: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, at);
      };
      const flash = (at, color) => {
        tl.fromTo("#conep", { opacity: 0.3 }, { opacity: 0.85, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);
      };

      // Cookie moves: x is the GSAP offset from each cookie's start, kept here in step with the timeline.
      const SLOT = [1176, 1232, 1288];   // page x of the mini cookies on the plate
      const pos = {};
      const xAt = (id) => pos[id] || 0;
      const slide = (ids, at, d) => ids.forEach((id) => {
        const from = xAt(id), to = from + 104; pos[id] = to;
        tl.fromTo(`#${id}`, { x: from }, { x: to, duration: d || 0.3, ease: "power2.inOut", immediateRender: false }, at);
      });
      const toPlate = (id, i, slot, at) => {
        const dx = SLOT[slot] - (LAMP - 104 * i);
        tl.fromTo(`#${id}`, { x: xAt(id), y: 0, scale: 1 }, { x: dx, y: 300, scale: 0.55, duration: 0.35, ease: "power2.in", immediateRender: false }, at);
        tl.to(`#${id}t`, { opacity: 0, duration: 0.1 }, at + 0.05);
      };
      const toBin = (id, i, at) => {
        const dx = 1600 - (LAMP - 104 * i);
        tl.fromTo(`#${id}`, { x: xAt(id), y: 0, rotation: 0, scale: 1 }, { x: dx, y: 300, rotation: 200, scale: 0.7, duration: 0.5, ease: "power2.inOut", immediateRender: false }, at);
      };
      const LAMP = 1700;
      const judgeOk = (id, i, slot, at, prev, next, rest) => {
        flash(at);
        pop(`#${id}t`, at, { from: 0.3, d: 0.2 });
        toPlate(id, i, slot, at + 0.15);
        tick(prev, next, at + 0.45);
        if (rest.length) slide(rest, at + 0.15);
      };

      /* ---- 1. Your cookies are out of the oven. Check the tray one at a time ---- */
      tl.set("#pc0", { opacity: 1 }, 0);
      for (let i = 0; i < 6; i++) tl.fromTo(`#k${i}`, { opacity: 0, x: -360 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, t(3) + (5 - i) * 0.06);
      bump("#h-tray", t(10));
      flash(t(11));

      /* ---- 2. Good. Good. Burnt? Skip it. In Python, that is continue ---- */
      judgeOk("k0", 0, 0, t(16), "#pc0", "#pc1", ["k1", "k2", "k3", "k4", "k5"]);
      judgeOk("k1", 1, 1, t(17), "#pc1", "#pc2", ["k2", "k3", "k4", "k5"]);
      flash(t(18));
      bump("#k2", t(18));
      draw("a-skip", t(19), 0.4);
      tl.set("#h-skip", { opacity: 1 }, t(19) + 0.35);
      toBin("k2", 2, t(19));
      slide(["k3", "k4", "k5"], t(19) + 0.5);
      tl.fromTo("#s-code", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out", immediateRender: false }, t(26) - 0.2);
      type("#L0", t(26) + 0.2, 8, 0.25);
      type("#L1", t(27), 19, 0.4);
      type("#L2", t(28), 25, 0.45);
      type("#L3", t(30), 16, 0.3);
      pop("#pcont", t(30), { from: 0.6 });
      out(["#a-skip", "#h-skip"], t(31), 0.2);
      draw("a-cont", t(32), 0.5);
      tl.set("#h-cont", { opacity: 1 }, t(32) + 0.45);
      judgeOk("k3", 3, 2, t(41), "#pc2", "#pc3", ["k4", "k5"]);

      /* ---- 3. Smoke alarm. Stop everything. That is break ---- */
      out(["#a-cont", "#h-cont"], t(43), 0.2);
      for (let k = 0; k < 3; k++) pop(`#k4p${k}`, t(45) + k * 0.12, { from: 0.3, d: 0.35 });
      tl.to("#alarm", { backgroundColor: "#b8235a", duration: 0.1 }, t(46));
      tl.fromTo("#alarm", { rotation: -12 }, { rotation: 12, duration: 0.09, ease: "none", yoyo: true, repeat: 9, immediateRender: false }, t(46));
      tl.set("#alarm", { rotation: 0 }, t(46) + 0.95);
      tl.to("#conep", { fill: "#b8235a", duration: 0.2 }, t(46));
      tl.fromTo("#stopst", { opacity: 0, scale: 1.6, rotation: -8 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.4, ease: "back.out(2)", immediateRender: false }, t(49));
      type("#L4", t(53), 25, 0.4);
      type("#L5", t(55), 13, 0.25);
      pop("#pbrk", t(55), { from: 0.6 });
      type("#L9", t(57), 11, 0.25);
      draw("a-brk", t(57), 0.5);
      tl.set("#h-brk", { opacity: 1 }, t(57) + 0.45);
      tl.to("#k5", { opacity: 0.35, duration: 0.3 }, t(63));
      show("#never", t(67), 0.3);

      /* ---- 4. Here is the code: burnt continue, smoke break, count it. 3 ---- */
      out(["#a-brk", "#h-brk"], t(69), 0.2);
      draw("r-burnt", t(77), 0.35);
      draw("r-cont", t(78), 0.35);
      out(["#r-burnt", "#r-cont"], t(79) - 0.1, 0.2);
      draw("r-smoke", t(82), 0.35);
      draw("r-brk", t(83), 0.35);
      out(["#r-smoke", "#r-brk"], t(84) - 0.1, 0.2);
      type("#L6", t(85), 13, 0.3);
      draw("r-plate", t(86), 0.4);
      show("#O1", t(87), 0.2);
      bump("#pc3", t(87));
      out("#r-plate", t(92), 0.2);

      /* ---- 5. A loop can have an else. It runs only without a break. A clean tray rings the bell ---- */
      const B5 = t(99);
      out(["#O1", "#k4", "#k5", "#never", "#stopst", "#k0", "#k1", "#k2", "#k3", "#pcont", "#pbrk"], t(93), 0.3);
      tl.to("#alarm", { backgroundColor: "#ffffff", duration: 0.3 }, t(93));
      tl.to("#conep", { fill: "#ffc24b", duration: 0.3 }, t(93));
      tl.set("#pc3", { opacity: 0 }, t(93) + 0.3);
      tl.set("#pc0", { opacity: 1 }, t(93) + 0.3);
      tl.fromTo("#L9", { y: 0 }, { y: 120, duration: 0.35, ease: "power2.inOut", immediateRender: false }, B5 - 0.2);
      type("#L7", B5 + 0.15, 5, 0.15);
      type("#L8", B5 + 0.35, 21, 0.35);
      ["n0", "n1", "n2"].forEach((id, i) => tl.fromTo(`#${id}`, { opacity: 0, x: -420 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, t(100) - 0.1 + i * 0.05));
      const c0 = t(101) + 0.3;
      judgeOk("n0", 0, 0, c0, "#pc0", "#pc1", ["n1", "n2"]);
      flash(c0 + 0.75);
      toBin("n1", 1, c0 + 0.8);
      slide(["n2"], c0 + 1.2);
      judgeOk("n2", 2, 1, c0 + 1.6, "#pc1", "#pc2", []);
      draw("r-else", t(107), 0.35);
      pop("#pelse", t(107), { from: 0.6 });
      pop("#bell", t(110), { from: 0.4 });
      tl.fromTo("#bell", { rotation: -16 }, { rotation: 16, duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 7, immediateRender: false }, t(115));
      tl.set("#bell", { rotation: 0 }, t(115) + 0.97);
      pop("#pbell", t(115), { from: 0.6 });
      show("#O2", t(115), 0.15);
      show("#O3", t(115) + 0.2, 0.15);

      /* ---- 6. One trap: continue in a while loop. day stays 3, the loop never ends ---- */
      const B6 = t(118) - 0.4;
      out(["#h-tray", "#alarm", "#belt", "#rail", "#cone", "#shade", "#plate", "#bin", "#n0", "#n1", "#n2", "#bell", "#pbell", "#pelse", "#r-else",
           "#L0", "#L1", "#L2", "#L3", "#L4", "#L5", "#L6", "#L7", "#L8", "#L9", "#O2", "#O3", "#ttray"], B6, 0.3);
      show("#tben", B6 + 0.3, 0.2);
      pop("#h-ben", t(118), { from: 0.8 });
      pop("#dc", t(119), { from: 0.7 });
      type("#B0", t(118), 7, 0.2);
      tick(null, "#dd1", t(118) + 0.3);
      type("#B1", t(122), 15, 0.3);
      type("#B2", t(123), 16, 0.3);
      type("#B3", t(124), 16, 0.3);
      type("#B4", t(124) + 0.35, 12, 0.25);
      tick("#dd1", "#dd2", t(125));
      tick("#dd2", "#dd3", t(127));
      draw("a-back", t(129), 0.45);
      tl.set("#h-back", { opacity: 1 }, t(129) + 0.4);
      pop("#spin", t(130), { from: 0.5 });
      tl.fromTo("#spin", { rotation: 0 }, { rotation: 360 * 9, duration: t(149) - t(130), ease: "none", immediateRender: false }, t(130));
      draw("r-day", t(135), 0.4);
      draw("r-d3", t(143), 0.4);
      pop("#pnever", t(147), { from: 0.6 });
      out(["#r-day"], t(146), 0.2);

      /* ---- 7. Change it before you continue ---- */
      tl.fromTo("#s-cursor", { opacity: 0, x: 900, y: 700 }, { opacity: 1, x: 310, y: 380, duration: 0.45, ease: "power3.out", immediateRender: false }, t(148));
      tl.fromTo(["#B3", "#B4"], { y: 0 }, { y: 60, duration: 0.3, ease: "power2.inOut", immediateRender: false }, t(149));
      out(["#a-back", "#h-back", "#r-d3"], t(149), 0.2);
      show("#newln", t(149) + 0.25, 0.2);
      type("#Bn", t(149) + 0.3, 16, 0.3);
      pop("#pfix", t(150), { from: 0.6 });
      tl.to("#s-cursor", { opacity: 0, duration: 0.2 }, t(151));
      out(["#spin", "#pnever"], t(149) + 0.5, 0.25);
      [4, 5, 6, 7, 8].forEach((d, k) => tick(`#dd${d - 1}`, `#dd${d}`, t(149) + 0.6 + k * 0.22));
      pop("#pend", t(151) + 0.1, { from: 0.6 });

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.25, ease: "power2.in" }, 57.9 - 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
  </script>
</template>
