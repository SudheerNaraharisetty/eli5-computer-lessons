      // Rings in page pixels. Code text at x 136, 20.4 px per char. Row r centre y = 212 + (r - 1) * 56.

      ring("r-course", 361, 436, 72, 32);     // course, row 5, cols 8-13

      ring("r-rows", 1271, 744, 96, 150);     // the three guest rows
      ring("r-cols", 1592, 584, 250, 36);     // the three course headers

      const pick = (group, key, at) => {
        group.forEach(k => tl.set(`#${k}`, { opacity: k === key ? 1 : 0 }, at));

      };
      const CNT = ["c0", "c1", "c2", "c3", "c4", "c5", "c6", "c7", "c8", "c9"];
      const GV = ["vA", "vC", "vB"], KV = ["vS", "vM", "vD"];
      // The waiter, by its centre point.
      const SPOT = { start: [1440, 70], A: [1281, 196], C: [1749, 196], B: [1650, 482], top: [1510, 76], right: [1790, 400] };
      const walk = (path, at, d) => {
        const step = d / path.length;
        path.forEach((k, i) => tl.to("#waiter", { x: SPOT[k][0] - 40, y: SPOT[k][1] - 40, duration: step, ease: i === path.length - 1 ? "power2.out" : "none" }, at + i * step));
      };
      // One serving: course variable, plate on the table, numbered badge in the grid, the counter.
      const serve = (seat, k, badge, n, at) => {
        pick(KV, KV[k - 1], at);
        hlTo(6, at);
        pop(`#p${seat}${k}`, at + 0.05, { from: 0.2, d: 0.3 });
        pop(`#${badge}`, at + 0.05, { from: 0.3, d: 0.3 });
        hlTo(5, at + 0.28);
        pick(CNT, CNT[n], at + 0.1);
      };

      tl.set("#waiter", { x: SPOT.start[0] - 40, y: SPOT.start[1] - 40 }, 0);
      tl.set("#s-hl", { y: 168 }, 0);
      tl.set("#c0", { opacity: 1 }, 0);

      bump("#nmA", t(6)); pop("#gA", t(6), { from: 0.6 });
      bump("#nmC", t(7)); pop("#gC", t(7), { from: 0.6 });
      bump("#nmB", t(9)); pop("#gB", t(9), { from: 0.6 });
      pop("#hS", t(13), { from: 0.6 }); show(["#k1", "#k4", "#k7"], t(13), 0.3);
      pop("#hM", t(15), { from: 0.6 }); show(["#k2", "#k5", "#k8"], t(15), 0.3);
      pop("#hD", t(18), { from: 0.6 }); show(["#k3", "#k6", "#k9"], t(18), 0.3);

      /* ---- 2. A loop inside a loop. For each guest. Then, pushed in, for each course. Serve it ---- */
      tl.fromTo("#s-code", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out", immediateRender: false }, t(19));
      type("#L1", t(20), 30, 0.45);
      type("#L2", t(21) + 0.1, 40, 0.5);
      type("#L3", t(24), 12, 0.3);
      type("#L4", t(28), 20, 0.4);
      draw("r-guest", t(29), 0.35);
      tl.fromTo("#s-cursor", { opacity: 0, x: 700, y: 700 }, { opacity: 1, x: 130, y: 336, duration: 0.45, ease: "power3.out", immediateRender: false }, t(31));
      show("#s-indent", t(32), 0.2);
      type("#L5", t(34), 26, 0.4);
      out(["#s-cursor", "#s-indent"], t(35), 0.2);
      draw("r-course", t(36), 0.35);
      type("#L6", t(37), 35, 0.45);
      type("#L7", t(38), 21, 0.3);
      out(["#r-guest", "#r-course"], t(38) + 0.4, 0.2);

      /* ---- 3. The waiter walks to Ana's seat. The inner loop runs all the way through ---- */
      show("#s-hl", t(39), 0.2);
      walk(["A"], t(40), 0.9);
      draw("r-ana", t(43), 0.4);
      show(["#wl", "#wG", "#wK"], t(43), 0.3);
      pick(GV, "vA", t(43) + 0.1);
      hlTo(5, t(45));
      show("#barI", t(47), 0.3);
      pop("#n-inner", t(50), { from: 0.6 });
      out("#r-ana", t(51), 0.2);
      tl.to("#rowhl", { y: 625 - 5, duration: 0 }, 0);
      show("#rowhl", t(53), 0.25);
      serve("A", 1, "b1", 1, t(54));
      serve("A", 2, "b2", 2, t(55));
      serve("A", 3, "b3", 3, t(56));

      /* ---- 4. Only then does the outer loop move on, to Chloe. 3 more plates. Then Ben ---- */
      out("#n-inner", t(57), 0.2);
      hlTo(4, t(61));
      show("#barO", t(61), 0.3);
      walk(["top", "C"], t(62), 1.2);
      tl.to("#rowhl", { y: 713 - 5, duration: 0.3, ease: "power2.inOut" }, t(65));
      pick(GV, "vC", t(66));
      hlTo(5, t(66) + 0.3);
      serve("C", 1, "b4", 4, t(67));
      serve("C", 2, "b5", 5, t(67) + 0.35);
      serve("C", 3, "b6", 6, t(67) + 0.7);
      hlTo(4, t(70));
      walk(["right", "B"], t(70) - 0.2, 0.7);
      tl.to("#rowhl", { y: 801 - 5, duration: 0.3, ease: "power2.inOut" }, t(71));
      pick(GV, "vB", t(71));
      hlTo(5, t(71) + 0.15);
      serve("B", 1, "b7", 7, t(71) + 0.2);
      serve("B", 2, "b8", 8, t(71) + 0.45);
      serve("B", 3, "b9", 9, t(71) + 0.7);

      /* ---- 5. 3 guests times 3 courses. 9 servings. The inner loop runs completely for every outer round ---- */
      out(["#rowhl", "#s-hl"], t(72) - 0.1, 0.2);
      draw("r-rows", t(72), 0.45);
      draw("r-cols", t(75), 0.45);
      pop("#mult", t(77), { from: 0.6 });
      bump("#cnt", t(77));
      out(["#r-rows", "#r-cols"], t(79), 0.2);
      pop("#n-inner", t(80), { from: 0.6 });
      bump("#barI", t(82));
      out("#n-inner", t(84) - 0.1, 0.15);
      pop("#n-outer", t(84), { from: 0.6 });
      tl.set("#rowhl", { y: 625 - 5 }, t(85));
      show("#rowhl", t(85), 0.15);
      tl.to("#rowhl", { y: 713 - 5, duration: 0.25, ease: "power2.inOut" }, t(86));
      tl.to("#rowhl", { y: 801 - 5, duration: 0.25, ease: "power2.inOut" }, t(89));

      /* ---- 6. Now a rule. Chloe's main has wheat. Gluten warning. Break ---- */
      out(["#rowhl", "#n-outer", "#mult", "#b4", "#b5", "#b6", "#b7", "#b8", "#b9", "#pC1", "#pC2", "#pC3", "#pB1", "#pB2", "#pB3"], t(91), 0.3);
      pick(CNT, "c3", t(91) + 0.2);
      tl.to(["#L6", "#L7"], { y: 112, duration: 0.45, ease: "power2.inOut" }, t(92));
      tl.to("#barI", { scaleY: 272 / 160, duration: 0.45, ease: "power2.inOut" }, t(92));
      tl.to("#barO", { scaleY: 328 / 216, duration: 0.45, ease: "power2.inOut" }, t(92));
      type("#R1", t(93), 49, 0.55);
      type("#R2", t(93) + 0.6, 17, 0.25);
      walk(["top", "C"], t(92), 1.1);
      pick(GV, "vC", t(94));
      draw("r-chloe", t(94), 0.35);
      tl.set("#s-hl", { y: 4 * 56 }, t(94) + 0.3);
      show("#s-hl", t(94) + 0.3, 0.15);
      // Chloe's starter is still served.
      tl.set("#s-hl", { y: 7 * 56 }, t(94) + 0.5);
      pick(KV, "vS", t(94) + 0.5);
      pop("#pC1", t(94) + 0.55, { from: 0.2, d: 0.3 });
      pop("#r4", t(94) + 0.55, { from: 0.3, d: 0.3 });
      pick(CNT, "c4", t(94) + 0.6);
      // Then the main.
      pick(KV, "vM", t(95));
      draw("r-main", t(95), 0.35);
      tl.set("#s-hl", { y: 5 * 56 }, t(95) - 0.1);
      pop("#xP", t(97), { from: 0.3 });
      out(["#r-chloe", "#r-main"], t(99), 0.2);
      pop("#warn", t(100), { from: 0.5, ease: "back.out(2.2)" });
      tl.set("#s-hl", { y: 6 * 56 }, t(102));
      draw("r-break", t(102), 0.35);
      pop("#xM", t(102) + 0.1, { from: 0.4 });
      pop("#xD", t(102) + 0.5, { from: 0.6 });

      /* ---- 7. Her card flips to no more. break leaves only the inner loop. Ben still gets served ---- */
      out(["#warn", "#r-break"], t(103), 0.2);
      tl.to("#nmC .f1", { scaleY: 0, duration: 0.2, ease: "power2.in" }, t(104));
      tl.to("#nmC", { backgroundColor: "#fbe0ea", duration: 0.01 }, t(104) + 0.2);
      tl.fromTo("#nmC .f2", { opacity: 1, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, t(104) + 0.2);
      out("#s-hl", t(108), 0.2);
      pop("#n-break", t(110), { from: 0.6 });
      bump("#barI", t(114));
      hlTo(4, t(116));
      show("#s-hl", t(116), 0.15);
      walk(["right", "B"], t(117), 0.9);
      draw("r-ben", t(121), 0.4);
      pick(GV, "vB", t(121));
      tl.set("#s-hl", { y: 7 * 56 }, t(121) + 0.2);
      const serve2 = (k, badge, n, at) => {
        pick(KV, KV[k - 1], at);
        pop(`#pB${k}`, at + 0.05, { from: 0.2, d: 0.3 });
        pop(`#${badge}`, at + 0.05, { from: 0.3, d: 0.3 });
        pick(CNT, CNT[n], at + 0.1);
      };
      serve2(1, "r5", 5, t(122));
      serve2(2, "r6", 6, t(123));
      serve2(3, "r7", 7, t(124));
      out("#r-ben", t(124) + 0.3, 0.2);

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.25, ease: "power2.in" }, 50.1);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
  </script>
</template>
