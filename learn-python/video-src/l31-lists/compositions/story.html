    (function () {
      // Word start times from the narration (seconds). The voice starts 0.6 s into the film.
      const W = [0.0, 0.221, 0.453, 0.778, 1.08, 1.196, 1.625, 2.252, 2.496, 3.007, 3.309, 3.901, 4.145, 4.911, 5.492, 6.026, 7.059, 7.291, 7.883, 8.139, 8.301, 8.417, 9.195, 9.567, 10.031, 10.403, 10.623, 10.844, 10.948, 11.32, 11.749, 11.912, 13.05, 13.375, 13.862, 14.095, 14.303, 14.617, 15.453, 15.778, 16.242, 16.416, 17.287, 17.507, 17.612, 17.786, 18.018, 18.227, 18.97, 19.423, 19.702, 20.48, 21.014, 21.385, 21.501, 21.745, 22.221, 22.43, 22.558, 23.475, 23.649, 23.893, 24.206, 24.392, 24.706, 25.553, 25.855, 26.041, 26.331, 26.83, 27.33, 27.678, 28.932, 29.326, 29.617, 29.826, 30.069, 30.244, 30.836, 31.033, 31.393, 31.532, 32.217, 32.426, 32.542, 33.843, 34.795, 35.213, 35.573, 35.828, 36.339, 36.792, 37.256, 37.5, 38.405, 38.939, 39.369, 39.497, 39.729, 40.1, 40.46, 40.774, 41.83, 42.26, 42.736, 43.084, 43.374, 44.048, 44.338, 45.058, 45.232, 45.592, 45.882, 46.114, 46.393, 46.939, 48.03, 48.796, 49.028, 49.133, 49.47, 50.12, 50.306, 50.41, 50.816, 51.06, 51.443, 52.395, 52.593, 52.918, 53.104, 53.405, 53.858, 54.09, 54.659, 55.158, 55.437, 56.354, 56.772, 57.26, 57.922, 58.224, 58.63];
      const t = (i) => W[i] + 0.6;
      const tl = gsap.timeline({ paused: true });

      // Rings in page pixels. Code text starts at x 136, 22.8 px per char. Row r centre y = 214 + (r - 1) * 60.
      const ring = (id, cx, cy, rx, ry) => {
        const d = `M${cx - rx + 6} ${cy + 4} C${cx - rx + 2} ${cy - ry} ${cx + rx} ${cy - ry - 3} ${cx + rx} ${cy} C${cx + rx} ${cy + ry} ${cx - rx - 3} ${cy + ry + 3} ${cx - rx} ${cy - 8}`;
        const p = document.getElementById(id); p.setAttribute("d", d);
        const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; p.dataset.len = L;
      };
      const cx = (c0, c1) => 136 + ((c0 + c1 + 1) / 2) * 22.8;
      ring("r-lb", cx(11, 11) + 4, 214, 25, 34);      // [
      ring("r-rb", cx(35, 35) + 4, 214, 25, 34);      // ]
      ring("r-c1", cx(19, 19) + 4, 214, 24, 34);      // first comma
      ring("r-c2", cx(27, 27) + 4, 214, 24, 34);      // second comma
      ring("r-v1", cx(12, 18), 214, 88, 36);      // "flour"
      ring("r-v2", cx(21, 26), 214, 76, 36);      // "eggs"
      ring("r-v3", cx(29, 34), 214, 76, 36);      // "milk"
      ring("r-app", cx(8, 14), 274, 92, 36);      // .append, row 2
      ring("r-bu", 1530, 728, 170, 56);           // butter on the paper
      ring("r-len", cx(6, 8), 394, 46, 36);       // len, row 4
      ring("r-fe", 1560, 458, 210, 64);           // the glued slip

      const pop = (sel, at, o) => { o = o || {}; tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.45, ease: o.ease || "back.out(1.6)", immediateRender: false }, at); };
      const show = (sel, at, d) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d || 0.3, ease: "power2.out", immediateRender: false }, at);
      const out = (sel, at, d) => tl.to(sel, { opacity: 0, duration: d || 0.25, ease: "power2.in" }, at);
      const draw = (id, at, d) => {
        const p = document.getElementById(id);
        tl.set(p, { opacity: 1 }, at);
        tl.fromTo(p, { strokeDashoffset: +p.dataset.len }, { strokeDashoffset: 0, duration: d || 0.5, ease: "power2.out", immediateRender: false }, at);
      };
      const bump = (sel, at) => tl.fromTo(sel, { scale: 1 }, { scale: 1.08, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);
      const swap = (from, to, at) => { out(from, at - 0.1, 0.12); pop(to, at, { from: 0.7, d: 0.35 }); };
      const type = (sel, at, n, d) => tl.fromTo(sel, { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: d || 0.04 * n, ease: `steps(${n})`, immediateRender: false }, at);
      const cursorTo = (x, y, at, d) => tl.to("#s-cursor", { x: x, y: y, duration: d || 0.45, ease: "power3.inOut" }, at);

      tl.set("#s-cursor", { x: 760, y: 760 }, 0);
      // The fridge starts in the middle of the frame and moves right when the code arrives.
      tl.set(["#s-fridge", ".slip"], { x: -420 }, 0);
      tl.to(["#s-fridge", ".slip"], { x: 0, duration: 0.6, ease: "power3.inOut" }, t(16) - 0.3);

      /* ---- 1. The fridge. One paper, many items, in order. Flour, eggs, milk ---- */
      bump("#fridge", t(2));
      bump("#magnet", t(5));
      bump("#paper", t(8));
      show("#order", t(11), 0.3);
      type("#fl", t(13), 5, 0.35);
      type("#eg", t(14), 4, 0.3);
      type("#mi", t(15), 4, 0.3);

      /* ---- 2. In Python, that is a list. Square brackets, commas, each item a value ---- */
      out("#order", t(16), 0.25);
      tl.fromTo("#s-code", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out", immediateRender: false }, t(16));
      type("#L1", t(17), 36, 0.7);
      pop("#n-list", t(21), { from: 0.6 });
      draw("r-lb", t(22), 0.3);
      draw("r-rb", t(23), 0.3);
      swap("#n-list", "#n-br", t(24));
      draw("r-c1", t(28), 0.3);
      draw("r-c2", t(28) + 0.2, 0.3);
      out(["#r-lb", "#r-rb", "#r-c1", "#r-c2"], t(32) - 0.2, 0.2);
      draw("r-v1", t(33), 0.35);
      draw("r-v2", t(33) + 0.25, 0.35);
      draw("r-v3", t(33) + 0.5, 0.35);
      bump("#fl", t(33));
      bump("#eg", t(33) + 0.25);
      bump("#mi", t(33) + 0.5);
      swap("#n-br", "#n-val", t(37));
      out(["#r-v1", "#r-v2", "#r-v3"], t(41) + 0.3, 0.2);

      /* ---- 3. Add to it. shopping.append("butter") writes a new item at the bottom ---- */
      out("#n-val", t(42), 0.2);
      tl.fromTo("#s-cursor", { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, t(45) - 0.2);
      cursorTo(140, 268, t(45) - 0.2);
      type("#L2", t(48), 25, 0.9);
      cursorTo(710, 268, t(48), 0.9);
      draw("r-app", t(50), 0.35);
      tl.to("#s-cursor", { opacity: 0, duration: 0.2 }, t(51));
      type("#bu", t(51) + 0.1, 6, 0.4);
      pop("#n-add", t(52), { from: 0.6 });
      draw("r-bu", t(58), 0.45);
      out(["#r-app", "#r-bu"], t(59) - 0.1, 0.2);

      /* ---- 4. The whole list is one value. One jar, holding many slips ---- */
      out("#n-add", t(59), 0.2);
      type("#L3", t(60), 15, 0.35);
      show("#oS", t(64), 0.25);
      out("#s-fridge", t(67), 0.35);
      pop("#s-jar", t(68), { from: 0.85 });
      show(".slip .bg", t(69), 0.35);
      bump("#sl1", t(70));
      bump("#sl2", t(70) + 0.12);
      bump("#sl3", t(70) + 0.24);
      bump("#sl4", t(70) + 0.36);

      /* ---- 5. len counts the slips, not the letters. Four ---- */
      type("#L4", t(72), 20, 0.45);
      draw("r-len", t(73), 0.35);
      pop("#b1", t(79), { from: 0.3 });
      pop("#b2", t(79) + 0.25, { from: 0.3 });
      pop("#b3", t(80), { from: 0.3 });
      pop("#b4", t(81), { from: 0.3 });
      pop("#n-cnt", t(82), { from: 0.6 });
      out("#r-len", t(84), 0.2);
      show("#oL", t(85), 0.2);
      pop("#lenp", t(85), { from: 0.7 });
      pop("#lv4", t(85) + 0.1, { from: 0.5 });

      /* ---- 6. Drop one comma. Python glues flour and eggs into one slip. No error. One item fewer ---- */
      out("#n-cnt", t(86), 0.2);
      tl.set("#s-cursor", { x: 560, y: 260 }, t(86));
      tl.to("#s-cursor", { opacity: 1, duration: 0.2 }, t(86));
      cursorTo(578, 214, t(87), 0.35);
      tl.set("#L1x", { opacity: 1 }, t(89));
      tl.set("#L1", { opacity: 0 }, t(89));
      show("#gap", t(89), 0.2);
      pop("#n-miss", t(89) + 0.1, { from: 0.6 });
      tl.to("#s-cursor", { opacity: 0, duration: 0.2 }, t(90));
      bump("#sl1", t(91));
      bump("#sl2", t(93));
      out(["#b1", "#b2", "#b3", "#b4"], t(94), 0.2);
      // eggs slides into flour, and the two words become one slip
      tl.to("#sl2", { y: -90, duration: 0.5, ease: "power2.in" }, t(95));
      tl.to("#sl2", { opacity: 0, duration: 0.15 }, t(95) + 0.4);
      out("#fl", t(100) - 0.15, 0.12);
      pop("#fe", t(100), { from: 0.7 });
      tl.to(["#sl3", "#sl4"], { y: -90, duration: 0.45, ease: "power2.inOut" }, t(100) + 0.3);
      draw("r-fe", t(102), 0.45);
      out("#oS", t(102) - 0.1, 0.12);
      show("#oS2", t(102), 0.2);
      pop("#n-err", t(107), { from: 0.6 });
      // renumber: 3 slips
      pop("#b1", t(113), { from: 0.3 });
      pop("#b2", t(113) + 0.2, { from: 0.3 });
      pop("#b3", t(114), { from: 0.3 });
      swap("#oL", "#oL3", t(116));
      swap("#lv4", "#lv3", t(116));
      tl.to("#lenp", { backgroundColor: "#fbe0ea", duration: 0.2 }, t(116));

      /* ---- 7. Put the comma back: the slips come apart again ---- */
      out(["#n-err", "#r-fe"], t(117), 0.2);
      tl.set("#s-cursor", { x: 560, y: 260 }, t(117));
      tl.to("#s-cursor", { opacity: 1, duration: 0.2 }, t(117));
      cursorTo(578, 214, t(117) + 0.1, 0.3);
      tl.set("#L1", { opacity: 1 }, t(119));
      tl.set("#L1x", { opacity: 0 }, t(119));
      out(["#gap", "#n-miss"], t(119), 0.15);
      pop("#n-back", t(120), { from: 0.6 });
      tl.to("#s-cursor", { opacity: 0, duration: 0.2 }, t(120) + 0.2);
      out(["#b1", "#b2", "#b3"], t(121), 0.15);
      out("#fe", t(123) - 0.1, 0.12);
      pop("#fl", t(123), { from: 0.7 });
      tl.to(["#sl3", "#sl4"], { y: 0, duration: 0.45, ease: "power2.inOut" }, t(123));
      tl.set("#sl2", { y: 0 }, t(123));
      pop("#sl2", t(124), { from: 0.5 });
      out("#oS2", t(124) - 0.1, 0.12);
      show("#oS3", t(124), 0.2);
      swap("#oL3", "#oL4", t(125));
      swap("#lv3", "#lv4b", t(125));
      tl.to("#lenp", { backgroundColor: "#ddefe6", duration: 0.2 }, t(125));
      ["#sl1", "#sl2", "#sl3", "#sl4"].forEach((sl, k) => bump(sl, t(125) + 0.3 + k * 0.12));

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.25, ease: "power2.in" }, 52.6);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
  </script>
