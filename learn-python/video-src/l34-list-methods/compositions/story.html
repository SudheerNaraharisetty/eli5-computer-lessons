      const t = (i) => W[i] + 0.6;
      const tl = gsap.timeline({ paused: true });

      // Rings in page pixels. Code text starts at x 136, 20.4 px per char. Row r centre y = 212 + (r - 1) * 56.
      const ring = (id, cx, cy, rx, ry) => {
        const d = `M${cx - rx + 6} ${cy + 4} C${cx - rx + 2} ${cy - ry} ${cx + rx} ${cy - ry - 3} ${cx + rx} ${cy} C${cx + rx} ${cy + ry} ${cx - rx - 3} ${cy + ry + 3} ${cx - rx} ${cy - 8}`;

        const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; p.dataset.len = L;

      const CW = 20.4;
      const cx = (c0, c1) => 136 + ((c0 + c1 + 1) / 2) * CW;

      const pop = (sel, at, o) => { o = o || {}; tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.45, ease: o.ease || "back.out(1.6)", immediateRender: false }, at); };

      const draw = (id, at, d) => {
        const p = document.getElementById(id);
        tl.set(p, { opacity: 1 }, at);
        tl.fromTo(p, { strokeDashoffset: +p.dataset.len }, { strokeDashoffset: 0, duration: d || 0.5, ease: "power2.out", immediateRender: false }, at);

      const bump = (sel, at) => tl.fromTo(sel, { scale: 1 }, { scale: 1.08, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);

      const row = (k) => k * 100;  // paper rows: y offset from row 0
      const msgIn = (sel, at) => {
        tl.fromTo(sel, { opacity: 0, y: -30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.8)", immediateRender: false }, at);

      tl.set("#it-ban", { y: row(0) }, 0);
      tl.set("#strike", { scaleX: 0, transformOrigin: "0% 50%" }, 0);

      tl.to("#s-paperg", { x: 0, duration: 0.6, ease: "power3.inOut" }, t(9) - 0.3);
      tl.fromTo("#s-code", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out", immediateRender: false }, t(9));

      out("#r-flour", t(46), 0.15);
      tl.to("#it-flour", { x: -90, opacity: 0, duration: 0.4, ease: "power2.in" }, t(46));

      cursorOut(t(53) + 0.2);

      tl.to("#it-eggs", { y: row(2), duration: 0.45, ease: "power2.inOut" }, t(54) - 0.3);
      tl.to("#it-rice", { y: row(3), duration: 0.45, ease: "power2.inOut" }, t(54) - 0.3);
      tl.to("#it-tofu", { y: row(4), duration: 0.45, ease: "power2.inOut" }, t(54) - 0.3);
      tl.fromTo("#it-ban", { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.5, ease: "back.out(1.4)", immediateRender: false }, t(54) + 0.1);
      pop("#idx0", t(56), { from: 0.3 });
      pop("#n-ins", t(56) + 0.2, { from: 0.6 });

      /* ---- 5. Last, sort it, so you can walk the shop from A to Z ---- */
      out(["#m-ana", "#n-ins", "#r-ins", "#r-zero", "#idx0"], t(63) - 0.25, 0.2);
      type("#L5", t(64) - 0.2, 15, 0.4);
      draw("r-sort", t(64) + 0.2, 0.35);
      // milk and eggs swap places, with a little arc so the move reads
      tl.to("#it-milk", { y: row(2), x: 40, duration: 0.6, ease: "power2.inOut" }, t(65));
      tl.to("#it-eggs", { y: row(1), x: -40, duration: 0.6, ease: "power2.inOut" }, t(65));
      tl.to(["#it-milk", "#it-eggs"], { x: 0, duration: 0.3, ease: "power2.out" }, t(65) + 0.6);
      type("#L6", t(69), 15, 0.4);
      show("#o-list", t(71), 0.3);
      pop("#az", t(73), { from: 0.5 });
      pop("#n-sort", t(65) + 0.2, { from: 0.6 });

      /* ---- 6. Every method changed the same paper. No new list. A method hands back None ---- */
      out(["#r-sort", "#az", "#n-sort"], t(76) - 0.2, 0.2);
      draw("r-app", t(77), 0.3);
      draw("r-rem", t(77) + 0.15, 0.3);
      draw("r-ins", t(77) + 0.3, 0.3);
      draw("r-sort", t(77) + 0.45, 0.3);
      pop("#n-same", t(78), { from: 0.6 });
      bump("#paper", t(81));
      tl.to("#n-same", { opacity: 0, duration: 0.15 }, t(83) - 0.15);
      pop("#n-new", t(83), { from: 0.7, d: 0.35 });
      out(["#r-app", "#r-rem", "#r-ins"], t(87), 0.2);
      pop("#n-back", t(92), { from: 0.6 });
      pop("#v-none", t(95), { from: 0.4 });

      /* ---- 7. shopping = shopping.sort(). Sorted, then None goes into the jar. Gone ---- */
      out(["#n-new", "#n-back", "#v-none", "#r-sort"], t(96), 0.2);
      tl.set("#s-cursor", { x: 300, y: 470 }, t(97) - 0.3);
      cursorIn(t(97) - 0.3);
      cursorTo(136, 430, t(97), 0.35);
      tl.set("#L5", { opacity: 0 }, t(98));
      type("#L5x", t(98), 26, 0.7);
      cursorOut(t(99) + 0.2);
      draw("r-dsort", t(102), 0.35);
      ["#it-ban", "#it-eggs", "#it-milk", "#it-rice", "#it-tofu"].forEach((s, k) => bump(s, t(104) + k * 0.12));
      // the answer from .sort(), None, travels left into the jar called shopping
      tl.set("#chip", { x: 136 + 20 * CW - 10, y: 410 }, t(110));
      pop("#chip", t(110), { from: 0.4 });
      tl.to("#chip", { x: 136 + 1 * CW, duration: 0.55, ease: "power2.inOut" }, t(111));
      out("#r-dsort", t(111), 0.2);
      draw("r-jar", t(112), 0.35);
      out(["#it-ban", "#it-eggs", "#it-milk", "#it-rice", "#it-tofu"], t(112), 0.35);
      out(".rule", t(112), 0.35);
      pop("#p-none", t(113), { from: 0.5 });
      tl.to("#o-list", { opacity: 0, duration: 0.12 }, t(115) - 0.12);
      show("#o-none", t(115), 0.2);
      pop("#n-bad", t(115) + 0.2, { from: 0.6 });
      tl.fromTo("#stamp", { opacity: 0, scale: 2.2, rotation: -10 }, { opacity: 1, scale: 1, rotation: -10, duration: 0.35, ease: "power3.in", immediateRender: false }, t(120) - 0.2);

      /* ---- 8. The fix: the method on its own line. A new sorted list? Use sorted ---- */
      tl.set("#s-cursor", { x: 300, y: 470 }, t(121) - 0.2);
      cursorIn(t(121) - 0.2);
      cursorTo(136 + 6 * CW, 430, t(121), 0.3);
      out(["#chip", "#r-jar", "#n-bad", "#stamp", "#p-none"], t(122), 0.2);
      tl.set("#L5x", { opacity: 0 }, t(123));
      pop("#L5", t(123), { from: 0.9, d: 0.3 });
      cursorOut(t(123) + 0.3);
      show(["#it-ban", "#it-eggs", "#it-milk", "#it-rice", "#it-tofu", ".rule"], t(124), 0.35);
      tl.to("#o-none", { opacity: 0, duration: 0.12 }, t(125) - 0.12);
      show("#o-list2", t(125), 0.2);
      draw("r-own", t(128), 0.4);
      pop("#n-fix", t(128) + 0.2, { from: 0.6 });
      out(["#r-own"], t(133), 0.2);
      type("#L7", t(133), 26, 0.7);
      draw("r-sorted", t(136), 0.35);
      pop("#n-copy", t(136) + 0.2, { from: 0.6 });
      bump("#L7", t(139));

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.25, ease: "power2.in" }, 56.9);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
  </script>
