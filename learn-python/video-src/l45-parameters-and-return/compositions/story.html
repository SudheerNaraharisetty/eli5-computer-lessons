      const W = [0.0, 0.348, 0.627, 0.743, 1.219, 1.358, 1.614, 2.74, 3.17, 3.541, 3.901, 4.203, 4.667, 5.004, 5.201, 5.561, 5.782, 6.153, 6.722, 6.966, 7.245, 8.429, 8.638, 8.754, 9.056, 9.369, 9.706, 10.101, 10.902, 11.517, 11.749, 12.086, 12.388, 12.771, 13.769, 13.967, 14.095, 14.454, 16.01, 16.312, 16.893, 17.322, 17.578, 17.775, 18.1, 18.251, 18.867, 19.238, 20.504, 20.817, 21.351, 21.665, 21.92, 22.083, 22.675, 22.93, 23.766, 23.917, 24.207, 24.463, 24.59, 25.031, 25.287, 25.705, 26.03, 26.169, 26.436, 27.075, 27.562, 27.899, 28.201, 29.049, 29.223, 29.525, 30.105, 30.407, 31.301, 31.487, 31.672, 32.021, 32.369, 32.671, 32.949, 33.205, 33.564, 34.307, 35.097, 35.341, 35.677, 36.165, 36.444, 37.175, 38.092, 38.359, 38.557, 39.079, 39.474, 39.741, 40.043, 40.612, 40.844, 41.215, 41.842, 41.993, 42.295, 42.655, 43.038, 43.166, 44.199, 44.373, 44.687, 44.989, 45.105, 45.221, 45.894, 46.068, 46.184, 46.486, 46.835, 47.102, 47.252, 47.659, 48.506, 49.342, 49.749, 50.074, 50.48, 50.863, 51.084, 51.188, 51.595, 52.431, 52.918, 53.418, 53.859, 53.986, 54.462, 54.718, 55.043, 55.612, 55.74, 56.529, 57.168, 57.423, 58.143, 58.596, 59.083, 59.478, 59.617, 59.896];

      // Rings in page pixels. Code text starts at x 136, 20.4 px per char. Row r centre y = 212 + (r - 1) * 56.

      const CW = 20.4;
      const cx = (c0, c1) => 136 + ((c0 + c1 + 1) / 2) * CW;

      cursorOut(t(38) + 1.0);

      draw("r-17", t(47), 0.4);

      pop("#n-arg", t(49), { from: 0.6 });

      chipFly("#ch-17", 23, 24, 4, 1540, t(50) + 0.3);
