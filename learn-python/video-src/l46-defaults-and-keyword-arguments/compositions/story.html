      const ring = (id, cx, cy, rx, ry) => {
        const d = `M${cx - rx + 6} ${cy + 4} C${cx - rx + 2} ${cy - ry} ${cx + rx} ${cy - ry - 3} ${cx + rx} ${cy} C${cx + rx} ${cy + ry} ${cx - rx - 3} ${cy + ry + 3} ${cx - rx} ${cy - 8}`;
        const p = document.getElementById(id); p.setAttribute("d", d);
        const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; p.dataset.len = L;
      };
      const CW = 20.4;
      const cx = (c0, c1) => 136 + ((c0 + c1 + 1) / 2) * CW;
      const rw = (c0, c1) => ((c1 - c0 + 1) * CW) / 2 + 16;
      const ry = (r) => 212 + (r - 1) * 56;
      ring("r-milk", cx(21, 31), ry(1), rw(21, 31), 30);   // milk_ml=250
      ring("r-salt", cx(34, 41), ry(1), rw(34, 41), 30);   // salt_g=1
      ring("r-80", cx(15, 16), ry(4), rw(15, 16), 30);     // 80 in Ana's call
      ring("r-kw", cx(19, 26), ry(5), rw(19, 26), 30);     // salt_g=0 in Chloe's call
      ring("r-zero", cx(19, 19), ry(6), rw(19, 19) + 4, 30); // the bare 0
      ring("r-bdef", cx(19, 27), ry(1), rw(19, 27), 30);   // basket=[]
      ring("r-none", cx(26, 29), ry(1), rw(26, 29), 30);   // None
      // if basket is None: / basket = []  get a rounded box, not a ring, so no line crosses the text
      (() => { const p = document.getElementById("r-new"); p.setAttribute("d", "M220 240 H690 Q702 240 702 252 V342 Q702 354 690 354 H212 Q200 354 200 342 V252 Q200 240 214 240");
        const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; p.dataset.len = L; })();
      ring("r-slbl", 1720, 501, 104, 32);                  // the salt_g label on the card
      ring("r-mlbl", 1510, 501, 110, 32);                  // the milk_ml label on the card
      ring("r-bk", 1510, 500, 220, 150);                   // the shared basket

      const pop = (sel, at, o) => { o = o || {}; tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.45, ease: o.ease || "back.out(1.6)", immediateRender: false }, at); };
      const show = (sel, at, d) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d || 0.3, ease: "power2.out", immediateRender: false }, at);
      const out = (sel, at, d) => tl.to(sel, { opacity: 0, duration: d || 0.25, ease: "power2.in" }, at);
      const draw = (id, at, d) => {
        const p = document.getElementById(id);
        tl.set(p, { opacity: 1 }, at);
        tl.fromTo(p, { strokeDashoffset: +p.dataset.len }, { strokeDashoffset: 0, duration: d || 0.5, ease: "power2.out", immediateRender: false }, at);
      };
      const bump = (sel, at) => tl.fromTo(sel, { scale: 1 }, { scale: 1.1, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);
      const type = (sel, at, n, d) => tl.fromTo(sel, { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: d || 0.04 * n, ease: `steps(${n})`, immediateRender: false }, at);
      const cursorTo = (x, y, at, d) => tl.to("#s-cursor", { x: x, y: y, duration: d || 0.45, ease: "power3.inOut" }, at);
      const cursorIn = (at) => tl.to("#s-cursor", { opacity: 1, duration: 0.2 }, at);
      const cursorOut = (at) => tl.to("#s-cursor", { opacity: 0, duration: 0.2 }, at);
      // A chip leaves its spot on a code line (columns c0..c1, row r) and drops into a jar (jar left x).
      const CHIPW = 120, CHIPH = 72;
      const chipFly = (sel, c0, c1, r, jarLeft, at) => {
        const x0 = cx(c0, c1) - CHIPW / 2, y0 = ry(r) - CHIPH / 2;
        const x1 = jarLeft + 90 - CHIPW / 2, y1 = 336 + 65 - CHIPH / 2;
        tl.set(sel, { x: x0, y: y0, scale: 0.5 }, at - 0.01);
        tl.to(sel, { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" }, at);
        tl.to(sel, { x: x1, duration: 0.75, ease: "power2.inOut" }, at + 0.15);
        tl.to(sel, { y: y1 - 130, duration: 0.45, ease: "power2.out" }, at + 0.15);
        tl.to(sel, { y: y1, duration: 0.3, ease: "power2.in" }, at + 0.6);
      };
      const drop = (sel, at) => tl.fromTo(sel, { opacity: 0, y: -90 }, { opacity: 1, y: 0, duration: 0.45, ease: "bounce.out", immediateRender: false }, at);

      /* ---- set up ---- */
      tl.set("#s-cursor", { x: 600, y: 700 }, 0);
      tl.set("#stamp", { rotation: -8 }, 0);

      /* ---- 1. Kitchen Coach makes porridge. Most days the amounts are the same ---- */
      tl.fromTo(["#fr-a", "#fr-b", "#fr-c"], { y: 0 }, { y: -12, duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out", stagger: 0.12, immediateRender: false }, t(5));
      tl.fromTo("#pg", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.4)", immediateRender: false }, t(3));
      type("#A1", t(3) + 0.3, 44, 1.2);
      type("#A2", t(10), 33, 0.8);
      pop("#v-m250", t(17), { from: 0.4 });       // fifty millilitres
      bump("#jl-m", t(18));
      pop("#v-s1", t(22), { from: 0.4 });         // one gram of salt
      bump("#jl-s", t(23));

      /* ---- 2. Write them on the card, in pencil. Default values ---- */
      draw("r-milk", t(31), 0.4);                 // card
      draw("r-salt", t(31) + 0.2, 0.4);
      pop("#pencil", t(33), { from: 0.4 });        // pencil
      show("#c-note", t(33) + 0.2, 0.3);
      pop("#n-def", t(36), { from: 0.6 });         // default

      /* ---- 3. Ana's call gives only the oats. 80. The other jars keep their usual amounts ---- */
      out(["#r-milk", "#r-salt"], t(38) - 0.3, 0.2);
      out("#c-note", t(38) - 0.3, 0.2);
      bump("#fr-a", t(38));
      type("#A4", t(39), 19, 0.6);
      draw("r-80", t(43), 0.35);
      chipFly("#ch-80", 15, 16, 4, 1210, t(44));
      out("#r-80", t(44) + 0.3, 0.2);
      bump("#v-m250", t(47));                      // jars
      bump("#v-s1", t(47) + 0.15);
      show("#oa1", t(50), 0.25);
      pop("#bw-a", t(50), { from: 0.85 });        // usual amounts

      /* ---- 4. Chloe: 60 grams, no salt. Name the jar: salt_g=0. Found by name, 1 swapped for 0 ---- */
      out(["#ch-80", "#n-def"], t(52) - 0.3, 0.25);
      bump("#fr-c", t(52));
      type("#A5", t(52) + 0.1, 28, 0.8);
      chipFly("#ch-60", 15, 16, 5, 1210, t(54));   // sixty
      draw("r-kw", t(60), 0.4);                    // name the jar
      pop("#n-kw", t(60) + 0.2, { from: 0.6 });
      tl.set("#s-cursor", { x: cx(19, 26) - 30, y: ry(5) + 6 }, t(63) - 0.4);
      cursorIn(t(63) - 0.4);
      cursorTo(1720, 510, t(63), 1.3);             // Salt g, equals zero: the cursor goes to the jar's name label
      draw("r-slbl", t(70), 0.4);                  // finds the jar by name
      bump("#jl-s", t(70));
      tl.to("#v-s1", { opacity: 0, scale: 0.5, duration: 0.3, ease: "power2.in" }, t(76));   // the one
      pop("#v-s0", t(79), { from: 0.3 });          // a zero
      cursorOut(t(79) + 0.2);
      out("#bw-a", t(79) + 0.3, 0.2);
      show("#oa2", t(79) + 0.4, 0.25);
      pop("#bw-c", t(79) + 0.5, { from: 0.85 });

      /* ---- 5. Without the name: porridge(60, 0). The 2nd number fills the 2nd jar: milk ---- */
      out(["#r-kw", "#r-slbl", "#n-kw"], t(80) - 0.2, 0.25);
      out(["#bw-c", "#v-s0"], t(93), 0.25);
      tl.fromTo("#v-s1", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, t(93) + 0.25);
      type("#A6", t(85), 22, 0.7);                 // write porridge, sixty, zero
      draw("r-zero", t(88), 0.35);                 // zero
      pop("#n-2nd", t(91), { from: 0.6 });         // second number
      chipFly("#ch-0", 19, 19, 6, 1420, t(93));    // fills
      tl.to("#v-m250", { opacity: 0, scale: 0.5, duration: 0.25, ease: "power2.in" }, t(93) + 0.7);
      pop("#bd-jar", t(95), { from: 0.5 });        // second jar
      out("#r-zero", t(97), 0.2);
      draw("r-mlbl", t(100) - 0.1, 0.4);           // the milk
      bump("#jl-m", t(100));
      pop("#bw-x", t(101), { from: 0.85 });        // dry oats
      bump("#v-s1", t(104));                       // with salt
      show("#oa3", t(105), 0.25);                  // no error
      pop("#n-noerr", t(105) + 0.2, { from: 0.6 });
      tl.fromTo("#stamp", { opacity: 0, scale: 2.2, rotation: -8 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.35, ease: "power3.in", immediateRender: false }, t(109));

      /* ---- 6. One trap: basket=[] is made once, when the card is written ---- */
      const partA = ["#A1", "#A2", "#A4", "#A5", "#A6", "#n-2nd", "#oa1", "#oa2", "#oa3", "#n-noerr", "#pg", "#pencil", "#v-m250", "#v-s1", "#ch-60", "#ch-0", "#bd-jar", "#bw-x", "#stamp", "#r-mlbl"];
      out(partA, t(111) - 0.2, 0.3);
      out("#fn-a", t(111) - 0.2, 0.2);
      show("#fn-b", t(111) + 0.1, 0.2);
      show("#bg", t(111) + 0.1, 0.35);
      type("#B1", t(113), 30, 0.8);
      type("#B2", t(115), 23, 0.5);
      type("#B3", t(116), 17, 0.4);
      draw("r-bdef", t(117), 0.4);                 // basket equals empty brackets
      pop("#bk", t(124), { from: 0.4 });           // once
      pop("#p-once", t(125), { from: 0.6 });       // when the card is written

      /* ---- 7. Every call shares that one basket. Bananas, tofu, rice flour, all in one ---- */
      out("#r-bdef", t(130) - 0.2, 0.2);
      type("#B5", t(130), 26, 0.35);
      type("#B6", t(130) + 0.35, 23, 0.35);
      type("#B7", t(130) + 0.7, 29, 0.35);
      pop("#cb1", t(131), { from: 0.4 });
      pop("#cb2", t(131) + 0.15, { from: 0.4 });
      pop("#cb3", t(131) + 0.3, { from: 0.4 });
      draw("r-bk", t(134), 0.5);                   // one basket
      out("#r-bk", t(136) - 0.15, 0.15);
      drop("#it-1", t(136)); show("#ob1", t(136), 0.2);
      drop("#it-2", t(137)); show("#ob2", t(137), 0.2);
      drop("#it-3", t(138)); show("#ob3", t(138), 0.2);
      pop("#p-shared", t(140), { from: 0.6 });     // all in one
      bump("#bk", t(141));

      /* ---- 8. Default to None, and make a fresh list inside ---- */
      const partB = ["#B1", "#B2", "#B3", "#B5", "#B6", "#B7", "#cb1", "#cb2", "#cb3", "#ob1", "#ob2", "#ob3", "#bk", "#it-1", "#it-2", "#it-3", "#p-once", "#p-shared"];
      out(partB, t(143) - 0.25, 0.25);
      show(["#F1", "#F4", "#F5", "#F7", "#F8", "#F9"], t(143), 0.3);
      draw("r-none", t(145), 0.4);                 // None
      type("#F2", t(147), 22, 0.45);               // make a fresh list
      type("#F3", t(147) + 0.45, 19, 0.45);
      draw("r-new", t(149) + 0.2, 0.45);           // fresh list
      pop(["#mb-1", "#mb-2", "#mb-3"], t(149), { from: 0.4 });
      pop(["#ml-1", "#ml-2", "#ml-3"], t(149) + 0.2, { from: 0.6 });
      drop("#mi-1", t(149) + 0.1); show("#of1", t(149) + 0.1, 0.2);
      drop("#mi-2", t(149) + 0.35); show("#of2", t(149) + 0.35, 0.2);
      drop("#mi-3", t(149) + 0.6); show("#of3", t(149) + 0.6, 0.2);
      pop("#p-fresh", t(147), { from: 0.6 });      // make a fresh list

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.25, ease: "power2.in" }, 64.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
  </script>
</template>
