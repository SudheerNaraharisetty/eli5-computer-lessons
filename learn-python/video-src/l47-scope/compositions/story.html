        d = d || 0.8;
        tl.set(sel, { x: x0 - CHW / 2, y: y0 - CHH / 2, scale: 0.5 }, at - 0.01);
        tl.to(sel, { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" }, at);
        tl.to(sel, { x: x1 - CHW / 2, duration: d, ease: "power2.inOut" }, at + 0.15);
        tl.to(sel, { y: Math.min(y0, y1) - 110 - CHH / 2, duration: d * 0.55, ease: "power2.out" }, at + 0.15);
        tl.to(sel, { y: y1 - CHH / 2, duration: d * 0.45, ease: "power2.in" }, at + 0.15 + d * 0.55);
      };
      const J1 = [1351, 412], J2 = [1591, 412], CJ = [1655, 743];

      /* ---- set up ---- */
      tl.set("#s-cursor", { x: 600, y: 700 }, 0);

      /* ---- 1. A jar on the counter: calories today. It starts at 0 ---- */
      bump(["#cjar", "#clid"], t(4));
      tl.fromTo("#s-code", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out", immediateRender: false }, t(7) - 0.3);
      type("#L1", t(8), 14, 0.5);
      draw("r-l1", t(9), 0.4);
      bump("#clbl", t(9));
      pop("#cv0", t(13), { from: 0.4 });
      out("#r-l1", t(13) + 0.4, 0.2);

      /* ---- 2. Ana eats breakfast. A card called eat should add 450 ---- */
      pop("#m-ana", t(14), { from: 0.8 });
      type("#L3", t(18), 14, 0.5);
      type("#L4", t(21), 34, 0.9);
      type("#L6", t(24), 8, 0.35);

      /* ---- 3. Every card cooks in its own pan. A name it fills in is a new jar ---- */
      out("#m-ana", t(29), 0.3);
      tl.fromTo("#pang", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.4)", immediateRender: false }, t(34) - 0.2);
      show("#pt1", t(35) - 0.1, 0.3);
      pop("#pjar1", t(35), { from: 0.5 });
      fly("#ch450", cx(4, 6), ry(6), J1[0], J1[1], t(35) + 0.2, 0.75);
      pop("#pl1a", t(35) + 0.9, { from: 0.6 });
      draw("r-left", t(40), 0.4);
      pop("#pjar2d", t(44), { from: 0.5 });
      pop("#pl2a", t(45), { from: 0.6 });
      pop("#n-two", t(49), { from: 0.6 });
      bump(["#pjar2d", "#pl2a"], t(52));
      bump(["#cjar", "#clid", "#cv0", "#clbl"], t(53));

      /* ---- 4. This line reads the pan jar before anything is in it. Empty. Python stops ---- */
      out(["#r-left", "#n-two"], t(54), 0.2);
      tl.set("#s-cursor", { x: 700, y: 520 }, t(55) - 0.3);
      cursorIn(t(55) - 0.3);
      cursorTo(cx(17, 26) - 30, ry(4) + 10, t(55) - 0.2, 0.5);
      draw("r-right", t(57), 0.4);
      cursorOut(t(58));
      draw("a-read", t(58), 0.6);
      tl.to(["#pjar2d", "#pl2a"], { opacity: 0, duration: 0.2 }, t(68) - 0.1);
      tl.set(["#pjar2r", "#pl2r"], { opacity: 1 }, t(68) - 0.1);
      pop("#empty", t(68), { from: 0.5 });
      show(["#o-e1", "#o-e2", "#o-e3"], t(70), 0.25);
      draw("r-err", t(71), 0.45);

      /* ---- 5. The counter jar is never touched ---- */
      out(["#r-right", "#a-read", "#r-err"], t(74) - 0.1, 0.2);
      draw("r-cjar", t(75), 0.5);
      pop("#t-still", t(78), { from: 0.6 });

      /* ---- 6. When the card is done, the pan is washed. Its jars are gone ---- */
      out(["#r-cjar", "#t-still"], t(85), 0.25);
      tl.to("#pt1", { opacity: 0, duration: 0.2 }, t(89) - 0.2);
      show("#pt2", t(89), 0.2);
      ["w1", "w2", "w3"].forEach((id, i) => draw(id, t(89) + i * 0.12, 0.6));
      tl.to(["#pjar1", "#pl1a", "#ch450", "#pjar2r", "#pl2r", "#empty"], { opacity: 0, scale: 0.6, duration: 0.4, ease: "power2.in" }, t(91));
      pop("#t-gone", t(93), { from: 0.6 });
      out(["#w1", "#w2", "#w3"], t(93), 0.3);

      /* ---- 7. The fix: pass the total in. Return hands it back. Pour it into the counter jar ---- */
      out(["#t-gone", "#pt2", "#o-e1", "#o-e2", "#o-e3"], t(94), 0.25);
      pop("#n-fix", t(95), { from: 0.6 });
      swapLine("#L3", "#F3", t(96) - 0.1);
      swapLine("#L6", "#F6", t(96) + 0.2);
      show("#pt3", t(97), 0.3);
      tl.set(["#pjar1", "#pjar2s"], { scale: 1 }, t(97) - 0.05);
      pop(["#pjar1", "#pjar2s"], t(97), { from: 0.5 });
      pop("#pl1b", t(98), { from: 0.6 });
      pop("#pl2b", t(98) + 0.15, { from: 0.6 });
      // the counter value goes in as total, and 450 as kcal
      fly("#ch0", CJ[0], CJ[1], J1[0], J1[1], t(98), 0.75);
      fly("#ch450b", cx(29, 31), ry(6), J2[0], J2[1], t(99), 0.75);
      swapLine("#L4", "#F4", t(100) - 0.1);
      // return hands the new total back out of the pan, then it is poured into the counter jar
      tl.to(["#ch0", "#ch450b"], { opacity: 0, scale: 0.6, duration: 0.25 }, t(104) - 0.2);
      fly("#ch450c", 1471, 412, 1471, 640, t(104), 0.6);
      draw("r-pour", t(108), 0.4);
      tl.to("#ch450c", { x: CJ[0] - CHW / 2, y: CJ[1] - CHH / 2, duration: 0.6, ease: "power2.inOut" }, t(108) + 0.1);
      tl.to("#ch450c", { opacity: 0, scale: 0.5, duration: 0.2 }, t(112));
      out("#cv0", t(112), 0.15);
      pop("#cv450", t(114) - 0.1, { from: 0.4 });
      show("#o-450", t(114), 0.3);
      out("#r-pour", t(114) + 0.5, 0.25);

      /* ---- 8. global: the card reaches the counter jar. It works. Any card can change it ---- */
      out(["#n-fix", "#o-450", "#pt3", "#pl1b", "#pl2b", "#pjar2s", "#F3", "#F4", "#F6", "#cv450"], t(118) - 0.1, 0.25);
      pop("#cv0b", t(118) + 0.2, { from: 0.6 });
      tl.fromTo("#L3", { opacity: 0 }, { opacity: 1, duration: 0.25, immediateRender: false }, t(118) + 0.15);
      type("#G4", t(120), 21, 0.5);
      tl.fromTo(["#G5", "#G7"], { opacity: 0 }, { opacity: 1, duration: 0.25, immediateRender: false }, t(120) + 0.2);
      draw("r-glob", t(121), 0.4);
      pop("#n-glob", t(121) + 0.2, { from: 0.6 });
      show("#pt4", t(122), 0.3);
      pop("#pl1c", t(122) + 0.1, { from: 0.6 });
      fly("#ch450g", cx(4, 6), ry(7), J1[0], J1[1], t(122), 0.7);
      draw("a-reach", t(125), 0.5);
      out("#cv0b", t(130) - 0.2, 0.15);
      pop("#cv450b", t(130) - 0.1, { from: 0.4 });
      show("#o-g450", t(130), 0.3);
      out(["#r-glob", "#n-glob"], t(131), 0.2);
      pop("#bc1", t(133), { from: 0.6 });
      pop("#bc2", t(134), { from: 0.6 });
      draw("a-b1", t(136), 0.35);
      draw("a-b2", t(136) + 0.15, 0.35);
      out("#cv450b", t(138) - 0.15, 0.15);
      pop("#cvq", t(138), { from: 0.4 });
      pop("#n-who", t(138), { from: 0.6 });
      out("#o-g450", t(138), 0.2);
      bump(["#cjar", "#clid", "#cvq"], t(141));

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.25, ease: "power2.in" }, 52.7);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
  </script>
