        const d = `M${cx - rx + 6} ${cy + 4} C${cx - rx + 2} ${cy - ry} ${cx + rx} ${cy - ry - 3} ${cx + rx} ${cy} C${cx + rx} ${cy + ry} ${cx - rx - 3} ${cy + ry + 3} ${cx - rx} ${cy - 8}`;
        const p = document.getElementById(id); p.setAttribute("d", d);
        const L = p.getTotalLength(); p.dataset.len = L;
        if (!p.style.strokeDasharray) { p.style.strokeDasharray = L; p.style.strokeDashoffset = L; }
      };
      const line = (id, x1, y, x2) => {
        const p = document.getElementById(id); p.setAttribute("d", `M${x1} ${y} L${x2} ${y}`);
        p.dataset.len = x2 - x1;
      };
      // Giant card: 28 px mono, 16.8 px per char, text at page x 132, row r centre y = 161 + (r - 1) * 50.
      const G = (c) => 132 + c * 16.8;
      const gy = (r) => 161 + (r - 1) * 50;
      ring("r-plan", G(4) + 5.5 * 16.8, gy(1), 6.5 * 16.8, 30);              // plan_dinner
      ring("r-mid", G(21.5), (gy(7) + gy(11)) / 2, 310, 200); // rows 7 to 11
      ring("r-six", G(35) + 5.5 * 16.8, 921, 5.5 * 16.8 + 34, 34);          // "6 g protein" in Ben's line
      ring("r-c3", 1132 + 8.5 * 16.8, 528, 8.5 * 16.8 + 36, 34);           // count_kcal(foods) title
      ring("r-v765", 132 + 1.5 * 31.2, 780, 72, 42);                        // 765
      // Check card: 30 px mono, 18 px per char, text at page x 300, row r centre y = 221 + (r - 1) * 54.
      const K = (c) => 300 + c * 18;
      const ky = (r) => 221 + (r - 1) * 54;
      ring("r-chili", K(24.5), ky(8), 92, 34);
      ring("r-salad", K(33.5), ky(8), 92, 34);
      ring("r-want", K(46.5), ky(8), 112, 34);
      ring("r-bug", K(18.5), ky(5), 236, 40);

      const pop = (sel, at, o) => { o = o || {}; tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.45, ease: o.ease || "back.out(1.6)", immediateRender: false }, at); };
      const show = (sel, at, d) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d || 0.3, ease: "power2.out", immediateRender: false }, at);
      const out = (sel, at, d) => tl.to(sel, { opacity: 0, duration: d || 0.25, ease: "power2.in" }, at);
      const draw = (id, at, d) => {
        const p = document.getElementById(id);
        tl.set(p, { opacity: 1 }, at);
        tl.fromTo(p, { strokeDashoffset: +p.dataset.len }, { strokeDashoffset: 0, duration: d || 0.5, ease: "power2.out", immediateRender: false }, at);
      };
      // A dashed cut line is drawn by widening a clip, so its own dashes stay.
      const cut = (id, at, d) => {
        tl.fromTo("#" + id, { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: d, ease: "none", immediateRender: false }, at);
      };
      const bump = (sel, at) => tl.fromTo(sel, { scale: 1 }, { scale: 1.08, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);
      const type = (sel, at, n, d) => tl.fromTo(sel, { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: d || 0.04 * n, ease: `steps(${n})`, immediateRender: false }, at);
      const cursorTo = (x, y, at, d) => tl.to("#s-cursor", { x: x, y: y, duration: d || 0.45, ease: "power3.inOut" }, at);
      const cursorIn = (at) => tl.to("#s-cursor", { opacity: 1, duration: 0.2 }, at);
      const cursorOut = (at) => tl.to("#s-cursor", { opacity: 0, duration: 0.2 }, at);

      /* ---- set up ---- */
      tl.set("#s-cursor", { x: 600, y: 700 }, 0);
      tl.set("#sc", { x: 40, y: 194 }, 0);

      /* ---- 1. One big recipe card, plan_dinner, with four jobs ---- */
      tl.fromTo("#g", { y: 0 }, { y: -8, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 0.2);
      tl.fromTo(".gl", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, stagger: 0.06, ease: "power2.out", immediateRender: false }, t(4));
      draw("r-plan", t(8), 0.45);
      out("#r-plan", t(11) - 0.2, 0.2);
      show("#bd1", t(11), 0.3); pop("#j1", t(11), { from: 0.7 });
      show(["#bd2a", "#bd2b"], t(17), 0.3); pop("#j2", t(17), { from: 0.7 });
      show(["#bd3a", "#bd3b"], t(19), 0.3); pop("#j3", t(19), { from: 0.7 });
      show("#bd4", t(21), 0.3); pop("#j4", t(21), { from: 0.7 });
      bump("#j1", t(24)); bump("#j2", t(24) + 0.12); bump("#j3", t(24) + 0.24); bump("#j4", t(24) + 0.36);

      /* ---- 2. Chloe wants the kcal as a number. The card only prints: None ---- */
      pop("#m-chl", t(29), { from: 0.7 });
      bump("#m-chl", t(35));
      type("#o-c1", t(35) + 0.1, 40, 0.8);
      show("#o-c2", t(43), 0.25);
      pop("#o-c3", t(47), { from: 0.5 });
      show("#copybox", t(54), 0.3);
      pop("#p-copy", t(54) + 0.1, { from: 0.6 });

      /* ---- 3. A bug hides in the middle: Ben gets 6 g protein ---- */
      out(["#copybox", "#p-copy", "#o-c1", "#o-c2", "#o-c3", "#m-chl"], t(60), 0.25);
      draw("r-mid", t(62), 0.6);
      pop("#m-ben", t(65), { from: 0.7 });
      show("#o-b1", t(65), 0.2);
      show("#o-b2", t(65) + 0.3, 0.2);
      draw("r-six", t(67), 0.4);
      out("#r-mid", t(71) - 0.2, 0.2);
      tl.fromTo(["#q2", "#q3", "#q4", "#q5", "#q6", "#q7", "#q8", "#q9", "#q10", "#q11", "#q12"], { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.25, stagger: 0.08, ease: "back.out(2)", immediateRender: false }, t(71));

      /* ---- 4. Cut the card up. If you need "and", split it ---- */
      out(["#q2", "#q3", "#q4", "#q5", "#q6", "#q7", "#q8", "#q9", "#q10", "#q11", "#q12", "#r-six", "#o-b1", "#o-b2", "#m-ben"], t(75), 0.25);
      tl.to("#sc", { opacity: 1, duration: 0.15 }, t(76) - 0.15);
      tl.to("#sc", { x: 1290, duration: 0.42, ease: "none" }, t(76));
      cut("cut1", t(76), 0.42);
      tl.set("#sc", { x: 40, y: 392 }, t(76) + 0.45);
      tl.to("#sc", { x: 1290, duration: 0.42, ease: "none" }, t(76) + 0.48);
      cut("cut2", t(76) + 0.48, 0.42);
      tl.set("#sc", { x: 40, y: 642 }, t(76) + 0.93);
      tl.to("#sc", { x: 1290, duration: 0.42, ease: "none" }, t(76) + 0.96);
      cut("cut3", t(76) + 0.96, 0.42);
      out("#sc", t(76) + 1.4, 0.2);
      show("#o-and", t(80), 0.3);
      bump("#and1", t(85)); bump("#and2", t(85) + 0.15); bump("#and3", t(85) + 0.3);

      // split: the giant card leaves, the short plan_dinner and four small cards arrive
      tl.to("#g", { opacity: 0, scale: 0.92, duration: 0.35, ease: "power2.in" }, t(91));
      out(["#j1", "#j2", "#j3", "#j4", "#cut1", "#cut2", "#cut3"], t(91), 0.3);
      tl.fromTo("#p", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out", immediateRender: false }, t(91) + 0.35);
      const cardIn = (sel, at) => tl.fromTo(sel, { opacity: 0, x: -260, rotation: -4 }, { opacity: 1, x: 0, rotation: 0, duration: 0.5, ease: "back.out(1.3)", immediateRender: false }, at);
      cardIn("#k1", t(93));
      cardIn("#k2", t(95));
      cardIn("#k3", t(97));
      cardIn("#k4", t(100));
      tl.fromTo(".card .jb", { color: "#3e3b52" }, { color: "#3b37e6", duration: 0.2, yoyo: true, repeat: 1, immediateRender: false }, t(102));
      pop(["#rt1", "#rt2", "#rt3", "#rt4"], t(107), { from: 0.5 });

      /* ---- 5. plan_dinner is just four calls ---- */
      type("#P3", t(111), 37, 0.35);
      type("#P4", t(111) + 0.4, 37, 0.35);
      type("#P5", t(111) + 0.8, 31, 0.35);
      type("#P6", t(111) + 1.2, 53, 0.45);
      pop("#rb1", t(115), { from: 0.3 });
      pop("#rb2", t(115) + 0.1, { from: 0.3 });
      pop("#rb3", t(115) + 0.2, { from: 0.3 });
      pop("#rb4", t(115) + 0.3, { from: 0.3 });

      /* ---- 6. Chloe's number is one call: 765 ---- */
      tl.fromTo("#chl", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out", immediateRender: false }, t(117) - 0.1);
      tl.set("#s-cursor", { x: 132, y: 720 }, t(118) - 0.3);
      cursorIn(t(118) - 0.3);
      type("#CH1", t(118), 46, 0.9);
      cursorTo(132 + 46 * 16.8, 720, t(118), 0.9);
      cursorOut(t(118) + 1.0);
      draw("r-c3", t(120), 0.4);
      pop("#v765", t(122), { from: 0.4 });
      draw("r-v765", t(124), 0.4);
      pop("#m-chl2", t(125), { from: 0.7 });

      /* ---- 7. Check one card on its own ---- */
      out(["#r-c3", "#r-v765"], t(127) - 0.2, 0.2);
      bump("#k2", t(127) - 0.1);
      out(["#p", "#rb1", "#rb2", "#rb3", "#rb4", "#k1", "#k2", "#k3", "#k4", "#chl", "#v765", "#m-chl2"], t(127) + 0.2, 0.3);
      tl.fromTo("#k", { opacity: 0, scale: 0.6, x: 300, y: -200 }, { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.55, ease: "expo.out", immediateRender: false }, t(127) + 0.3);
      type("#K8", t(133) - 0.1, 51, 0.6);
      draw("r-chili", t(133) + 0.3, 0.3);
      draw("r-salad", t(135), 0.3);
      draw("r-want", t(138), 0.4);
      out(["#r-chili", "#r-salad"], t(140), 0.2);
      pop("#k-out3", t(143), { from: 0.4 });
      pop("#k-st1", t(143) + 0.15, { from: 0.6 });
      out("#r-want", t(144), 0.2);
      draw("r-bug", t(148), 0.5);
      pop("#k-bug", t(148) + 0.3, { from: 0.6 });
      tl.set("#s-cursor", { x: 760, y: 560 }, t(150));
      cursorIn(t(150));
      cursorTo(K(14) + 4, ky(5) + 6, t(150) + 0.1, 0.45);
      out(["#r-bug", "#k-bug"], t(151) - 0.1, 0.2);
      out("#K5", t(151) + 0.1, 0.15);
      pop("#K5b", t(151) + 0.1, { from: 0.8, d: 0.35 });
      cursorOut(t(152));
      out(["#k-out3", "#k-st1"], t(152), 0.15);
      pop("#k-out21", t(152) + 0.1, { from: 0.4 });
      pop("#k-st2", t(153) - 0.1, { from: 0.6 });

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.2, ease: "power2.in" }, 58.2);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
  </script>
