        const p = document.getElementById(id);
        p.setAttribute("d", `M${x1} ${y1} Q${qx} ${qy} ${x2} ${y2} M${h1[0]} ${h1[1]} L${x2} ${y2} L${h2[0]} ${h2[1]}`);
        prep(p);
      };
      const CW = 20.4;
      const cx = (c0, c1) => 136 + ((c0 + c1 + 1) / 2) * CW;
      const rw = (c0, c1) => ((c1 - c0 + 1) * CW) / 2 + 16;
      const ry = (r) => 212 + (r - 1) * 56;

      // the recipe book
      arrowPath("a-tc", 1410, 278, 1380, 300, 1345, 336);
      arrowPath("a-ts", 1590, 278, 1620, 300, 1655, 336);
      arrowPath("a-sf", 1660, 522, 1662, 550, 1660, 578);
      // the code
      ring("r-own", cx(12, 28), ry(5), rw(12, 28), 30);      // recipe["minutes"] on line 5
      ring("r-call", cx(17, 34), ry(7), rw(17, 34), 30);     // total_minutes(sub) on line 7
      ring("r-call2", cx(17, 34), ry(7), rw(17, 34), 30);
      arrowPath("a-self", cx(17, 34) + 120, ry(7) - 30, 1100, 330, 660, ry(1) + 4);  // calls itself: back to the def line
      ring("r-base", 136 + 18 * CW, (ry(3) + ry(4)) / 2, 15 * CW + 20, 66);         // lines 3 and 4
      ring("r-base2", 136 + 18 * CW, (ry(3) + ry(4)) / 2, 15 * CW + 20, 66);
      ring("r-out", 136 + 20, 96 + 728 + 24, 50, 32);        // 65 in the output
      ring("r-err", 136 + 7 * 18, 96 + 728 + 24, 7 * 18 + 20, 32);  // RecursionError
      ring("r-mis", 1458, 452, 70, 30);                      // uses: sponge
      // the way to the stop
      arrowPath("a-c1", 1500, 240, 1502, 270, 1500, 304);
      arrowPath("a-c2", 1500, 410, 1502, 440, 1500, 474);
      arrowPath("a-c3", 1500, 580, 1502, 615, 1500, 652);

      const pop = (sel, at, o) => { o = o || {}; tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.45, ease: o.ease || "back.out(1.6)", immediateRender: false }, at); };
      const show = (sel, at, d) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d || 0.3, ease: "power2.out", immediateRender: false }, at);
      const out = (sel, at, d) => tl.to(sel, { opacity: 0, duration: d || 0.25, ease: "power2.in" }, at);
      const draw = (id, at, d) => {
        const p = document.getElementById(id);
        tl.set(p, { opacity: 1 }, at);
        tl.fromTo(p, { strokeDashoffset: +p.dataset.len }, { strokeDashoffset: 0, duration: d || 0.5, ease: "power2.out", immediateRender: false }, at);
      };
      const bump = (sel, at) => tl.fromTo(sel, { scale: 1 }, { scale: 1.06, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);
      const type = (sel, at, n, d) => tl.fromTo(sel, { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: d || 0.03 * n, ease: `steps(${n})`, immediateRender: false }, at);
      const swap = (a, b, at) => { tl.to(a, { opacity: 0, duration: 0.15 }, at); tl.fromTo(b, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)", immediateRender: false }, at + 0.1); };
      const drop = (sel, at) => tl.fromTo(sel, { opacity: 0, y: -70 }, { opacity: 1, y: 0, duration: 0.45, ease: "bounce.out", immediateRender: false }, at);
      const leave = (sel, at) => tl.to(sel, { opacity: 0, x: 120, duration: 0.4, ease: "power2.in" }, at);
      const cursorTo = (x, y, at, d) => tl.to("#s-cursor", { x: x, y: y, duration: d || 0.45, ease: "power3.inOut" }, at);
      const cursorIn = (at) => tl.to("#s-cursor", { opacity: 1, duration: 0.2 }, at);
      const cursorOut = (at) => tl.to("#s-cursor", { opacity: 0, duration: 0.2 }, at);
      // A chip flies from (x0, y0) to (x1, y1), centre points, with a little hop to the left.
      const CHW = 130, CHH = 84;
      const fly = (sel, x0, y0, x1, y1, at, d) => {
        d = d || 0.8;
        tl.set(sel, { x: x0 - CHW / 2, y: y0 - CHH / 2, scale: 0.5 }, at - 0.01);
        tl.to(sel, { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" }, at);
        tl.to(sel, { x: x1 - CHW / 2 - 40, duration: d * 0.5, ease: "power2.out" }, at + 0.15);
        tl.to(sel, { x: x1 - CHW / 2, duration: d * 0.5, ease: "power2.in" }, at + 0.15 + d * 0.5);
        tl.to(sel, { y: y1 - CHH / 2, duration: d, ease: "power2.inOut" }, at + 0.15);
        tl.to(sel, { opacity: 0, scale: 0.6, duration: 0.2, ease: "power2.in" }, at + 0.15 + d);
      };
      // centre of the value on a plate at each level
      const VX = 1745, V0 = 828, V1 = 702, V2 = 576;

      /* ---- set up ---- */
      tl.set("#s-cursor", { x: 760, y: 760 }, 0);

      /* ---- 1. Chloe wants a trifle. Trifle uses custard and sponge, sponge uses flour mix ---- */
      bump("#m-chloe", t(3));
      pop("#c-tri", t(5), { from: 0.6 });
      draw("a-tc", t(9) - 0.15, 0.35);
      pop("#c-cus", t(9), { from: 0.6 });
      draw("a-ts", t(13) - 0.15, 0.35);
      pop("#c-spo", t(13), { from: 0.6 });
      draw("a-sf", t(20) - 0.15, 0.35);
      pop("#c-flo", t(20), { from: 0.6 });
      tl.fromTo("#cap", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out", immediateRender: false }, t(22) - 0.1);
      bump(["#c-cus", "#c-spo"], t(23));
      bump("#c-flo", t(24));

      /* ---- 2. How long does it all take? ---- */
      pop("#mn-tri", t(26), { from: 0.4 });
      pop("#mn-cus", t(26) + 0.25, { from: 0.4 });
      pop("#mn-spo", t(26) + 0.5, { from: 0.4 });
      pop("#mn-flo", t(26) + 0.75, { from: 0.4 });

      /* ---- 3. One card, total minutes: own minutes, then it calls itself ---- */
      out(["#m-chloe", "#cap"], t(31) - 0.4, 0.3);
      tl.fromTo("#s-code", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out", immediateRender: false }, t(31) - 0.2);
      type("#L1", t(31) + 0.2, 24, 0.45);
      type("#L2", t(33), 26, 0.4);
      type("#L3", t(33) + 0.4, 28, 0.4);
      type("#L4", t(33) + 0.8, 32, 0.4);
      type("#L5", t(34), 29, 0.4);
      type("#L6", t(34) + 0.4, 30, 0.4);
      type("#L7", t(34) + 0.8, 35, 0.4);
      type("#L8", t(35) + 0.2, 16, 0.3);
      type("#L10", t(35) + 0.5, 30, 0.4);
      tl.set("#s-cursor", { x: 820, y: 760 }, t(38) - 0.7);
      cursorIn(t(38) - 0.7);
      cursorTo(cx(12, 28) + 40, ry(5) + 12, t(38) - 0.6, 0.55);
      draw("r-own", t(40), 0.4);
      bump("#mn-tri", t(40));
      cursorTo(cx(17, 34) + 60, ry(7) + 12, t(42), 0.45);
      draw("r-call", t(43), 0.4);
      cursorOut(t(44) + 0.1);
      draw("a-self", t(44), 0.6);
      bump(["#c-cus", "#c-spo"], t(46));
      bump("#c-flo", t(48));

      /* ---- 4. Every call gets its own pan, and a plate on the pile ---- */
      out(["#c-tri", "#c-cus", "#c-spo", "#c-flo", "#a-tc", "#a-ts", "#a-sf", "#r-own", "#a-self"], t(49) - 0.35, 0.3);
      show(["#slab", "#pile-h", "#pile-s"], t(49), 0.3);
      drop("#p-tri", t(49) + 0.1);
      drop("#p-cus", t(50) + 0.1);
      pop("#pan", t(54), { from: 0.6 });
      bump(["#p-tri", "#p-cus"], t(57));
      out("#r-call", t(57), 0.2);

      /* ---- 5. Custard uses nothing: it stops and hands back 20. Trifle is at 35 ---- */
      out("#pan", t(61) - 0.2, 0.2);
      draw("r-base", t(61), 0.45);
      bump("#p-cus", t(66));
      fly("#ch20", VX, V1, VX, V0, t(68), 0.9);
      leave("#p-cus", t(69));
      swap("#v-t15", "#v-t35", t(74) - 0.1);
      out("#r-base", t(75), 0.2);

      /* ---- 6. Sponge calls flour mix: 5. Sponge hands back 30. The plates come off: 65 ---- */
      drop("#p-spo", t(76));
      drop("#p-flo", t(78));
      fly("#ch5", VX, V2, VX, V1, t(80) - 0.2, 0.8);
      leave("#p-flo", t(80) + 0.1);
      swap("#v-s25", "#v-s30", t(81) - 0.15);
      fly("#ch30", VX, V1, VX, V0, t(82), 0.9);
      leave("#p-spo", t(83));
      swap("#v-t35", "#v-t65", t(88));
      show("#o-65", t(89), 0.3);
      draw("r-out", t(89) + 0.1, 0.4);
      bump("#p-tri", t(91));

      /* ---- 7. That stop is the base case: a recipe that uses nothing ---- */
      out(["#p-tri", "#slab", "#pile-h", "#pile-s", "#r-out"], t(94) - 0.1, 0.3);
      draw("r-base2", t(95), 0.45);
      pop("#n-base", t(98), { from: 0.6 });
      pop(["#d-cus", "#d-flo"], t(101), { from: 0.6 });
      pop(["#t-stop1", "#t-stop2"], t(104), { from: 0.6 });

      /* ---- 8. Sponge lists sponge, by mistake. The pile grows. RecursionError ---- */
      out(["#d-cus", "#d-flo", "#t-stop1", "#t-stop2", "#r-base2", "#n-base", "#o-65"], t(105), 0.25);
      pop("#c-mis", t(107), { from: 0.6 });
      draw("r-mis", t(109), 0.4);
      pop("#t-oops", t(110), { from: 0.6 });
      out(["#c-mis", "#t-oops", "#r-mis"], t(112) - 0.3, 0.25);
      show("#tp0", t(112), 0.2);
      draw("r-call2", t(113), 0.4);
      for (let j = 1; j < 20; j++) {
        tl.fromTo(`#tp${j}`, { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.18, ease: "power2.out", immediateRender: false }, t(113) + (j - 1) * 0.17);
      }
      show("#ceil", t(119), 0.3);
      pop("#t-1000", t(125), { from: 0.6 });
      tl.fromTo("#stamp", { opacity: 0, scale: 1.8, rotation: -8 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.35, ease: "power3.in", immediateRender: false }, t(128) - 0.25);
      show(["#o-e1", "#o-e2"], t(129), 0.3);
      draw("r-err", t(129) + 0.1, 0.45);

      /* ---- 9. Every call must move toward the stop ---- */
      const tower = []; for (let j = 0; j < 20; j++) tower.push(`#tp${j}`);
      out(tower.concat(["#ceil", "#t-1000", "#stamp", "#r-call2"]), t(131) - 0.2, 0.3);
      out(["#o-e1", "#o-e2", "#r-err"], t(131), 0.25);
      pop("#ch-tri", t(131), { from: 0.6 });
      draw("a-c1", t(132), 0.3);
      pop("#ch-spo", t(132) + 0.25, { from: 0.6 });
      draw("a-c2", t(134), 0.3);
      pop("#ch-flo", t(134) + 0.25, { from: 0.6 });
      draw("a-c3", t(136), 0.3);
      pop("#ch-stop", t(137), { from: 0.6 });

      /* ---- 10. A plain loop for counting. Recursion for things inside things ---- */
      out(["#ch-tri", "#ch-spo", "#ch-flo", "#ch-stop", "#a-c1", "#a-c2", "#a-c3"], t(138), 0.25);
      tl.to("#s-code", { opacity: 0.35, duration: 0.4 }, t(138));
      pop("#b-loop", t(139), { from: 0.7 });
      type("#lc1", t(143) - 0.2, 10, 0.25);
      type("#lc2", t(143) + 0.1, 21, 0.35);
      type("#lc3", t(143) + 0.5, 23, 0.35);
      type("#lc4", t(144), 17, 0.3);
      bump("#b-loop", t(146));
      pop("#b-nest", t(147), { from: 0.7 });
      pop("#nz-tri", t(150), { from: 0.7 });
      pop(["#nz-cus", "#nz-spo"], t(152), { from: 0.6 });
      pop("#nz-flo", t(152) + 0.35, { from: 0.5 });

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.25, ease: "power2.in" }, 67.7);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
  </script>
