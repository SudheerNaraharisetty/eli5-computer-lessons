      const type = (sel, at, n, d) => tl.fromTo(sel, { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: d || 0.04 * n, ease: `steps(${n})`, immediateRender: false }, at);
      const swapLine = (a, b, at) => { tl.to(a, { opacity: 0, duration: 0.15 }, at); tl.fromTo(b, { opacity: 0, x: 14 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, at + 0.1); };
      const swapSay = (a, b, at) => { tl.to(a, { opacity: 0, duration: 0.12 }, at); tl.fromTo(b, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(2)", immediateRender: false }, at + 0.08); };
      const cursorTo = (x, y, at, d) => tl.to("#s-cursor", { x: x, y: y, duration: d || 0.45, ease: "power3.inOut" }, at);
      const drawNet = (id, at) => document.getElementById(id).querySelectorAll(".nm").forEach((p, i) => draw(p, at + i * 0.08, 0.5));
      const hideNet = (id, at) => tl.to(document.getElementById(id).querySelectorAll(".nm"), { opacity: 0, duration: 0.25 }, at);

      // The dish: its plate centre is local (110, 86).
      const P = (x, y) => ({ x: x - 110, y: y - 86 });
      const COUNTER = [1320, 312], EDGE = [1420, 312], NET = [1660, 676], FLOOR = [1640, 944];
      // Slide to the edge, then fall in an arc to (x, y).
      const fall = (at, x, y, d) => {
        tl.to("#dish", Object.assign(P(EDGE[0], EDGE[1]), { duration: 0.4, ease: "power1.in" }), at);
        tl.to("#dish", { x: x - 110, duration: d, ease: "power1.out" }, at + 0.4);
        tl.to("#dish", { y: y - 86, duration: d, ease: "power2.in" }, at + 0.4);
        tl.to("#dish", { rotation: 14, duration: d, ease: "power1.in" }, at + 0.4);
      };
      // The bug: local centre (40, 36).
      const B = (x, y) => ({ x: x - 40, y: y - 36 });
      // The lens: glass centre is local (110, 110).
      const Lz = (x, y) => ({ x: x - 110, y: y - 110 });

      /* ---- set up ---- */
      tl.set("#dish", Object.assign(P(COUNTER[0], COUNTER[1]), { rotation: 0 }), 0);
      tl.set("#s-cursor", { x: 700, y: 700 }, 0);
      tl.set("#bug", B(1420, 296), 0);
      tl.set("#lens", Lz(1900, 1000), 0);

      /* ---- 1. Kitchen Coach asks. Ana types the word two ---- */
      type("#A1", t(3) - 0.2, 44, 0.8);
      show("#o1", t(4), 0.25);
      show(["#A2", "#A3", "#A4"], t(5) - 0.2, 0.35);
      bump("#m-ana", t(6));
      swapSay("#say0", "#say1", t(10) - 0.1);
      show("#o1b", t(10), 0.2);

      /* ---- 2. int cannot read a word. ValueError. Crash. The rest never runs ---- */
      draw("r-int", t(11), 0.4);
      show(["#o1e1", "#o1e2"], t(19), 0.25);
      draw("r-verr", t(19) + 0.3, 0.4);
      pop("#dtag", t(19), { from: 0.5 });
      tl.fromTo("#dish", { rotation: 0 }, { rotation: -6, duration: 0.12, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, t(20));
      fall(t(21), FLOOR[0], FLOOR[1], 0.75);
      tl.to("#dish", { opacity: 0, duration: 0.08 }, t(21) + 1.15);
      pop("#shards", t(21) + 1.15, { from: 0.4, d: 0.3 });
      pop("#t-crash", t(23), { from: 0.5 });
      out("#r-int", t(24), 0.2);
      tl.to(["#A2", "#A3", "#A4"], { opacity: 0.3, duration: 0.3 }, t(25));
      pop("#n-never", t(26), { from: 0.6 });
      bump("#t-crash", t(33));

      /* ---- 3. Put the risky line inside try. except ValueError is a net ---- */
      out(["#A1", "#A2", "#A3", "#A4", "#n-never", "#o1", "#o1b", "#o1e1", "#o1e2", "#r-verr", "#shards", "#t-crash"], t(36) - 0.1, 0.25);
      swapSay("#say1", "#say0", t(36));
      tl.set("#dish", Object.assign(P(COUNTER[0], COUNTER[1]), { rotation: 0 }), t(36) + 0.2);
      tl.set("#dtag", { opacity: 0 }, t(36) + 0.2);
      pop("#dish", t(37), { from: 0.5 });
      show("#B1", t(37) + 0.1, 0.3);
      type("#B2", t(41), 4, 0.25);
      show("#B3", t(41) + 0.15, 0.3);
      draw("r-try", t(42), 0.4);
      type("#B4", t(45), 18, 0.5);
      show("#B5", t(46), 0.3);
      out("#r-try", t(45), 0.2);
      draw("r-exc", t(45) + 0.5, 0.45);
      drawNet("net-s", t(50) - 0.15);
      show("#nl-small", t(50), 0.3);

      /* ---- 4. When that error falls, the net catches it. The program carries on ---- */
      swapSay("#say0", "#say1", t(51) - 0.1);
      show("#o2a", t(51), 0.25);
      pop("#dtag", t(53), { from: 0.5 });
      fall(t(54) - 0.3, NET[0], NET[1], 0.75);
      tl.fromTo("#net-s", { y: 0 }, { y: 14, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, t(57) - 0.25);
      tl.to("#dish", { rotation: 0, duration: 0.3, ease: "back.out(2)" }, t(57) - 0.2);
      pop("#t-caught", t(57), { from: 0.5 });
      out("#r-exc", t(59), 0.2);
      show("#o2b", t(64), 0.25);

      /* ---- 5. A while True loop asks again. Ana types 3. break. Cooking for 3 ---- */
      out(["#B1", "#B2", "#B3", "#B4", "#B5"], t(68), 0.2);
      show(["#C2", "#C3", "#C4", "#C5", "#C6", "#C7", "#C9"], t(68) + 0.2, 0.3);
      type("#C1", t(72), 11, 0.35);
      out("#t-caught", t(74), 0.2);
      show("#o2c", t(78), 0.25);
      swapSay("#say1", "#say2", t(82) - 0.15);
      show("#o2cb", t(82), 0.2);
      draw("r-break", t(83), 0.35);
      show("#o2d", t(84), 0.25);
      tl.set("#dtag", { opacity: 0 }, t(84) - 0.01);
      tl.to("#dish", Object.assign(P(COUNTER[0], COUNTER[1] - 40), { duration: 0.35, ease: "power2.out" }), t(84));
      tl.to("#dish", Object.assign(P(COUNTER[0], COUNTER[1]), { duration: 0.25, ease: "bounce.out" }), t(84) + 0.35);

      /* ---- 6. A giant net. A bare except catches every error, and hides a typo ---- */
      out(["#r-break", "#o2a", "#o2b", "#o2c", "#o2cb", "#o2d"], t(87), 0.25);
      hideNet("net-s", t(88));
      out("#nl-small", t(88), 0.25);
      drawNet("net-g", t(89));
      show("#nl-giant", t(90), 0.3);
      swapLine("#C6", "#C6x", t(93) - 0.1);
      draw("r-bare", t(93) + 0.3, 0.4);
      pop("#t-every", t(95), { from: 0.6 });
      out("#t-every", t(97) - 0.1, 0.2);
      tl.set("#s-cursor", { x: 820, y: 520 }, t(97) - 0.3);
      tl.to("#s-cursor", { opacity: 1, duration: 0.2 }, t(97) - 0.3);
      cursorTo(cx(23, 28) - 20, ry(4) + 14, t(97) - 0.1, 0.45);
      swapLine("#C4", "#C4x", t(99));
      draw("r-typo", t(99) + 0.3, 0.4);
      tl.to("#s-cursor", { opacity: 0, duration: 0.2 }, t(101));
      // the bug drops into the giant net
      pop("#bug", t(102) - 0.2, { from: 0.4, d: 0.3 });
      tl.to("#bug", { x: 1700 - 40, duration: 0.7, ease: "power1.out" }, t(102) + 0.2);
      tl.to("#bug", { y: 760 - 36, duration: 0.7, ease: "power2.in" }, t(102) + 0.2);
      tl.fromTo("#net-g", { y: 0 }, { y: 12, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, t(102) + 0.85);
      // the lens shows what is in the net
      tl.set("#lens", { opacity: 1 }, t(104) - 0.4);
      tl.to("#lens", Object.assign(Lz(1700, 770), { duration: 0.5, ease: "power3.out" }), t(104) - 0.4);
      pop("#t-hidden", t(108), { from: 0.6 });
      tl.to("#lens", Object.assign(Lz(1900, 1060), { opacity: 0, duration: 0.4, ease: "power2.in" }), t(114) - 0.1);
      bump("#t-hidden", t(114));
      // Ana types 3, and hears: please type a number. Forever.
      swapSay("#say2", "#say3", t(116));
      show("#o3a", t(117), 0.25);
      show("#o3b", t(121) - 0.1, 0.25);
      show("#o3c", t(124) - 0.2, 0.2);
      show("#o3d", t(125), 0.2);
      pop("#t-forever", t(125), { from: 0.6 });

      /* ---- 7. The small net. Catch ValueError only, around the one risky line ---- */
      out(["#t-forever", "#t-hidden", "#r-bare", "#r-typo", "#o3a", "#o3b", "#o3c", "#o3d", "#nl-giant"], t(126), 0.25);
      hideNet("net-g", t(128) - 0.1);
      drawNet("net-s", t(128));
      show("#nl-small", t(128) + 0.2, 0.3);
      // the bug is not a ValueError: it falls through the small net to the floor
      tl.to("#bug", { y: 940 - 36, duration: 0.55, ease: "power2.in" }, t(128) + 0.1);
      swapLine("#C6x", "#C6f", t(130));
      draw("r-exc2", t(130) + 0.3, 0.4);
      out("#r-exc2", t(134) - 0.1, 0.2);
      draw("r-risky", t(137) - 0.2, 0.45);
      // the typo shows itself
      show(["#o4a", "#o4b"], t(141) - 0.2, 0.25);
      pop("#t-name", t(141), { from: 0.5 });
      bump("#bug", t(142));
      // fix it
      out("#r-risky", t(144) - 0.25, 0.2);
      swapLine("#C4x", "#C4f", t(144) - 0.15);
      out(["#bug", "#t-name", "#o4a", "#o4b"], t(144) + 0.05, 0.2);
      show("#o5a", t(144) + 0.2, 0.2);
      show("#o5b", t(144) + 0.35, 0.25);

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.25, ease: "power2.in" }, 61.95);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
  </script>
