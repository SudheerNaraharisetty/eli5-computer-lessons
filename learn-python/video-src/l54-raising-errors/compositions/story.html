      swap("#rg-1", "#rg-1b", t(29));

      swap("#rv-1", "#rv-1n", t(40));
      bump("#rv-1n", t(44));
      out("#r-typo", t(46), 0.25);
      swap("#bv-a", "#bv-b", t(49));
      out("#o-695a", t(49), 0.15);
      show("#o-185", t(49) + 0.1, 0.2);

      type("#G2", t(67) + 0.7, 17, 0.4);

      show("#o-43", t(85) + 0.1, 0.2);
      tl.fromTo("#stamp", { opacity: 0, scale: 2.2, rotation: -8 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.35, ease: "power3.in", immediateRender: false }, t(87));
