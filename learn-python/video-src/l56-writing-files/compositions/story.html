      const t = (i) => W[i] + 0.6;
      const tl = gsap.timeline({ paused: true });

      // Rings in page pixels. Code text starts at x 136, 18 px per char. Row r centre y = 209 + (r - 1) * 50.
      const ring = (id, cx, cy, rx, ry) => {
        const d = `M${cx - rx + 6} ${cy + 4} C${cx - rx + 2} ${cy - ry} ${cx + rx} ${cy - ry - 3} ${cx + rx} ${cy} C${cx + rx} ${cy + ry} ${cx - rx - 3} ${cy + ry + 3} ${cx - rx} ${cy - 8}`;
        const p = document.getElementById(id); p.setAttribute("d", d);
        const L = p.getTotalLength(); p.dataset.len = L;
        if (id !== "r-crash") { p.style.strokeDasharray = L; p.style.strokeDashoffset = L; }
      };
      const CW = 18;
      const cx = (c0, c1) => 136 + ((c0 + c1 + 1) / 2) * CW;
      const rw = (c0, c1) => ((c1 - c0 + 1) * CW) / 2 + 14;
      const ry = (r) => 209 + (r - 1) * 50;
      ring("r-tab", 1412, 151, 214, 46);              // the file name on the notebook tab

      ring("r-close", cx(0, 8), ry(6), rw(0, 8), 28);  // f.close()

        if (id === "r-crash") { tl.fromTo(p, { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, at); return; }
        tl.fromTo(p, { strokeDashoffset: +p.dataset.len }, { strokeDashoffset: 0, duration: d || 0.5, ease: "power2.out", immediateRender: false }, at);
      };
      const bump = (sel, at) => tl.fromTo(sel, { scale: 1 }, { scale: 1.08, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);
      const type = (sel, at, n, d) => tl.fromTo(sel, { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: d || 0.04 * n, ease: `steps(${n})`, immediateRender: false }, at);
      const cursorTo = (x, y, at, d) => tl.to("#s-cursor", { x: x, y: y, duration: d || 0.45, ease: "power3.inOut" }, at);
      const cursorIn = (at) => tl.to("#s-cursor", { opacity: 1, duration: 0.2 }, at);
      const cursorOut = (at) => tl.to("#s-cursor", { opacity: 0, duration: 0.2 }, at);
      const swap = (a, b, at) => { out(a, at, 0.15); pop(b, at + 0.1, { from: 0.5 }); };
      // The pen writes a row: it slides along the row while the text types in. Row top y, chars n.
      const rowY = (i) => 220 + i * 72;
      const write = (sel, at, row, x0, n, d) => {
        d = d || Math.max(0.3, 0.05 * n);
        tl.set("#pen", { x: x0 - 10, y: rowY(row) - 70 }, at - 0.01);
        tl.to("#pen", { opacity: 1, duration: 0.12 }, at);
        tl.to("#pen", { x: x0 - 10 + n * 22.8, duration: d, ease: `steps(${n})` }, at);
        type(sel, at, n, d);
      };
      const penOut = (at) => tl.to("#pen", { opacity: 0, duration: 0.2 }, at);
      // The eraser zigzags down the page over rows first..last, fading each row as it passes.
      const erase = (rows, at, sels) => {
        const n = rows.length, step = 0.22;
        tl.set("#eraser", { x: 1240, y: rowY(rows[0]) - 10 }, at - 0.01);
        tl.to("#eraser", { opacity: 1, duration: 0.12 }, at);
        rows.forEach((r, k) => {
          tl.to("#eraser", { x: k % 2 ? 1240 : 1560, y: rowY(r) - 10, duration: step, ease: "power1.inOut" }, at + k * step);
          out(sels[k], at + k * step + 0.08, step);
        });
        tl.to("#eraser", { opacity: 0, duration: 0.2 }, at + n * step + 0.05);
      };

      /* ---- set up ---- */
      tl.set("#s-cursor", { x: 600, y: 500 }, 0);
      tl.set("#stamp", { rotation: -8 }, 0);

      /* ---- 1. After dinner, Kitchen Coach saves next week's list ---- */
      bump("#kc-h", t(2));
      pop("#kc-1", t(9), { from: 0.5 });
      pop("#kc-2", t(10), { from: 0.5 });
      pop("#kc-3", t(12), { from: 0.5 });
      out("#kc-g", t(13), 0.3);
      tl.fromTo("#s-code", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out", immediateRender: false }, t(13) + 0.1);
      type("#S1", t(13) + 0.45, 35, 0.6);
      draw("r-tab", t(17), 0.5);

      /* ---- 2. open with "w": a clean page ---- */
      out("#r-tab", t(22) - 0.2, 0.2);
      type("#S3", t(23), 30, 0.5);
      draw("r-w", t(27), 0.4);
      bump("#nb", t(31));
      pop("#n-new", t(35), { from: 0.6 });
      pop("#n-old", t(40), { from: 0.6 });
      erase([0, 1, 2], t(44) - 0.1, ["#old-0", "#old-1", "#old-2"]);
      out("#own-1", t(44) + 0.5, 0.2);

      /* ---- 3. write adds no new line: the words crash together ---- */
      out(["#n-new", "#n-old", "#r-w"], t(46) - 0.2, 0.2);
      type("#S4", t(46), 21, 0.35);
      type("#S5", t(46) + 0.4, 17, 0.3);
      type("#S6", t(46) + 0.75, 9, 0.2);
      write("#w1", t(50), 0, 1232, 4, 0.3);
      write("#w2", t(52), 0, 1323.2, 4, 0.3);
      write("#w3", t(54) + 0.15, 0, 1414.4, 4, 0.3);
      penOut(t(55));
      draw("r-write", t(55), 0.45);
      pop("#n-nonl", t(58), { from: 0.6 });
      tl.to(["#w1", "#w2", "#w3"], { color: "#b8235a", duration: 0.2 }, t(63));
      draw("r-crash", t(63));
      bump(["#w1", "#w2", "#w3"], t(63) + 0.05);

      /* ---- 4. Add \n yourself: every item gets its own line. Close, and it is saved ---- */
      tl.set("#s-cursor", { x: 520, y: 420 }, t(65) - 0.4);
      cursorIn(t(65) - 0.4);
      cursorTo(136 + 20 * CW, 396, t(65) - 0.4, 0.4);
      out(["#r-write", "#n-nonl"], t(65), 0.2);
      swap("#S5", "#S5b", t(66));
      cursorOut(t(67) + 0.2);
      draw("r-nl", t(67), 0.4);
      pop("#n-nl", t(68), { from: 0.6 });
      out(["#w1", "#w2", "#w3", "#r-crash"], t(72) - 0.3, 0.2);
      write("#g0", t(72), 0, 1232, 4, 0.3);
      write("#g1", t(73), 1, 1232, 4, 0.3);
      write("#g2", t(74), 2, 1232, 4, 0.3);
      penOut(t(75) + 0.1);
      out(["#r-nl", "#n-nl"], t(78) - 0.2, 0.2);
      draw("r-close", t(78), 0.4);
      pop(["#saved", "#saved-ok"], t(84), { from: 0.5 });

      /* ---- 5. "a" for append: the dinner log grows ---- */
      out(["#S1", "#S3", "#S4", "#S5b", "#S6", "#r-close", "#g0", "#g1", "#g2", "#saved", "#saved-ok"], t(85), 0.25);
      swap("#tab-1", "#tab-2", t(86));
      swap("#bn-1", "#bn-2", t(86));
      type("#D1", t(90), 32, 0.5);
      draw("r-a", t(95), 0.4);
      pop("#n-a", t(97), { from: 0.6 });
      type("#D2", t(98), 28, 0.4);
      type("#D3", t(98) + 0.35, 9, 0.2);
      write("#d0", t(99), 0, 1232, 16, 0.5);
      penOut(t(99) + 0.6);
      type("#D5", t(100), 32, 0.4);
      type("#D6", t(101), 27, 0.35);
      type("#D7", t(101) + 0.3, 9, 0.2);
      write("#d1", t(101) + 0.35, 1, 1232, 15, 0.5);
      penOut(t(102) + 0.3);
      pop("#plus", t(105) - 0.1, { from: 0.4 });

      /* ---- 6. The danger: "w" on Ana's training log ---- */
      out(["#D1", "#D2", "#D3", "#D5", "#D6", "#D7", "#r-a", "#n-a", "#d0", "#d1", "#plus"], t(106), 0.25);
      swap("#tab-2", "#tab-3", t(109));
      swap("#bn-2", "#bn-3", t(109));
      pop(["#own-2", "#ana"], t(109) + 0.1, { from: 0.6 });
      ["#a0", "#a1", "#a2", "#a3", "#a4"].forEach((s, k) => pop(s, t(112) + k * 0.14, { from: 0.7 }));
      type("#A1", t(117), 34, 0.5);
      type("#A2", t(119) + 0.2, 21, 0.35);
      type("#A3", t(120) + 0.2, 9, 0.2);
      draw("r-w3", t(127), 0.4);
      erase([0, 1, 2, 3, 4], t(131) - 0.1, ["#a0", "#a1", "#a2", "#a3", "#a4"]);
      write("#at0", t(135) - 0.15, 0, 1232, 9, 0.35);
      penOut(t(135) + 0.35);
      pop("#n-gone", t(134), { from: 0.6 });
      tl.fromTo("#stamp", { opacity: 0, scale: 2.2, rotation: -8 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.35, ease: "power3.in", immediateRender: false }, t(136) + 0.1);

      /* ---- 7. Open it with "a": her runs stay safe ---- */
      out(["#stamp", "#n-gone", "#r-w3"], t(139), 0.25);
      tl.set("#s-cursor", { x: 760, y: 330 }, t(139));
      cursorIn(t(139));
      cursorTo(136 + 30 * CW, 196, t(139), 0.45);
      swap("#A1", "#A1b", t(142));
      cursorOut(t(143) + 0.2);
      draw("r-a3", t(142) + 0.1, 0.4);
      out("#at0", t(142) + 0.2, 0.2);
      ["#a0", "#a1", "#a2", "#a3", "#a4"].forEach((s, k) => pop(s, t(142) + 0.35 + k * 0.1, { from: 0.7 }));
      write("#at5", t(145) - 0.1, 5, 1232, 9, 0.35);
      penOut(t(146) + 0.2);
      pop("#n-safe", t(142) + 0.5, { from: 0.6 });
      pop(["#saved", "#saved-ok"], t(145) + 0.3, { from: 0.5 });

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.25, ease: "power2.in" }, 58.7);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
  </script>
