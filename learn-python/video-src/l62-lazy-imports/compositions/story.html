  <script>
    (function () {
      // Word start times from the narration (seconds). The voice starts 0.6 s into the film.
      const W = [0.0, 0.476, 0.778, 0.964, 1.741, 1.939, 2.403, 2.844, 3.39, 3.495, 3.622, 4.644, 4.865, 4.981, 5.387, 5.561, 5.77, 6.56, 6.896, 6.989, 7.361, 7.546, 8.51, 8.673, 9.021, 9.532, 10.008, 10.461, 10.716, 10.809, 10.937, 11.355, 12.063, 12.272, 12.608, 13.549, 13.897, 14.06, 14.234, 14.478, 14.675, 14.803, 15.209, 15.906, 16.196, 16.544, 16.707, 17.125, 17.392, 17.717, 18.936, 19.296, 19.563, 19.76, 19.899, 20.41, 20.584, 20.793, 20.956, 21.049, 21.316, 21.536, 21.838, 22.674, 23.22, 23.556, 23.847, 24.636, 25.101, 25.414, 26.169, 27.016, 27.515, 27.98, 28.212, 28.758, 29.06, 29.176, 29.582, 29.826, 29.93, 30.046, 30.72, 31.974, 32.31, 32.635, 32.763, 33.088, 33.228, 33.379, 33.855, 33.971, 34.064, 35.062, 35.248, 35.503, 35.84, 36.212, 36.316, 36.444, 37.535, 37.779, 38.069, 38.394, 38.557, 38.87, 39.416, 39.834, 40.484, 40.797, 41.761, 42.051, 42.423, 42.678, 42.957, 43.073, 43.305, 43.863, 44.141, 45.024, 45.209, 46.231, 46.742, 46.939, 47.531, 47.798, 48.239, 48.681, 48.855, 48.994, 49.993, 50.213, 50.527, 50.852, 50.991, 51.142, 51.56, 51.908, 52.466, 52.802, 52.976, 53.093, 53.487, 54.242, 54.486, 54.753, 55.078, 55.38, 56.343, 56.808, 57.237, 57.62, 57.911, 58.085, 58.642, 58.967, 59.083, 60.36, 60.848, 61.428, 61.672, 62.044, 62.299, 62.473];
      const t = (i) => W[i] + 0.6;
      const tl = gsap.timeline({ paused: true });

      // Rings in page pixels. Code text starts at x 136, 18 px per char. Row r centre y = 209 + (r - 1) * 50.
      const ringD = (cx, cy, rx, ry) => `M${cx - rx + 6} ${cy + 4} C${cx - rx + 2} ${cy - ry} ${cx + rx} ${cy - ry - 3} ${cx + rx} ${cy} C${cx + rx} ${cy + ry} ${cx - rx - 3} ${cy + ry + 3} ${cx - rx} ${cy - 8}`;
      const setPath = (id, d, dashed) => {
        const p = document.getElementById(id); p.setAttribute("d", d);
        const L = p.getTotalLength(); p.dataset.len = L;
        if (dashed) p.dataset.fade = "1"; else { p.style.strokeDasharray = L; p.style.strokeDashoffset = L; }
      };
      const ring = (id, cx, cy, rx, ry, dashed) => setPath(id, ringD(cx, cy, rx, ry), dashed);
      const CW = 18;
      const cx = (c0, c1) => 136 + ((c0 + c1 + 1) / 2) * CW;
      const rw = (c0, c1) => ((c1 - c0 + 1) * CW) / 2 + 14;
      const ry = (r) => 209 + (r - 1) * 50;
      ring("r-big", 1726, 300, 88, 140);                 // the big cookbook on the shelf
      ring("r-imp", cx(0, 18), ry(7), rw(0, 18), 28);    // import big_cookbook
      ring("r-plan", cx(4, 34), ry(10), rw(4, 34), 30, true); // the plan line, not used in shopping mode
      ring("r-never", 1726, 740, 88, 140, true);         // the big cookbook on the counter, never read
      ring("r-lazy", cx(0, 3), ry(7), rw(0, 3) + 4, 28); // lazy
      ring("r-stays", 1726, 300, 88, 140);               // it stays on the shelf
      ring("r-use", cx(10, 26), ry(10), rw(10, 26), 28); // big_cookbook.plan
      ring("r-typo", cx(12, 22), ry(7), rw(12, 22), 28); // big_cookbok on the import line
      ring("r-typo2", cx(10, 25), ry(10), rw(10, 25), 28); // big_cookbok where it is first used
      setPath("a-far", "M760 640 C900 610 900 520 600 512", true); // from the first use back up to the import line

      const pop = (sel, at, o) => { o = o || {}; tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.45, ease: o.ease || "back.out(1.6)", immediateRender: false }, at); };
      const show = (sel, at, d) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d || 0.3, ease: "power2.out", immediateRender: false }, at);
      const out = (sel, at, d) => tl.to(sel, { opacity: 0, duration: d || 0.25, ease: "power2.in" }, at);
      const draw = (id, at, d) => {
        const p = document.getElementById(id);
        if (p.dataset.fade) { tl.fromTo(p, { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, at); return; }
        tl.set(p, { opacity: 1 }, at);
        tl.fromTo(p, { strokeDashoffset: +p.dataset.len }, { strokeDashoffset: 0, duration: d || 0.5, ease: "power2.out", immediateRender: false }, at);
      };
      const bump = (sel, at) => tl.fromTo(sel, { scale: 1 }, { scale: 1.08, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);
      const type = (sel, at, n, d) => tl.fromTo(sel, { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: d || 0.04 * n, ease: `steps(${n})`, immediateRender: false }, at);
      const cursorTo = (x, y, at, d) => tl.to("#s-cursor", { x: x, y: y, duration: d || 0.45, ease: "power3.inOut" }, at);
      const cursorIn = (at) => tl.to("#s-cursor", { opacity: 1, duration: 0.2 }, at);
      const cursorOut = (at) => tl.to("#s-cursor", { opacity: 0, duration: 0.2 }, at);
      const swapT = (a, b, at) => { out(a, at, 0.15); show(b, at + 0.12, 0.2); };
      const down = (sel, at, d) => tl.to(sel, { y: 440, duration: d || 0.5, ease: "power2.in" }, at);
      const up = (sel, at, d) => tl.to(sel, { y: 0, duration: d || 0.45, ease: "power3.inOut" }, at);
      const spin = (at, turns, d) => tl.fromTo("#ck-hand", { rotation: 0, transformOrigin: "50% 100%" }, { rotation: 360 * turns, duration: d, ease: "none", immediateRender: false }, at);
      const SMALL = ["#bk-t", "#bk-j", "#bk-m", "#bk-r", "#bk-p", "#bk-k"];
      const ALL = SMALL.concat(["#bk-b"]);

      tl.set("#s-cursor", { x: 700, y: 640 }, 0);

      /* ---- 1. Kitchen Coach imports seven cookbooks. The big one takes a second to open ---- */
      ["#R1", "#R2", "#R3", "#R4", "#R5", "#R6"].forEach((r, i) => type(r, t(5) + i * 0.14, 14, 0.25));
      type("#R7a", t(5) + 6 * 0.14, 19, 0.35);
      ALL.forEach((b, i) => bump(b, t(6) + i * 0.12));
      draw("r-big", t(15), 0.45);
      spin(t(17), 1, 1.0);
      pop("#p-open", t(17), { from: 0.7 });

      /* ---- 2. A normal import opens every book at the import line, on every run ---- */
      out(["#r-big", "#p-open"], t(22), 0.2);
      tl.set("#s-cursor", { x: 700, y: 640 }, t(22));
      cursorIn(t(23));
      cursorTo(136 + 3 * CW, ry(7) + 6, t(23), 0.45);
      draw("r-imp", t(24), 0.4);
      ALL.forEach((b, i) => down(b, t(25) + i * 0.16, 0.45));
      cursorOut(t(28));
      show("#oa1", t(30), 0.2);
      bump("#bk-b", t(30));
      pop("#p-every", t(33), { from: 0.7 });
      out("#r-imp", t(34), 0.2);

      /* ---- 3. Even for the shopping list. Ready in one second ---- */
      out("#p-every", t(35), 0.2);
      type("#R9", t(35), 18, 0.3);
      type("#R10a", t(35) + 0.3, 35, 0.45);
      type("#R11", t(35) + 0.75, 5, 0.15);
      type("#R12", t(35) + 0.9, 26, 0.35);
      show("#oa2", t(41), 0.2);
      draw("r-plan", t(41) + 0.2);
      spin(t(43), 1, 1.0);
      swapT("#ck-q", "#ck-slow", t(48));
      bump("#ck-slow", t(49) + 0.3);
      pop("#p-six", t(50), { from: 0.7 });
      draw("r-never", t(59));

      /* ---- 4. Python 3.15 adds one word: lazy. A sticky note: later ---- */
      out(["#p-six", "#r-never", "#r-plan", "#oa1", "#oa2"], t(63) - 0.1, 0.25);
      ALL.forEach((b, i) => up(b, t(63) + i * 0.06, 0.45));
      swapT("#ck-slow", "#ck-q", t(63));
      pop("#new", t(64), { from: 0.6 });
      swapT("#R7a", "#R7b", t(70));
      draw("r-lazy", t(70) + 0.2, 0.35);
      tl.set("#s-cursor", { x: 600, y: 300 }, t(75));
      cursorIn(t(75));
      cursorTo(1836, 178, t(75), 0.45);
      tl.fromTo("#sticky", { opacity: 0, scale: 0.4, rotation: -20 }, { opacity: 1, scale: 1, rotation: 6, duration: 0.45, ease: "back.out(1.8)", immediateRender: false }, t(77));
      cursorOut(t(80));
      bump("#sticky", t(82));

      /* ---- 5. Ready in a hundredth of a second. The big book stays on the shelf ---- */
      out("#r-lazy", t(83), 0.2);
      SMALL.forEach((b, i) => down(b, t(83) + i * 0.1, 0.4));
      show("#ob1", t(85), 0.2);
      swapT("#ck-q", "#ck-fast", t(89));
      bump("#ck-fast", t(90) + 0.2);
      draw("r-stays", t(96), 0.45);
      pop("#p-stays", t(96) + 0.1, { from: 0.7 });

      /* ---- 6. Plan day: the first use of big_cookbook.plan brings that one book down ---- */
      out(["#r-stays", "#p-stays", "#ob1"], t(100) - 0.1, 0.2);
      pop("#p-plan", t(101), { from: 0.7 });
      tl.set("#s-cursor", { x: 700, y: 760 }, t(103));
      cursorIn(t(103));
      cursorTo(136 + 11 * CW, ry(10) + 6, t(103), 0.45);
