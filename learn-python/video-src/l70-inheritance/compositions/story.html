  <script>
    (function () {
      // Word start times from the narration (seconds). The voice starts 0.6 s into the film.
      const W = [0.0, 0.337, 0.627, 1.393, 1.707, 2.009, 2.113, 2.635, 3.576, 4.005, 4.342, 4.737, 4.899, 4.981, 5.457, 6.153, 6.339, 6.618, 6.734, 7.105, 7.326, 7.535, 8.464, 8.684, 8.87, 9.462, 9.95, 10.17, 10.461, 10.67, 10.89, 11.25, 12.33, 12.504, 12.922, 13.084, 13.212, 13.56, 13.665, 14.594, 14.942, 15.128, 15.209, 16.08, 16.324, 16.463, 16.95, 17.09, 17.949, 18.32, 18.866, 20.062, 20.236, 20.584, 20.933, 21.397, 21.954, 22.361, 22.767, 22.918, 23.893, 24.439, 24.775, 25.878, 26.366, 26.633, 26.761, 27.19, 27.806, 28.096, 28.433, 29.361, 29.686, 29.849, 30.22, 30.395, 30.557, 31.985, 32.403, 32.844, 33.053, 33.135, 33.587, 33.878, 34.156, 34.458, 34.83, 35.515, 35.712, 36.095, 37.152, 37.465, 37.79, 38.289, 38.847, 39.497, 39.799, 40.426, 40.565, 41.61, 41.993, 42.399, 42.666, 43.049, 43.723, 43.92, 44.025, 44.268, 44.466, 44.721, 45.778, 46.173, 46.521, 46.649, 46.788, 47.171, 47.74, 48.494, 49.377, 49.83, 50.399, 50.712, 51.037, 51.734, 52.628, 52.802, 53.034, 53.383, 53.882, 54.021, 54.509, 55.519, 55.844, 56.274, 56.529, 57.005, 57.307, 57.655, 57.876, 58.282, 59.014, 59.443, 59.71, 60.801, 61.185, 61.568, 61.974, 62.473, 62.764, 63.193, 64.087, 64.25, 64.61, 64.923, 65.202, 65.666, 65.852, 66.061, 66.943, 67.408, 67.721, 67.953, 68.104];
      const t = (i) => W[i] + 0.6;
      const tl = gsap.timeline({ paused: true });

      const ringD = (cx, cy, rx, ry) => `M${cx - rx + 6} ${cy + 4} C${cx - rx + 2} ${cy - ry} ${cx + rx} ${cy - ry - 3} ${cx + rx} ${cy} C${cx + rx} ${cy + ry} ${cx - rx - 3} ${cy + ry + 3} ${cx - rx} ${cy - 8}`;
      const prep = (p) => { const L = p.getTotalLength(); p.dataset.len = L; p.style.strokeDasharray = p.classList.contains("dash") ? "" : L; p.style.strokeDashoffset = p.classList.contains("dash") ? 0 : L; };
      const ring = (id, cx, cy, rx, ry) => { const p = document.getElementById(id); p.setAttribute("d", ringD(cx, cy, rx, ry)); prep(p); };
      const path = (id, d) => { const p = document.getElementById(id); p.setAttribute("d", d); prep(p); };
      // code rows: text starts at page x 136, row top inside the panel `top`, so centre y = 96 + top + 25
      const tok = (id, text, sub, top, cw, pad) => {
        const c0 = text.indexOf(sub), c1 = c0 + sub.length;
        ring(id, 136 + ((c0 + c1) / 2) * cw, 96 + top + 25, (sub.length * cw) / 2 + (pad || 14), 28);
      };
      tok("r-brk", "class Kettle(Appliance):", "(Appliance)", 88, 18);
      tok("r-bapp", "class Blender(Appliance):", "Appliance", 238, 18);
      tok("r-e2", "no attribute 'watts'", "'watts'", 788, 16.8);
      tok("r-icode", "    def __init__(self, name, watts, speeds):", "__init__", 288, 18);
      tok("r-super", "        super().__init__(name, watts)", "super().__init__", 338, 18);
      tok("r-out", "0.03", "0.03", 738, 16.8, 18);
      // cards: Appliance at (1190, 96). buttons row top 196 -> centre y 96 + 196 + 32 = 324
      ring("r-stop", 1190 + 206 + 70, 324, 86, 44);
      ring("r-cost", 1190 + 362 + 124, 324, 140, 44);
      ring("r-iap", 1190 + 30 + 68, 96 + 108 + 28, 92, 36);
      ring("r-iok", 1190 + 30 + 68, 96 + 108 + 28, 92, 36);
      // Blender card at (1190, 580). watts chip at left 150, top 270
      ring("r-wmiss", 1190 + 150 + 66, 580 + 270 + 26, 86, 40);
      ring("r-watts", 1190 + 150 + 60, 580 + 270 + 26, 80, 40);
      // "is a" arrows: from each child's top up to the parent's bottom edge (y 386)
      const arr = (x1, y1, x2, y2) => {
        const a = Math.atan2(y2 - y1, x2 - x1), b = 26, s = 16;
        const p1 = [x2 - b * Math.cos(a) + s * Math.sin(a), y2 - b * Math.sin(a) - s * Math.cos(a)];
        const p2 = [x2 - b * Math.cos(a) - s * Math.sin(a), y2 - b * Math.sin(a) + s * Math.cos(a)];
        return `M${x1} ${y1} L${x2} ${y2} M${p1[0]} ${p1[1]} L${x2} ${y2} L${p2[0]} ${p2[1]}`;
      };
      path("a-isb", arr(1400, 566, 1460, 402));
      path("a-isk", arr(1680, 566, 1640, 402));
      path("a-sup", arr(1222, 566, 1222, 402));

      const pop = (sel, at, o) => { o = o || {}; tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.45, ease: o.ease || "back.out(1.6)", immediateRender: false }, at); };
      const show = (sel, at, d) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d || 0.3, ease: "power2.out", immediateRender: false }, at);
      const out = (sel, at, d) => tl.to(sel, { opacity: 0, duration: d || 0.25, ease: "power2.in" }, at);
      const draw = (id, at, d) => {
        const p = document.getElementById(id);
        tl.set(p, { opacity: 1 }, at);
        if (p.classList.contains("dash")) { tl.fromTo(p, { opacity: 0 }, { opacity: 1, duration: d || 0.3, immediateRender: false }, at); return; }
        tl.fromTo(p, { strokeDashoffset: +p.dataset.len }, { strokeDashoffset: 0, duration: d || 0.45, ease: "power2.out", immediateRender: false }, at);
      };
      const bump = (sel, at, s) => tl.fromTo(sel, { scale: 1 }, { scale: s || 1.06, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);
      const type = (sel, at, n, d) => tl.fromTo(sel, { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: d || 0.035 * n, ease: `steps(${n})`, immediateRender: false }, at);
      const cursorTo = (x, y, at, d) => tl.to("#s-cursor", { x: x - 5, y: y - 4, duration: d || 0.45, ease: "power3.inOut" }, at);
      const cursorIn = (at) => tl.to("#s-cursor", { opacity: 1, duration: 0.2 }, at);
      const cursorOut = (at) => tl.to("#s-cursor", { opacity: 0, duration: 0.2 }, at);
      const shake = (sel, at) => tl.to(sel, { x: -8, duration: 0.06, yoyo: true, repeat: 5, ease: "sine.inOut" }, at);

      tl.set("#s-cursor", { x: 1700, y: 1000 }, 0);

      /* ---- 1. Ana wants tea, Ben a smoothie. Kitchen Coach has an Appliance class ---- */
      tl.fromTo("#in2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out", immediateRender: false }, t(3) - 0.1);
      pop("#ap", t(13) - 0.15, { from: 0.85 });
      show("#ap-init", t(18) - 0.1, 0.3);
      pop("#ap-name", t(18), { from: 0.6 });
      pop("#ap-watts", t(21), { from: 0.6 });
      pop("#ap-start", t(24), { from: 0.6 });
      pop("#ap-stop", t(25), { from: 0.6 });
      pop("#ap-cost", t(30), { from: 0.6 });

      /* ---- 2. A kettle is a kind of appliance. So is a blender. Parent in brackets ---- */
      out("#intro", t(32) - 0.2, 0.3);
      tl.fromTo("#s-code", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out", immediateRender: false }, t(32));
      type("#K1", t(33) + 0.1, 24, 0.45);
      type("#K2", t(33) + 0.6, 8, 0.2);
      pop("#kt", t(33) + 0.2, { from: 0.8 });
      draw("a-isk", t(36), 0.45);
      pop("#isa-k", t(36) + 0.25, { from: 0.6 });
      pop("#bl", t(42) - 0.1, { from: 0.8 });
      draw("a-isb", t(42) + 0.2, 0.45);
      pop("#isa-b", t(42) + 0.45, { from: 0.6 });
      draw("r-brk", t(45), 0.45);
      out("#r-brk", t(48) - 0.15, 0.2);
      type("#B1", t(48), 25, 0.5);
      type("#B2", t(48) + 0.6, 8, 0.2);
      draw("r-bapp", t(50), 0.4);

      /* ---- 3. The child gets every method, without writing them again ---- */
      pop("#n-every", t(53) - 0.1, { from: 0.7 });
      bump(["#isa-b", "#isa-k"], t(53), 1.15);
      bump("#ap-start", t(54), 1.1);
      bump("#ap-stop", t(54) + 0.2, 1.1);
      bump("#ap-cost", t(54) + 0.4, 1.1);

      /* ---- 4. blender.stop(): look in Blender, no stop, climb to Appliance, found ---- */
      out(["#n-every", "#r-bapp"], t(60) - 0.2, 0.2);
      type("#N1", t(60) - 0.4, 34, 0.45);
      type("#C1", t(60) + 0.15, 14, 0.4);
      tl.set("#s-cursor", { x: 136 + 14 * 18, y: 96 + 688 + 20 }, t(63) - 0.3);
      cursorIn(t(63) - 0.3);
      cursorTo(1300, 760, t(64), 0.7);
