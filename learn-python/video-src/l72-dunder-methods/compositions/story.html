      // Word start times from the narration (seconds). The voice starts 0.6 s into the film.

      const t = (i) => W[i] + 0.6;
      const tl = gsap.timeline({ paused: true });

      const ringD = (cx, cy, rx, ry) => `M${cx - rx + 6} ${cy + 4} C${cx - rx + 2} ${cy - ry} ${cx + rx} ${cy - ry - 3} ${cx + rx} ${cy} C${cx + rx} ${cy + ry} ${cx - rx - 3} ${cy + ry + 3} ${cx - rx} ${cy - 8}`;

      const ring = (id, cx, cy, rx, ry) => { const p = document.getElementById(id); p.setAttribute("d", ringD(cx, cy, rx, ry)); prep(p); };
      const path = (id, d) => { const p = document.getElementById(id); p.setAttribute("d", d); prep(p); };
      // code rows: text starts at page x 136, 16.8 px per char, row centre y = 96 + top + 24
      const CW = 16.8;
      const tok = (id, text, sub, top, pad) => {
        const c0 = text.indexOf(sub), c1 = c0 + sub.length;
        ring(id, 136 + ((c0 + c1) / 2) * CW, 96 + top + 24, (sub.length * CW) / 2 + (pad || 18), 31);
      };
      tok("r-p1", "print(soup)", "print(soup)", 756);
      tok("r-p1b", "print(soup)", "print(soup)", 756);
      tok("r-p2", "print(menu)", "print(menu)", 804);
      tok("r-init", "    def __init__(self, name, protein):", "__init__", 132);
      tok("r-str", "    def __str__(self):", "__str__", 324);
      const L6 = '        return f"{self.name} ({self.protein} g protein)"';
      tok("r-sn", L6, "self.name", 372, 10);
      tok("r-sp", L6, "self.protein", 372, 10);
      tok("r-repr", "    def __repr__(self):", "__repr__", 468);
      tok("r-call", 'soup = Dish("lentil soup", 18)', 'Dish("lentil soup", 18)', 612, 20);
      const L9 = `        return f"Dish('{self.name}', {self.protein})"`;
      tok("r-r9", L9, `f"Dish('{self.name}', {self.protein})"`, 516, 22);
      // card text: x 1274, line i centre y = 250 + 104 + 48 i + 24 (card at rest)
      ring("r-obj", 1274 + 15.5 * CW, 378, 11 * CW / 2 + 14, 27);
      path("r-addr", ringD(1274 + 8.5 * CW, 426, 11 * CW / 2 + 16, 30));
      // rails in the left gutter: from a print line up to the method it calls
      const head = (x, y) => ` M${x - 14} ${y - 12} L${x} ${y} L${x - 14} ${y + 12}`;
      path("rail1", "M128 876 H112 V444 H190" + head(190, 444));
      path("rail2", "M128 924 H108 V588 H190" + head(190, 588));

      const pop = (sel, at, o) => { o = o || {}; tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.45, ease: o.ease || "back.out(1.6)", immediateRender: false }, at); };
      const show = (sel, at, d) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d || 0.3, ease: "power2.out", immediateRender: false }, at);
      const out = (sel, at, d) => tl.to(sel, { opacity: 0, duration: d || 0.25, ease: "power2.in" }, at);
      const draw = (id, at, d) => {
        const p = document.getElementById(id);

        if (p.classList.contains("dash")) { tl.fromTo(p, { opacity: 0 }, { opacity: 1, duration: d || 0.3, immediateRender: false }, at); return; }

      const bump = (sel, at, s) => tl.fromTo(sel, { scale: 1 }, { scale: s || 1.06, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);

      const cursorTo = (x, y, at, d) => tl.to("#s-cursor", { x: x, y: y, duration: d || 0.45, ease: "power3.inOut" }, at);

      tl.set("#s-cursor", { x: 700, y: 1000 }, 0);

      tl.fromTo("#s-code", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out", immediateRender: false }, t(10) - 0.15);
      draw("r-p1", t(11) - 0.05, 0.4);

      /* ---- 2. The card comes out: <__main__.Dish object at 0x...> ---- */
      printOut(t(12), 1.0);
      out("#r-p1", t(19) - 0.2, 0.2);
      draw("r-obj", t(20), 0.45);
      out("#r-obj", t(25), 0.2);
      draw("r-addr", t(26) - 0.1, 0.3);
      pop("#n-mem", t(34) - 0.3, { from: 0.7 });
      // the number is different on every run
      out("#c-ugly .a0", t(37), 0.12); pop("#c-ugly .a1", t(37) + 0.08, { from: 0.5, d: 0.3 });
      out("#c-ugly .a1", t(39), 0.12); pop("#c-ugly .a2", t(39) + 0.08, { from: 0.5, d: 0.3 });
      bump("#c-ugly", t(40), 1.03);
      badge("#gu-a", "q", t(45));
      badge("#gu-b", "q", t(47));
      badge("#gu-c", "q", t(49));

      pullIn(t(51));
      draw("r-init", t(58) - 0.1, 0.45);
      pop("#n-dunder", t(60) - 0.1, { from: 0.7 });
      bump("#r-init", t(63), 1.04);
      out(["#r-init", "#n-dunder"], t(64) - 0.25, 0.2);
      type("#L5", t(64), 22, 0.5);
      draw("r-str", t(65) + 0.1, 0.4);
      out("#r-str", t(67) - 0.1, 0.2);
      type("#L6", t(67), 56, 0.9);
      draw("r-sn", t(69), 0.35);
      draw("r-sp", t(72) - 0.1, 0.35);

      out(["#r-sn", "#r-sp"], t(73), 0.2);
      cursorIn(t(73));
      cursorTo(280, 420, t(73), 0.5);
      bump("#L5", t(75), 1.04);
      cursorTo(260, 860, t(78) - 0.3, 0.45);
      cursorOut(t(78) + 0.3);

      pop("#n-calls", t(79), { from: 0.7 });
