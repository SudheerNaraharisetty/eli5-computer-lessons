      const bump = (sel, at, s) => tl.fromTo(sel, { scale: 1 }, { scale: s || 1.06, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);
      const type = (sel, at, n, d) => tl.fromTo(sel, { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: d || 0.035 * n, ease: `steps(${n})`, immediateRender: false }, at);
      const cursorTo = (x, y, at, d) => tl.to("#s-cursor", { x: x, y: y, duration: d || 0.45, ease: "power3.inOut" }, at);
      const cursorIn = (at) => tl.to("#s-cursor", { opacity: 1, duration: 0.2 }, at);
      const cursorOut = (at) => tl.to("#s-cursor", { opacity: 0, duration: 0.2 }, at);

      tl.set("#s-cursor", { x: 1700, y: 1000 }, 0);

      /* ---- 1. Kitchen Coach keeps a record for every dish. The class, by hand ---- */
      bump("#rec", t(4), 1.04);
      out(["#intro", "#intro-sub", "#rec"], t(8) - 0.15, 0.3);
      tl.fromTo("#s-code", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out", immediateRender: false }, t(8) + 0.1);
      const hand = [["#H1", 11], ["#H2", 50], ["#H3", 24], ["#H4", 30], ["#H5", 32], ["#H7", 23], ["#H8", 66], ["#H10", 28], ["#H11", 74], ["#H12", 52]];
      hand.forEach(([id, n], i) => type(id, t(11) + i * 0.16, n, 0.3));

      /* ---- 2. Count protein: 1, 2, 3 in the setup, 4 in the printout, 5 and 6 in == ---- */
      tl.to(["#H1", "#H3", "#H5", "#H7", "#H10", "#H12"], { opacity: 0.3, duration: 0.3 }, t(15));
      const mark = (r, b, at) => { draw(r, at, 0.35); pop("#" + b, at + 0.1, { from: 0.4 }); };
      mark("r1", "b1", t(19));
      mark("r2", "b2", t(20));
      mark("r3", "b3", t(21));
      mark("r4", "b4", t(26));
      mark("r5", "b5", t(31));
      mark("r6", "b6", t(31) + 0.45);
      pop("#n-six", t(36), { from: 0.7 });

      /* ---- 3. Add a field: update every place. Miss one: print and == go wrong ---- */
      out(["#r1", "#r2", "#r3", "#r4", "#r5", "#r6", "#b1", "#b2", "#b3", "#b4", "#b5", "#b6", "#n-six"], t(41), 0.25);
      tl.to(["#H1", "#H3", "#H5", "#H7", "#H10", "#H12"], { opacity: 1, duration: 0.3 }, t(41));
      type("#H6", t(43), 32, 0.4);
      out("#h2a", t(43), 0.15);
      pop("#h2b", t(43) + 0.1, { from: 0.8 });
      pop("#n-add", t(43) + 0.3, { from: 0.7 });
      dashIn("u8", t(48));
      dashIn("u11", t(48) + 0.2);
      tl.to(["#u8", "#u11"], { stroke: "#ff6b8b", duration: 0.2 }, t(50));
      pop("#n-print", t(53), { from: 0.7 });
      pop("#n-eq", t(55), { from: 0.7 });
      bump(["#n-print", "#n-eq"], t(57), 1.08);

      /* ---- 4. The same class as a dataclass: just list the fields ---- */
      out(["#u8", "#u11", "#n-add", "#n-print", "#n-eq"], t(59), 0.25);
      tl.to(".hand", { opacity: 0, y: -16, duration: 0.35, stagger: 0.03, ease: "power2.in" }, t(59) + 0.05);
      tl.to("#s-code", { width: 1040, duration: 0.6, ease: "power3.inOut" }, t(59) + 0.5);
      type("#D1", t(62), 33, 0.4);
      type("#D3", t(65), 10, 0.25);
      type("#D4", t(65) + 0.2, 11, 0.25);
      pop("#shelf", t(65) + 0.3, { from: 0.9 });
      type("#D5", t(70), 13, 0.3);
      type("#D6", t(71), 16, 0.3);
      type("#D7", t(73), 21, 0.35);
      draw("r-def", t(76), 0.4);
      pop("#n-five", t(73) + 0.4, { from: 0.7 });

      /* ---- 5. The @ line is a decorator. It writes three methods for you ---- */
      out(["#r-def", "#n-five"], t(79), 0.2);
      tl.set("#s-cursor", { x: 520, y: 360 }, t(80) - 0.3);
      cursorIn(t(80) - 0.3);
      cursorTo(290, 312, t(80) - 0.2, 0.5);
      draw("r-at", t(83), 0.4);
      pop("#n-dec", t(87), { from: 0.7 });
      cursorOut(t(87) + 0.3);
      bump("#sh-h", t(89), 1.06);
      drop("#c-init", t(91));
      drop("#c-repr", t(93));
      drop("#c-eq", t(96));

      /* ---- 6. Print a dish: a clear record, every field named ---- */
      out(["#r-at", "#n-dec"], t(100), 0.2);
      type("#D10", t(100), 30, 0.4);
      type("#D11", t(101) + 0.1, 11, 0.25);
      pop("#out", t(104), { from: 0.9 });
      draw("r-o1", t(106), 0.3);
      draw("r-o2", t(107), 0.3);
      draw("r-o3", t(108), 0.3);

      /* ---- 7. One catch: a list default. ValueError ---- */
      out(["#r-o1", "#r-o2", "#r-o3"], t(110), 0.2);
      out("#shelf", t(110), 0.3);
      type("#D8", t(115), 24, 0.4);
      draw("r-empty", t(118), 0.35);
      out("#o-ok", t(121), 0.15);
      pop("#o-err", t(121) + 0.1, { from: 0.9 });
      pop("#stamp", t(121) + 0.1, { from: 1.6, ease: "power3.out", d: 0.3 });
      pop("#leak", t(127), { from: 0.9 });
      tl.fromTo(["#ar1", "#ar2"], { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, t(130));
      out("#jar-v", t(132), 0.15);
      pop("#jar-g", t(132) + 0.1, { from: 0.5 });

      /* ---- 8. The fix: field(default_factory=list). Each dish gets its own list ---- */
      out("#r-empty", t(137), 0.15);
      tl.set("#s-cursor", { x: 760, y: 620 }, t(137) - 0.3);
      cursorIn(t(137) - 0.3);
      cursorTo(560, 568, t(137) - 0.2, 0.45);
      out("#d8a", t(138), 0.15);
      pop("#d8b", t(138) + 0.1, { from: 0.8 });
      pop("#d1b", t(138) + 0.3, { from: 0.6 });
      cursorOut(t(139));
      draw("r-fac", t(142), 0.4);
      out(["#stamp", "#leak", "#o-err"], t(145), 0.25);
      pop("#o-fine", t(145) + 0.2, { from: 0.8 });
      pop("#own", t(145) + 0.2, { from: 0.9 });
      pop("#own1", t(147), { from: 0.7 });
      pop("#own2", t(150), { from: 0.7 });

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.15, ease: "power2.in" }, 64.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
  </script>
</template>
