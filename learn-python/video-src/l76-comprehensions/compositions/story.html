    (function () {
      // Word start times from the narration (seconds). The voice starts 0.6 s into the film.
      const W = [0.0, 0.569, 0.871, 1.567, 2.392, 2.694, 3.088, 3.425, 3.785, 3.901, 4.4, 4.656, 5.004, 5.155, 5.248, 5.654, 6.339, 6.618, 6.757, 6.885, 7.14, 7.349, 8.324, 8.87, 9.253, 9.392, 9.799, 10.298, 10.948, 11.192, 11.54, 12.04, 12.167, 12.272, 13.038, 13.607, 13.874, 14.048, 14.35, 14.791, 15.546, 16.126, 16.637, 16.846, 17.531, 18.158, 18.971, 19.958, 20.213, 20.875, 21.049, 21.246, 21.432, 21.769, 22.245, 22.43, 22.547, 22.779, 22.918, 23.266, 23.522, 23.835, 24.752, 25.112, 25.368, 25.53, 25.797, 25.913, 26.807, 27.272, 27.469, 27.574, 27.876, 28.282, 28.653, 28.793, 30.186, 30.581, 31.196, 31.498, 31.8, 32.171, 33.332, 33.843, 34.075, 34.342, 34.458, 34.586, 35.074, 35.283, 36.188, 36.583, 36.815, 37.14, 37.547, 37.628, 37.733, 38.708, 39.126, 39.486, 40.078, 40.264, 40.403, 40.6, 41.146, 42.121, 42.377, 42.783, 42.98, 43.329, 43.77, 44.513, 45.14, 45.906, 47.102, 47.392, 47.497, 47.717, 47.822, 48.75, 48.936, 49.389, 49.61, 49.935, 50.422, 50.562, 50.689, 51.339, 51.618, 51.781, 52.001, 52.57, 53.557, 53.708, 54.462, 54.857, 55.02, 55.403, 55.577, 55.821, 56.564, 56.9, 57.133, 57.794];
      const t = (i) => W[i] + 0.6;
      const tl = gsap.timeline({ paused: true });

      const ringD = (cx, cy, rx, ry) => `M${cx - rx + 6} ${cy + 4} C${cx - rx + 2} ${cy - ry} ${cx + rx} ${cy - ry - 3} ${cx + rx} ${cy} C${cx + rx} ${cy + ry} ${cx - rx - 3} ${cy + ry + 3} ${cx - rx} ${cy - 8}`;
      const prep = (p) => { const L = p.getTotalLength(); p.dataset.len = L; p.style.strokeDasharray = L; p.style.strokeDashoffset = L; };
      const path = (id, d) => { const p = document.getElementById(id); p.setAttribute("d", d); prep(p); };
      // code rows: text starts at page x 136, 16.8 px per char, row centre y = 96 + top + 24
      const CW = 16.8;
      const col = (id, c0, len, top, pad) => path(id, ringD(136 + (c0 + len / 2) * CW, 96 + top + 24, (len * CW) / 2 + (pad || 16), 30));

      under("r-dw", 12, 4);
      col("r-se", 0, 38, 132, 20);    // for name, grams, gluten_free in pantry
      under("r-de", 17, 38);
      col("r-sh", 4, 14, 180);        // if gluten_free
      under("r-dh", 56, 14);
      col("r-b1", 11, 1, 324, 14);    // [
      col("r-b2", 70, 1, 324, 14);    // ]
      // a bracket in the left gutter around the 4 lines

      const pop = (sel, at, o) => { o = o || {}; tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.45, ease: o.ease || "back.out(1.6)", immediateRender: false }, at); };
      const show = (sel, at, d) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d || 0.3, ease: "power2.out", immediateRender: false }, at);
      const out = (sel, at, d) => tl.to(sel, { opacity: 0, duration: d || 0.25, ease: "power2.in" }, at);
      const dim = (sel, at, o) => tl.to(sel, { opacity: o, duration: 0.35, ease: "power2.out" }, at);
      const draw = (id, at, d) => {
        const p = document.getElementById(id);
        tl.set(p, { opacity: 1 }, at);
        tl.fromTo(p, { strokeDashoffset: +p.dataset.len }, { strokeDashoffset: 0, duration: d || 0.45, ease: "power2.out", immediateRender: false }, at);
      };
      const bump = (sel, at, s) => tl.fromTo(sel, { scale: 1 }, { scale: s || 1.06, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);
      const type = (sel, at, n, d) => tl.fromTo(sel, { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: d || 0.035 * n, ease: `steps(${n})`, immediateRender: false }, at);
      // pointer above jar i (shelf coordinates)
      const ptrTo = (i, at, d) => tl.to("#ptr", { x: 32 + i * 188 + 68, y: 74, duration: d || 0.3, ease: "power3.inOut" }, at);
      // one loop round: the pointer lands on jar i; safe jars turn green and go on the list
      const visit = (i, at, item) => {
        ptrTo(i, at - 0.3);
        if (item != null) {
          tl.fromTo(`#j${i} > .tint`, { opacity: 0 }, { opacity: 1, duration: 0.25, immediateRender: false }, at);
          bump(`#j${i}`, at, 1.05);
          pop(`#i${item}`, at + 0.05, { from: 0.5, d: 0.35 });
        } else {
          dim(`#j${i}`, at, 0.4);
        }
      };
      // a piece of code flies from its place in the loop to its place in the one line
      const fly = (sel, dx, dy, at, d) => tl.fromTo(sel, { opacity: 1, x: dx, y: dy }, { opacity: 1, x: 0, y: 0, duration: d || 0.8, ease: "power3.inOut", immediateRender: false }, at);

      tl.set("#ptr", { x: 32 + 68, y: 74 }, 0);

      /* ---- 1. Chloe is gluten free. Kitchen Coach checks the pantry, builds her a shopping list ---- */
      bump("#chloe", t(0) + 0.1, 1.08);
      show("#chloe-n", t(0), 0.3);
      show("#intro2", t(5) - 0.1, 0.35);
      pop("#shelf", t(9) - 0.15, { from: 0.85, d: 0.5 });
      out("#chloe-n", t(13) - 0.2, 0.2);
      pop("#list", t(14) - 0.1, { from: 0.85, d: 0.5 });

      /* ---- 2. The way you know: four lines, badges 1 to 4 ---- */
      out(["#intro", "#intro2"], t(16) - 0.3, 0.25);
      tl.fromTo("#s-code", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out", immediateRender: false }, t(16) - 0.05);
      type("#L0", t(22) + 0.1, 13, 0.45);
      pop("#b1", t(22), { from: 0.3 });
      type("#L1", t(27) + 0.1, 39, 0.8);
      pop("#b2", t(27), { from: 0.3 });
      type("#L2", t(34) + 0.1, 19, 0.5);
      pop("#b3", t(34), { from: 0.3 });
      type("#L3", t(40) + 0.1, 29, 0.6);
      pop("#b4", t(40), { from: 0.3 });

      /* ---- 3. The loop runs: rice, (pasta), lentils, (rye bread), tofu ---- */
      show("#ptr", t(44) - 0.5, 0.2);
      visit(0, t(44), 0);
      visit(1, t(44) + 0.35);
      visit(2, t(45), 1);
      visit(3, t(45) + 0.45);
      visit(4, t(46), 2);
      out("#ptr", t(47), 0.2);
      pop("#p-works", t(48) - 0.1, { from: 0.7 });

      /* ---- 4. But that is 4 lines, written again and again ---- */
      draw("r-four", t(52) - 0.1, 0.4);
      pop("#n-four", t(52), { from: 0.7 });
      bump(["#b1", "#b2", "#b3", "#b4"], t(53), 1.15);
      pop("#n-again", t(58) - 0.1, { from: 0.7 });
      bump(["#b1", "#b2", "#b3", "#b4"], t(62), 1.15);

      /* ---- 5. Python has a short way: a comprehension. Square brackets ---- */
      out(["#n-four", "#n-again", "#r-four", "#p-works", "#b1", "#b2", "#b3", "#b4"], t(68) - 0.1, 0.25);
      dim(["#L0", "#L1", "#L2", "#L3"], t(68), 0.6);
      pop("#n-comp", t(75), { from: 0.7 });
      show("#c-open", t(76), 0.25);
      show("#c-close", t(76) + 0.1, 0.25);
      draw("r-b1", t(77) - 0.1, 0.35);
      draw("r-b2", t(77) + 0.05, 0.35);
      out(["#r-b1", "#r-b2"], t(81) + 0.3, 0.2);

      /* ---- 6. First, what goes on the list: the name ---- */
      draw("r-sw", t(83) - 0.05, 0.4);
      fly("#c-what", (24 - 12) * CW, 228 - 324, t(88) - 0.3, 0.75);
      draw("r-dw", t(89) + 0.3, 0.35);
      out("#r-sw", t(89) + 0.3, 0.2);

      /* ---- 7. Then, for each item in the pantry ---- */
      draw("r-se", t(91) - 0.05, 0.45);
      fly("#c-for", (0 - 17) * CW, 132 - 324, t(93), 0.8);
      draw("r-de", t(96) + 0.1, 0.4);
      out("#r-se", t(96) + 0.1, 0.2);

      /* ---- 8. Then, which ones: if it is gluten free ---- */
      draw("r-sh", t(98) - 0.05, 0.4);
      fly("#c-if", (4 - 56) * CW, 180 - 324, t(100) - 0.1, 0.8);
      draw("r-dh", t(103) + 0.2, 0.35);
      out("#r-sh", t(103) + 0.2, 0.2);

      out(["#r-dw", "#r-de", "#r-dh"], t(105) - 0.1, 0.2);
      out(["#i0", "#i1", "#i2"], t(105), 0.25);
      tl.to(["#j0 > .tint", "#j2 > .tint", "#j4 > .tint"], { opacity: 0, duration: 0.25 }, t(105));
      tl.to(["#j1", "#j3"], { opacity: 1, duration: 0.25 }, t(105));
      bump(["#c-open", "#c-what", "#c-for", "#c-if", "#c-close"], t(106), 1.04);
