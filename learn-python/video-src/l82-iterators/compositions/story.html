  <script>
    (function () {
      // Word start times from the narration (seconds). The voice starts 0.6 s into the film.
      const W = [0.0, 0.383, 0.557, 1.625, 1.881, 2.241, 2.519, 2.635, 2.752, 3.448, 4.063, 4.377, 4.76, 5.016, 6.153, 6.327, 6.653, 6.954, 7.999, 8.162, 8.324, 8.568, 8.835, 8.986, 9.242, 9.52, 9.636, 9.799, 10.507, 10.693, 11.006, 11.494, 11.993, 12.399, 12.585, 13.677, 14.141, 14.327, 15.012, 15.174, 15.511, 15.94, 16.196, 16.533, 16.649, 16.753, 17.404, 17.601, 18.065, 18.332, 18.507, 19.61, 20.376, 20.817, 21.003, 21.711, 22.291, 22.628, 22.988, 23.151, 23.824, 24.416, 25.043, 25.206, 26.041, 26.367, 26.506, 26.773, 26.935, 27.272, 27.69, 27.876, 27.992, 28.329, 28.514, 29.71, 30.163, 30.627, 31.092, 32.113, 32.357, 32.531, 32.798, 33.031, 33.634, 34.203, 34.389, 34.737, 35.086, 35.759, 36.038, 36.607, 37.141, 37.802, 38.22, 38.708, 40.066, 40.496, 40.74, 41.401, 42.261, 42.69, 42.864, 43.619, 43.99, 44.397, 44.536, 44.85, 44.966, 45.407, 46.173, 46.324, 46.579, 46.812, 46.951, 47.16, 47.288, 47.624, 47.857, 48.356, 48.82, 49.726, 50.016, 50.121, 50.631, 50.829, 50.945, 51.316, 51.525, 52.35, 52.652, 53.174, 53.499, 53.65, 54.126, 54.66, 54.904, 55.008, 55.345, 56.181, 56.413, 56.483, 56.773, 57.505, 57.725, 58.317, 58.608, 58.851, 59.176, 59.525, 59.641, 59.734, 60.372, 60.686, 61.138];
      const t = (i) => W[i] + 0.6;
      const tl = gsap.timeline({ paused: true });

      const ringD = (cx, cy, rx, ry) => `M${cx - rx + 6} ${cy + 4} C${cx - rx + 2} ${cy - ry} ${cx + rx} ${cy - ry - 3} ${cx + rx} ${cy} C${cx + rx} ${cy + ry} ${cx - rx - 3} ${cy + ry + 3} ${cx - rx} ${cy - 8}`;
      const prep = (p) => { const L = p.getTotalLength(); p.dataset.len = L; if (!p.style.strokeDasharray) p.style.strokeDasharray = L; p.style.strokeDashoffset = L; };
      const path = (id, d) => { const p = document.getElementById(id); p.setAttribute("d", d); prep(p); };
      // code rows: page x 136 + col * 20.4; row k (top 100 + 60k in the panel) has centre y 96 + top + 30
      const CW = 20.4;
      const code = (id, c0, len, cy, pad) => path(id, ringD(136 + (c0 + len / 2) * CW, cy, (len * CW) / 2 + (pad || 12), 28));
      code("rplates", 0, 6, 226);
      code("riter", 9, 12, 286);
      code("rmap", 8, 3, 286);
      // terminal lines: 16.8 px per char, page x 136
      const TW = 16.8;
      path("rstop", `M${136 + 2} ${96 + 768 + 40} H${136 + 13 * TW - 2}`);
      path("rq2", ringD(136 + TW, 96 + 636 + 22, 34, 26));
      path("rlist", ringD(136 + 17.5 * TW, 96 + 636 + 22, 17.5 * TW + 30, 30));
      path("rptr", ringD(1290, 194, 80, 30));
      path("rempty", ringD(1730, 286, 56, 62));
      path("rtray", ringD(1500, 300, 284, 100));

      const pop = (sel, at, o) => { o = o || {}; tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.45, ease: o.ease || "back.out(1.6)", immediateRender: false }, at); };
      const show = (sel, at, d) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d || 0.3, ease: "power2.out", immediateRender: false }, at);
      const out = (sel, at, d) => tl.to(sel, { opacity: 0, duration: d || 0.25, ease: "power2.in" }, at);
      const draw = (id, at, d) => {
        const p = document.getElementById(id);
        tl.set(p, { opacity: 1 }, at);
        tl.fromTo(p, { strokeDashoffset: +p.dataset.len }, { strokeDashoffset: 0, duration: d || 0.45, ease: "power2.out", immediateRender: false }, at);
      };
      const fadeRing = (id, at) => tl.fromTo("#" + id, { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, at);
      const bump = (sel, at, s) => tl.fromTo(sel, { scale: 1 }, { scale: s || 1.06, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);
      const type = (sel, at, n, d) => tl.fromTo(sel, { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: d || 0.04 * n, ease: `steps(${n})`, immediateRender: false }, at);
      // a plate goes from the pass down to its guest (420 px lower)
      const serve = (sel, at, d) => tl.to(sel, { y: 420, duration: d || 0.7, ease: "power3.inOut" }, at);
      const home = (sels, at) => tl.to(sels, { x: 0, y: 0, duration: 0.6, ease: "power3.inOut" }, at);
      // the waiter pointer stands above slot k (0, 1, 2 = plates, 3 = the empty end)
      const SLOT = [0, 150, 300, 440];
      const ptrTo = (k, at) => tl.to("#ptr", { x: SLOT[k], duration: 0.45, ease: "power2.inOut" }, at);
      // counter digit swap
      let shown = null;
      const count = (n, at) => {
        if (shown !== null) tl.to("#n" + shown, { opacity: 0, y: -14, duration: 0.15 }, at);
        tl.fromTo("#n" + n, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.2, immediateRender: false }, at + 0.05);
        shown = n;
      };
      const countOff = (at) => { if (shown !== null) tl.to("#n" + shown, { opacity: 0, duration: 0.2 }, at); shown = null; };

      /* ---- 1. Dinner is ready: 3 plates on the pass ---- */
      type("#r1", t(3) - 0.1, 44, 1.0);
      bump("#p1", t(9), 1.1);
      bump("#p2", t(10), 1.1);
      bump("#p3", t(13), 1.1);
      draw("rplates", t(15), 0.4);
      pop("#p-iterable", t(17), { from: 0.7 });
      pop("#p-often", t(20), { from: 0.7 });
      bump("#p1, #p2, #p3", t(24), 1.05);

      /* ---- 2. Python sends a waiter: iter(plates) ---- */
      out(["#p-iterable", "#p-often", "#rplates"], t(31), 0.25);
      pop("#ptr", t(34), { from: 0.5 });
      type("#r2", t(35) - 0.1, 21, 0.5);
      draw("riter", t(35) + 0.3, 0.4);
      bump("#ptr", t(41), 1.12);
      bump("#p1", t(42), 1.08);
      // remembers where it is: the ring sits on the pointer (offset back to slot 0)
      draw("rptr", t(47), 0.45);
      pop("#cnt", t(48), { from: 0.7 });
      count(0, t(48));

      /* ---- 3. next, next, next ---- */
      out(["#riter", "#rptr"], t(51) - 0.2, 0.2);
      show("#r3", t(51) - 0.05, 0.2);
      count(1, t(51));
      serve("#p1", t(51) + 0.15, 0.75);
      show("#c3", t(52), 0.25);
      ptrTo(1, t(53));
      bump("#g1", t(54), 1.08);

      show("#r4", t(55) - 0.05, 0.2);
      count(2, t(55));
      serve("#p2", t(55) + 0.15, 0.75);
      show("#c4", t(56), 0.25);
      ptrTo(2, t(58));
      bump("#g2", t(59), 1.08);

      show("#r5", t(60) - 0.05, 0.2);
      count(3, t(60));
      serve("#p3", t(60) + 0.15, 0.75);
      show("#c5", t(61), 0.25);
      ptrTo(3, t(62));
      bump("#g3", t(63), 1.08);

      /* ---- 4. A fourth next: the pass is empty, StopIteration ---- */
      show("#r6", t(66) - 0.05, 0.2);
      count(4, t(68));
      bump("#ptr", t(70), 1.12);
      fadeRing("rempty", t(72));
      pop("#left", t(74), { from: 0.7 });
      [0, 1, 2, 3, 4].forEach((i) => show(`#o${i}`, t(75) + i * 0.08, 0.2));
      show("#o5", t(77) - 0.05, 0.25);
      show("#c6", t(77), 0.25);
      tl.fromTo("#stamp", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.4)", immediateRender: false }, t(77));
      draw("rstop", t(78), 0.45);

      /* ---- 5. A for loop does exactly this ---- */
      const p1out = ["#r2", "#r3", "#r4", "#r5", "#r6", "#c3", "#c4", "#c5", "#c6", "#o0", "#o1", "#o2", "#o3", "#o4", "#o5", "#rstop", "#stamp", "#rempty", "#left", "#ptr"];
      out(p1out.concat(["#cnt"]), t(79) - 0.2, 0.25);
      home(["#p1", "#p2", "#p3"], t(80));
      tl.set("#ptr", { x: 0 }, t(80));
      countOff(t(80));
