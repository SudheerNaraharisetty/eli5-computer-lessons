    (function () {
      // Word start times from the narration (seconds). The voice starts 0.6 s into the film.
      const W = [0.0, 0.488, 0.813, 1.138, 1.579, 1.974, 2.171, 2.276, 2.624, 2.868, 3.727, 4.238, 4.563, 4.818, 5.074, 6.142, 6.455, 6.769, 7.779, 8.104, 8.533, 8.707, 9.079, 9.868, 10.054, 10.484, 10.937, 11.993, 12.144, 12.434, 12.829, 13.154, 13.41, 13.572, 13.735, 14.745, 14.93, 15.279, 15.406, 15.639, 16.057, 16.254, 16.37, 17.066, 17.252, 17.368, 17.844, 18.192, 18.564, 18.935, 19.133, 19.249, 20.491, 21.083, 21.478, 21.617, 22.105, 22.813, 22.976, 23.312, 23.452, 24.357, 24.578, 24.671, 25.24, 25.658, 25.878, 26.192, 26.308, 26.401, 27.364, 27.829, 28.142, 28.943, 29.21, 29.442, 30.081, 30.255, 31.184, 31.567, 31.718, 31.857, 31.939, 32.589, 32.833, 33.692, 33.912, 34.237, 34.516, 34.864, 35.468, 35.653, 36.025, 36.42, 36.803, 37.023, 37.325, 38.08, 38.242, 38.556, 39.009, 39.206, 39.299, 39.438, 40.321, 40.495, 40.843, 41.621, 42.027, 43.153, 43.502, 43.804, 43.92, 45.023, 45.208, 45.487, 45.626, 45.963, 46.358, 47.17, 47.832, 48.157, 48.877, 49.063, 49.179, 49.504, 49.876, 50.154, 50.641, 51.501, 51.826, 52.232, 52.348, 53.509, 53.799, 53.916, 54.275, 54.635, 55.042, 55.425, 55.785, 56.203, 57.213, 57.596, 58.002, 58.943, 59.186, 59.779, 60.115, 60.731, 61.497, 61.659, 62.263, 62.6, 62.716, 63.122, 63.854, 64.074, 64.167, 64.655, 64.875, 65.108, 65.317];
      const t = (i) => W[i] + 0.6;
      const tl = gsap.timeline({ paused: true });

      const ringD = (cx, cy, rx, ry) => `M${cx - rx + 6} ${cy + 4} C${cx - rx + 2} ${cy - ry} ${cx + rx} ${cy - ry - 3} ${cx + rx} ${cy} C${cx + rx} ${cy + ry} ${cx - rx - 3} ${cy + ry + 3} ${cx - rx} ${cy - 8}`;
      const ring = (id, cx, cy, rx, ry) => { const p = document.getElementById(id); p.setAttribute("d", ringD(cx, cy, rx, ry)); const L = p.getTotalLength(); p.dataset.len = L; p.style.strokeDasharray = L; p.style.strokeDashoffset = L; };

      tok("r-f", L2, "f", 188, 16);
      tok("r-safe", "def safe_html(template):", "safe_html", 288, 16);

      const pop = (sel, at, o) => { o = o || {}; tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.45, ease: o.ease || "back.out(1.6)", immediateRender: false }, at); };
      const show = (sel, at, d) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d || 0.3, ease: "power2.out", immediateRender: false }, at);
      const out = (sel, at, d) => tl.to(sel, { opacity: 0, duration: d || 0.25, ease: "power2.in" }, at);
      const draw = (id, at, d) => { const p = document.getElementById(id); tl.set(p, { opacity: 1 }, at); tl.fromTo(p, { strokeDashoffset: +p.dataset.len }, { strokeDashoffset: 0, duration: d || 0.45, ease: "power2.out", immediateRender: false }, at); };
      const bump = (sel, at, s) => tl.fromTo(sel, { scale: 1 }, { scale: s || 1.06, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);

      const hlTo = (row, at, d) => tl.to("#hl", { y: row - 88, duration: d || 0.25, ease: "power2.inOut" }, at);
      const swap = (a, b, at) => { out(a, at, 0.15); pop(b, at + 0.1, { from: 0.7, d: 0.3 }); };
      const cursorTo = (x, y, at, d) => tl.to("#s-cursor", { x: x, y: y, duration: d || 0.45, ease: "power3.inOut" }, at);

      tl.set("#s-cursor", { x: 1000, y: 1000 }, 0);

      /* ---- 1. The menu card; guests type notes; Ana wants pasta; Ben types a bold tag ---- */
      bump("#card", t(4), 1.03);
      pop("#inp", t(10), { from: 0.8 });
      bump("#ra", t(17), 1.08);
      // Ben types "<b>" (3 of 15 characters), then "extra cheese"
      tl.set("#note", { clipPath: "inset(0% 100% 0% 0%)" }, 0);
      tl.to("#note", { clipPath: "inset(0% 80% 0% 0%)", duration: 0.35, ease: "steps(3)" }, t(21));
      tl.to("#note", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "steps(12)" }, t(25));
      type("#L0", t(19), 40, 0.9);

      /* ---- 2. The f-string glues the note straight into the page ---- */
      type("#L2", t(28), 30, 0.6);
      show("#hl", t(28) + 0.2, 0.2);
      tl.set("#hl", { y: 188 - 88 }, t(28));
      draw("r-note", t(37), 0.4);
      pop("#n-glue", t(39), { from: 0.7, d: 0.3 });
      // the note flies from the input into Ben's row
      tl.set("#fly", { opacity: 1 }, t(38));
      tl.fromTo("#fly", { x: 0, y: 0 }, { x: 98, y: -315, duration: 0.65, ease: "power3.inOut", immediateRender: false }, t(38));
      out("#fly", t(42) - 0.05, 0.1);
      swap("#rb0", "#rb1", t(42) - 0.1);
      // the browser reads the tag as an instruction
      draw("r-tag", t(47), 0.4);
      out("#r-tag", t(51) - 0.05, 0.15);
      swap("#rb1", "#rb2", t(51));
      // everything after it turns bold
      swap("#rc0", "#rc1", t(55));
      pop("#wrong", t(60), { from: 1.5, ease: "power3.out", d: 0.3 });
      pop("#script", t(69), { from: 0.7, d: 0.35 });

      /* ---- 3. Change one letter: f becomes t. A template, two trays ---- */

      tl.to("#s-cursor", { opacity: 1, duration: 0.2 }, t(70));
      cursorTo(136 + 7 * 18 + 4, 96 + 188 + 34, t(70), 0.6);

      bump("#pfx", t(74), 1.3);
      swap("#pf", "#pt", t(77) - 0.05);
      out("#r-f", t(78), 0.2);
      tl.to("#s-cursor", { opacity: 0, duration: 0.2 }, t(79));
      pop("#n-tpl", t(82), { from: 0.7, d: 0.3 });
      out(["#inp", "#script"], t(80), 0.25);
      pop("#tp", t(82), { from: 0.85, d: 0.4 });
      show(["#lb1", "#tr1"], t(87), 0.3);
      show(["#lb2", "#tr2"], t(88), 0.3);
      pop("#c1", t(91), { from: 0.5, d: 0.3 });
      pop("#c2", t(91) + 0.2, { from: 0.5, d: 0.3 });
      bump("#tr1", t(96), 1.03);
      pop("#c3", t(99), { from: 0.5, d: 0.35 });
      bump("#tr2", t(103), 1.03);

      /* ---- 4. safe_html walks the template: text as is, values escaped, then joined ---- */
      out("#n-tpl", t(104) - 0.1, 0.2);
      tl.to("#hl", { opacity: 0, duration: 0.2 }, t(104) - 0.1);
      type("#L4", t(104), 24, 0.3);
      type("#L5", t(104) + 0.3, 15, 0.2);
      type("#L6", t(104) + 0.5, 25, 0.3);
      type("#L7", t(105), 43, 0.4);
      type("#L8", t(105) + 0.4, 42, 0.4);
      type("#L9", t(105) + 0.8, 27, 0.3);
      type("#L10", t(106), 26, 0.3);
      draw("r-safe", t(107), 0.4);
      out("#r-safe", t(110) - 0.1, 0.2);
      tl.set("#hl", { y: 388 - 88 }, t(109) - 0.2);
      show("#hl", t(109), 0.2);
      // fixed text: as is
      hlTo(538, t(114), 0.25);
      pop("#n-kept", t(116), { from: 0.7, d: 0.3 });
      bump(["#c1", "#c2"], t(117), 1.08);
      pop("#asis", t(118), { from: 0.6, d: 0.3 });
      // values: escaped
