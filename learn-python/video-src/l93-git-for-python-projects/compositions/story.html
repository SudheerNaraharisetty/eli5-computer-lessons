      out("#fold", t(66), 0.25);
      pop("#gi", t(66), { from: 0.85, d: 0.4 });

      type("#b0", t(82), 11, 0.3);
      type("#b1", t(84), 37, 0.6);
      pop("#stampt", t(84) + 0.2, { from: 0.5 });
      tl.fromTo("#stampt", { y: 0 }, { y: 60, duration: 0.16, ease: "power2.in", yoyo: true, repeat: 1, immediateRender: false }, t(89) - 0.15);

      tl.to(["#pA", "#pB", "#pC"], { x: (i) => [31, -124, -347][i], y: -268, scale: 0.3, opacity: 0, duration: 0.55, ease: "power2.in" }, t(89) + 0.25);
      out("#stampt", t(89) + 0.4, 0.2);
      pop("#st1", t(89) + 0.6, { from: 1.5, ease: "power3.out", d: 0.3 });

      /* ---- Then, Thursday's save point; on Friday Ana's plan drops to 260 ---- */
