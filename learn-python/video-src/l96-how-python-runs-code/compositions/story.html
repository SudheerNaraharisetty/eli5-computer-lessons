  <script>
    (function () {
      // Word start times from the narration (seconds). The voice starts 0.6 s into the film.
      const W = [0.0, 0.337, 0.755, 1.602, 1.997, 2.299, 3.274, 3.506, 3.889, 4.214, 4.331, 4.702, 4.911, 5.259, 5.619, 6.525, 7.059, 7.535, 7.883, 8.046, 8.371, 9.369, 9.752, 10.24, 10.588, 10.716, 11.088, 11.993, 12.144, 12.469, 12.887, 13.073, 13.514, 14.524, 15.139, 15.615, 15.848, 16.115, 16.509, 17.09, 17.369, 18.483, 18.774, 18.89, 19.261, 19.911, 20.039, 20.411, 20.736, 21.374, 21.85, 22.849, 23.162, 23.418, 24.474, 24.799, 25.507, 25.844, 26.552, 27.11, 27.609, 28.34, 28.944, 29.954, 30.268, 30.395, 30.651, 30.918, 31.231, 31.719, 32.021, 32.415, 32.648, 32.764, 33.762, 33.994, 34.331, 34.912, 35.19, 35.306, 35.423, 36.154, 36.712, 37.013, 37.188, 38.024, 38.476, 38.79, 39.057, 39.335, 39.533, 39.8, 40.09, 40.346, 40.705, 41.042, 42.145, 42.621, 42.935, 43.062, 43.213, 43.898, 44.188, 44.606, 44.908, 45.582, 45.86, 46.185, 46.359, 47.253, 47.416, 47.683, 48.078, 48.612, 49.065, 49.32, 49.633, 50.133, 50.377, 50.957, 51.085, 51.317, 52.188, 52.641, 52.861, 53.465, 53.72, 54.092, 54.417, 55.404, 56.159, 56.983, 57.47, 57.749, 57.888, 58.167, 58.829, 59.166, 59.27, 59.514, 60.396, 60.64, 60.93, 61.093, 61.406, 61.847, 62.231, 62.451, 62.567];
      const t = (i) => W[i] + 0.6;
      const tl = gsap.timeline({ paused: true });

      const CARD = [
        'print("Coach is starting")',
        'def add_shake(protein):',
        '    return protein + 30',
        '',
        'print("Ben:", add_shake(115))'
      ];
      const SMUDGED = 'print("Ben:"  add_shake(115))';

      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const paint = (src) => src.split(/("[^"]*")/).map((seg, i) => i % 2
        ? '<span class="m">' + esc(seg) + "</span>"
        : esc(seg)
          .replace(/\b(def|return)\b/g, '<span class="k">$1</span>')
          .replace(/\b(add_shake|print)\(/g, '<span class="f">$1</span>(')
          .replace(/([^\w])(\d+)\b/g, '$1<span class="m">$2</span>')).join("");
      const holder = document.getElementById("lines");
      const addLine = (id, text, row, hidden) => {
        const d = document.createElement("div");
        d.className = "ln";
        d.id = id;
        d.style.top = 76 + row * 44 + "px";
        if (hidden) d.style.opacity = "0";
        d.innerHTML = paint(text);
        holder.appendChild(d);
      };
      CARD.forEach((s, i) => { if (s) addLine("c" + i, s, i, false); });
      addLine("c4s", SMUDGED, 4, true);

      // hand-drawn rings around a token on the card (page x 176 + col * 16.8, row centre 194 + row * 44)
      const marks = document.getElementById("s-marks");
      const ringD = (cx, cy, rx, ry) => `M${cx - rx + 6} ${cy + 4} C${cx - rx + 2} ${cy - ry} ${cx + rx} ${cy - ry - 3} ${cx + rx} ${cy} C${cx + rx} ${cy + ry} ${cx - rx - 3} ${cy + ry + 3} ${cx - rx} ${cy - 8}`;
      const ring = (id, row, col, n, color, dash) => {
        const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.id = id;
        p.style.stroke = color;
        if (dash) p.setAttribute("class", "dash");
        p.setAttribute("d", ringD(176 + (col + n / 2) * 16.8, 194 + row * 44, (n * 16.8) / 2 + 16, 27));
        marks.appendChild(p);
        const L = p.getTotalLength();
        p.dataset.len = L;
        if (!dash) { p.style.strokeDasharray = L; p.style.strokeDashoffset = L; }
        return p;
      };
      const Y = "#ffc24b", R = "#ff6b8b";
      ring("r-line3", 2, 4, 19, Y);
      ring("r-comma", 4, 12, 1, R, true);
      ring("r-line1", 0, 0, 26, R);

      const pop = (sel, at, o) => { o = o || {}; tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.4, ease: o.ease || "back.out(1.6)", immediateRender: false }, at); };
      const show = (sel, at, d) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d || 0.3, ease: "power2.out", immediateRender: false }, at);
      const out = (sel, at, d) => tl.to(sel, { opacity: 0, duration: d || 0.25, ease: "power2.in" }, at);
      const draw = (id, at, d) => {
        const p = document.getElementById(id);
        tl.set(p, { opacity: 1 }, at);
        if (p.getAttribute("class") === "dash") tl.fromTo(p, { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: d || 0.4, ease: "back.out(2)", immediateRender: false }, at);
        else tl.fromTo(p, { strokeDashoffset: +p.dataset.len }, { strokeDashoffset: 0, duration: d || 0.45, ease: "power2.out", immediateRender: false }, at);
      };
      const bump = (sel, at, s) => tl.fromTo(sel, { scale: 1 }, { scale: s || 1.08, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);
      const type = (sel, at, n, d) => tl.fromTo(sel, { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: d || 0.03 * n, ease: `steps(${n})`, immediateRender: false }, at);
      const on = (n, at) => show("#st" + n + " > b", at, 0.25);
      const off = (n, at) => out("#st" + n + " > b", at, 0.25);

      tl.set(".node", { xPercent: -50 }, 0);

      /* ---- 1. Ben runs coach.py ---- */
      type("#o0", t(2), 18, 0.6);
      bump("#o0", t(6), 1.06);
      bump("#p-code .ttl", t(8), 1.15);
      pop("#n-how", t(11), { from: 0.7 });
      bump("#n-how", t(13), 1.06);

      /* ---- 2. Read: the chef reads the whole card first ---- */
      out("#n-how", t(15) - 0.25, 0.2);
      on(1, t(15));
      tl.set("#hl", { y: 0 }, t(17));
      tl.to("#hl", { opacity: 1, duration: 0.2 }, t(17));
      tl.to("#hl", { y: 4 * 44, duration: 2.2, ease: "none" }, t(17) + 0.1);
      pop("#n-read", t(21), { from: 0.7 });
      pop("#n-nocook", t(25), { from: 0.7 });
      out("#hl", t(26), 0.3);

      /* ---- 3. Tree ---- */
      out(["#n-read", "#n-nocook"], t(27) - 0.2, 0.2);
      off(1, t(27));
      on(2, t(27));
      draw("r-line3", t(28), 0.5);
      pop("#nd-ret", t(33), { from: 0.6 });
      show("#tl1", t(34), 0.2);
      pop("#nd-plus", t(34), { from: 0.6 });
      show(["#tl2", "#tl3"], t(38), 0.2);
      pop("#nd-pro", t(38), { from: 0.6 });
      pop("#nd-30", t(40), { from: 0.6 });

      /* ---- 4. Compile to bytecode ---- */
      off(2, t(41));
      on(3, t(41));
      bump("#nd-plus", t(44), 1.12);
      out(["#nd-ret", "#nd-plus", "#nd-pro", "#nd-30", "#tl1", "#tl2", "#tl3"], t(46), 0.35);
      show(["#k1", "#k2", "#k3", "#k4"], t(49), 0.3);
      show("#by-lbl", t(53), 0.3);
      pop("#b1", t(54), { from: 0.7 });
      pop("#b2", t(56), { from: 0.7 });
      pop("#b3", t(58), { from: 0.7 });
      pop("#b4", t(61), { from: 0.7 });
      out("#r-line3", t(62), 0.3);

      /* ---- 5. Run: the line cook, one step at a time ---- */
      off(3, t(63));
      on(4, t(63));
      out("#by-lbl", t(63), 0.2);
      show("#o1", t(64), 0.2);
      show("#cook", t(65), 0.25);
      tl.set("#cook-tag", { y: 0 }, t(65));
      pop("#cook-tag", t(66), { from: 0.7 });
      show("#counter", t(67), 0.3);
      // 115 on the counter
      tl.fromTo("#v115", { opacity: 0, y: -120 }, { opacity: 1, y: 0, duration: 0.45, ease: "bounce.out", immediateRender: false }, t(74));
      // 30 on top
      tl.to("#cook", { y: 90, duration: 0.35, ease: "power2.inOut" }, t(81) - 0.3);
      tl.fromTo("#v30", { opacity: 0, y: -120 }, { opacity: 1, y: 0, duration: 0.45, ease: "bounce.out", immediateRender: false }, t(81));
      // plus takes both off, puts back 145
      tl.to("#cook", { y: 180, duration: 0.35, ease: "power2.inOut" }, t(85) - 0.3);
      tl.to(["#v115", "#v30"], { opacity: 0, scale: 0.5, x: -60, duration: 0.4, ease: "power2.in" }, t(87));
      tl.fromTo("#v145", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)", immediateRender: false }, t(92));
      // return hands it back
      tl.to("#cook", { y: 270, duration: 0.35, ease: "power2.inOut" }, t(96) - 0.3);
      tl.to("#v145", { x: -560, y: 250, opacity: 0, duration: 0.5, ease: "power2.in" }, t(96) + 0.1);
      pop("#n-ben", t(96) + 0.3, { from: 0.7 });
