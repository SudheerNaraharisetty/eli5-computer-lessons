      const STN = ["#st1", "#st2", "#st3", "#st4"], CHV = ["#ch1", "#ch2", "#ch3"];
      const BARS = ["#bar1", "#bar2", "#bar3", "#bar4"], VALS = ["#bv1", "#bv-hot", "#bv3", "#bv4"];

      /* ---- 1. Every morning: four stations ---- */

      bump("#c3", t(7), 1.05);
      bump("#c4", t(10), 1.05);
      bump("#c5", t(12), 1.04);
      pop("#st1", t(13), { from: 0.7 });
      show("#ch1", t(15), 0.2);
      pop("#st2", t(16), { from: 0.7 });
      show("#ch2", t(18), 0.2);
      pop("#st3", t(19), { from: 0.7 });
      show("#ch3", t(20) - 0.15, 0.2);
      pop("#st4", t(20), { from: 0.7 });
      show("#a1", t(20) + 0.4, 0.2);

      /* ---- 2. The stopwatch: 2 seconds, but where? ---- */
      pop("#watch", t(22), { from: 0.8 });
      tl.fromTo("#hand", { rotation: 0, svgOrigin: "40 45" }, { rotation: 720, svgOrigin: "40 45", duration: 1.4, ease: "power2.inOut", immediateRender: false }, t(22) + 0.1);
      pop("#wv-old", t(24), { from: 0.6 });
      show("#a2", t(24), 0.2);
      bump("#a2", t(25), 1.06);
      pop(["#q1", "#q2", "#q3", "#q4"], t(27), { from: 0.4 });
      pop("#n-guess", t(31), { from: 0.7 });
      tl.fromTo("#guess-x", { opacity: 1, scaleX: 0, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, t(33));

      /* ---- 3. The profiler: a stopwatch on every function ---- */

      out(["#a0", "#a1", "#a2"], t(35), 0.25);
      type("#b0", t(35) + 0.3, 44, 0.9);
      show(["#base", "#base-lbl"], t(41), 0.3);
      pop("#b1", t(43), { from: 0.9 });
      // read orders: almost nothing

      show("#b2", t(47) + 0.2, 0.2);

      out(SCENE1, t(64), 0.35);
      out(["#r-inp", "#hl-hot"], t(64), 0.3);

      show("#sh-ttl", t(70), 0.3);
      pop("#i0", t(71), { from: 0.7 });
      pop("#i1", t(71) + 0.12, { from: 0.7 });
      pop("#i2", t(71) + 0.24, { from: 0.7 });
      show("#dots", t(72), 0.2);
      pop("#i3", t(73), { from: 0.7 });
      draw("r-in", t(76), 0.5);
      pop("#clerk", t(80), { from: 0.6 });
      show("#looks", t(80) + 0.2, 0.25);
      // the clerk walks: item-0, item-1, item-2 ... item-39999
      show("#lk1", t(81), 0.1);
      bump("#i0", t(81), 1.08);
      tl.to("#clerk", { x: 164, duration: 0.4, ease: "power1.inOut" }, t(84) - 0.3);
      out("#lk1", t(84) + 0.1, 0.08); show("#lk2", t(84) + 0.12, 0.1);
      bump("#i1", t(84) + 0.1, 1.08);
      tl.to("#clerk", { x: 328, duration: 0.4, ease: "power1.inOut" }, t(85) - 0.1);

      bump("#i3", t(86) + 0.8, 1.08);
      pop("#n-orders", t(88), { from: 0.7 });
      pop("#n-million", t(93), { from: 0.6 });

      out(["#sh-ttl", "#i0", "#i1", "#i2", "#i3", "#dots", "#clerk", "#looks", "#lk4", "#n-orders", "#n-million", "#r-list", "#r-in"], t(99) - 0.2, 0.3);

      // the drawer opens

      pop("#n-one", t(117), { from: 0.6 });
      bump("#n-one", t(118), 1.08);

      /* ---- 6. Change one line, profile again ---- */
      out(["#dr-ttl", ".drw", "#tray", "#n-query", "#n-one"], t(119) - 0.2, 0.3);
      tl.to("#cursor", { x: -1175, y: -390, duration: 0.9, ease: "power3.inOut" }, t(119));
      show("#hl-fix", t(121), 0.25);
      out("#c4", t(124), 0.15);
      show("#c4s", t(124) + 0.1, 0.2);
      draw("r-set", t(126), 0.4);
      out("#cursor", t(126) + 0.2, 0.2);
      // back on the kitchen line, the old bars still standing
      back(SCENE1.filter((s) => s !== "#pct"), t(127), 0.3);
      out(["#b0", "#b1", "#b2", "#b3", "#b4", "#b5", "#b6"], t(127), 0.2);
      type("#d0", t(127) + 0.2, 44, 0.8);

      out("#wv-old", t(142), 0.15);

      /* ---- hand off to the takeaway ---- */

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
