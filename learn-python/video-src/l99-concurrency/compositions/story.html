        const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.id = id;
        p.style.stroke = color;
        p.setAttribute("d", d);
        marks.appendChild(p);
        const L = p.getTotalLength();
        p.dataset.len = L;
        p.style.strokeDasharray = L;
        p.style.strokeDashoffset = L;
      };
      const ring = (id, row, col, n, color) => mkRing(id, ringD(176 + (col + n / 2) * 16.8, 194 + row * 44, (n * 16.8) / 2 + 16, 27), color);
      const Y = "#ffc24b", R = "#ff6b8b", G = "#4bd69b";
      ring("r-sleep", 1, 4, 13, Y);
      ring("r-tpe", 4, 5, 18, Y);
      ring("r-done", 3, 8, 9, Y);
      ring("r-ppe", 6, 5, 19, G);
      ring("r-lock", 0, 0, 10, G);
      mkRing("r-five", ringD(1580, 245, 90, 82), "#b8235a");

      const pop = (sel, at, o) => { o = o || {}; tl.fromTo(sel, { opacity: 0, scale: o.from || 0.6 }, { opacity: 1, scale: 1, duration: o.d || 0.4, ease: o.ease || "back.out(1.6)", immediateRender: false }, at); };
      const show = (sel, at, d) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d || 0.3, ease: "power2.out", immediateRender: false }, at);
      const out = (sel, at, d) => tl.to(sel, { opacity: 0, duration: d || 0.25, ease: "power2.in" }, at);
      const draw = (id, at, d) => {
        const p = document.getElementById(id);
        tl.set(p, { opacity: 1 }, at);
        tl.fromTo(p, { strokeDashoffset: +p.dataset.len }, { strokeDashoffset: 0, duration: d || 0.45, ease: "power2.out", immediateRender: false }, at);
      };
      const bump = (sel, at, s) => tl.fromTo(sel, { scale: 1 }, { scale: s || 1.08, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);
      const type = (sel, at, n, d) => tl.fromTo(sel, { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: d || 0.03 * n, ease: `steps(${n})`, immediateRender: false }, at);
      const fill = (sel, at, d) => tl.fromTo(sel, { opacity: 1, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: d || 0.6, ease: "none", immediateRender: false }, at);

      /* ---- frame 0: the first order is already on screen ---- */
      tl.set(["#ttl-a", "#a0", "#a1", "#a2", "#a4", "#a5", "#h-wait", "#la1", "#axis", "#tk0", "#tk1", "#tk2", "#tk3"], { opacity: 1 }, 0);

      /* ---- 1. one cook, three orders, waiting ---- */
      draw("r-sleep", t(4), 0.45);
      bump("#h-wait", t(9), 1.06);
      type("#oa0", t(10), 20, 0.5);
      fill("#w1", t(10), 0.7);
      fill("#w2", t(10) + 0.72, 0.7);
      fill("#w3", t(10) + 1.44, 0.7);
      pop("#r-3s", t(17), { from: 0.7 });
      show("#oa1", t(17), 0.2);

      /* ---- 2. waiting is not working: three cooks (threads) ---- */
      pop("#n-idle", t(20), { from: 0.7 });
      out("#r-sleep", t(23), 0.3);
      out("#la1", t(24) - 0.1, 0.2);
      show("#lb1", t(24), 0.25);
      pop(["#lb2", "#lb3"], t(25), { from: 0.7 });
      // code: the for loop becomes a pool of three threads
      out(["#a4", "#a5", "#ttl-a", "#oa0", "#oa1"], t(31) - 0.25, 0.2);
      show(["#b4", "#b5", "#ttl-b"], t(31), 0.25);
      draw("r-tpe", t(31) + 0.1, 0.45);
      type("#ob0", t(31) + 0.2, 24, 0.5);
      // all three wait together
      out("#n-idle", t(32) - 0.1, 0.2);
      tl.to(["#w1", "#w2", "#w3"], { clipPath: "inset(0% 100% 0% 0%)", duration: 0.25, ease: "power2.in" }, t(32));
      tl.set("#w2", { x: -220, y: 110 }, t(32) + 0.3);
      tl.set("#w3", { x: -440, y: 220 }, t(32) + 0.3);
      fill(["#w1", "#w2", "#w3"], t(34), 1.0);
      tl.to(["#tk2", "#tk3"], { opacity: 0.35, duration: 0.3 }, t(36));
      pop("#r-1s", t(42), { from: 0.7 });
      show("#ob1", t(42), 0.2);
      bump("#ob1", t(43), 1.06);

      /* ---- 3. heavy work: three threads, one talking stick ---- */
      out(["#w1", "#w2", "#w3", "#r-3s", "#r-1s", "#tk0", "#tk1", "#tk2", "#tk3", "#h-wait", "#r-tpe"], t(44) - 0.1, 0.3);
      out(["#a0", "#a1", "#a2", "#b4", "#b5", "#ttl-b", "#ob0", "#ob1"], t(44) - 0.1, 0.3);
      pop("#h-work", t(45), { from: 0.7 });
      show(["#c0", "#c1", "#c2", "#c3", "#c4", "#c6", "#c7", "#ttl-c"], t(45), 0.3);
      pop("#bw1", t(47), { from: 0.6 });
      pop("#bw2", t(48), { from: 0.6 });
      pop("#bw3", t(49), { from: 0.6 });
      draw("r-done", t(50), 0.45);
      out(["#lb1", "#lb2", "#lb3"], t(53) - 0.2, 0.2);
      show(["#lt1", "#lt2", "#lt3"], t(53), 0.25);
      type("#oc0", t(53), 17, 0.45);
      out("#r-done", t(56), 0.3);
      tl.fromTo("#gil", { opacity: 0, scale: 0.4, rotation: -20 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2)", immediateRender: false }, t(61));
      bump("#gil", t(65), 1.2);
      // only the cook holding the stick may chop: slices take turns, lane by lane
      for (let k = 0; k < 15; k++) {
        const at = t(66) + k * 0.21;
        const lane = k % 3;
        if (k > 0) tl.to("#gil", { y: lane * 110, duration: 0.12, ease: "power2.inOut" }, at - 0.12);
        tl.fromTo("#sl" + k, { opacity: 0, scaleX: 0.2, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, at);
      }
      pop("#r-nofast", t(79), { from: 0.7 });
      show("#oc1", t(79), 0.2);
      show("#oc2", t(79) + 0.3, 0.2);

      /* ---- 4. processes: three separate kitchens ---- */
      const SL = Array.from({ length: 15 }, (_, k) => "#sl" + k);
      out(SL.concat(["#axis", "#gil", "#r-nofast", "#h-work", "#lt1", "#lt2", "#lt3"]), t(81) - 0.1, 0.25);
      pop("#h-proc", t(81) + 0.1, { from: 0.7 });
      out("#c6", t(81), 0.2);
      show("#d6", t(81) + 0.15, 0.25);
      draw("r-ppe", t(81) + 0.3, 0.45);
      pop("#kc1", t(85) - 0.3, { from: 0.85 });
      pop("#kc2", t(85) - 0.15, { from: 0.85 });
      pop("#kc3", t(85), { from: 0.85 });
      show(["#lk1", "#lk2", "#lk3"], t(85), 0.25);
      pop(["#own1", "#own2", "#own3"], t(89), { from: 0.6 });
      fill(["#p1", "#p2", "#p3"], t(93), 1.0);
      pop("#r-proc", t(97), { from: 0.7 });
      show("#oc3", t(97), 0.2);
      bump("#oc3", t(97) + 0.3, 1.06);

      /* ---- 5. the free-threaded build takes the stick away ---- */
      out("#r-proc", t(109) - 0.3, 0.25);
      out(["#kc1", "#kc2", "#kc3", "#own1", "#own2", "#own3", "#p1", "#p2", "#p3", "#h-proc", "#lk1", "#lk2", "#lk3", "#r-ppe"], t(100) - 0.25, 0.25);
      out("#d6", t(100) - 0.25, 0.25);
      out(["#oc0", "#oc1", "#oc2", "#oc3"], t(104), 0.25);
      pop("#h-free", t(100), { from: 0.7 });
      pop("#kit-all", t(100) + 0.1, { from: 0.9 });
      show(["#lt1", "#lt2", "#lt3", "#c6"], t(100) + 0.2, 0.25);
      tl.set("#gil", { y: 110 }, t(100));
      tl.fromTo("#gil", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, t(100) + 0.4);
      pop("#b-new", t(102), { from: 0.6 });
      type("#oe0", t(105), 23, 0.5);
      show("#oe1", t(106), 0.25);
      tl.to("#gil", { y: -260, x: 60, rotation: 25, opacity: 0, duration: 0.6, ease: "power2.in" }, t(109));
      fill(["#fb1", "#fb2", "#fb3"], t(110), 1.0);
      pop("#r-free", t(110) + 0.4, { from: 0.7 });

      /* ---- 6. two cooks, one whiteboard ---- */
      out(["#kit-all", "#lt1", "#lt2", "#lt3", "#fb1", "#fb2", "#fb3", "#r-free", "#h-free", "#b-new", "#bw1", "#bw2", "#bw3", "#axis"], t(113) - 0.1, 0.25);
      out(["#c0", "#c1", "#c2", "#c3", "#c4", "#c6", "#c7", "#ttl-c", "#oe0", "#oe1"], t(113) - 0.1, 0.25);
      pop("#h-race", t(113) + 0.2, { from: 0.7 });
      show(["#f0", "#f1", "#ttl-f"], t(113) + 0.3, 0.3);
      show(["#lc1", "#lc2"], t(116), 0.25);
      type("#of0", t(116), 23, 0.5);
      pop("#wb", t(120) - 0.15, { from: 0.8 });
      show("#wb5", t(120) - 0.05, 0.2);
      pop("#c1r", t(121), { from: 0.7 });
      pop("#c2r", t(121) + 0.25, { from: 0.7 });
      draw("r-five", t(121) + 0.1, 0.45);
      out("#r-five", t(124) - 0.2, 0.2);
      pop("#c1p", t(124), { from: 0.4 });
      pop("#c2p", t(124) + 0.2, { from: 0.4 });
      pop("#c1w", t(128), { from: 0.7 });
      out("#wb5", t(128) + 0.15, 0.15);
      pop("#wb6", t(128) + 0.2, { from: 0.6 });
      pop("#c2w", t(130), { from: 0.7 });
      bump("#wb6", t(130) + 0.15, 1.15);
      pop("#n-two", t(131), { from: 0.7 });
      show("#of1", t(131) + 0.1, 0.2);
      tl.fromTo("#stamp", { opacity: 0, scale: 1.8, rotation: -8 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.35, ease: "power3.in", immediateRender: false }, t(136) + 0.2);

      /* ---- 7. lock the whiteboard: one cook at a time ---- */
      out(["#stamp", "#c1r", "#c2r", "#c1p", "#c2p", "#c1w", "#c2w", "#n-two", "#wb6", "#f0", "#f1"], t(140) - 0.15, 0.2);
      show("#wb5b", t(140), 0.15);
      tl.fromTo("#lock", { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.4, ease: "bounce.out", immediateRender: false }, t(140) + 0.05);
      show(["#g0", "#g1", "#g2"], t(140) + 0.05, 0.25);
      draw("r-lock", t(140) + 0.3, 0.4);
      pop("#d1r", t(143), { from: 0.7, d: 0.3 });
      pop("#d2t", t(143) + 0.15, { from: 0.7, d: 0.3 });
      pop("#d1w", t(143) + 0.4, { from: 0.7, d: 0.3 });
      out("#wb5b", t(143) + 0.5, 0.1);
      show("#wb6b", t(143) + 0.55, 0.15);
      pop("#d2r", t(146), { from: 0.7, d: 0.3 });
      pop("#d2w", t(147) + 0.1, { from: 0.7, d: 0.3 });
      out("#wb6b", t(147) + 0.2, 0.1);
      pop("#wb7", t(147) + 0.25, { from: 0.6, d: 0.3 });
      pop("#tick7", t(147) + 0.3, { from: 0.4, d: 0.3 });
      show("#of2", t(144), 0.2);
      show("#of3", t(147) + 0.25, 0.2);

      /* ---- hand off to the takeaway ---- */
      tl.to("#s-wrap", { opacity: 0, duration: 0.2, ease: "power2.in" }, 61.08);

      window.__timelines = window.__timelines || {};
      window.__timelines["story"] = tl;
    })();
  </script>
